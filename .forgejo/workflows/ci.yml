# CI/CD de la web en Forgejo, el origen del repositorio.
#
# - comprobar (runner del CI, sin secretos): lo mismo que el CI de GitHub más
#   gitleaks sobre todo el historial.
# - desplegar (solo main, con «comprobar» en verde): el runner de despliegue
#   pasa el control de fugas de lo que aún no es público, compila, despliega
#   con Ansible y empuja ese commit a GitHub, que queda como copia pública.
#   El script vive en ese runner, con la infraestructura, no aquí.
#
# El resultado de cada ejecución llega a Element por el webhook del repo.
name: CI

on:
  push:
  workflow_dispatch:

env:
  # Las consultas se comprueban contra los datos de .sqlx (cargo sqlx prepare).
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: never

jobs:
  comprobar:
    runs-on: landing
    steps:
      # Sin actions/checkout: el runner no tiene Node para acciones y basta un
      # fetch. Historial completo para gitleaks.
      - name: Copia del repo
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token ${{ github.token }}" \
            fetch -q --no-tags "${{ github.server_url }}/${{ github.repository }}.git" "+${{ github.ref }}:refs/ci/actual"
          git checkout -q -f "${{ github.sha }}"
          git clean -qffdx
      - name: Formato
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Pruebas (contra PostgreSQL)
        run: cargo test --locked
      - name: Compilar en release
        run: cargo build --locked --release
      - name: Contenido válido
        run: '"$CARGO_TARGET_DIR/release/landing" check'
      - name: El JS minificado sigue siendo JS válido
        run: |
          min="$(mktemp -d)"
          "$CARGO_TARGET_DIR/release/landing" dump-assets "$min"
          for f in "$min"/*.js; do node --check "$f"; done
          # El rack 3D ya viene minificado por esbuild y es un módulo ES.
          cp static/rack3d.min.js "$min/rack3d.mjs" && node --check "$min/rack3d.mjs"
          rm -rf "$min"
      # Banco de experiencia (tools/ux) sin 3D, con el Chromium de Debian:
      # unidades, blog y portada en móvil, tableta y sin WebGL. Cualquier cifra
      # por encima de 0 (solapes, scroll lateral, axe, errores…) lo pone en rojo.
      # El runner lo recibe con infra-tf (PR #157); hasta entonces, solo avisa.
      - name: Banco de experiencia
        run: |
          if [ ! -x /usr/bin/chromium ] || ! command -v npm >/dev/null; then
            echo "::warning::El runner aún no tiene Chromium/npm (infra-tf #157): banco omitido"
            exit 0
          fi
          sitio="$(mktemp -d)"
          "$CARGO_TARGET_DIR/release/landing" dump-site "$sitio" >/dev/null
          python3 tools/ux/servir.py "$sitio" &
          servidor=$!
          trap 'kill $servidor; rm -rf "$sitio"' EXIT
          cd tools/ux
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund --loglevel=error
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8099/es/ && break; sleep 1; done
          node banco.mjs --chromium /usr/bin/chromium --sin-webgl --slow no --fallar \
            --solo movil,tableta,sin3d,unidades,unidades_movil,blog,blog_movil \
            --out "$sitio/informe" || { cat "$sitio/informe/informe.md"; exit 1; }
      - name: Pruebas del resumen semanal (Python, sin red)
        run: python3 -m unittest tools/digest/test_digest.py
      # Todo el historial: lo que se borró en un commit posterior sigue en el repo.
      - name: gitleaks
        run: gitleaks git --redact --no-banner --exit-code 1 .

  desplegar:
    needs: comprobar
    if: github.ref == 'refs/heads/main'
    runs-on: landing-despliegue
    steps:
      - name: Control de fugas, despliegue y copia pública
        run: landing-desplegar "${{ github.sha }}"
