[package]
name = "landing"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8.9"
bytes = "1.12.1"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "form"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "time", "uuid"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.6"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-br", "trace", "limit", "set-header", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
