[about]
paragraphs = [
  "I've just completed a combined Higher Vocational Qualification in Systems Administration (ASIR) and Web Application Development (DAW), so I have both halves: I can run systems and networks, and I can write the tools that automate them.",
  "Outside class I run a homelab that is not a toy: it serves my household every day and is defined entirely as code. If a server disappears, Terraform recreates it and Ansible configures it exactly as it was.",
  "How I work: measure before changing, one change at a time, verify it in production and document it, including what didn't work. I'd rather turn a manual fix into maintainable automation than do it twice.",
  "I've worked in English with clients and a technical team during an international internship in Malta.",
]
values = [
  { title = "Cause, not symptom", text = "I look for why something fails before touching it. My postmortems explain the root cause and how to detect it next time." },
  { title = "Everything as code", text = "Versioned infrastructure, encrypted secrets, and changes reviewed with plan/diff before they're applied." },
  { title = "Measure, don't guess", text = "One measurement is not a result. I compare against a baseline, repeat, and keep measured and estimated apart." },
]

