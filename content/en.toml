[flows.update]
title = "Updating containers"
steps = [
  "Hermes notices there are new images for several Docker containers.",
  "It tells me on Matrix: which ones and since when.",
  "I read it on my phone and decide when to update.",
  "I run the update playbook from the control node.",
  "Each container is updated and Ansible waits for its healthcheck to go green before moving on.",
  "Zabbix confirms everything is healthy again.",
]

[flows.cert]
title = "Renewing certificates"
steps = [
  "A TLS certificate is about to expire: Traefik notices on its own.",
  "It asks Let's Encrypt for a new one, proving the domain is mine with a DNS record in Cloudflare (DNS-01).",
  "Traefik gets the new certificate and uses it without restarting anything.",
  "Hermes checks certificate and domain expiry every day.",
  "Only if something goes wrong does it post to Matrix.",
  "If an alert comes in, I see it on my phone. Usually I don't even notice.",
]

[flows.ipchange]
title = "My IP changes"
steps = [
  "The ISP changes my public IP without warning.",
  "Within 5 minutes the sync job spots the new IP.",
  "It updates each domain's record in Cloudflare through its API.",
  "Visitors keep arriving as if nothing happened.",
]

[flows.docs]
title = "Hermes learns by itself"
steps = [
  "After every change I write a note: what happened, how it was measured and what didn't work.",
  "The note goes into Obsidian, the homelab's documentation.",
  "Every 15 minutes it's chunked and indexed into Qdrant as vectors.",
  "From then on Hermes can cite it in its answers.",
]

[flows.okd]
title = "Deploying on OpenShift"
steps = [
  "The application and its deployment are described as code.",
  "Ansible applies the manifests to the cluster.",
  "OpenShift spreads the pods across its three nodes and exposes a route.",
  "The internal DNS resolves the cluster's application domain.",
  "And the app opens from any device at home.",
]

[flows.intrusion]
title = "An intrusion attempt"
steps = [
  "A bot crawls the internet looking for misconfigured servers.",
  "Cloudflare stops much of the automated traffic.",
  "The router firewall drops anything that isn't the website; SSH isn't even visible from outside.",
  "Wazuh agents record any failed login inside the containers.",
  "Hermes reviews failed logins and sums them up.",
  "If something looks off, it posts it to its Matrix room.",
  "And it reaches my phone.",
]

[flows.digest]
title = "The morning digest"
steps = [
  "At 7:00 Hermes prepares the daily digest.",
  "It asks Zabbix about open problems and resources.",
  "It asks Wazuh about security: agents and failed logins.",
  "It checks the backup repository has been updated.",
  "It puts it all into a single Matrix message.",
  "And I read it over coffee.",
]

[flows.game]
title = "Game night"
steps = [
  "From my phone I open the game server panel.",
  "It comes in through Cloudflare, like the other sites.",
  "Traefik takes it to the panel.",
  "I start tonight's game server.",
  "The router firewall opens its port automatically, only while it's running.",
  "My friends connect from their homes.",
  "Zabbix watches CPU and memory while we play.",
]

[flows.adblock]
title = "Browsing without ads"
steps = [
  "The TV at home tries to load an ad.",
  "It asks the home DNS, which has that domain on a blocklist.",
  "No answer: the ad never loads. Not on the TV, not on any device.",
  "A normal website does resolve, and gets cached for next time.",
  "The page loads faster and without trackers.",
]

[flows.scan]
title = "A new piece of paper"
steps = [
  "I scan a document at home.",
  "Authelia checks it's me, with a second factor.",
  "Paperless runs OCR, classifies it and tags it.",
  "The original and its text are stored on ZFS, with redundancy.",
]

[flows.visit]
title = "Your visit to this site"
steps = [
  "You type titopinardogutierrez.com into your browser.",
  "Cloudflare gets the request, checks it isn't an attack and forwards it to my home.",
  "The MikroTik router only lets web traffic through to Traefik.",
  "Traefik terminates TLS and knows from the domain that it's for this site.",
  "The Rust binary already has the page rendered in memory: it answers in microseconds.",
  "The response goes back through Cloudflare, which keeps a copy of whatever can be cached.",
  "And you're looking at it. The whole trip, in milliseconds.",
]

[flows.contact]
title = "When you write to me"
steps = [
  "You fill in the contact form and hit send.",
  "Cloudflare filters automated traffic.",
  "The router lets it through to Traefik.",
  "Traefik hands it to the website.",
  "The site validates the fields, checks the honeypot and the per-IP sending limit.",
  "It's stored in PostgreSQL first: if anything fails later, the message isn't lost.",
  "A background worker picks up messages waiting to be announced.",
  "It posts it to my Matrix room and doesn't count it as delivered until it gets an event id back.",
  "It reaches my phone. I'll reply myself, in person.",
]

[flows.ask]
title = "I ask Hermes"
steps = [
  "I message Hermes from my phone: \"how are the disks?\".",
  "The message comes in through Cloudflare.",
  "It reaches my Matrix server.",
  "Hermes decides which tools it needs to answer.",
  "It searches Qdrant for the relevant Obsidian documentation.",
  "It asks Zabbix for the real state of the disks and ZFS.",
  "The local model, on the GPU PC, drafts the answer. Nothing leaves home.",
  "Hermes checks the answer: whatever can be computed is done by code, not the model.",
  "The answer goes back through Matrix.",
  "And I read it on my phone.",
]

[flows.alert]
title = "Something breaks"
steps = [
  "A service starts failing: say, Plex runs out of temporary space.",
  "Zabbix catches it with its checks.",
  "Hermes receives the problem and explains it in plain words, with context from the docs.",
  "It posts it to the Matrix alerts room.",
  "I know before anyone in the house notices.",
]

[flows.deploy]
title = "I deploy a service"
steps = [
  "It all starts with a commit: the new service is described as code.",
  "On the control node, Terraform works out the plan: what gets created, what changes and what's left alone.",
  "Proxmox creates the container exactly as the code says.",
  "The service starts in its new container.",
  "Ansible configures it: hardening, firewall, the app itself and a check that it answers.",
  "The Zabbix agent starts sending metrics.",
  "Wazuh starts watching its security.",
  "And the change is saved in the backup repository too.",
]

[flows.media]
title = "Movie night"
steps = [
  "The library organises itself: names, metadata and subtitles.",
  "Everything is stored on the ZFS pools, with redundancy.",
  "Plex presents it with artwork and synopses.",
  "If the device can't play the format, the GPU converts it in hardware.",
  "Plex streams the adapted video.",
  "Out through the router.",
  "And it plays on any screen, at home or away.",
]

[flows.remote]
title = "Getting in from outside"
steps = [
  "I'm away from home and need a document.",
