# Quests
# ---------------------------------------------------------------------------

[projects.homelab-iac]
title = "Homelab as code"
tagline = "My home infrastructure, defined entirely in Terraform and Ansible."
context = "Ongoing personal project, in daily production use."
problem = "The home services had been set up by hand over the years: nobody (me included) knew exactly how to rebuild one if it broke."
bullets = [
  "Migrated the services to infrastructure as code: Terraform creates the containers and VMs on Proxmox, and reusable Ansible roles configure the OS and applications.",
  "Secrets encrypted with Ansible Vault, everything versioned in Git with an automatic backup remote, and every change reviewed with plan or --check --diff before applying.",
  "MikroTik network segmented with VLANs, remote access over WireGuard, Traefik as the single public entry point with automatic certificates, and self-hosted DNS with Technitium.",
  "ZFS and software RAID storage, plus NVIDIA GPU passthrough for hardware-accelerated workloads.",
  "Published a sanitised public copy of the repository: no real IPs, secrets or firewall rules.",
]
outcome = "Rebuilding a service goes from an afternoon of trial and error to a single command."
lesson = "After a power cut left LVM storage inactive and every service down, I wrote the postmortem with the root cause, how to detect it and the exact fix."

[projects.hermes]
title = "Hermes · local AI assistant"
tagline = "A chat assistant that knows the state of my servers, and nothing leaves my network."
context = "Personal project, in production since September 2026."
problem = "Checking whether the homelab was healthy meant opening several different dashboards (monitoring, security, storage, backups)."
bullets = [
  "Conversational bot on Matrix, by text and voice, with the language model running locally on Ollama.",
  "RAG over my Obsidian documentation with Qdrant as the vector store, combined with Zabbix and Wazuh snapshots to put incidents in context.",
  "Homelab health tools (backups, certificates, storage, updates, unusual usage, failed logins, network) that only speak up when something is abnormal, plus a daily digest.",
  "Multi-seed evaluation suite: the final version passes 107 of 111 cases with no regressions, and changes that made results worse were discarded based on the data.",
]
outcome = "The homelab's health is one natural-language question away instead of a tour of dashboards."
lesson = "Whatever can be computed in code isn't asked of the model: dates, sums and due dates kept failing while the LLM did them and stopped failing once moved to code."

[projects.xpify]
title = "XPIFY · gamified e-learning"
tagline = "A learning platform with games and real-time chat. Final project graded 10/10."
context = "ASIR + DAW final project, deployed to production and assessed live."
problem = "The goal was an educational platform that motivates with game mechanics and could be assessed in real production, not a local demo."
bullets = [
  "Owned the backend, all the infrastructure and deployment automation, and contributed to the Next.js frontend.",
  "NestJS REST API with PostgreSQL, Keycloak authentication and role-based access control.",
  "Real-time chat and game events with Socket.io.",
  "Deployed on Kubernetes (K3s) with GitOps through Argo CD and GitLab CI/CD, with metrics and logs in Prometheus, Grafana and Loki.",
]
outcome = "Graded 10/10, assessed with the platform running in production."

[projects.security]
title = "Security & monitoring"
tagline = "Knowing what happens on every machine and closing what shouldn't be open."
context = "Ongoing personal project within the homelab."
problem = "With more than twenty containers and VMs, checking each one's security and health by hand doesn't scale."
bullets = [
  "Automated Zabbix and Wazuh agent rollout with Ansible, with email and chat alerts tested end to end.",
  "Vulnerability review with Wazuh: fixed all 430 entries that had a published fix and documented the remaining ones and their limits.",
  "Reusable Linux and SSH hardening applied as an Ansible role, and a network audit with fixes on the router and firewall.",
  "Took every dashboard that didn't need to be public off the internet: only the essentials stay exposed.",
]
outcome = "A smaller exposed surface, and alerts that arrive on their own instead of manual reviews."
lesson = "I document what an audit doesn't prove as carefully as what it does: 'no findings' is not 'no vulnerabilities'."

[projects.okd]
title = "OpenShift cluster (OKD)"
tagline = "A three-node cluster on Proxmox to practise OpenShift administration."
context = "Personal lab, installation completed and verified."
problem = "I wanted to practise OpenShift for real, with real installation problems, not a guided tutorial."
bullets = [
  "Three nodes defined in Terraform, DNS prepared and installed with the Agent-Based Installer.",
  "Solved the real problems along the way: an ISO with a boot bug, insufficient RAM, boot order after install and etcd latency on spinning disks.",
  "Verified result: 3/3 nodes Ready and 33/33 healthy operators, with a test application deployed through Ansible.",
]
outcome = "A working OpenShift cluster and an installation log with every failure and its fix."
lesson = "etcd doesn't forgive slow disks: storage latency shows up in the control plane long before it shows in the apps."

[projects.paperless]
title = "Automatic document classification"
tagline = "Python scripts that classify and assign student documents on their own."
context = "Internship at Centro Universitario Cardenal Cisneros."
problem = "Student documents were classified and assigned by hand."
bullets = [
  "Python scripts on the Paperless-ngx API that classify and assign documents automatically.",
  "Researched AI and handwriting recognition to support automated replies to student enquiries.",
]
outcome = "Less repetitive manual work for the centre's staff."

[projects.landing]
title = "This website"
tagline = "Rust, PostgreSQL and my own homelab, no templates or site builders."
context = "Personal project, in production."
problem = "I wanted a way to show my work that is, in itself, an example of how I work."
bullets = [
  "Rust server with Axum and compiled templates; PostgreSQL with compile-time checked queries.",
  "Pre-rendered pages behind Cloudflare: almost no visit ever reaches the server.",
  "Deployed with Terraform and Ansible on my homelab, behind Traefik and monitored.",
  "Works without JavaScript; the map, terminal and achievements are an enhancement on top.",
]
outcome = "What you're looking at."
lesson = "The fast part of a website isn't the server's language, it's not having to call the server."

