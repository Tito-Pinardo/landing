[lab]
intro = "This is how my homelab is built. Tap each piece to see what it does and what problem it solved."
legend_edge = "Edge"
legend_network = "Network"
legend_compute = "Compute"
legend_control = "Control"
legend_observability = "Observability"
legend_ai = "AI"
legend_app = "Application"
disclaimer = "Simplified view: no addresses, ports or internal names."

[nodes.internet]
title = "Internet"
text = "All outside traffic comes in through Cloudflare, which hides my home IP and filters before anything reaches it."

[nodes.router]
title = "MikroTik router"
text = "Network segmented with VLANs, audited firewall and remote access over WireGuard. It replaced the ISP router, connecting straight to the fibre."

[nodes.traefik]
title = "Traefik"
text = "The single public entry point. Automatic TLS certificates and security headers; internal dashboards never go through it."

[nodes.dns]
title = "Self-hosted DNS"
text = "Technitium resolves internal names and blocks ads and trackers. I migrated from Pi-hole without losing a single query during the switch."

[nodes.proxmox]
title = "Proxmox VE"
text = "The physical server hosting every LXC container and virtual machine, with ZFS and software RAID."

[nodes.iac]
title = "IaC control node"
text = "From here Terraform creates the machines and Ansible configures them. Nothing is changed by hand in production."

[nodes.docker]
title = "Docker applications"
text = "Household apps in Docker stacks with watched updates: the system flags new images, and an update waits until the service reports healthy."

[nodes.okd]
title = "OpenShift cluster"
text = "Three OKD nodes to practise OpenShift: 3/3 nodes Ready and 33/33 healthy operators."

[nodes.monitoring]
title = "Zabbix & Wazuh"
text = "Metrics, alerts and security for every machine, with agents rolled out by Ansible."

[nodes.hermes]
title = "Hermes (local AI)"
text = "An assistant that answers questions about the homelab's health in natural language, with the model running locally."

[nodes.gpu]
title = "GPU passthrough"
text = "An NVIDIA GPU assigned to a container for hardware transcoding."

[nodes.landing]
title = "This website"
text = "A Rust binary with PostgreSQL in its own unprivileged container, behind Traefik."

