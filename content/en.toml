[incidents.blackout]
title = "Everything down after a power cut"
intro = "The power goes out at home. When it's back, the server boots on its own… but no website answers and not a single alert arrives. What happened?"
options = [
  "A disk broke and backups need restoring.",
  "LVM storage was left half-activated after its automatic check and blocks everything from starting.",
  "Proxmox lost the containers' configuration.",
]
feedback = [
  "The disks and the RAID are fine: no hardware errors, no damaged data.",
  "",
  "The configuration is intact: the containers exist, they just can't start.",
]
solution = "After the power cut, LVM checked the storage metadata (65-90 minutes on spinning disks) and left two internal volumes activated on their own. While they stay like that, LVM refuses to activate the storage. Deactivating them by hand and activating the pool fixed everything."
lesson = "I wrote the postmortem with how to detect it, the exact commands and why it takes so long. And that if monitoring lives on the same server, it goes down with it."

[incidents.blackout.clues]
internet = "The websites don't answer: requests reach home, but nobody replies."
traefik = "Traefik isn't even running: its container is stopped."
proxmox = "The host booted fine, but every container and VM is \"stopped\". The log keeps saying: \"activating LV pve/data failed… prohibited while data_tmeta is active\"."
zabbix = "Zabbix is down too: it's also a container. That's why no alert arrived."
zfs = "LVM shows the pool's internal volumes active on their own, and a \"thin_check\" has just finished after more than an hour."
obsidian = "The documentation won't open either: it runs in another stopped container."

[incidents.slowupdate]
title = "An update that never ends"
intro = "I run the update of every container with Ansible. Half an hour later it's still on the same step… and three hours later, too."
options = [
  "apt is waiting for someone to answer an on-screen prompt.",
  "A disk is dying.",
  "The spinning-disk RAID1 shared by about 16 containers is saturated with writes.",
]
feedback = [
  "There's no prompt: dpkg was progressing at first, then got stuck waiting for the disk.",
  "SMART says both disks are healthy, with no bad sectors.",
  "",
]
solution = "Both disks had their write cache in \"write through\" mode and the whole system shared one RAID1. Every write waited for the platter. I enabled \"write back\" caching persistently and measured the improvement under real load."
lesson = "High load with an idle CPU means waiting on disk. And I documented what was measured versus only inferred: deleting the snapshots barely changed I/O pressure."

[incidents.slowupdate.clues]
iac = "Ansible has been on the \"apt upgrade\" task of the Wazuh container for 30 minutes."
wazuh = "Inside the container, mandb has been in state D (waiting on disk) for almost an hour. Load 27 with the CPU nearly idle."
proxmox = "50 % I/O pressure. The md0 RAID is at 100 % utilisation while moving barely 2 MB/s."
zfs = "SMART: both SAS disks are healthy, zero defects. But their write cache is set to \"write through\"."
zabbix = "The graphs show I/O wait shooting up since the update started."

[incidents.backup]
title = "The backup that stopped backing up"
intro = "Reviewing the documentation I find its Git copy hasn't been updated in 13 days… and nobody noticed."
options = [
  "The GitHub credentials expired.",
  "The server's disk is full.",
  "The sync plugin stopped running its cycle without raising any error.",
]
feedback = [
  "A manual push from inside the container works first time: the credentials are fine.",
  "There's plenty of space: the files are on disk, just not pushed.",
  "",
]
solution = "The Obsidian plugin that commits and pushes every 10 minutes stopped silently. I brought the repository up to date by hand (198 files, nothing lost). The exact cause inside the plugin is still unconfirmed, and that's written down as such."
lesson = "What isn't watched fails silently: a backup only counts if something checks it's up to date. And I wrote it down as mitigated, not solved."

[incidents.backup.clues]
obsidian = "The last commit is 13 days old, even though the plugin is set to save and push every 10 minutes."
github = "A manual push from inside the container works first time: the SSH key and GitHub are fine."
backup = "There are 147 notes on disk; the last commit has 92. Nothing is lost: it just wasn't pushed."
hermes = "No alert at all: nothing was watching this backup's date."

