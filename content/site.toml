# Datos que no dependen del idioma: enlaces, catálogo de tecnologías,
# piezas del mapa del homelab y qué tecnologías usa cada proyecto.
# Los textos traducibles viven en es.toml / en.toml con los mismos `id`.

# Claves sueltas: tienen que ir antes de la primera tabla, si no TOML las
# mete dentro de la última.

# Conexiones del mapa del homelab (pares de ids de [[nodes]]).
links = [
  ["internet", "router"],
  ["router", "traefik"],
  ["router", "dns"],
  ["traefik", "landing"],
  ["router", "proxmox"],
  ["iac", "proxmox"],
  ["proxmox", "docker"],
  ["proxmox", "okd"],
  ["proxmox", "monitoring"],
  ["proxmox", "hermes"],
  ["proxmox", "gpu"],
  ["proxmox", "landing"],
  ["monitoring", "hermes"],
]

# Logros: se desbloquean en el navegador, sin cuentas ni cookies.
achievements = ["explorer", "root", "architect", "skill_hunter", "recruiter", "polyglot", "messenger"]

[person]
name = "Tito Pinardo Gutiérrez"
github = "https://github.com/Tito-Pinardo"
linkedin = "https://www.linkedin.com/in/tito-pinardo-gutierrez-b7341b293"
github_user = "Tito-Pinardo"
cv_es = "/static/cv/Tito_Pinardo_CV_ES.pdf"
cv_en = "/static/cv/Tito_Pinardo_CV_EN.pdf"

