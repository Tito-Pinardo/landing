title = "Traefik"
text = "The way in from outside."

[text.en.pods.gpu]
short = "GTX 1050 Ti"
title = "GTX 1050 Ti"
text = "A modest GPU that encodes H.264 and HEVC in hardware, including 10-bit HEVC with HDR. It can't decode AV1."

[text.en.pods.zfs]
short = "ZFS pool"
title = "Storage"
text = "The library lives on a multi-disk ZFS pool."

[text.en.pods.plex]
short = "Plex"
title = "Plex Media Server"
text = "The server, updated from the beta channel because the public repo lags behind."

[text.en.pods.direct]
short = "Direct"
title = "Direct play"
text = "If the device understands the format, the file goes out as it is: no GPU, no CPU."

[text.en.pods.sessions]
short = "Sessions"
title = "Sessions"
text = "Every playback in progress, with its conversion command. That's where you see whether it's on GPU or software."

[text.en.pods.update]
short = "Update"
title = "Update"
text = "Beta-channel package, installed inside the container and checked: version, GPU detected and database migration done."

[text.en.pods.decode]
short = "Decode"
title = "Decoding (NVDEC)"
text = "The GPU decompresses the original video."

[text.en.pods.encode]
short = "Encode"
title = "Encoding (NVENC)"
text = "And compresses it again to the format and quality the device asks for."

[text.en.pods.cpu]
short = "CPU"
title = "CPU, when there's no choice"
text = "Whatever the GPU can't do (decode AV1) falls to the CPU."

[text.en.pods.detect]
short = "Detection"
title = "Hardware detection"
text = "Plex checks its hardware once and remembers. If the GPU comes back later, it won't notice until restarted."

[text.en.pods.vfio]
short = "IOMMU"
title = "IOMMU and boot"
text = "Kernel parameters so the GPU gets its own group and can be assigned."

[text.en.pods.driver]
short = "NVIDIA driver"
title = "Driver on the hypervisor"
text = "The version is pinned on purpose: every new kernel is a chance for it to stop compiling."

[text.en.pods.devices]
short = "Devices"
