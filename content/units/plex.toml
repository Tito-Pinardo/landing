text = "The hypervisor's device files are passed into the container, with their exact numbers."

[text.en.pods.idmap]
short = "Unprivileged"
title = "Unprivileged container"
text = "Only the video group is mapped one to one; the rest is shifted. Root in the container isn't root on the server."

[text.en.pods.movies]
short = "Library"
title = "Library"
text = "Films and series on the pool, with access time disabled to save writes."

[text.en.pods.scan]
short = "Scan"
title = "Codec scan"
text = "A walk through the library with ffprobe to find each file's codec."

[text.en.pods.convert]
short = "Conversion"
title = "Library conversion"
text = "What no device at home can play is converted once and for all."

[text.en.pods.live]
short = "Live TV"
title = "Live channels"
text = "Public free-to-air channels with their guide, served by the live TV unit."

[text.en.flows.home]
title = "A film on the TV"
steps = [
  "The TV asks for a film.",
  "The router lets it reach Plex: its only exception.",
  "Plex looks up the file.",
  "In the library.",
  "The pool reads it.",
  "Back to Plex.",
  "The TV understands the format: direct play, nothing converted.",
  "And it plays.",
]

[text.en.flows.away]
title = "The same film, away from home"
steps = [
  "From my phone, on mobile data, I ask for the same film.",
  "It comes in through Traefik.",
  "Plex sees it needs lower quality.",
  "The GPU decodes the original.",
  "All the heavy lifting stays on the GPU.",
  "And encodes it at the quality the connection can take.",
  "The session shows it's on hardware.",
  "And it reaches the phone without loading the server's CPU.",
]

[text.en.flows.av1]
title = "Files nothing at home could play"
steps = [
  "A library scan looks up each file's codec.",
  "14 show up in AV1; two pairs were the same file linked twice: 12 films.",
  "They're converted one by one.",
  "The CPU decodes AV1, because this GPU can't.",
  "The GPU encodes 10-bit HEVC, keeping HDR.",
  "The encoding work, on the GPU.",
  "The result replaces the original.",
  "And Plex plays it on any device at home.",
]

[text.en.flows.boot]
title = "The GPU reaches the container"
steps = [
  "The hypervisor boots with IOMMU on.",
  "It loads the NVIDIA driver, at its pinned version.",
  "The GPU is ready.",
  "Its devices are passed into the container with their exact numbers.",
  "Unprivileged: only the video group matches the hypervisor's.",
  "Plex starts.",
  "And detects the GPU. If it wasn't there at start-up, it won't see it until restarted.",
]

[text.en.flows.upgrade]
title = "I update Plex"
steps = [
  "I install the new version inside the container.",
  "Plex starts and migrates its database.",
  "I check it detects the GPU.",
  "And that a test conversion runs on hardware.",
]

[text.en.incidents.cached]
title = "The GPU was fine, but Plex didn't use it"
meta = "21-07-2026 · transcoding"
symptom = "After fixing the devices, decoding was on the GPU again, but encoding stayed on the CPU. I even tried lifting the driver's session limit: nothing."
options = [
  "GeForce cards' NVENC session limit",
  "Plex had detected the hardware at start-up, without the GPU, and kept that",
  "The driver was incompatible",
  "The film had an odd format",
]
cause = "Plex detects hardware once and remembers it while the process lives. When it started the GPU wasn't available, and fixing it underneath didn't make it look again."
fix = "Restart Plex at a moment when nobody was watching anything. The next conversion ran fully on the GPU."
lesson = "Fixing the layer below isn't enough if the layer above kept the broken state. You have to know what's cached and when it's checked again."

[text.en.incidents.nodes]
title = "The GPU vanishes from the container"
meta = "July 2026 · driver"
symptom = "After a run of driver updates with a new kernel, Plex went back to converting everything on the CPU. On the hypervisor the GPU worked."
options = [
  "The GPU had died",
  "Plex had lost its licence",
  "The container had no memory",
  "The container's device files had different numbers from the hypervisor's",
]
cause = "The GPU's devices are created when the driver starts, with specific numbers. The ones the container saw didn't match the hypervisor's real ones after the change."
fix = "The second time it happened, without restarting Plex: recreate the devices inside the container with the same numbers as the hypervisor. And check with a five-frame conversion as the Plex user."
lesson = "Know how to really check something runs on hardware: the session's command, the process's CPU and the devices it has open."

[text.en.incidents.av1]
title = "Films that couldn't be watched"
meta = "06-08-2026 · formats"
symptom = "Some films didn't play well on any device at home, not even when converted on the fly."
options = [
  "The files were damaged",
  "The network was short on bandwidth",
  "They were AV1, which this GPU can't decode, and converting on the fly on the CPU wasn't fast enough",
  "Plex didn't have the codec installed",
]
cause = "The GTX 1050 Ti predates hardware AV1 decoding. On the fly, the CPU alone couldn't keep up with 4K in real time."
fix = "Convert those 12 films once: decode on the CPU and encode 10-bit HEVC on the GPU, keeping HDR. Checked against the library manager's list."
lesson = "If an expensive job would be repeated on every playback, do it once and keep it."

[text.en.incidents.delete]
title = "Deleting from Plex didn't work"
meta = "19-09-2026 · permissions"
symptom = "After moving Plex to an unprivileged container, deleting content from its interface failed. And not even the container's root could fix the permissions."
options = [
  "In an unprivileged container root isn't root: the permissions had to be fixed from the hypervisor",
  "Plex didn't have deletion enabled",
  "The pool was read-only",
  "The files were in use",
]
cause = "Some folders lacked group write permission. And in this container only the video group matches the hypervisor's: root inside can't change files it doesn't own."
fix = "Grant the group permission from the hypervisor, only on the folders that needed it, and test creating and deleting as the Plex user. Without stopping Plex."
lesson = "An unprivileged container is safer precisely because its root can't do everything. That changes where things get fixed."

