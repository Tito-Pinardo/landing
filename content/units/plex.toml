[text.en.meta]
title = "Inside Plex and the GPU · Tito Pinardo Gutiérrez"
description = "The home media server: Plex in an unprivileged container with a GTX 1050 Ti for hardware transcoding, and what it took to keep the GPU working after every driver change."

[text.en.ui]
slot = "1U · PLEX"
face_specs = "Plex · GTX 1050 Ti · NVENC"
state = "In production"
map_silk = "MEDIA"
map_title = "Inside the media"
