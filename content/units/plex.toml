[text.es.incidents.cached]
title = "La GPU estaba bien, pero Plex no la usaba"
meta = "21-07-2026 · transcodificación"
symptom = "Tras arreglar los dispositivos, la decodificación ya iba por GPU, pero la codificación seguía en la CPU. Probé incluso a quitar el límite de sesiones del driver: nada."
options = [
  "El límite de sesiones de NVENC de las GeForce",
  "Plex había detectado el hardware al arrancar, sin GPU, y lo tenía guardado",
  "El driver era incompatible",
  "La película tenía un formato raro",
]
cause = "Plex detecta el hardware una vez y lo recuerda mientras el proceso vive. Cuando arrancó, la GPU no estaba disponible, y arreglarla por debajo no hacía que lo volviera a mirar."
fix = "Reiniciar Plex en un momento sin nadie viendo nada. La siguiente conversión ya fue entera por GPU."
lesson = "Arreglar la capa de abajo no basta si la de arriba guardó el estado roto. Hay que saber qué se cachea y cuándo se vuelve a mirar."

[text.es.incidents.nodes]
title = "La GPU desaparece del contenedor"
meta = "Julio de 2026 · driver"
symptom = "Tras una saga de actualizaciones del driver con un kernel nuevo, Plex volvió a convertir todo por CPU. En el hipervisor la GPU funcionaba."
options = [
  "La GPU se había estropeado",
  "Plex había perdido la licencia",
  "El contenedor no tenía memoria",
  "Los ficheros de dispositivo del contenedor tenían otro número que los del hipervisor",
]
cause = "Los dispositivos de la GPU se crean al arrancar el driver con unos números concretos. Los que veía el contenedor no coincidían con los reales del hipervisor tras el cambio."
fix = "La segunda vez que pasó, sin reiniciar Plex: recrear dentro del contenedor los dispositivos con los mismos números que el hipervisor. Y comprobar con una conversión de cinco fotogramas como usuario de Plex."
lesson = "Hay que saber cómo comprobar de verdad que algo va por hardware: el comando de la sesión, la CPU del proceso y los dispositivos abiertos."

[text.es.incidents.av1]
title = "Películas que no se podían ver"
meta = "06-08-2026 · formatos"
symptom = "Algunas películas no se veían bien en ningún dispositivo de casa, ni siquiera convirtiéndolas al vuelo."
options = [
  "Los ficheros estaban dañados",
  "Faltaba ancho de banda en la red",
  "Estaban en AV1, que esta GPU no sabe decodificar, y convertirlas por CPU al vuelo no daba",
  "Plex no tenía el códec instalado",
]
cause = "La GTX 1050 Ti es anterior a la decodificación de AV1 por hardware. Al vuelo, la CPU sola no llegaba a tiempo real en 4K."
fix = "Convertir esas 12 películas una vez: decodificar por CPU y codificar HEVC de 10 bits en la GPU, conservando el HDR. Comprobado contra la lista del gestor de la biblioteca."
lesson = "Si un trabajo caro se va a repetir en cada reproducción, se hace una vez y se guarda."

[text.es.incidents.delete]
title = "Borrar desde Plex no funcionaba"
meta = "19-09-2026 · permisos"
symptom = "Tras pasar Plex a un contenedor sin privilegios, al borrar contenido desde su interfaz daba error. Y ni siquiera el root del contenedor podía arreglar los permisos."
options = [
  "En un contenedor sin privilegios el root no es root: había que arreglar los permisos desde el hipervisor",
  "Plex no tenía permiso de borrado activado",
  "El pool estaba en solo lectura",
  "Los ficheros estaban en uso",
]
cause = "Algunas carpetas no tenían permiso de escritura para el grupo. Y en este contenedor solo el grupo de vídeo coincide con el del hipervisor: el root de dentro no puede cambiar ficheros que no le pertenecen."
fix = "Dar el permiso de grupo desde el hipervisor, solo en las carpetas que lo necesitaban, y probar a crear y borrar como el usuario de Plex. Sin parar Plex."
lesson = "Un contenedor sin privilegios es más seguro precisamente porque su root no puede con todo. Eso cambia dónde se arreglan las cosas."

