[[text.es.decisions]]
title = "Qué GPU"
choice = "Una modesta, para conversión"
why = "Para convertir vídeo no hace falta potencia de cálculo sino el bloque de codificación, y una GeForce pequeña lo tiene."

[[text.es.decisions]]
title = "Con privilegios o sin ellos"
choice = "Sin privilegios, con el mapeo justo"
why = "Con privilegios todo es más fácil, pero el root del contenedor sería el del servidor. Sin ellos, solo el grupo de vídeo se comparte."

[[text.es.decisions]]
title = "El driver"
choice = "Fijado, no el último"
why = "Plex es lo que más se usa en casa. Una versión que funciona con el kernel actual vale más que una más nueva que quizá no compile."

[text.es.tech_notes]
proxmox = "IOMMU, el driver de la GPU en el hipervisor y los permisos que el contenedor no puede tocar."
lxc = "Contenedor sin privilegios con los dispositivos de la GPU pasados dentro y el grupo de vídeo mapeado uno a uno."
terraform = "Crea el contenedor de Plex."
zfs = "La biblioteca en un pool ZFS, con el tiempo de acceso desactivado."
linux = "Driver fijado, ffmpeg y ffprobe para revisar y convertir la biblioteca, y comprobaciones por usuario."
vlan = "La tele está en el segmento más aislado, con una excepción solo para Plex."
traefik = "La entrada a Plex desde fuera de casa."
hardening = "Contenedor sin privilegios y una única excepción de red para la tele."

[text.es.close]
lessons = [
  "Comprobar por hardware de verdad, no por lo que dice el panel.",
  "Saber qué guarda en caché cada capa y cuándo lo vuelve a mirar.",
]
next = [
  "Una GPU con decodificación AV1 para dejar de convertir la biblioteca.",
  "Pasar el driver a un repositorio firmado como manda la política actual de APT.",
]

