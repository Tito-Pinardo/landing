[[text.en.decisions]]
title = "Which GPU"
choice = "A modest one, for conversion"
why = "Converting video doesn't need compute power but the encoding block, and a small GeForce has it."

[[text.en.decisions]]
title = "Privileged or not"
choice = "Unprivileged, with just the right mapping"
why = "Privileged makes everything easier, but the container's root would be the server's. Without it, only the video group is shared."

[[text.en.decisions]]
title = "The driver"
choice = "Pinned, not the latest"
why = "Plex is the most used thing at home. A version that works with the current kernel is worth more than a newer one that might not build."

