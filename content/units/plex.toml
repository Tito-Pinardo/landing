disclaimer = "Rebuilt from my documentation: no addresses, paths, titles or anything from the library."

[text.en.hero]
kicker = "1U unit · Media"
title = "Plex · with the GPU inside"
tagline = "The home media server. When the TV or a phone can't play a format, Plex converts it on the fly on a GTX 1050 Ti that the container sees as its own, without loading the server's CPU."
grade = "The household's priority"
facts = [
  { label = "Why a GPU", value = "Converting 4K on the CPU saturates several cores. With the GPU, the same work uses a fraction of one." },
  { label = "How the GPU gets there", value = "The driver lives on the hypervisor and the container receives its devices. Since September, in an unprivileged container with exactly the group mapping it needs." },
  { label = "The hard part", value = "Keeping it working after every kernel or driver update: twice it broke without anything saying so." },
]

