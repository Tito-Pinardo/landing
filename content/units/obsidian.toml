[text.es.incidents.stuck]
title = "13 días sin copia"
meta = "18-09-2026 · copia"
symptom = "Revisando la documentación, el último commit del vault era de hacía 13 días, aunque el plugin estaba configurado para hacer commit y push cada 10 minutos."
options = [
  "La clave SSH había caducado",
  "GitHub rechazaba los push",
  "El disco del contenedor estaba lleno",
  "El plugin dejó de ejecutarse en silencio, probablemente tras mover cientos de notas a la vez",
]
cause = "Las credenciales y la conexión funcionaban: un push manual entró a la primera. El que se había parado era el plugin, justo después de reorganizar todo el vault en carpetas numeradas."
fix = "Revisar el diff, hacer commit de la reorganización (git la reconoció como renombrados) y empujar a mano desde dentro del contenedor. Después, vigilar que el plugin vuelve a hacerlo solo."
lesson = "Una copia que no avisa cuando falla no es una copia fiable. Hay que vigilar el resultado (la fecha del último commit), no la configuración."

[text.es.incidents.push]
title = "«dubious ownership» y luego «Host key verification failed»"
meta = "Julio de 2026 · Git"
symptom = "El push del vault fallaba con dos errores seguidos: primero git se negaba a trabajar con el repositorio; al arreglarlo, SSH no reconocía a GitHub."
options = [
  "Dueños distintos entre los ficheros y el proceso, y la clave y los hosts conocidos en una ruta que se borra al recrear el contenedor",
  "La clave se había borrado",
  "GitHub había cambiado su clave",
  "El repositorio estaba corrupto",
]
cause = "Los ficheros eran del usuario de la aplicación y git corría como root: git lo rechaza por seguridad. Y SSH buscaba la clave y los hosts conocidos en la carpeta de root, que se vacía cada vez que se recrea el contenedor."
fix = "Marcar el repositorio como seguro, guardar los hosts conocidos en la ruta persistente y decirle a git qué clave usar desde la configuración del propio repositorio, que vive en el vault."
lesson = "En un contenedor, lo que no está en un volumen no existe tras recrearlo. El arreglo tiene que vivir donde persiste, o hay que repetirlo cada vez."

[text.es.incidents.update]
title = "Obsidian no levanta tras actualizar"
meta = "21-07-2026 · aplicación"
symptom = "Tras actualizar Obsidian, la aplicación dejó de arrancar bien. El contenedor seguía vivo, sin reinicios ni falta de memoria."
options = [
  "El contenedor se quedaba sin memoria",
  "El vault estaba corrupto",
  "Un plugin incompatible con la versión nueva, probablemente al abrir la nota de inicio",
  "El escritorio remoto no arrancaba",
]
cause = "Sin confirmar del todo: Obsidian no guarda en disco los errores de plugins. Los sospechosos eran los dos únicos que pedían la versión más reciente, uno de ellos el que abre al arrancar una nota con varias consultas."
fix = "Arrancar en modo restringido, sin plugins de la comunidad, para seguir usando el vault mientras se aísla el culpable."
lesson = "Antes de mirar la aplicación, descartar la infraestructura capa por capa. Y saber dónde guarda cada cosa sus errores: aquí, en ningún sitio."

