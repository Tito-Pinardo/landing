[text.en.incidents.stuck]
title = "13 days without a backup"
meta = "18-09-2026 · backup"
symptom = "Reviewing the documentation, the vault's last commit was 13 days old, even though the plugin was set to commit and push every 10 minutes."
options = [
  "The SSH key had expired",
  "GitHub was rejecting pushes",
  "The container's disk was full",
  "The plugin silently stopped running, probably after moving hundreds of notes at once",
]
cause = "Credentials and connection worked: a manual push went through first time. What had stopped was the plugin, right after reorganising the whole vault into numbered folders."
fix = "Review the diff, commit the reorganisation (git recognised it as renames) and push by hand from inside the container. Then keep an eye on the plugin doing it on its own again."
lesson = "A backup that doesn't warn when it fails isn't a reliable backup. Watch the result (the last commit's date), not the configuration."

[text.en.incidents.push]
title = "«dubious ownership» and then «Host key verification failed»"
meta = "July 2026 · Git"
symptom = "Pushing the vault failed with two errors in a row: first git refused to work with the repository; once fixed, SSH didn't recognise GitHub."
options = [
  "Different owners for the files and the process, and the key and known hosts in a path wiped when the container is recreated",
  "The key had been deleted",
  "GitHub had changed its key",
  "The repository was corrupted",
]
cause = "The files belonged to the app's user and git ran as root: git refuses that for safety. And SSH looked for the key and known hosts in root's folder, which is emptied every time the container is recreated."
fix = "Mark the repository as safe, store known hosts in the persistent path and tell git which key to use from the repository's own configuration, which lives in the vault."
lesson = "In a container, whatever isn't on a volume doesn't exist after it's recreated. The fix has to live where things persist, or be repeated every time."

[text.en.incidents.update]
title = "Obsidian won't come up after updating"
meta = "21-07-2026 · app"
symptom = "After updating Obsidian, the app stopped starting properly. The container was still alive, with no restarts and no memory shortage."
options = [
  "The container ran out of memory",
  "The vault was corrupted",
  "A plugin incompatible with the new version, probably when opening the start note",
  "The remote desktop didn't start",
]
cause = "Not fully confirmed: Obsidian doesn't write plugin errors to disk. The suspects were the only two asking for the newest version, one of them the plugin that opens a note full of queries at start-up."
fix = "Start in restricted mode, without community plugins, to keep using the vault while isolating the culprit."
lesson = "Before looking at the app, rule out the infrastructure layer by layer. And know where each thing keeps its errors: here, nowhere."

