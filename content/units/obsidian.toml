[[text.es.decisions]]
title = "Qué se documenta"
choice = "El resultado real, no el plan"
why = "Un procedimiento que dice lo que debería pasar engaña el día que pasa otra cosa. Con el resultado de cada comando se ve qué es dato y qué es suposición."

[[text.es.decisions]]
title = "Dónde viven los secretos"
choice = "Nunca en el vault"
why = "El vault se copia en un repositorio externo. Las contraseñas van cifradas en el vault de Ansible o en ficheros locales con permisos mínimos."

[[text.es.decisions]]
title = "¿Hermes puede escribir?"
choice = "No"
why = "La documentación es de trabajo y tiene que ser de fiar. Un modelo pequeño que escribe notas acabaría mezclando datos y suposiciones."

[text.es.tech_notes]
lxc = "Corre en el contenedor de Docker del servidor."
docker = "Obsidian dentro de un escritorio remoto en Docker, con el vault y la configuración en volúmenes persistentes."
git = "Commit y push automáticos cada 10 minutos a un repositorio privado y a una segunda copia, con la clave en una ruta persistente."
hardening = "Acceso solo desde casa o la VPN con doble factor y secretos siempre fuera del vault."
llm = "La documentación está indexada por significado para que Hermes la use al responder."

[text.es.close]
lessons = [
  "Documentar con resultados reales es lo que hace que la segunda vez cueste minutos.",
  "Vigilar la copia por lo que produce, no por cómo está configurada.",
]
next = [
  "Un aviso automático si el último commit del vault tiene más de un día.",
  "Encontrar el plugin que se paró y decidir si se sustituye por una tarea programada.",
]

