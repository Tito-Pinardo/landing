[[text.en.decisions]]
title = "What gets documented"
choice = "The real result, not the plan"
why = "A procedure that says what should happen misleads you the day something else happens. With each command's output you can tell data from assumption."

[[text.en.decisions]]
title = "Where secrets live"
choice = "Never in the vault"
why = "The vault is copied to an external repository. Passwords go encrypted in the Ansible vault or in local files with minimal permissions."

[[text.en.decisions]]
title = "Can Hermes write?"
choice = "No"
why = "The documentation is for work and has to be trustworthy. A small model writing notes would end up mixing data with assumptions."

[text.en.tech_notes]
lxc = "Runs in the server's Docker container."
docker = "Obsidian inside a remote desktop on Docker, with the vault and settings on persistent volumes."
git = "Automatic commit and push every 10 minutes to a private repository and a second copy, with the key in a persistent path."
hardening = "Access only from home or the VPN with two-factor, and secrets always outside the vault."
llm = "The documentation is indexed by meaning so Hermes can use it when answering."

[text.en.close]
lessons = [
  "Documenting real results is what makes the second time take minutes.",
  "Watch the backup by what it produces, not how it's configured.",
]
