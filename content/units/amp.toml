short = "Router"
title = "Router"
text = "Only has the ports of running servers open, with rules created by the automation."

[text.en.pods.cloudflare]
short = "Cloudflare"
title = "Cloudflare DNS"
text = "One name per server, which only exists while it's running. No proxy: games don't speak HTTP."

[text.en.pods.sync]
short = "Publisher"
title = "Automatic publisher"
text = "Every minute it asks the panel what's running and adjusts router and DNS. On the router it can only touch its own rules."

[text.en.pods.discord]
short = "Discord"
title = "Discord"
text = "A channel where each server has its status message: on or off, who's in, the address and the link to join."

[text.en.pods.site]
short = "Public site"
title = "Public servers site"
text = "A single page with the servers live, grouped by game, with «Copy» and «Connect with Steam», who's on Discord and the rules. It doesn't link to the AMP panel."

[text.en.pods.botpanel]
short = "Bot panel"
title = "Bot admin panel"
text = "Only from home or the VPN, behind the internal door with two-factor. This is where servers AMP already publishes get registered and how they show up gets edited."

[text.en.pods.host]
short = "Hypervisor"
title = "Hypervisor"
text = "Power cuts included: with no UPS, the server switches off abruptly."

[text.en.pods.proxy]
short = "Velocity proxy"
title = "Minecraft proxy"
text = "One port for every Minecraft world: depending on the name you join with, it sends you to one world or another."

[text.en.pods.ufw]
short = "Firewall"
title = "Container firewall"
text = "Inbound blocked except declared ports. The panel syncs them every five minutes; the panel and SSH, only from home."

[text.en.pods.panel]
short = "AMP panel"
title = "AMP panel"
text = "Where servers are started, stopped and configured. No longer published on the internet."

[text.en.pods.bot]
short = "Status bot"
title = "Status bot"
text = "Reads the panel with an unprivileged user and keeps the Discord messages and the public site up to date."

[text.en.pods.modded]
short = "Modded MC"
title = "Modded Minecraft"
text = "The main server, with almost ninety mods, several of them for performance."

[text.en.pods.other]
short = "Other worlds"
title = "Other Minecraft worlds"
text = "Smaller worlds, behind the same proxy."

[text.en.pods.steam]
short = "Steam games"
title = "Steam games"
text = "Dedicated servers that start when someone wants to play."

[text.en.pods.manager]
short = "Manager"
title = "Instance manager"
text = "Each server is its own Docker container. The manager starts, stops and updates them."

[text.en.pods.disks]
short = "SAS disks"
title = "Four mirrored disks"
text = "They came with write cache off. Turned on and saved on the disk itself: fsync writes, from 108 to 946 per second."

[text.en.pods.cpu]
short = "Pinned CPU"
title = "CPU on a single processor"
text = "The hypervisor gave threads from both processors: Java had its memory on one and its work on the other. Now the container uses six cores of a single one."

[text.en.pods.java]
short = "Java"
title = "Tuned Java"
text = "Memory reserved from start-up, huge pages and no forced clean-ups every 5 seconds. Compression only once: at the proxy."

[text.en.pods.arc]
short = "ZFS cache"
title = "ZFS cache in RAM"
text = "It already served over 98 % of reads: no need to touch it."

[text.en.pods.users]
short = "Users"
title = "Users file"
text = "Where AMP keeps accounts and permissions. With a power cut mid-write, it ends up empty."

[text.en.pods.backup]
short = "Backup 30 min"
title = "Backup every 30 minutes"
text = "From the hypervisor, outside the container, the last 100 versions."

[text.en.pods.valid]
short = "Is it valid?"
title = "Check the backup"
text = "An empty or «{}» copy doesn't count as a backup: the script rejects it and warns."

[text.en.pods.zabbix]
short = "Zabbix"
title = "Monitoring"
text = "Watches the container and the servers' processes."

[text.en.flows.start]
title = "I start a server"
steps = [
  "I start a server from the panel.",
  "The manager starts its container.",
  "The server loads the world.",
  "A minute later, the publisher sees it's running.",
  "It creates its rule on the router, with only the game ports: no console or admin.",
  "And its name…",
  "…on Cloudflare.",
  "A friend types that name in the game.",
  "They come in through the router.",
  "The proxy looks at the name and sends them to their world.",
  "They're in.",
]

[text.en.flows.stop]
title = "I stop it"
steps = [
  "I stop the server in the panel.",
  "The manager stops its container.",
  "The publisher waits 3 minutes, in case it's a restart.",
  "It removes the router rule.",
  "And the Cloudflare name. Nothing is left open.",
]

[text.en.flows.play]
title = "A game session"
steps = [
  "A player connects.",
  "They come in through the router.",
  "They pass the container firewall, which only allows declared ports.",
  "The proxy sends them to their world.",
  "The server saves the world every so often.",
  "Writes go to the disk mirror, now with cache: 8.8 times faster.",
  "Reads almost always come from the RAM cache.",
  "The server answers.",
  "Through the proxy, which compresses just once.",
  "And to the player.",
]

[text.en.flows.status]
title = "Friends check Discord to see what's up"
steps = [
  "The panel knows which servers are running and how many people are on each.",
  "The bot asks it every so often, with a read-only user over the internal network.",
  "In the Discord channel each server has its own message: on or off, who's in, the address and its cover art. The bot edits it when something changes, without flooding the channel.",
  "A friend sees people playing and fancies joining.",
  "The message title links to the server's page to connect directly or copy the address; if that page won't work, to the website.",
  "They come in through the router, which has that port open because the server is running.",
  "And the proxy takes them to their world.",
]

[text.en.flows.listed]
title = "A new server shows up on the site and on Discord"
steps = [
  "In the AMP panel I give a server its public address.",
  "The bot sees it on its next check: address, game, cover art and the Steam button come from what AMP already knows.",
  "The server appears on its own on the public site, in its section (Minecraft, games with several servers, Steam or others). No Discord message yet.",
  "In the bot's panel, only from home or the VPN with two-factor, it shows up under «Published from AMP» with an «Add to bot» button.",
  "Adding it registers it in the bot: if I set my own address or cover art, they override AMP's.",
  "And it starts posting its status message in the Discord channel.",
  "On the site the server now has its full card: «Copy» the address and «Connect with Steam».",
  "Friends find it on the site or on Discord, without me having to tell anyone.",
]

[text.en.flows.blackout]
title = "A power cut"
steps = [
  "The power goes and the server switches off abruptly.",
  "AMP was writing its users file: it's left empty.",
  "But it was copied every 30 minutes from outside the container.",
  "The last valid copy (not empty, real JSON) is found automatically.",
  "It's restored with the panel stopped.",
  "And the panel comes back with every account.",
]

[text.en.incidents.users]
title = "«No such user» after a power cut"
meta = "16-07-2026 · panel"
symptom = "After a power cut I couldn't log into the panel: «No such user». Neither could the status bot, which retried thousands of times a day."
options = [
  "Someone had deleted the account",
  "The container disk was full",
  "The cut caught AMP writing its users file and left it empty",
  "Two-factor had expired",
]
cause = "AMP doesn't write its users file atomically. A shutdown halfway leaves it as «{}», and its own rotating copy fell in the same window. It's a known AMP bug."
fix = "Recreate the accounts, plus a backup every 30 minutes from the hypervisor, outside the container, keeping the last 100 versions."
lesson = "Without a UPS, anything that writes carelessly is a risk. The backup has to live outside what breaks."

[text.en.incidents.cron]
title = "A backup that had never backed up"
meta = "02-08-2026 · backups"
symptom = "Another cut and the file was empty again. I went to restore the backup… and 17 days of backups were all 0 bytes."
options = [
  "The backup disk was full",
  "Cron couldn't find the Proxmox command because its PATH doesn't include it",
  "The file was locked",
  "Backups were deleted on rotation",
]
cause = "The script used a Proxmox command living in a folder that cron's minimal PATH doesn't include. It failed on every run since day one, silently, and the script accepted any output as good."
fix = "Absolute paths, a test with cron's real PATH and a check that each copy is real JSON: if it's empty or «{}», it's discarded and a warning is raised."
lesson = "An untested backup isn't a backup. Test it the way the system will run it, not the way I run it."

[text.en.incidents.wce]
title = "Slow disks for no obvious reason"
meta = "06-10-2026 · performance"
symptom = "Saving the world was slow and fsync writes topped out at 108 per second on a four-disk mirror."
options = [
  "One of the disks was failing",
  "ZFS compression was misconfigured",
  "The ARC cache was small",
  "The disks shipped with write cache switched off",
]
cause = "These SAS disks come with write cache disabled. Every write waited for the platter."
fix = "Turn it on and save it on the disk itself, with the «none» scheduler since ZFS already orders I/O. Safe with power cuts: ZFS flushes the cache on every transaction. From 108 to 946 fsync writes per second."
lesson = "Measure before buying. And note that a replacement disk will come with the cache off again."

