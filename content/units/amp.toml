[[text.en.decisions]]
title = "What gets opened"
choice = "Only what's running, and only its game ports"
why = "An open port for a stopped server adds nothing and is surface. Console and admin are never opened."

[[text.en.decisions]]
title = "How to improve without buying"
choice = "Measure first"
why = "The CPU is what it is and a Minecraft server depends on a single thread. But the disks, the split across processors and Java had room, measured before and after with fio."

[[text.en.decisions]]
title = "What the automation touches on the router"
choice = "Only its own rules"
why = "The router user the publisher uses can only create and delete rules with its prefix. If it failed, it couldn't break the rest of the firewall."

[text.en.tech_notes]
proxmox = "CPU pinned to one processor, more memory live, and backups of the users file from the hypervisor."
lxc = "AMP runs in its own container, with game data mounted from the ZFS pool."
terraform = "Creates the AMP container; CPU pinning is noted because Terraform can't see it."
zfs = "A four-disk mirror for the worlds, compression and RAM cache with over 98 % hits."
docker = "Each game server and the panel in its own container, plus the status bot."
mikrotik = "Inbound rules created and deleted by the automation based on what's running."
linux = "Disk write cache, I/O scheduler, cron with the right PATH and verified backups."
zabbix = "Watches the container and its processes."
hardening = "Firewall blocking inbound, panel and SSH only from home, no UPnP and ports open only while needed."
python = "The publisher that syncs panel, router and DNS every minute."
typescript = "The bot that posts the servers' status, in Node.js."

[text.en.close]
lessons = [
  "Test backups by restoring them, and with cron's real environment.",
  "Open ports based on what's running, not just in case.",
  "Measure before thinking about buying.",
]
