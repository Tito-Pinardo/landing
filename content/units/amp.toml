[text.es.meta]
title = "Los servidores de juego por dentro · Tito Pinardo Gutiérrez"
description = "Los servidores de juego de los amigos con AMP: puertos y DNS que se abren solos al encender un servidor y se cierran al apagarlo, discos 8,8 veces más rápidos sin comprar nada y una copia que llevaba 17 días vacía."

