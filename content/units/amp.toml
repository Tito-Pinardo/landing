[text.es.incidents.users]
title = "«No such user» después de un corte"
meta = "16-07-2026 · panel"
symptom = "Tras un corte de luz, no podía entrar al panel: «No such user». El bot de estado tampoco, y reintentaba miles de veces al día."
options = [
  "Alguien había borrado la cuenta",
  "El disco del contenedor estaba lleno",
  "El corte pilló a AMP escribiendo el fichero de usuarios y lo dejó vacío",
  "La autenticación en dos pasos había caducado",
]
cause = "AMP no escribe su fichero de usuarios de forma atómica. Un apagado a mitad lo deja en «{}», y su propia copia rotativa cayó en la misma ventana. Es un fallo conocido de AMP."
fix = "Recrear las cuentas, y una copia cada 30 minutos desde el hipervisor, fuera del contenedor, con las últimas 100 versiones."
lesson = "Sin SAI, todo lo que escribe sin cuidado es un riesgo. La copia tiene que vivir fuera de lo que se rompe."

[text.es.incidents.cron]
title = "Una copia que nunca había copiado"
meta = "02-08-2026 · copias"
symptom = "Otro corte y otra vez el fichero vacío. Fui a restaurar la copia… y las copias de 17 días eran todas de 0 bytes."
options = [
  "El disco de las copias estaba lleno",
  "El cron no encontraba el comando de Proxmox porque su PATH no lo incluye",
  "El fichero estaba bloqueado",
  "Las copias se borraban al rotar",
]
cause = "El script usaba un comando de Proxmox que vive en una carpeta que el PATH mínimo del cron no incluye. Fallaba en cada pasada desde el primer día, en silencio, y además el script daba por buena cualquier salida."
fix = "Rutas absolutas, una prueba con el PATH real del cron y una comprobación de que cada copia es JSON de verdad: si sale vacía o «{}», se descarta y avisa."
lesson = "Una copia no probada no es una copia. Se prueba como la ejecutará el sistema, no como la ejecuto yo."

[text.es.incidents.wce]
title = "Discos lentos sin motivo aparente"
meta = "06-10-2026 · rendimiento"
symptom = "Guardar el mundo costaba mucho y las escrituras con fsync se quedaban en 108 por segundo en un espejo de cuatro discos."
options = [
  "Uno de los discos estaba fallando",
  "ZFS tenía la compresión mal configurada",
  "La caché ARC era pequeña",
  "Los discos venían de fábrica con la caché de escritura apagada",
]
cause = "Estos discos SAS traen la caché de escritura desactivada. Cada escritura esperaba al plato."
fix = "Activarla y guardarla en el propio disco, con planificador «none» porque ZFS ya ordena la E/S. Es seguro con cortes: ZFS vacía la caché en cada transacción. De 108 a 946 escrituras con fsync por segundo."
lesson = "Medir antes de comprar. Y apuntar que un disco de repuesto vendrá con la caché apagada otra vez."

[[text.es.timeline]]
title = "Los primeros servidores"
period = "Verano de 2026"
items = [
  "AMP con una instancia Docker por juego y un proxy para todos los Minecraft.",
  "Copias del fichero de usuarios tras el primer corte, y su arreglo cuando resultaron vacías.",
]

[[text.es.timeline]]
title = "Cortafuegos y migración"
period = "Septiembre de 2026"
items = [
  "Cortafuegos del contenedor con entrada bloqueada y puertos sincronizados por el panel.",
  "Contenedor nuevo gestionado con Terraform.",
]

[[text.es.timeline]]
title = "Rendimiento y apertura automática"
period = "Octubre de 2026"
items = [
  "Caché de escritura, CPU en un solo procesador, Java y compresión ajustados.",
  "Router y DNS que se abren y cierran solos según lo encendido.",
  "Panel y gestión del bot fuera de internet.",
]

[[text.es.decisions]]
title = "Qué se abre"
choice = "Solo lo que está encendido, y solo sus puertos de juego"
why = "Un puerto abierto para un servidor apagado no aporta nada y es superficie. La consola y la administración nunca se abren."

[[text.es.decisions]]
title = "Cómo mejorar sin comprar"
choice = "Medir primero"
why = "La CPU es la que es y un servidor de Minecraft depende de un solo hilo. Pero los discos, el reparto entre procesadores y Java tenían margen, y se midió antes y después con fio."

[[text.es.decisions]]
title = "Qué toca la automatización en el router"
choice = "Solo sus propias reglas"
why = "El usuario del router que usa el publicador solo puede crear y borrar reglas con su prefijo. Si fallara, no puede romper el resto del cortafuegos."

[text.es.tech_notes]
proxmox = "CPU fijada a un procesador, más memoria en caliente y copias del fichero de usuarios desde el hipervisor."
lxc = "AMP corre en su propio contenedor, con los datos de juego montados desde el pool de ZFS."
terraform = "Crea el contenedor de AMP; la fijación de CPU queda anotada porque Terraform no la ve."
zfs = "Un espejo de cuatro discos para los mundos, compresión y caché en RAM con más del 98 % de aciertos."
docker = "Cada servidor de juego y el panel, en su propio contenedor, más el bot de estado."
mikrotik = "Reglas de entrada creadas y borradas por la automatización según lo encendido."
linux = "Caché de escritura de los discos, planificador de E/S, cron con PATH correcto y copias comprobadas."
zabbix = "Vigila el contenedor y sus procesos."
hardening = "Cortafuegos con entrada bloqueada, panel y SSH solo desde casa, sin UPnP y puertos abiertos solo mientras hace falta."
python = "El publicador que sincroniza panel, router y DNS cada minuto."
typescript = "El bot que publica el estado de los servidores, en Node.js."

[text.es.close]
lessons = [
  "Probar las copias restaurándolas, y con el entorno real del cron.",
  "Abrir puertos según lo que está encendido, no por si acaso.",
  "Medir antes de pensar en comprar.",
]
next = [
  "Un SAI: es lo único que evita de raíz los apagados a mitad de escritura.",
  "Un SSD para el mundo principal y pregenerar el mapa.",
]

