title = "AMP · servidores de juego"
tagline = "Minecraft con mods, otros Minecraft detrás de un proxy y juegos de Steam para los amigos, gestionados desde un panel. Lo que se abre a internet depende de lo que está encendido: al arrancar un servidor se crean su regla en el router y su nombre en Cloudflare, y a los 3 minutos de apagarlo desaparecen."
grade = "Escrituras ×8,8 sin comprar hardware"
facts = [
  { label = "Por qué tanto cuidado", value = "Es lo único del homelab con puertos de juego abiertos a internet. Cuantos menos y menos tiempo, mejor." },
