[text.en.groups]
wan = "WAN and inbound"
segments = "Segments (VLANs)"
home = "What sits behind"
guard = "Protection and automation"

[text.en.pods.internet]
short = "Internet"
title = "Internet"
text = "Anyone, from anywhere."

[text.en.pods.ont]
short = "Fibre (bridge)"
title = "Fibre box in bridge mode"
text = "The ISP box only turns fibre into Ethernet. No Wi-Fi, no DHCP, no UPnP or WPS: no services of its own."

[text.en.pods.cloudflare]
short = "Cloudflare"
title = "Cloudflare"
text = "In front of the public sites: hides my home IP and filters attacks before they arrive."

[text.en.pods.phone]
short = "Phone outside"
title = "My phone, away from home"
text = "On mobile data with the VPN, I join the network as if I were home."

[text.en.pods.pppoe]
short = "PPPoE"
title = "PPPoE connection"
text = "The router authenticates with the ISP and gets the public IP, which changes now and then."

[text.en.pods.nat]
short = "Inbound NAT"
title = "Port forwarding (NAT)"
text = "Only what has somewhere to go is forwarded: the web goes to Traefik and little else. Every rule is scoped to traffic coming in on the WAN."

[text.en.pods.fw]
short = "Firewall"
title = "Firewall"
text = "Decides what can talk to what. Between segments the default is no: only the documented exceptions."

[text.en.pods.wg]
short = "WireGuard"
title = "WireGuard VPN"
text = "Lives on the router itself: I moved it out of a container so getting in to fix the server doesn't depend on the server."

[text.en.pods.servers]
short = "Servers"
title = "Server segment"
text = "The server and my admin PC. They can start connections towards the rest; the rest can't start them towards here."

[text.en.pods.wired]
short = "Wired home"
title = "Wired segment"
text = "Home devices on cable. They can't get into the server segment."

[text.en.pods.wifi]
short = "Wi-Fi · TV"
title = "Wi-Fi, TV and alarm segment"
text = "Phones, the TV and the alarm. The most isolated one: it sees neither servers nor wired, except DNS and Plex."

[text.en.pods.dhcp]
short = "DHCP"
title = "DHCP per segment"
text = "Each segment gets addresses from its own range, and all of them point at the home DNS."

[text.en.pods.ap]
short = "Wi-Fi AP"
title = "Wi-Fi access point"
text = "The old ISP router, repurposed: it only broadcasts Wi-Fi into its segment. No DHCP, UPnP or WPS."

[text.en.pods.traefik]
short = "Traefik"
title = "Traefik"
text = "The only door to the public sites. It has its own unit in the rack."

[text.en.pods.dns]
short = "DNS"
title = "Home DNS"
text = "Resolves internal names and blocks ads. It's the exception every segment can reach."

[text.en.pods.plex]
short = "Plex"
title = "Plex"
text = "The other exception: the TV, on Wi-Fi, can watch the library."

[text.en.pods.lists]
short = "Block lists"
title = "Staged lists"
text = "Whoever opens new connections again and again goes onto a first list, then a second, and finally the block list for a day. A single attempt punishes no one."

[text.en.pods.hairpin]
short = "Hairpin NAT"
title = "Hairpin NAT"
text = "So that, from inside the house, the public IP leads to the internal service just like from outside."

[text.en.pods.script]
short = "IP script"
title = "Dynamic IP script"
text = "When the ISP changes the public IP, a router script updates only the rules that depend on it."

[text.en.pods.mgmt]
short = "Management"
title = "Router management"
text = "Administration is only accepted from the server segment and the VPN, with TLS 1.2 and strong SSH crypto."

[text.en.flows.visit]
title = "Someone opens this site"
steps = [
  "A visitor asks for the site from anywhere in the world.",
  "It reaches Cloudflare first, which has it cached or asks home for it.",
  "The request comes in over the fibre. The ISP box is only a bridge.",
  "The MikroTik receives it on the PPPoE connection, with the home public IP.",
  "A NAT rule forwards it to Traefik. Only for traffic coming in on the WAN: a failure taught me that condition.",
  "The firewall lets it through because it's a connection with a known destination.",
  "It enters the server segment.",
  "Traefik gets it and sends it to the site's container.",
]

[text.en.flows.vpn]
title = "I get in from outside with the VPN"
steps = [
  "I'm away from home, on mobile data.",
  "The phone opens the WireGuard tunnel to the home public IP.",
  "It comes in over the fibre.",
  "The MikroTik receives the encrypted packet.",
  "WireGuard checks the phone's key and opens the tunnel. If the key doesn't match, it doesn't even answer.",
  "The firewall treats the VPN like the admin segment.",
  "From there I reach the server as if I were home.",
  "And the router management, which accepts connections from nowhere else.",
]

[text.en.flows.wifi]
title = "A phone joins the Wi-Fi"
steps = [
  "A phone connects to the home access point.",
  "The AP puts it in the Wi-Fi segment, the most isolated one.",
  "The router's DHCP gives it an address in that segment and the home DNS.",
  "Its DNS queries go to the home DNS, which blocks ads and trackers.",
  "The firewall lets it out to the internet.",
  "Out through the PPPoE connection with the public IP.",
  "And over the fibre.",
  "The phone browses without being able to see the servers.",
]

[text.en.flows.isolation]
title = "A Wi-Fi device tries to get in"
steps = [
  "The TV, on the Wi-Fi segment, asks for the Plex library.",
  "The firewall has an explicit exception for that: go ahead.",
  "Plex serves the film.",
  "Now a device on the same segment tries to reach something else on the server.",
  "The firewall looks for an exception. There isn't one.",
  "The traffic never reaches the server segment.",
  "It's silently dropped, no reply.",
  "The device only sees what it's been allowed to see.",
]

[text.en.flows.bruteforce]
title = "Someone tries passwords over SSH"
steps = [
  "An internet bot tries to log in over SSH, again and again.",
  "It reaches the router.",
  "First attempt: the firewall writes its address on the first list, for a minute.",
  "If it comes back within that minute, it moves to the second list.",
  "The third attempt in a row…",
  "…puts it on the block list for a day.",
  "From then on, everything it sends is dropped unseen. I reviewed the order of the stages in the audit: the first packet mustn't skip all three at once.",
]

[text.en.flows.ipchange]
title = "The ISP changes the IP"
steps = [
  "The PPPoE connection renegotiates and a new public IP arrives.",
  "The router script spots it on the WAN list.",
  "It updates the hairpin NAT rules that had the old IP written in.",
  "And the forwards point to the right address again.",
  "Outside, the server's sync job updates Cloudflare so the domains still point home.",
]

[text.en.incidents.hsts]
title = "Fake certificates across the house"
meta = "June 2026 · NAT"
symptom = "From home, sites like Spotify showed a «self-signed» certificate error and Firefox wouldn't even allow an exception. From outside they were fine."
options = [
  "The home DNS resolved those domains wrongly",
  "A NAT rule was redirecting all inside HTTPS to Traefik",
  "The PC's antivirus was inspecting traffic",
  "The ISP was intercepting HTTPS",
]
cause = "The rule forwarding 443 to Traefik didn't say «only traffic coming in on the WAN». It caught inside traffic too, Traefik answered with its internal certificate and HSTS sites don't forgive."
fix = "Add the WAN interface condition to the rule and flush open connections so they were rebuilt with the new rule."
lesson = "Every forwarding rule carries its inbound interface. A rule that's too broad works… until it breaks something far from where it lives."

[text.en.incidents.selfban]
title = "I locked myself out"
meta = "14-08-2026 · firewall"
symptom = "Minutes after adding brute-force protection to the Minecraft server, I couldn't get in to play myself."
options = [
  "The Minecraft server had crashed",
  "The rule was in the wrong chain",
  "The client opens several connections at once and I climbed the stages in seconds",
  "The home IP had changed",
]
cause = "The staged pattern that works for SSH doesn't suit a game: the client opens several new connections when it starts, so it went through the three stages in seconds and landed on the block list for a whole day."
fix = "Take my address off the list and drop the rule for that service. Staged protection stays where it makes sense: admin access."
lesson = "A security rule is tested with legitimate traffic, not just with the attack. What works for one protocol doesn't work for another."

[text.en.incidents.askey]
title = "A laptop that wouldn't join the Wi-Fi"
meta = "30-09-2026 · Wi-Fi"
symptom = "A new laptop couldn't join the home Wi-Fi, and the VPN failed from the home Wi-Fi itself. Every other device was fine."
options = [
  "The access point was cabled into the wrong segment",
  "The Wi-Fi password was wrong",
  "The laptop had an old driver",
  "DHCP had run out of addresses",
]
cause = "The access point was plugged into the server segment's port, with an address that wasn't its own. On top of that, the ISP box had its own Wi-Fi on, competing with the home one."
fix = "Re-cable the AP to its port, check in the router's VLAN table that it was in its segment, and turn off the spare Wi-Fi, DHCP, UPnP and WPS on the ISP box and the AP."
lesson = "Check live, not in the docs: the AP's real IP wasn't the planned one. And switch off everything a device doesn't need: UPnP opens ports without asking and WPS can be brute-forced."

[text.en.incidents.laliga]
title = "My sites don't load on Saturdays"
meta = "10-10-2026 · outside my network"
symptom = "One Saturday afternoon my sites wouldn't load from outside home. With the VPN, they did. The server was answering perfectly."
options = [
  "Cloudflare was down",
  "The certificate had expired",
  "The router had changed IP",
  "ISPs were blocking Cloudflare IPs because of football",
]
cause = "On match days Spanish ISPs block Cloudflare IPs to cut pirate streams. My sites share those IPs. It wasn't my fault."
fix = "Check the origin bypassing Cloudflare and look at a public service that tracks the blocks. I considered dropping Cloudflare during matches or running a proxy elsewhere; I decided to do nothing: the block lifts on its own."
lesson = "Before touching anything, separate «my system is failing» from «something between the visitor and me is failing». Checking the origin directly settles it in a minute."

[[text.en.timeline]]
title = "Out with the ISP router"
period = "June 2026"
items = [
  "MikroTik RB5009 as the router, with its own PPPoE; the ISP box in bridge mode.",
  "WireGuard moved from a container to the router itself: the VPN no longer depends on the server.",
  "First failure, first lesson: HTTPS NAT scoped to the WAN.",
]

[[text.en.timeline]]
title = "Segments and access matrix"
period = "August 2026"
items = [
  "The initial six-VLAN plan simplified to the three segments that were really needed.",
  "A matrix of what can start connections towards what, confirmed live against the router.",
  "Explicit exceptions: DNS for everyone and Plex for the TV.",
]

[[text.en.timeline]]
title = "Audit and hardening"
period = "September 2026"
items = [
  "Order of the blocking stages reviewed, TLS 1.2 for management and strong SSH crypto.",
  "September RouterOS security advisory: update to the fixed release in the same branch.",
  "AP and fibre box cleaned up: no spare Wi-Fi, DHCP, UPnP or WPS.",
]

[[text.en.timeline]]
title = "A DMZ for what faces the internet"
period = "18-10-2026"
items = [
  "The public door and the game server, the only things that take connections from the internet, move to their own segment.",
  "From there they only reach DNS, monitoring and, for the door, the services it publishes. The home network, nothing.",
  "Changed live, without an outage, and then put into code.",
]

[[text.en.decisions]]
title = "Where the VPN lives"
choice = "On the router, not the server"
why = "If the VPN depends on the server, when the server fails I can't get in to fix it. On the router it's there as long as there's internet."

[[text.en.decisions]]
title = "How many segments"
choice = "Three, not six"
why = "The original plan had six VLANs. Each one is a matrix of rules to maintain; three cover what matters: servers apart, the house apart and wireless, the most isolated."

[[text.en.decisions]]
title = "What's open to the internet"
choice = "Only what has somewhere to go, scoped to the WAN"
why = "Every open port is surface. The web comes in through Traefik and Cloudflare; internal panels aren't published: you reach them through the VPN."

[[text.en.decisions]]
title = "What takes connections from the internet"
choice = "On its own segment"
why = "If someone got in through the public door or a game server, the next step would be moving around the network. Isolated in a DMZ, they only see what they need to work."

[text.en.tech_notes]
mikrotik = "RouterOS 7: PPPoE, NAT, a firewall with staged lists, DHCP per segment, scripts reacting to IP changes and restricted management."
vlan = "Three segments with an explicit access matrix: servers, wired home and Wi-Fi with the TV, the most isolated."
wireguard = "The VPN to get in from outside, on the router itself, with access equal to the admin segment."
dns = "The home DNS is the exception every segment can reach; each segment's DHCP announces it."
hardening = "Staged brute-force blocking, management only from inside or the VPN, TLS 1.2, strong SSH crypto and spare services switched off."

[text.en.close]
lessons = [
  "Network rules fail far from where they live: a NAT rule was breaking HTTPS in the browser.",
  "Test security rules with legitimate traffic, not only with the attack.",
  "Check the device's real state before trusting the documentation.",
]
next = [
  "Get VPN hairpin working from the home Wi-Fi, which still doesn't.",
  "Move the router configuration into code and review it with diffs, like the rest of the infrastructure.",
]
