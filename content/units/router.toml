  "Actualiza las reglas de hairpin NAT que tenían la IP antigua escrita.",
  "Y las redirecciones vuelven a apuntar a la dirección correcta.",
  "Fuera, el sincronizador del servidor actualiza Cloudflare para que los dominios sigan apuntando a casa.",
]

[text.es.incidents.hsts]
title = "Certificados falsos en toda la casa"
meta = "Junio de 2026 · NAT"
symptom = "Desde casa, webs como Spotify daban error de certificado «autofirmado» y Firefox no dejaba ni añadir una excepción. Desde fuera iban bien."
options = [
  "El DNS de casa resolvía mal esos dominios",
  "Una regla de NAT redirigía todo el HTTPS de dentro hacia Traefik",
  "El antivirus del PC inspeccionaba el tráfico",
  "La operadora interceptaba el HTTPS",
]
cause = "La regla que reenvía el 443 a Traefik no decía «solo lo que entra por la WAN». Interceptaba también tráfico de dentro, Traefik respondía con su certificado interno y las webs con HSTS no perdonan."
fix = "Añadir a la regla la condición de interfaz WAN y vaciar las conexiones abiertas para que se rehicieran con la regla nueva."
lesson = "Toda regla de redirección lleva su interfaz de entrada. Una regla demasiado amplia funciona… hasta que rompe algo lejos de donde está."

[text.es.incidents.selfban]
title = "Me bloqueé a mí mismo"
meta = "14-08-2026 · cortafuegos"
symptom = "Minutos después de añadir protección contra fuerza bruta al servidor de Minecraft, yo mismo no podía entrar a jugar."
options = [
  "El servidor de Minecraft se había caído",
  "La regla estaba en la cadena equivocada",
  "El cliente abre varias conexiones seguidas y subí de etapa en segundos",
  "La IP de casa había cambiado",
]
cause = "El patrón por etapas que funciona con SSH no vale para un juego: el cliente abre varias conexiones nuevas al arrancar, así que pasaba las tres etapas en segundos y acababa en la lista de bloqueo un día entero."
fix = "Quitar mi dirección de la lista y retirar la regla para ese servicio. La protección por etapas se queda donde tiene sentido: el acceso de administración."
lesson = "Una regla de seguridad se prueba con el tráfico legítimo, no solo con el ataque. Lo que sirve para un protocolo no sirve para otro."

[text.es.incidents.askey]
title = "Un portátil que no conectaba al WiFi"
meta = "30-09-2026 · WiFi"
symptom = "Un portátil nuevo no se conectaba al WiFi de casa, y la VPN fallaba desde la propia WiFi. El resto de dispositivos iban bien."
options = [
  "El punto de acceso estaba cableado en el segmento equivocado",
  "La contraseña del WiFi era incorrecta",
  "El portátil tenía un driver antiguo",
  "El DHCP se había quedado sin direcciones",
]
cause = "El punto de acceso estaba conectado al puerto del segmento de servidores, con una dirección que no le correspondía. Además, el equipo de la operadora tenía su propio WiFi encendido y competía con el de casa."
fix = "Recablear el AP a su puerto, comprobar en la tabla de VLANs del router que estaba en su segmento y apagar en el equipo de la operadora y en el AP el WiFi sobrante, el DHCP, UPnP y WPS."
lesson = "Comprobar en vivo, no en la documentación: la IP real del AP no era la del plan. Y apagar todo lo que un equipo no necesita: UPnP abre puertos sin pedir permiso y WPS se puede romper a fuerza bruta."

[text.es.incidents.laliga]
title = "Mis webs no cargan los sábados"
meta = "10-10-2026 · fuera de mi red"
symptom = "Un sábado por la tarde mis webs no cargaban desde fuera de casa. Con la VPN, sí. El servidor respondía perfectamente."
options = [
  "Cloudflare tenía una caída",
  "Se había caducado el certificado",
  "El router había cambiado de IP",
  "Las operadoras bloqueaban IPs de Cloudflare por el fútbol",
]
cause = "En día de partido, las operadoras españolas bloquean IPs de Cloudflare para cortar retransmisiones piratas. Mis webs comparten esas IPs. No era un fallo mío."
fix = "Comprobar el origen saltándose Cloudflare y mirar un servicio público que registra los bloqueos. Valoré quitar Cloudflare durante el partido o montar un proxy fuera; decidí no hacer nada: el bloqueo se levanta solo."
lesson = "Antes de tocar nada, separar «mi sistema falla» de «algo entre el visitante y yo falla». Verificar el origen directamente lo aclara en un minuto."

[[text.es.timeline]]
title = "Fuera el router de la operadora"
period = "Junio de 2026"
items = [
  "MikroTik RB5009 como router, con PPPoE propio; el equipo de la operadora, en puente.",
  "WireGuard migrado de un contenedor al propio router: la VPN ya no depende del servidor.",
  "Primera avería y primera lección: el NAT del HTTPS, acotado a la WAN.",
]

[[text.es.timeline]]
title = "Segmentos y matriz de acceso"
period = "Agosto de 2026"
items = [
  "Plan inicial de seis VLANs simplificado a tres segmentos que de verdad hacían falta.",
  "Matriz de qué puede iniciar conexiones hacia qué, confirmada en vivo contra el router.",
  "Excepciones explícitas: el DNS para todos y Plex para la tele.",
]

[[text.es.timeline]]
title = "Auditoría y endurecimiento"
period = "Septiembre de 2026"
items = [
  "Orden de las etapas de bloqueo revisado, TLS 1.2 en la gestión y criptografía fuerte en SSH.",
  "Aviso de seguridad de RouterOS de septiembre: actualización a la versión corregida de la misma rama.",
  "AP y equipo de fibra limpios: sin WiFi sobrante, DHCP, UPnP ni WPS.",
]

[[text.es.timeline]]
title = "Una DMZ para lo que da a internet"
period = "18-10-2026"
items = [
  "La puerta pública y el servidor de juegos, lo único que recibe conexiones de internet, pasan a su propio segmento.",
  "Desde ahí solo llegan al DNS, a la monitorización y, la puerta, a los servicios que publica. A la red de casa, nada.",
  "Cambiado en caliente, sin cortar, y después pasado al código.",
]

[[text.es.decisions]]
title = "Dónde vive la VPN"
choice = "En el router, no en el servidor"
why = "Si la VPN depende del servidor, cuando el servidor falla no puedo entrar a arreglarlo. En el router está disponible mientras haya internet."

[[text.es.decisions]]
title = "Cuántos segmentos"
choice = "Tres, no seis"
why = "El plan original tenía seis VLANs. Cada una es una matriz de reglas que mantener; tres cubren lo que importa: servidores aparte, la casa aparte y lo inalámbrico, lo más aislado."

[[text.es.decisions]]
title = "Qué se abre a internet"
choice = "Solo lo que tiene destino, y acotado a la WAN"
why = "Cada puerto abierto es superficie. La web entra por Traefik y Cloudflare; los paneles internos no se publican: se llega a ellos por la VPN."

[[text.es.decisions]]
title = "Lo que recibe conexiones de internet"
choice = "En su propio segmento"
why = "Si alguien consiguiera entrar por la puerta pública o por un servidor de juegos, lo siguiente sería moverse por la red. Aislados en una DMZ, solo ven lo que necesitan para funcionar."

[text.es.tech_notes]
mikrotik = "RouterOS 7: PPPoE, NAT, cortafuegos con listas por etapas, DHCP por segmento, scripts que reaccionan al cambio de IP y gestión restringida."
vlan = "Tres segmentos con una matriz de acceso explícita: servidores, cable de casa y WiFi con la tele, el más aislado."
wireguard = "La VPN para entrar desde fuera, en el propio router, con acceso equivalente al segmento de administración."
dns = "El DNS de casa es la excepción que todos los segmentos alcanzan; el DHCP de cada uno lo anuncia."
hardening = "Bloqueo por etapas contra fuerza bruta, gestión solo desde dentro o la VPN, TLS 1.2, criptografía fuerte en SSH y servicios sobrantes apagados."

[text.es.close]
lessons = [
  "Las reglas de red fallan lejos de donde están: una regla de NAT rompía HTTPS en el navegador.",
  "Probar las reglas de seguridad con el tráfico legítimo, no solo con el ataque.",
  "Comprobar el estado real del equipo antes de fiarse de la documentación.",
]
next = [
  "Probar el hairpin de la VPN desde la propia WiFi, que sigue sin funcionar.",
  "Llevar la configuración del router a código y revisarla con diff, como el resto de la infraestructura.",
]

