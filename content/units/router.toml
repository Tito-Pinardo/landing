[text.en.meta]
title = "Inside the router · Tito Pinardo Gutiérrez"
description = "My home MikroTik router from the inside: PPPoE, VLANs, a firewall with staged block lists, WireGuard, hairpin NAT and the real failures behind each rule."

[text.en.ui]
slot = "1U · ROUTER"
face_specs = "RB5009 · RouterOS 7 · 3 segments"
state = "In production"
map_silk = "NET"
map_title = "Inside the router"
map_intro = "Everything coming into or leaving home goes through here. Pick a flow to see which rule decides each step."
vm_title = "MikroTik RB5009 · and what hangs off it"
vm_specs = "RouterOS 7"
outside = "Outside home"
disclaimer = "Rebuilt from my network documentation: no addresses, ports, keys or device names."

[text.en.hero]
kicker = "1U unit · Home network"
title = "The MikroTik router"
tagline = "A MikroTik RB5009 replaces the ISP router: the fibre box is left as a plain bridge. It splits the house into segments, decides what can talk to what, opens the VPN to get in from outside and only lets in from the internet what has somewhere to go."
grade = "Audited on 06-09-2026"
facts = [
  { label = "Why", value = "The ISP router can't split networks, show what comes in or run my own VPN. With the MikroTik every rule is mine and documented." },
  { label = "How it's set up", value = "Fibre → ISP box in bridge mode → MikroTik with PPPoE. Three segments: servers, wired home and Wi-Fi with the TV. WireGuard on the router itself." },
  { label = "What it taught me", value = "Every firewall rule has a failure behind it: a fake certificate across the whole house, locking myself out, and a Wi-Fi that wouldn't connect." },
]

