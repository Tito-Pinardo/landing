text = "Decide qué puede hablar con qué. Entre segmentos, por defecto, no: solo las excepciones documentadas."

[text.es.pods.wg]
short = "WireGuard"
title = "VPN WireGuard"
text = "Vive en el propio router: la saqué de un contenedor para no depender del servidor para entrar a arreglar el servidor."

[text.es.pods.servers]
short = "Servidores"
title = "Segmento de servidores"
text = "El servidor y mi PC de administración. Pueden iniciar conexiones hacia el resto; el resto no puede iniciarlas hacia aquí."

[text.es.pods.wired]
short = "Cable casa"
title = "Segmento de cable"
text = "Los equipos de casa conectados por cable. No pueden entrar al segmento de servidores."

[text.es.pods.wifi]
short = "WiFi · TV"
title = "Segmento WiFi, TV y alarma"
text = "Móviles, la tele y la alarma. El más aislado: no ve ni servidores ni cable, salvo el DNS y Plex."

[text.es.pods.dhcp]
short = "DHCP"
title = "DHCP por segmento"
text = "Cada segmento recibe direcciones de su propio rango, y todos apuntan al DNS de casa."

[text.es.pods.ap]
short = "AP WiFi"
title = "Punto de acceso WiFi"
text = "El antiguo router de la operadora, reconvertido: solo emite WiFi en el segmento que le toca. Sin DHCP, UPnP ni WPS."

[text.es.pods.traefik]
short = "Traefik"
title = "Traefik"
text = "La única puerta de las webs públicas. Tiene su propia unidad en el rack."

[text.es.pods.dns]
short = "DNS"
title = "DNS de casa"
text = "Resuelve los nombres internos y bloquea publicidad. Es la excepción que todos los segmentos pueden alcanzar."

[text.es.pods.plex]
short = "Plex"
title = "Plex"
text = "La otra excepción: la tele, desde el WiFi, puede ver la biblioteca."

[text.es.pods.lists]
short = "Lista de bloqueo"
title = "Listas por etapas"
text = "Quien abre conexiones nuevas una y otra vez pasa a una primera lista, luego a una segunda y al final a la de bloqueo durante un día. Un intento suelto no castiga a nadie."

[text.es.pods.hairpin]
short = "Hairpin NAT"
title = "Hairpin NAT"
text = "Para que, desde dentro de casa, la IP pública lleve al servicio interno igual que desde fuera."

[text.es.pods.script]
short = "Script de IP"
title = "Script de IP dinámica"
text = "Cuando la operadora cambia la IP pública, un script del router actualiza solo las reglas que dependen de ella."

[text.es.pods.mgmt]
short = "Gestión"
title = "Gestión del router"
text = "La administración solo se acepta desde el segmento de servidores y la VPN, con TLS 1.2 y criptografía fuerte en SSH."

