[text.es.pods.pppoe]
short = "PPPoE"
title = "Conexión PPPoE"
text = "El router se autentica con la operadora y recibe la IP pública, que cambia de vez en cuando."

[text.es.pods.nat]
short = "NAT entrante"
title = "Redirecciones (NAT)"
text = "Solo se reenvía lo que tiene destino: la web va a Traefik y poco más. Cada regla está acotada a lo que entra por la WAN."

[text.es.pods.fw]
