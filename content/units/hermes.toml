[text.es.meta]
title = "Hermes por dentro · Tito Pinardo Gutiérrez"
description = "Cómo responde un asistente de IA local con una GPU de 8 GB: las fases de cada turno, lo que decide el código sin preguntar al modelo, las guardias de salida y un simulador de VRAM con las medidas reales."

[text.es.ui]
slot = "1U · HERMES"
face_specs = "qwen3:8b · 8 GB VRAM · 24 herramientas"
state = "En producción"
map_silk = "AI"
map_title = "Un turno de chat por dentro"
map_intro = "Cada pregunta pasa por varias fases antes de llegar a ti. Elige un recorrido para ver cuándo piensa el modelo, cuándo decide el código y qué se comprueba antes de enviar."
vm_title = "Contenedor del asistente · Proxmox"
vm_specs = "bot, conectores, vigilantes e índices"
outside = "Fuera del servidor"
disclaimer = "Reconstrucción a partir de mi documentación de Obsidian. Sin direcciones, nombres de máquinas ni datos personales: las respuestas de ejemplo son inventadas."

[text.es.hero]
kicker = "Unidad 1U · Proyecto personal en producción"
title = "Hermes · asistente de IA local"
tagline = "Un asistente en el chat que conoce el estado de mis servidores, mi agenda y mi documentación. El modelo corre en una GPU de 8 GB de mi PC: nada sale de mi red. Como el modelo es pequeño, la precisión no se le pide al modelo: se construye alrededor de él."
grade = "117/120 en la batería, 23/23 en preguntas reales"
facts = [
  { label = "La regla", value = "Lo que se puede calcular, se calcula; al modelo solo se le pregunta lo que hace falta entender. Cada regla que se dejó en sus manos (fechas, días de la semana, sumas) acabó fallando, y dejó de fallar al pasarla a código." },
  { label = "Dónde corre", value = "El bot, los conectores y los índices viven en un contenedor del servidor, encendidos siempre. El modelo de lenguaje, la voz y los embeddings, en la GPU de mi PC: si está apagado, las preguntas esperan en una cola." },
  { label = "Lo que no puede hacer", value = "Por decisión mía, no enciende ni apaga servidores, no escribe notas, no envía correo y no ve documentos oficiales. Hay un caso de prueba que lo comprueba en cada medición." },
]

