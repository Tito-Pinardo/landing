[text.es.pods.ollama]
short = "qwen3:8b"
title = "Modelo de lenguaje (Ollama)"
text = "Un modelo de 8.000 millones de parámetros cuantizado a 4 bits: unos 5 GB. Se carga solo cuando se le pregunta y se descarga a los 5 minutos, para dejar la GPU libre para el resto del PC."

[text.es.pods.voice]
short = "Voz"
title = "Voz (Whisper + síntesis)"
text = "Whisper convierte los audios en texto y un sintetizador local responde con voz. También en la GPU del PC."

[text.es.pods.gpu]
short = "GPU 8 GB"
title = "La GPU de 8 GB"
text = "El límite de todo el diseño. Si el modelo no cabe entero, una parte corre en la CPU y la velocidad cae de 73 a 17 tokens por segundo. El simulador de abajo lo enseña con las medidas reales."

[text.es.pods.tito]
short = "Mi móvil"
title = "Yo, desde Element"
text = "Pregunto por texto o por audio desde el chat, esté donde esté."

[text.es.pods.mail]
short = "Correo"
title = "Correo (solo lectura)"
text = "Se indexa al instante en cuanto llega (IMAP IDLE), con el texto de los PDF adjuntos. Solo la bandeja principal: ni promociones ni redes sociales."

[text.es.pods.calendar]
short = "Calendario"
title = "Calendario"
text = "Lo único donde Hermes escribe: crea eventos desde correos de reserva y deja un 🗑️ para deshacerlo con una reacción."

[text.es.pods.matrix]
short = "Matrix"
title = "Matrix (sala del asistente)"
text = "Mi servidor de mensajería. Hermes tiene su propio usuario y verifica su dispositivo solo: nada de avisos de «fuente no verificada»."

[text.es.pods.bot]
short = "Hermes"
title = "Hermes (el bot)"
text = "El programa en Python que orquesta el turno: recibe el mensaje, prepara el contexto, llama al modelo, ejecuta herramientas y revisa la respuesta antes de enviarla."

[text.es.pods.queue]
short = "Cola"
title = "Cola persistente"
text = "Si el PC con la GPU está apagado, la pregunta no se pierde: se guarda en disco y se responde sola en cuanto vuelve."

[text.es.pods.format]
short = "Formato"
title = "Maquetado"
text = "Convierte el Markdown en HTML para Element y deja una versión en texto plano para las notificaciones. Todo lo que viene de fuera (asuntos, títulos) se escapa: es dato, no marcado."

[text.es.pods.prompt]
short = "1 · Contexto"
title = "Fase 1 · Contexto que pone el código"
text = "Instrucciones, la fecha de hoy con una tabla de los próximos 7 días y el historial resumido a pregunta y respuesta. El modelo no sabe qué día es: si no se le dice, razona con la fecha de su entrenamiento."

[text.es.pods.hints]
short = "2 · Pistas"
title = "Fase 2 · Pistas según la pregunta"
text = "Si la pregunta encaja con un patrón («qué pasó con…», «por dónde se entra…»), se añade una frase solo a ese turno. Nunca al prompt global: cuanto más texto general, peor elige un modelo de 8B."

[text.es.pods.think]
short = "3 · think on/off"
title = "Fase 3 · Razonar solo donde aporta"
text = "Pensar multiplica por seis el tiempo. Se enciende para elegir herramienta y calcular argumentos, y cuando un resultado viene vacío o con un aviso; se apaga para redactar con los datos delante."

[text.es.pods.guards]
short = "4 · Guardias"
title = "Fase 4 · Guardias de salida"
text = "Antes de enviar, el código compara la respuesta con las fuentes del turno: una IP o un importe que no aparece en ninguna se devuelve al modelo para corregir. Si insiste, se envía con un aviso."

[text.es.pods.tools]
short = "24 herramientas"
title = "Herramientas"
text = "Estado del servidor, agenda, correo y tres memorias. El código valida los argumentos antes de ejecutar («7» pasa a 7) y, si el modelo nombra una herramienta sin llamarla, le pide una vez que la llame."

[text.es.pods.status]
short = "Estado en vivo"
title = "Estado del servidor"
text = "Instantáneas de la monitorización y la seguridad, inventario de contenedores, ZFS y discos. Cada dato va con su antigüedad: si tiene más de 30 minutos, el modelo lo sabe."

[text.es.pods.watchers]
short = "7 vigilantes"
title = "Los siete vigilantes"
text = "Copias, certificados, almacenamiento, actualizaciones, uso anómalo, accesos fallidos y red. Cada uno con nombre de la mitología griega y su propia sala: solo hablan cuando encuentran algo raro."

[text.es.pods.relay]
short = "Relevo"
title = "Relevo del código"
text = "Cuando una pregunta en realidad son dos («¿cuánto costó la entrada de lo que tengo el jueves?»), el modelo fallaba 3 de 3. Ahora el código da el segundo paso: mira la agenda, coge el título y lo busca en el correo."

[text.es.pods.embed]
short = "Embeddings"
title = "Embeddings"
text = "Convierten cada texto en un vector de números para poder buscar por significado y no solo por palabras."

[text.es.pods.qdrant]
short = "Qdrant"
title = "Qdrant (base vectorial)"
text = "Guarda los vectores de las notas, los correos, los documentos que le paso y las conversaciones. El código busca en las tres memorias a la vez para que el modelo no tenga que adivinar cuál."

[text.es.pods.notes]
short = "Notas"
title = "Mi documentación"
text = "Procedimientos, incidentes y postmortems del homelab. Hermes los lee, pero nunca escribe en ellos."

[text.es.pods.recall]
short = "Conversaciones"
title = "Memoria de conversaciones"
text = "Cada conversación, también los audios transcritos, se indexa: «¿qué hice la semana pasada con…?» tiene respuesta."

[text.es.flows.turn]
title = "Una pregunta, fase a fase"
steps = [
  "Pregunto desde el móvil: «¿Hay alguna alerta en el servidor?»",
  "El mensaje llega a mi servidor de Matrix, en la sala del asistente.",
  "Hermes lo recoge. Lo primero no es llamar al modelo: es preparar lo que el modelo necesita saber.",
  "Fase 1: el código pone la fecha de hoy, una tabla con los próximos 7 días y el historial resumido. Sin esto, el modelo cree que estamos en el año de su entrenamiento.",
  "Fase 2: la pregunta no encaja con ningún patrón especial, así que no se añade ninguna pista. Menos texto, mejor elige.",
  "Fase 3: todavía no se ha ejecutado ninguna herramienta, así que el modelo PIENSA: tiene que elegir cuál y con qué argumentos.",
  "El modelo, en la GPU de mi PC, decide llamar a la herramienta de salud del servidor.",
  "El código valida los argumentos contra el esquema y ejecuta la herramienta. El modelo nunca toca nada directamente.",
  "Llegan las alertas activas, con la antigüedad de cada dato pegada al resultado.",
  "Fase 3 otra vez: el resultado trae datos y no hay avisos, así que ahora el modelo NO piensa. Solo tiene que redactar.",
  "Redacta la respuesta en 0,7 s en vez de 4,7 s, con la misma calidad.",
  "Fase 4: las guardias comparan la respuesta con las fuentes. Ninguna IP ni importe inventados: adelante.",
  "El Markdown se convierte en HTML para Element, con una copia en texto plano para la notificación.",
  "Se envía a la sala y se indexa en la memoria de conversaciones.",
  "Me llega la respuesta, con los datos y su antigüedad.",
]

[text.es.flows.empty]
title = "Una búsqueda que vuelve vacía"
steps = [
