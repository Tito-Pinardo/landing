options = [
  "El reloj del contenedor estaba desincronizado",
  "La zona horaria del calendario era otra",
  "El modelo no sabe qué día es: razonaba con la fecha de su entrenamiento",
  "Qdrant devolvía eventos antiguos",
]
cause = "Un modelo de lenguaje no tiene reloj. Sin una fecha en el contexto, razona con la de sus datos de entrenamiento, y calcular el día de la semana tampoco se le da bien."
fix = "El código pone en cada turno la fecha y hora reales y una tabla con los próximos 7 días ya calculados. El día de la semana de cada evento también lo calcula el código."
lesson = "Las fechas no se le piden al modelo: se le dan hechas."

[text.es.incidents.history]
title = "Después de una herramienta, ninguna más"
meta = "Septiembre de 2026 · conversación"
symptom = "Tras una pregunta que usaba una herramienta, las preguntas siguientes de la misma conversación no usaban ninguna, ni pidiéndoselo por su nombre. Reforzar las instrucciones dio 0 de 4."
options = [
  "Se acababa el contexto de 8.192 tokens",
  "El historial arrastraba el JSON completo de las herramientas anteriores",
  "El modelo se quedaba sin VRAM",
  "La herramienta se desactivaba tras un error",
]
cause = "El historial guardaba los resultados intermedios de las herramientas, con JSON de muchos campos. Al modelo de 8B esos bloques le cambiaban el comportamiento en los turnos siguientes."
fix = "El historial de turnos pasados se resume a solo pregunta y respuesta final, sin los pasos intermedios. Verificado: 3 de 3 en la conversación real que había fallado."
lesson = "Cuando más instrucciones no arreglan algo, la causa suele ser estructural: hay que cambiar lo que recibe el modelo, no lo que se le pide."

[text.es.incidents.slow]
title = "141 segundos para una pregunta"
meta = "22-09-2026 · rendimiento"
symptom = "Por la tarde una pregunta sencilla tardó 141 s y un caso de la batería que por la mañana pasaba 5 de 5 fallaba 8 de 8, con el mismo código."
options = [
  "El prompt había crecido demasiado",
  "Ollama tenía una versión con un fallo",
  "La base vectorial estaba reindexando",
  "Parte del modelo corría en la CPU porque el escritorio ocupaba la VRAM",
]
cause = "Con un juego y el navegador abiertos, solo cabía en la GPU el 66 % del modelo; el resto corría en la CPU a 10 tokens por segundo. Además, al repartirse, los cálculos cambian un poco y los casos que están al límite se vuelcan."
fix = "Caché KV cuantizada a q8_0, flash attention, una sola petición y un solo modelo cargado a la vez. Con el navegador cerrado, el modelo entra al 100 %: de 17,5 a 73 tokens por segundo, y la batería subió de 106 a 114 de 120."
lesson = "Antes de culpar al modelo, mira dónde corre. Ahora cada medición anota la versión de Ollama y qué porcentaje del modelo estaba en la GPU."

[text.es.incidents.ip]
title = "Una IP pública inventada"
meta = "23-09-2026 · guardias"
symptom = "Le pregunté por la IP pública de casa y respondió con una dirección con formato perfecto… que no era la mía. La correcta estaba en el resultado de la herramienta que acababa de usar."
options = [
  "El modelo la inventó aunque tenía la buena delante",
  "La herramienta devolvía una IP antigua",
  "Cloudflare enmascaraba la dirección",
  "El router había cambiado de IP en ese momento",
]
cause = "Los modelos pequeños a veces completan con algo que «suena bien». Una IP con buen formato es justo eso: no hay manera de distinguirla a ojo."
fix = "Una guardia de salida busca cada IP y cada importe de la respuesta en las fuentes del turno. Si no aparece (o no es una suma de importes que sí aparecen), se pide corregir; si insiste, se envía con un aviso. Cuesta 0,09 ms."
lesson = "Las guardias no deben saltar con datos buenos: un aviso que salta de más enseña a ignorarlo. Por eso las sumas legítimas se aceptan, sin límite de conceptos."

[text.es.incidents.silent]
title = "Un día sin planes que no lo era"
meta = "25-09-2026 · resumen diario"
symptom = "El resumen de la mañana dijo que no tenía nada en la agenda. Sí tenía cosas."
options = [
  "El modelo resumió mal la lista de eventos",
  "Los eventos estaban en otro calendario",
  "El acceso al calendario había caducado y el error parecía una lista vacía",
  "El resumen se generó antes de medianoche",
]
cause = "La autorización con el calendario se revocó por la noche. La consulta fallaba, y el resumen trataba el fallo como «no hay eventos»."
fix = "Reautorizado, y ahora un fallo de una fuente se dice como fallo: «no he podido leer el calendario». Si el modelo redacta «no he encontrado nada» tras un error, el código añade el aviso."
lesson = "«No hay nada» y «no he podido comprobarlo» no son lo mismo: el primero dice que el dato no existe y el segundo que el sistema está roto."

[[text.es.timeline]]
title = "Fase 0 · Medir mejor"
period = "22-09-2026"
items = [
  "Una línea de log por llamada al modelo: tokens de entrada y salida, tiempo de carga, velocidad y qué porcentaje del modelo estaba en la GPU.",
  "Detector de «narración»: cuando el modelo dice «usa la herramienta X» en vez de llamarla.",
  "La primera medida real destapó el problema: 141 s en una pregunta, 954 tokens de razonamiento solo para redactar.",
]

[[text.es.timeline]]
title = "Fase 1 · Que el modelo quepa en 8 GB"
period = "22-09-2026"
items = [
  "Flash attention y caché KV en q8_0: el contexto ocupa la mitad.",
  "Una sola petición y un solo modelo cargado a la vez: cada petición paralela añade su propia caché.",
  "Descubrir que el cuello no era el modelo sino el escritorio: el navegador se llevaba 805 MiB de VRAM.",
  "Resultado: 4,2× más rápido y 8 fallos menos en la batería.",
]

[[text.es.timeline]]
title = "Fase 2 · Menos texto por turno (descartada)"
period = "22-09-2026"
items = [
  "Juntar herramientas para enviar menos texto: de 24 a 16.",
  "El prompt bajó, pero la batería también: de 118 a 112 de 120.",
  "Lección: para un modelo de 8B, el nombre de una herramienta pesa más que su descripción, y esconder capacidades detrás de un parámetro las hace invisibles.",
]

[[text.es.timeline]]
title = "Fase 3 · Robustez por código"
period = "22 y 23-09-2026"
items = [
  "Validación de argumentos contra el esquema y errores legibles que el modelo puede corregir.",
  "Razonamiento adaptativo: pensar para elegir, no para redactar (de 4,7 a 0,7 s).",
  "Guardias de salida para IPs e importes, relevo del código en preguntas de dos pasos y avisos cuando una fuente se cae.",
]

[[text.es.timeline]]
title = "Fase 4 y 5 · Modelo y dónde se procesa"
period = "Pendiente"
items = [
  "Probar la misma familia con más bits (Q5_K_M) solo si cabe con el mismo contexto.",
  "Mover el modelo al servidor cuando tenga una GPU propia: 1U de alto y 70 W por el slot. La candidata es una tarjeta pasiva de 16 GB.",
]

[[text.es.decisions]]
title = "Dónde corre el modelo"
choice = "En local, en mi GPU"
why = "Nada sale de mi red: el asistente lee mi correo y mi agenda. Probé un modelo de 14B y no cabía en 8 GB: el mismo fallo y de 4 a 8 veces más lento. La CPU del servidor no tiene AVX2: serían minutos por respuesta."

[[text.es.decisions]]
title = "Cómo se consigue precisión con un modelo pequeño"
choice = "Mover reglas del prompt al código"
why = "Añadir texto al prompt empeoró la batería (96 frente a 105 de 111) y los ejemplos hacían que imitara la forma de la frase, no su sentido. Lo que funcionó fue que el código calcule fechas, días, vencimientos, sumas y tipos, y que el modelo solo entienda y redacte."

[[text.es.decisions]]
title = "Cómo se decide un cambio"
choice = "Medirlo con 3 semillas, caso por caso"
why = "Cada cambio se mide por separado y solo se despliega si no hay regresiones. Además de la batería, hay pruebas contra producción y preguntas reales, porque la batería usa datos sintéticos y no ve una herramienta caída."

[[text.es.decisions]]
title = "Qué puede tocar el modelo"
choice = "Leer casi todo, escribir casi nada"
why = "El modelo interpreta y el código decide si se escribe algo. Por eso una orden escrita dentro de un correo no puede crear ni borrar nada, y los reintentos automáticos nunca se aplican a herramientas de escritura."

[text.es.tech_notes]
python = "El bot entero: el bucle del turno, la validación de argumentos, las guardias, el relevo de las preguntas de dos pasos, los vigilantes y unas 110 pruebas sin modelo ni red."
llm = "Ollama con qwen3:8b para el chat, un modelo de embeddings para buscar por significado, Qdrant como base vectorial y Whisper para la voz. Todo local, ajustado para caber en 8 GB de VRAM."
linux = "Servicios systemd con permisos mínimos (rutas de solo lectura, sin privilegios), en un contenedor dedicado; la GPU en un PC con Linux."
ansible = "El rol que despliega el bot, sus servicios y su configuración; los secretos van cifrados con Ansible Vault."

[text.es.close]
lessons = [
  "Con un modelo pequeño, la precisión no sale del modelo: sale de lo que el código hace a su alrededor.",
  "Cuanto más texto general recibe un modelo de 8B, peor elige. Aislar una tarea la arregla.",
  "La memoria de la GPU es parte del diseño: un navegador abierto cambiaba la velocidad por cuatro y el resultado de la batería.",
  "Medir con varias semillas y con preguntas reales: la mitad de los fallos importantes no salían en la batería.",
]
next = [
  "Una GPU propia para el servidor, para que Hermes no dependa de que mi PC esté encendido.",
  "Revisar los criterios de la batería: algunos casos medían la redacción y no el fondo.",
  "Resolver las preguntas sobre incidentes pasados, que aún van a veces a las herramientas de estado actual.",
]

# ===========================================================================
# English
# ===========================================================================

[text.en.meta]
title = "Inside Hermes · Tito Pinardo Gutiérrez"
description = "How a local AI assistant answers on an 8 GB GPU: the phases of every turn, what the code decides without asking the model, the output guards and a VRAM simulator built from real measurements."

[text.en.ui]
slot = "1U · HERMES"
face_specs = "qwen3:8b · 8 GB VRAM · 24 tools"
state = "In production"
map_silk = "AI"
map_title = "A chat turn from the inside"
map_intro = "Every question goes through several phases before it reaches you. Pick a flow to see when the model thinks, when the code decides and what gets checked before sending."
vm_title = "Assistant container · Proxmox"
vm_specs = "bot, connectors, watchers and indexes"
outside = "Outside the server"
disclaimer = "Rebuilt from my Obsidian documentation. No addresses, machine names or personal data: the example answers are made up."

[text.en.hero]
kicker = "1U unit · Personal project in production"
title = "Hermes · local AI assistant"
tagline = "A chat assistant that knows the state of my servers, my calendar and my documentation. The model runs on an 8 GB GPU in my PC: nothing leaves my network. Because the model is small, accuracy isn't asked of the model: it is built around it."
grade = "117/120 on the test suite, 23/23 on real questions"
facts = [
  { label = "The rule", value = "Whatever can be computed, is computed; the model is only asked what needs understanding. Every rule left in its hands (dates, weekdays, sums) failed sooner or later, and stopped failing once moved into code." },
  { label = "Where it runs", value = "The bot, the connectors and the indexes live in an always-on container on the server. The language model, voice and embeddings run on my PC's GPU: if it's off, questions wait in a queue." },
  { label = "What it can't do", value = "By my choice, it doesn't start or stop servers, write notes, send email or see official documents. A test case checks it on every run." },
]

[[text.en.stats]]
value = "4.2×"
label = "faster with the whole model on the GPU"

[[text.en.stats]]
value = "17.5 → 73"
label = "tokens per second, freeing desktop VRAM"

[[text.en.stats]]
value = "4.7 → 0.7 s"
label = "writing without reasoning once the data is there"

[[text.en.stats]]
value = "24"
label = "tools: status, calendar, email and memory"

[[text.en.stats]]
value = "0.09 ms"
label = "what the output guards cost"

[[text.en.stats]]
value = "~110"
label = "tests without the model, plus 48 cases × 3 seeds"

[text.en.groups]
pc = "My PC · 8 GB GPU"
entry = "In and out"
turn = "The turn, phase by phase"
tools = "Tools · done by code"
memory = "Memory · search by meaning"

[text.en.pods.ollama]
short = "qwen3:8b"
title = "Language model (Ollama)"
text = "An 8-billion-parameter model quantised to 4 bits: about 5 GB. It only loads when asked and unloads after 5 minutes, leaving the GPU free for the rest of the PC."

[text.en.pods.voice]
short = "Voice"
title = "Voice (Whisper + speech)"
text = "Whisper turns voice notes into text and a local speech synthesiser answers out loud. Also on the PC's GPU."

[text.en.pods.gpu]
short = "8 GB GPU"
title = "The 8 GB GPU"
text = "The limit behind the whole design. If the model doesn't fit, part of it runs on the CPU and speed drops from 73 to 17 tokens per second. The simulator below shows it with real measurements."

[text.en.pods.tito]
short = "My phone"
title = "Me, on Element"
text = "I ask by text or voice note from the chat, wherever I am."

[text.en.pods.mail]
short = "Email"
title = "Email (read-only)"
text = "Indexed the moment it arrives (IMAP IDLE), including the text of attached PDFs. Primary inbox only: no promotions or social."

[text.en.pods.calendar]
short = "Calendar"
title = "Calendar"
text = "The only thing Hermes writes to: it creates events from booking emails and leaves a 🗑️ to undo them with a reaction."

[text.en.pods.matrix]
short = "Matrix"
title = "Matrix (assistant room)"
text = "My own messaging server. Hermes has its own user and verifies its device on its own: no «unverified source» warnings."

[text.en.pods.bot]
short = "Hermes"
title = "Hermes (the bot)"
text = "The Python program that runs the turn: it gets the message, prepares the context, calls the model, runs tools and checks the answer before sending it."

[text.en.pods.queue]
short = "Queue"
title = "Persistent queue"
text = "If the GPU PC is off, the question isn't lost: it is saved to disk and answered on its own as soon as the PC is back."

[text.en.pods.format]
short = "Formatting"
title = "Formatting"
text = "Turns Markdown into HTML for Element and keeps a plain-text version for notifications. Anything from outside (subjects, titles) is escaped: it's data, not markup."

[text.en.pods.prompt]
short = "1 · Context"
title = "Phase 1 · Context set by code"
text = "Instructions, today's date with a table of the next 7 days, and history trimmed to question and answer. The model doesn't know what day it is: unless told, it reasons with its training date."

[text.en.pods.hints]
short = "2 · Hints"
title = "Phase 2 · Hints from the question"
text = "If the question matches a pattern («what happened with…», «how do I get into…»), one sentence is added to that turn only. Never to the global prompt: the more general text, the worse an 8B model chooses."

[text.en.pods.think]
short = "3 · think on/off"
title = "Phase 3 · Reason only where it helps"
text = "Thinking makes a call six times slower. It's on to pick a tool and work out arguments, and when a result comes back empty or with a warning; it's off to write with the data in front of it."

[text.en.pods.guards]
short = "4 · Guards"
title = "Phase 4 · Output guards"
text = "Before sending, the code compares the answer with the turn's sources: an IP or an amount that appears in none of them goes back to the model to fix. If it insists, it's sent with a warning."

[text.en.pods.tools]
short = "24 tools"
title = "Tools"
text = "Server status, calendar, email and three memories. The code validates arguments before running («7» becomes 7) and, if the model names a tool without calling it, asks once that it call it."

[text.en.pods.status]
short = "Live status"
title = "Server status"
text = "Monitoring and security snapshots, container inventory, ZFS and disks. Every value carries its age: if it's over 30 minutes old, the model knows."

[text.en.pods.watchers]
short = "7 watchers"
title = "The seven watchers"
text = "Backups, certificates, storage, updates, unusual usage, failed logins and network. Each named after Greek mythology, each with its own room: they only speak when they find something odd."

[text.en.pods.relay]
short = "Code relay"
title = "Code relay"
text = "When a question is really two («how much was the ticket for what I have on Thursday?»), the model failed 3 out of 3. Now the code takes the second step: it checks the calendar, takes the title and searches the email for it."

[text.en.pods.embed]
short = "Embeddings"
title = "Embeddings"
text = "Turn each text into a vector of numbers so search works by meaning, not just by words."

[text.en.pods.qdrant]
short = "Qdrant"
title = "Qdrant (vector database)"
text = "Stores the vectors of my notes, emails, the documents I send it and our conversations. The code searches all three memories at once so the model doesn't have to guess which."

[text.en.pods.notes]
short = "Notes"
title = "My documentation"
text = "Homelab procedures, incidents and postmortems. Hermes reads them but never writes to them."

[text.en.pods.recall]
short = "Conversations"
title = "Conversation memory"
text = "Every conversation, including transcribed voice notes, is indexed: «what did I do last week with…?» has an answer."

[text.en.flows.turn]
title = "One question, phase by phase"
steps = [
  "I ask from my phone: «Are there any alerts on the server?»",
  "The message reaches my Matrix server, in the assistant's room.",
  "Hermes picks it up. The first thing isn't calling the model: it's preparing what the model needs to know.",
  "Phase 1: the code adds today's date, a table of the next 7 days and the trimmed history. Without it, the model thinks it's the year it was trained.",
  "Phase 2: the question doesn't match any special pattern, so no hint is added. Less text, better choices.",
  "Phase 3: no tool has run yet, so the model THINKS: it has to choose one and its arguments.",
  "The model, on my PC's GPU, decides to call the server health tool.",
  "The code checks the arguments against the schema and runs the tool. The model never touches anything directly.",
  "The active alerts come back, each value tagged with its age.",
  "Phase 3 again: the result has data and no warnings, so now the model does NOT think. It only has to write.",
  "It writes the answer in 0.7 s instead of 4.7 s, with the same quality.",
  "Phase 4: the guards compare the answer with the sources. No made-up IPs or amounts: go ahead.",
  "Markdown becomes HTML for Element, with a plain-text copy for the notification.",
  "It's sent to the room and indexed in conversation memory.",
  "I get the answer, with the data and how old it is.",
]

[text.en.flows.empty]
title = "A search that comes back empty"
steps = [
  "A two-step question: «How much was the ticket for what I have this week?»",
  "A tool has to be chosen: the model thinks.",
  "It chooses to search the memories for «ticket».",
  "The code runs the search.",
  "Qdrant finds nothing useful with those words.",
  "Empty result: reasoning switches back ON. Without this, the model gave up with «I found nothing» while the answer was one call away.",
  "Even thinking, an 8B model failed this case 3 times out of 3.",
  "So the code takes over: it knows «what I have this week» is an event.",
  "It checks the calendar, filtered with the question itself, and takes the event's exact title.",
  "It searches the email for that title and finds the confirmation with the amount.",
  "The model gets the data already gathered and just has to read it.",
  "The guards check the amount in the answer appears in the email (or is a sum of amounts that do).",
  "Right answer. Filtering the calendar with the question cut the time from 60-120 s to 31-41 s.",
]

[text.en.flows.offline]
title = "The PC is off"
steps = [
  "I ask something at three in the morning.",
  "Matrix gets it fine: the server is always on.",
  "Hermes checks whether the model is available. It isn't: my PC is off.",
  "The question goes into a persistent queue on disk. It isn't lost or answered badly.",
  "In the morning I turn the PC on and the GPU is back.",
  "Hermes sees the model responding and drains the queue in order.",
  "Each question runs the full turn, with the current date, not the one when it was asked.",
  "The answer reaches the room, marked as a queued reply.",
  "I get everything I asked during the night.",
]

[text.en.flows.voice]
title = "A voice note"
steps = [
  "I send a voice note from my phone.",
  "It reaches Matrix as an audio file.",
  "Hermes sees it's audio and sends it to be transcribed.",
  "Whisper turns it into text on the PC's GPU.",
  "With the text, the turn continues as if I'd typed it.",
  "The model answers with its usual phases.",
  "Hermes prepares the answer as text.",
  "The local speech synthesiser turns it into audio.",
  "It's sent to the room as a voice message, with the text alongside.",
  "I listen on my phone. The transcript also goes into conversation memory.",
]

[text.en.flows.recall]
title = "Searching the three memories"
steps = [
  "A search tool gets «what happened to the disk after the power cut?».",
  "The question becomes a vector.",
  "Qdrant searches by meaning, not exact words.",
  "In the documentation, the blackout postmortem shows up.",
  "In the conversations, the night we talked about it shows up.",
  "The code merges the results from the three memories and labels where each comes from. The model used to mix up the three searches and once said it had no semantic database.",
  "The model gets the fragments with their source and summarises them.",
  "The answer comes with a link to the note.",
]

[text.en.flows.booking]
title = "An email with a booking"
steps = [
  "A booking confirmation email arrives.",
  "It's indexed straight away, including the text of the attached PDF.",
  "It stays in the vector database for good.",
  "The email watcher hands it to Hermes without anyone asking.",
  "The model answers two closed questions, with no tools: is it important? is it a booking with a date and time? It interprets the text, but decides nothing.",
  "The code decides: it checks whether it overlaps with something that already exists. That check stopped 4 real duplicates.",
  "No overlap: the event is created with the place in its own field and a tidy description. An instruction written inside an email can't create or delete anything.",
  "A notice in the events room, with a 🗑️ to undo it.",
  "I find out without opening the email.",
]

[text.en.flows.watch]
title = "A watcher finds something"
steps = [
  "One of the seven watchers checks its topic; certificates, say.",
  "It checks the real state: expiry dates of certificates and domains.",
  "It finds one expiring soon. The dates are worked out by code: the model once mixed up a certificate with a domain registration.",
  "It prepares a structured notice: what's happening, when and what to do.",
  "It posts it in its own room. If everything is fine, it says nothing.",
  "I only hear about it when there's something to look at.",
]

