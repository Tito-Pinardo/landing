[text.en.incidents.date]
title = "«The year 2026 is inconsistent»"
meta = "September 2026 · calendar"
symptom = "Asked to create an event «next Thursday», Hermes said the date made no sense and that 2026 was «inconsistent». Another day it said «Tuesday the 28th» when the 28th was a Monday."
options = [
  "The container clock was out of sync",
  "The calendar's time zone was different",
  "The model doesn't know what day it is: it reasoned with its training date",
  "Qdrant was returning old events",
]
cause = "A language model has no clock. Without a date in its context it reasons with the date of its training data, and working out weekdays isn't its strength either."
fix = "On every turn the code adds the real date and time and a table of the next 7 days, already worked out. The weekday of each event is computed by code too."
lesson = "Dates aren't asked of the model: they're handed to it ready-made."

[text.en.incidents.history]
title = "After one tool, no more"
meta = "September 2026 · conversation"
symptom = "After a question that used a tool, the following questions in the same conversation used none, even when asked by name. Strengthening the instructions scored 0 out of 4."
options = [
  "The 8,192-token context ran out",
  "The history carried the full JSON of earlier tool calls",
  "The model ran out of VRAM",
  "The tool got disabled after an error",
]
cause = "The history kept the intermediate tool results, JSON with many fields. For the 8B model those blocks changed its behaviour in later turns."
fix = "The history of past turns is trimmed to just the question and final answer, without the intermediate steps. Checked: 3 out of 3 on the real conversation that had failed."
lesson = "When more instructions don't fix something, the cause is usually structural: change what the model receives, not what you ask of it."

[text.en.incidents.slow]
title = "141 seconds for one question"
meta = "22-09-2026 · performance"
symptom = "In the afternoon a simple question took 141 s, and a test case that passed 5 out of 5 in the morning failed 8 out of 8 with the same code."
options = [
  "The prompt had grown too big",
  "Ollama had a buggy version",
  "The vector database was reindexing",
  "Part of the model ran on the CPU because the desktop was using the VRAM",
]
cause = "With a game and the browser open, only 66 % of the model fitted on the GPU; the rest ran on the CPU at 10 tokens per second. On top of that, splitting changes the maths slightly and borderline cases flip."
fix = "KV cache quantised to q8_0, flash attention, one request and one loaded model at a time. With the browser closed the model fits at 100 %: from 17.5 to 73 tokens per second, and the suite went from 106 to 114 out of 120."
lesson = "Before blaming the model, check where it runs. Every run now records the Ollama version and how much of the model was on the GPU."

[text.en.incidents.ip]
title = "A made-up public IP"
meta = "23-09-2026 · guards"
symptom = "I asked for my home public IP and it answered with a perfectly formatted address… that wasn't mine. The right one was in the result of the tool it had just used."
options = [
  "The model made it up even with the right one in front of it",
  "The tool returned an old IP",
  "Cloudflare masked the address",
  "The router changed IP at that moment",
]
cause = "Small models sometimes fill in with something that «sounds right». A well-formatted IP is exactly that: there's no way to spot it by eye."
fix = "An output guard looks for every IP and amount in the answer in the turn's sources. If it isn't there (or isn't a sum of amounts that are), it asks for a fix; if the model insists, it's sent with a warning. It costs 0.09 ms."
lesson = "Guards must not fire on good data: a warning that fires too often teaches you to ignore it. That's why legitimate sums are accepted, with no limit on items."

[text.en.incidents.silent]
title = "An empty day that wasn't"
meta = "25-09-2026 · daily digest"
symptom = "The morning digest said I had nothing on. I did."
options = [
  "The model summarised the event list badly",
  "The events were in another calendar",
  "Calendar access had expired and the error looked like an empty list",
  "The digest was generated before midnight",
]
cause = "The calendar authorisation was revoked overnight. The query failed, and the digest treated the failure as «no events»."
fix = "Re-authorised, and a failing source is now reported as a failure: «I couldn't read the calendar». If the model writes «I found nothing» after an error, the code adds the warning."
lesson = "«There's nothing» and «I couldn't check» aren't the same: the first says the data doesn't exist, the second says the system is broken."

[[text.en.timeline]]
title = "Phase 0 · Measure better"
period = "22-09-2026"
items = [
  "One log line per model call: input and output tokens, load time, speed and how much of the model was on the GPU.",
  "A «narration» detector: when the model says «use tool X» instead of calling it.",
  "The first real measurement exposed the problem: 141 s for one question, 954 reasoning tokens just to write.",
]

[[text.en.timeline]]
title = "Phase 1 · Make the model fit in 8 GB"
period = "22-09-2026"
items = [
  "Flash attention and a q8_0 KV cache: the context takes half the space.",
  "One request and one loaded model at a time: each parallel request adds its own cache.",
  "Finding the bottleneck wasn't the model but the desktop: the browser was taking 805 MiB of VRAM.",
  "Result: 4.2× faster and 8 fewer failures on the suite.",
]

[[text.en.timeline]]
title = "Phase 2 · Less text per turn (dropped)"
period = "22-09-2026"
items = [
  "Merging tools to send less text: from 24 to 16.",
  "The prompt shrank, but so did the score: from 118 to 112 out of 120.",
  "Lesson: for an 8B model a tool's name weighs more than its description, and hiding capabilities behind a parameter makes them invisible.",
]

[[text.en.timeline]]
title = "Phase 3 · Robustness through code"
period = "22-23-09-2026"
items = [
  "Argument validation against the schema and readable errors the model can fix.",
  "Adaptive reasoning: think to choose, not to write (from 4.7 to 0.7 s).",
  "Output guards for IPs and amounts, a code relay for two-step questions and warnings when a source is down.",
]

[[text.en.timeline]]
title = "Phases 4 and 5 · Model and where it runs"
period = "Pending"
items = [
  "Try the same family with more bits (Q5_K_M) only if it fits with the same context.",
  "Move the model to the server once it has its own GPU: 1U high and 70 W from the slot. The candidate is a passive 16 GB card.",
]

[[text.en.decisions]]
title = "Where the model runs"
choice = "Locally, on my GPU"
why = "Nothing leaves my network: the assistant reads my email and calendar. I tried a 14B model and it didn't fit in 8 GB: same failure and 4 to 8 times slower. The server CPU has no AVX2: it would be minutes per answer."

[[text.en.decisions]]
title = "How to get accuracy from a small model"
choice = "Move rules from the prompt into code"
why = "Adding text to the prompt made the suite worse (96 vs 105 out of 111) and examples made it copy the shape of a sentence, not its meaning. What worked was having the code compute dates, weekdays, expiries, sums and types, and leaving the model to understand and write."

[[text.en.decisions]]
title = "How a change gets accepted"
choice = "Measured with 3 seeds, case by case"
why = "Each change is measured on its own and only shipped with no regressions. Besides the suite there are tests against production and real questions, because the suite uses synthetic data and can't see a broken tool."

[[text.en.decisions]]
title = "What the model can touch"
choice = "Read almost everything, write almost nothing"
why = "The model interprets and the code decides whether anything gets written. That's why an instruction inside an email can't create or delete anything, and automatic retries never apply to write tools."

[text.en.tech_notes]
python = "The whole bot: the turn loop, argument validation, the guards, the relay for two-step questions, the watchers and about 110 tests with no model or network."
llm = "Ollama with qwen3:8b for chat, an embedding model to search by meaning, Qdrant as the vector database and Whisper for voice. All local, tuned to fit in 8 GB of VRAM."
linux = "systemd services with minimal permissions (read-only paths, no privileges) in a dedicated container; the GPU in a Linux PC."
ansible = "The role that deploys the bot, its services and its configuration; secrets are encrypted with Ansible Vault."

[text.en.close]
lessons = [
  "With a small model, accuracy doesn't come from the model: it comes from what the code does around it.",
  "The more general text an 8B model receives, the worse it chooses. Isolating a task fixes it.",
  "GPU memory is part of the design: an open browser changed the speed fourfold and the suite's result.",
  "Measure with several seeds and with real questions: half the important failures never showed up in the suite.",
]
next = [
  "A GPU of its own for the server, so Hermes doesn't depend on my PC being on.",
  "Review the suite's criteria: some cases measured wording rather than substance.",
  "Fix questions about past incidents, which still sometimes go to the live-status tools.",
]
