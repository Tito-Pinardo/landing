[text.en.incidents.load]
title = "Eight containers alerting at once"
meta = "05-10-2026 · noise"
symptom = "Every few days, eight containers alerted at once about «load per CPU above 3 for 15 minutes». None of them was doing anything."
options = [
  "An attack on the whole fleet",
  "The hypervisor had run out of memory",
  "Inside an LXC container, the load you see is the whole hypervisor's",
  "The agent was measuring CPU wrongly",
]
cause = "In these containers, /proc/loadavg shows the server's load. During the monthly RAID check the hypervisor hit 50, and divided by each container's 2 CPUs, they all «were» at 25."
fix = "Disable that trigger on the containers and keep it only on the hypervisor, where it measures something real. Each container's CPU is still watched by usage."
lesson = "An alert that fires on something that can't be measured that way teaches you to ignore alerts. Check what the metric really measures in that environment."

[text.en.incidents.latency]
title = "Disk latency «too high»"
meta = "08-09-2026 · disks"
symptom = "Constant alerts about read and write latency above 20 ms on one of the system disks."
options = [
  "It's a spinning disk serving the whole system: 20 ms is its normal, not a fault",
  "The disk was dying",
  "The cable was loose",
  "The controller was saturated",
]
cause = "SMART clean and no kernel errors. It's one of the two spinning disks in the system RAID, under real load: 15-28 ms is expected."
fix = "Raise the threshold to 50 ms for that disk and its mirror partner, not for all of them."
lesson = "Default thresholds are for a generic disk. They're tuned with data from the actual disk, and for both mirror members at once."

[text.en.incidents.silentagent]
title = "Agents with no sign of life"
meta = "16-09-2026 · registration"
symptom = "After registering several new containers, only two started sending data. The others stayed at «trying to connect», with no error."
options = [
  "The key was copied wrongly",
  "The agent version wasn't compatible",
  "DNS didn't resolve the server",
  "The server firewall only accepted known addresses, and the new ones weren't there",
]
cause = "The two that worked reused addresses already on the server firewall's list. The new ones were silently dropped."
fix = "Add the addresses to the firewall and make that step part of the registration itself: a new container can no longer be left out by oversight."
lesson = "A failure that happens twice in a day isn't bad luck: it's a step missing from the procedure."

