[text.en.meta]
title = "Inside Zabbix · Tito Pinardo Gutiérrez"
description = "The homelab's monitoring: agents with their own key on every machine, ZFS, RAID, SMART and Docker checks without extra permissions, and how alerts went from «unbearable» to only what needs looking at."

[text.en.ui]
slot = "1U · ZABBIX"
face_specs = "Zabbix 7 LTS · PSK · 4 channels"
state = "In production"
map_silk = "MON"
map_title = "Inside the monitoring"
map_intro = "Every machine sends its metrics; here it's decided what's a problem and who gets told. Pick a flow."
vm_title = "Zabbix container · Proxmox"
vm_specs = "unprivileged, no SSH"
outside = "Outside"
disclaimer = "Rebuilt from my documentation: no addresses, machine names or credentials."

[text.en.hero]
kicker = "1U unit · Observability"
title = "Zabbix · metrics and alerts"
tagline = "Every container and the server itself run an agent sending its metrics encrypted with its own key: CPU, memory, disks, RAID, ZFS, SMART health, Docker containers. Zabbix decides what's a problem, alerts on the right channel for the severity and alerts again when it's fixed."
grade = "From 178 doubled alerts to only the serious ones"
facts = [
  { label = "How it's isolated", value = "Unprivileged container, SSH stopped and masked, inbound dropped except from agents and the internal door. Its API only listens inwards." },
  { label = "What it can't do", value = "Agents don't accept remote commands or have access to the Docker socket: read-only collectors leave the data as JSON." },
  { label = "Alerts", value = "One alert per incident plus its recovery, no hourly repeats. By severity: Discord from average up, email and Element only for high." },
]

