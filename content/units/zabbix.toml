[text.es.incidents.load]
title = "Ocho contenedores en alerta a la vez"
meta = "05-10-2026 · ruido"
symptom = "Cada pocos días, ocho contenedores avisaban a la vez de «carga por CPU por encima de 3 durante 15 minutos». Ninguno estaba haciendo nada."
options = [
  "Un ataque a toda la flota",
  "El hipervisor se había quedado sin memoria",
  "Dentro de un contenedor LXC, la carga que se ve es la del hipervisor entero",
  "El agente medía mal la CPU",
]
cause = "En estos contenedores, /proc/loadavg enseña la carga del servidor. Durante la comprobación mensual del RAID el hipervisor llegaba a 50, y dividido entre las 2 CPU de cada contenedor, todos «estaban» a 25."
fix = "Desactivar ese trigger en los contenedores y dejarlo solo en el hipervisor, donde mide algo real. La CPU de cada contenedor se sigue vigilando por uso."
lesson = "Un aviso que salta por algo que no se puede medir así enseña a ignorar los avisos. Comprobar qué mide de verdad la métrica en ese entorno."

[text.es.incidents.latency]
title = "Latencia de disco «demasiado alta»"
meta = "08-09-2026 · discos"
symptom = "Avisos constantes de latencia de lectura y escritura por encima de 20 ms en uno de los discos del sistema."
options = [
  "Es un disco mecánico sirviendo a todo el sistema: 20 ms es su normal, no un fallo",
  "El disco se estaba muriendo",
  "El cable estaba suelto",
  "La controladora estaba saturada",
]
cause = "SMART limpio y sin errores en el kernel. Es uno de los dos discos mecánicos del RAID del sistema, con una carga real: 15-28 ms es lo esperable."
fix = "Subir el umbral a 50 ms para ese disco y su pareja del espejo, no para todos."
lesson = "Los umbrales por defecto son para un disco genérico. Se ajustan con datos del disco concreto, y para los dos miembros del espejo a la vez."

[text.es.incidents.silentagent]
title = "Agentes que no daban señales de vida"
meta = "16-09-2026 · registro"
symptom = "Tras registrar varios contenedores nuevos, solo dos empezaron a mandar datos. Los otros se quedaban en «intentando conectar», sin ningún error."
options = [
  "La clave estaba mal copiada",
  "La versión del agente no era compatible",
  "El DNS no resolvía el servidor",
  "El cortafuegos del servidor solo aceptaba direcciones ya conocidas, y las nuevas no estaban",
]
cause = "Los dos que funcionaban reutilizaban direcciones que ya estaban en la lista del cortafuegos del servidor. Los nuevos se descartaban en silencio."
fix = "Añadir las direcciones al cortafuegos y llevar ese paso al propio registro: un contenedor nuevo ya no puede quedarse fuera por olvido."
lesson = "Un fallo que pasa dos veces el mismo día no es mala suerte: es un paso que falta en el procedimiento."

[[text.es.timeline]]
title = "Instalación aislada"
period = "06-09-2026"
items = [
  "Zabbix y Wazuh en contenedores propios sin privilegios ni SSH.",
  "Agentes con clave propia en toda la flota, sin órdenes remotas.",
  "Canales de aviso por gravedad.",
]

[[text.es.timeline]]
title = "Registro en un comando"
period = "16-09-2026"
items = [
  "Script que da de alta un contenedor en Zabbix y Wazuh y guarda la clave en el vault.",
  "Cortafuegos del servidor incluido en el registro.",
]

[[text.es.timeline]]
title = "Menos ruido"
period = "Septiembre y octubre de 2026"
items = [
  "Umbrales de disco ajustados al disco real.",
  "Una semana de avisos medida antes de cambiar nada.",
  "Correo solo para lo alto y el trigger engañoso, fuera.",
]

[[text.es.decisions]]
title = "Quién inicia la conexión"
choice = "El agente, en modo activo"
why = "Así el servidor no necesita llegar a cada máquina: solo las máquinas al servidor. Una superficie menos."

[[text.es.decisions]]
title = "Cómo se mira Docker"
choice = "Colectores de solo lectura, sin socket"
why = "Dar el socket de Docker al usuario de monitorización es darle el servidor. Un script con permisos mínimos deja el estado en un fichero."

[[text.es.decisions]]
title = "Cómo se decide qué avisar"
choice = "Midiendo primero"
why = "Bajar umbrales a ojo esconde problemas reales. Contar qué llegaba, cuánto y desde dónde dijo qué sobraba."

[text.es.tech_notes]
zabbix = "Servidor y agentes activos con PSK, colectores de ZFS, RAID, SMART y Docker, triggers ajustados y avisos por gravedad con recuperación."
wazuh = "Comparte el script de registro: un contenedor nuevo entra en las dos herramientas a la vez."
hardening = "Contenedor sin privilegios ni SSH, entrada rechazada, sin ejecución remota y sin acceso al socket de Docker."
mikrotik = "El router se vigila por ping y HTTPS, sin credenciales de administración."
vlan = "Los agentes de todos los segmentos informan al mismo servidor, que solo acepta direcciones conocidas."
wireguard = "Desde la VPN se llega al panel como desde casa, detrás de la puerta interna."
ansible = "Instala los agentes con su clave desde el vault; el script de registro la escribe ahí."

[text.es.close]
lessons = [
  "Un aviso que no se cree es peor que ninguno: se mide y se ajusta.",
  "Comprobar qué significa una métrica dentro de un contenedor.",
  "Lo que falla dos veces se mete en el procedimiento.",
]
next = [
  "Repetir la medición de avisos tras unas semanas para confirmar el efecto.",
  "Vigilar también que cada servicio responde a sus usuarios, no solo que su agente informa.",
]

