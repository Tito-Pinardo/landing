[[text.en.decisions]]
title = "Who starts the connection"
choice = "The agent, in active mode"
why = "That way the server doesn't need to reach every machine: only the machines reach the server. One less surface."

[[text.en.decisions]]
title = "How Docker is checked"
choice = "Read-only collectors, no socket"
why = "Giving the Docker socket to the monitoring user is giving it the server. A script with minimal permissions leaves the state in a file."

[[text.en.decisions]]
title = "How to decide what to alert on"
choice = "Measure first"
why = "Lowering thresholds by eye hides real problems. Counting what arrived, how much and from where said what was surplus."

[text.en.tech_notes]
zabbix = "Server and active agents with PSK, collectors for ZFS, RAID, SMART and Docker, tuned triggers and alerts by severity with recovery."
wazuh = "Shares the registration script: a new container joins both tools at once."
hardening = "Unprivileged container with no SSH, inbound dropped, no remote execution and no Docker socket access."
mikrotik = "The router is watched by ping and HTTPS, with no admin credentials."
vlan = "Agents on every segment report to the same server, which only accepts known addresses."
wireguard = "From the VPN you reach the panel as from home, behind the internal door."
ansible = "Installs the agents with their key from the vault; the registration script writes it there."

[text.en.close]
lessons = [
  "An alert nobody believes is worse than none: measure and tune.",
  "Check what a metric means inside a container.",
  "Whatever fails twice goes into the procedure.",
]
