kicker = "1U unit · Personal documents"
title = "Paperless-ngx · the home archive"
tagline = "I scan a paper and Paperless reads it with OCR, gives it a title, tags and type with help from a local model, and files it where I can find it by searching. These are identity and property documents, so it's the most locked-down container on the server."
grade = "137 documents migrated 1:1"
facts = [
  { label = "Why so locked down", value = "It isn't ordinary paperwork: land registry, residence certificates, official documents. If anything in the homelab leaks, it mustn't be this." },
