[text.es.incidents.ssh]
title = "Un SSH que no debía estar"
meta = "17-09-2026 · auditoría"
symptom = "El diseño decía «sin SSH». Antes de migrar, revisé el contenedor tal y como estaba."
options = [
  "Tenía una contraseña débil",
  "La aplicación estaba expuesta a internet",
  "El SSH estaba activo, con claves de root y una regla del cortafuegos que lo dejaba pasar",
  "El cifrado estaba desactivado",
]
cause = "En algún momento se añadió acceso por SSH para arreglar algo y nunca se quitó, ni se reflejó en la documentación. El diseño y la realidad se habían separado."
fix = "El contenedor nuevo nace de Terraform sin ninguna cuenta y Ansible lo administra a través del hipervisor: ya no hay SSH que alguien pueda volver a abrir por comodidad."
lesson = "La documentación dice lo que quería hacer; el sistema, lo que hay. Antes de fiarse del diseño, comprobar el estado real."

[text.es.incidents.pmxcfs]
title = "Ansible no podía escribir el cortafuegos"
meta = "17-09-2026 · migración"
symptom = "El fichero del cortafuegos del contenedor no se podía escribir desde Ansible: «Operation not permitted», ni con la copia normal ni con la directa."
options = [
  "Faltaban permisos de root",
  "Ese fichero vive en el sistema de ficheros del clúster de Proxmox, que no admite el reemplazo atómico",
  "El fichero estaba bloqueado por el servicio",
  "El disco estaba lleno",
]
cause = "La configuración del cortafuegos está en el sistema de ficheros especial de Proxmox. Ansible escribe en un temporal y lo renombra, y ese sistema no lo permite."
fix = "Una tarea que compara el contenido y, solo si cambia, lo escribe con una redirección normal. Sigue siendo idempotente."
lesson = "Las herramientas suponen un sistema de ficheros normal. Cuando no lo es, se respeta lo que la herramienta garantiza (idempotencia) aunque haya que hacerlo de otra manera."

[[text.es.timeline]]
title = "Despliegue"
period = "09-09-2026"
items = [
  "Paperless con OCR en español, detrás de la puerta interna.",
  "IA local para clasificar, con el modelo en mi PC.",
]

[[text.es.timeline]]
title = "Migración a código"
period = "17-09-2026"
items = [
  "Contenedor nuevo con Terraform, sin cuentas, y Ansible a través del hipervisor.",
  "Cortafuegos con política de rechazo y tres orígenes permitidos.",
  "Datos migrados sin abrir ningún documento y comprobados uno a uno.",
]

[[text.es.decisions]]
title = "Cómo se administra"
choice = "Sin SSH, a través del hipervisor"
why = "Quien llega al hipervisor ya lo tiene todo; abrir además SSH en el contenedor solo añade una puerta."

[[text.es.decisions]]
title = "Dónde se cifra"
choice = "Dentro del propio contenedor"
why = "La puerta interna ya cifra, pero el tramo hasta el contenedor también pasa por la red. Con nginx dentro, los documentos nunca viajan en claro."

[[text.es.decisions]]
title = "El contenedor viejo"
choice = "Parado, no destruido"
why = "Sin copias periódicas todavía, el original es la vuelta atrás. Se borra cuando haya copia de verdad."

[text.es.tech_notes]
proxmox = "El cortafuegos del contenedor y la administración con «pct exec» desde el hipervisor."
lxc = "Contenedor sin privilegios con anidamiento para poder correr Docker."
terraform = "Crea el contenedor sin ninguna cuenta de usuario."
ansible = "Despliega el stack a través del hipervisor y guarda las credenciales en el vault."
docker = "Paperless, su base de datos y su cola, publicados solo hacia dentro."
zabbix = "Comprueba que el HTTPS del contenedor responde."
wazuh = "Vigila los cambios en la configuración."
hardening = "Rechazo por defecto, sin SSH, TLS dentro del contenedor, doble factor delante y login propio detrás."
postgresql = "La base de Paperless, migrada con un volcado sin abrir documentos."
redis = "La cola donde esperan los OCR."
llm = "Un modelo local propone título, etiquetas y tipo: los documentos no salen de casa."

[text.es.close]
lessons = [
  "Lo más sensible se diseña desde el «no»: qué no tiene que poder pasar.",
  "Comprobar el estado real antes de migrar: apareció un SSH que no estaba en ningún papel.",
]
next = [
  "Copias periódicas cifradas fuera del servidor; después, borrar el contenedor viejo.",
  "Activar el segundo factor propio de Paperless.",
]

