[text.en.meta]
title = "Inside Paperless · Tito Pinardo Gutiérrez"
description = "The home's personal document archive: Paperless-ngx with OCR and local AI, in the homelab's most locked-down container, with no SSH and managed only through the hypervisor."

[text.en.ui]
slot = "1U · PAPERLESS"
face_specs = "Paperless-ngx · OCR · no SSH"
state = "In production"
map_silk = "DOCS"
map_title = "Inside the archive"
map_intro = "Papers that mustn't leave home live here. Pick a flow to see how many doors you have to go through to reach them."
