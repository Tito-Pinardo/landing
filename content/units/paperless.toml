]

[text.en.flows.admin]
title = "Ansible manages it"
steps = [
  "Ansible takes the credentials from the encrypted vault.",
  "It connects to the hypervisor, not the container.",
  "And runs the tasks inside with «pct exec».",
  "The container has no SSH: there's no other way in.",
  "Paperless ends up updated and configured.",
]

[text.en.flows.migrate]
title = "The migration to code"
steps = [
  "Terraform creates the new container, with no accounts.",
  "On the old one, a database dump and an archive of the files, opening nothing.",
  "They move through the hypervisor.",
  "They're restored into a clean database.",
  "Checked: 137 documents and the same size in both.",
  "The app answers through the same door, on the same IP.",
  "Monitoring registered again.",
  "And security, with a new agent.",
  "The old one, stopped but not deleted.",
]

[text.en.flows.intruder]
title = "Someone on the network tries"
steps = [
  "A device on the network tries to connect to the container.",
  "The firewall drops everything that isn't the internal door or monitoring.",
  "It tries the app directly.",
  "It only listens on localhost: there's nothing on the other side.",
]

[text.en.incidents.ssh]
title = "An SSH that shouldn't have been there"
meta = "17-09-2026 · audit"
symptom = "The design said «no SSH». Before migrating, I checked the container as it actually was."
options = [
  "It had a weak password",
  "The app was exposed to the internet",
  "SSH was running, with root keys and a firewall rule letting it through",
  "Encryption was disabled",
]
cause = "At some point SSH access was added to fix something and never removed, nor written into the documentation. Design and reality had drifted apart."
fix = "The new container is born from Terraform with no accounts and Ansible manages it through the hypervisor: there's no SSH left for anyone to reopen for convenience."
lesson = "Documentation says what you meant to do; the system, what there is. Before trusting the design, check the real state."

[text.en.incidents.pmxcfs]
title = "Ansible couldn't write the firewall"
meta = "17-09-2026 · migration"
symptom = "The container's firewall file couldn't be written from Ansible: «Operation not permitted», neither with the normal copy nor the direct one."
options = [
  "Root permissions were missing",
  "That file lives on Proxmox's cluster file system, which doesn't allow atomic replacement",
  "The file was locked by the service",
  "The disk was full",
]
cause = "The firewall configuration lives on Proxmox's special file system. Ansible writes a temporary file and renames it, and that file system doesn't allow it."
fix = "A task that compares the content and, only if it changed, writes it with a plain redirect. Still idempotent."
lesson = "Tools assume a normal file system. When it isn't, keep what the tool guarantees (idempotence) even if you have to do it another way."

