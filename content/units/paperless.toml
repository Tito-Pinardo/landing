[[text.en.decisions]]
title = "How it's managed"
choice = "No SSH, through the hypervisor"
why = "Whoever reaches the hypervisor already has everything; opening SSH on the container as well only adds a door."

[[text.en.decisions]]
title = "Where it's encrypted"
choice = "Inside the container itself"
why = "The internal door already encrypts, but the hop to the container also crosses the network. With nginx inside, documents never travel in the clear."

[[text.en.decisions]]
title = "The old container"
choice = "Stopped, not destroyed"
why = "With no regular backups yet, the original is the way back. It gets deleted once there's a real backup."

