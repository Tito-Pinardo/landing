[[text.en.decisions]]
title = "Velocity or my own gateway"
choice = "My own gateway, in Rust"
why = "Crossing between servers with no loading screen means splicing packets on the fly, and a generic proxy doesn't do that."

[[text.en.decisions]]
title = "Paper, Purpur or Folia"
choice = "Folia, with my own patches"
why = "Folia splits the world into regions with their own threads: with many players spread out it uses every core."

[[text.en.decisions]]
title = "Redis in front of PostgreSQL"
choice = "No: fewer round trips"
why = "33 hours of pg_stat_statements: the weight was writes that must persist. Merging round trips beat a cache."

[[text.en.decisions]]
title = "Split the world by hand or automatically"
choice = "The controller does it"
why = "By cells, never splitting an area with players in it (bases and redstone intact), and reassigning on its own if a server dies."

[[text.en.decisions]]
title = "Expose the controller or just the gateway"
choice = "Just the gateway, in the DMZ"
why = "The database isn't reachable from the internet and services talk to each other with mutual TLS."

