[text.es.meta]
title = "BattlePros por dentro · Tito Pinardo Gutiérrez"
description = "Una red de Minecraft hecha a medida: entrada propia en Rust, fragmentos con Folia, un mando que lo reparte todo y un panel para añadir servidores con una orden. Cada cambio, medido contra la línea base."

[text.es.ui]
slot = "1U · BATTLEPROS"
face_specs = "Rust · Folia · PostgreSQL"
state = "Abierto a pruebas externas"
map_silk = "GAME NET"
map_title = "La red por dentro"
map_intro = "Pulsa una pieza o elige un recorrido: entrar, cruzar de un servidor a otro sin pantalla de carga, añadir un servidor con una orden…"
vm_title = "Un goliat · contenedores en Proxmox"
vm_specs = "una zona en producción"
outside = "Fuera"
disclaimer = "Reconstrucción a partir de la documentación y la wiki de resultados del proyecto: sin direcciones, puertos ni nombres internos."

[text.es.hero]
kicker = "Unidad 1U · Proyecto personal en marcha"
title = "BattlePros"
tagline = "Una red de Minecraft hecha a medida: un solo mundo repartido entre varios servidores, sin pantallas de carga al pasar de uno a otro, y todo lo que hay detrás (entrada, mando, agentes, panel) escrito desde cero."
grade = "Abierto a pruebas · 0.7.45"
facts = [
  { label = "Mi parte", value = "La idea, la arquitectura, las decisiones y las pruebas. El código lo escribo con un agente de IA como compañero, con reglas fijas: medir antes y después, documentar el porqué y no tocar la jugabilidad." },
  { label = "Dónde vive", value = "En este mismo servidor: el mando y los fragmentos en un contenedor y la entrada pública aislada en la DMZ, en otro. Sin nada en mi PC." },
  { label = "Pruebas y producción", value = "Todo se probó con dos zonas (dos «continentes» a 80 ms de distancia) para comprobar que el reparto, los cruces y la alta disponibilidad funcionan. En producción, para las pruebas externas, hay una sola: el goliat de este servidor." },
]

[[text.es.stats]]
value = "20 TPS"
label = "con 100 bots a la vez en la zona"

[[text.es.stats]]
value = "−80 %"
label = "en pagar a otro jugador (/pay), tras juntar 5 viajes a la base en uno"

[[text.es.stats]]
value = "2 → 1"
label = "zonas: dos en pruebas, una en producción"

[[text.es.stats]]
value = "0"
label = "agujeros en la batería de suplantación de cuentas"

[[text.es.stats]]
value = "1 orden"
label = "para sumar un servidor físico nuevo a la red"

[[text.es.stats]]
value = "2,35×"
label = "más rápido generando terreno con el generador en Rust"

[text.es.groups]
dmz = "DMZ · lo único visible desde internet"
control = "Control · detrás del inicio de sesión"
game = "Fragmentos · el mundo repartido"
data = "Mundo, agentes y copias"

[text.es.pods.player]
short = "Jugador"
title = "Jugador"
text = "Cualquiera con una cuenta original de Minecraft. Solo cuentas de Mojang: nadie puede entrar haciéndose pasar por otro."

[text.es.pods.friend]
short = "Otro jugador"
title = "Otro jugador"
text = "Alguien en otra parte del mundo, quizá en otro servidor. Para él es el mismo mundo y el mismo chat."

[text.es.pods.mojang]
short = "Mojang"
title = "Sesiones de Mojang"
text = "La entrada pregunta a Mojang si la cuenta es de verdad (y trae su skin). Si no responde a tiempo, no se entra."

[text.es.pods.dns]
short = "DNS (SRV)"
title = "DNS con registro SRV"
text = "El jugador escribe solo el dominio; un registro SRV le dice a qué puerto ir. Sin proxy de Cloudflare: Minecraft no es HTTP."

[text.es.pods.router]
short = "Router"
title = "Router"
text = "Reenvía el puerto del juego y la voz solo hacia la DMZ. Desde la DMZ solo se puede hablar con los puertos exactos del juego."

[text.es.pods.admin]
short = "Yo (admin)"
title = "Administrador"
text = "Yo desde el navegador: el panel está detrás de Authelia y solo se ve desde casa."

[text.es.pods.forgejo]
short = "Forgejo CI"
title = "Forgejo (CI y releases)"
text = "Cada pieza tiene su repositorio: en cada push se compila y se prueba, y con una etiqueta sale una release con su suma SHA-256."

[text.es.pods.otro]
short = "Otro servidor"
title = "Un servidor físico nuevo"
text = "Cualquier Linux con systemd: se le pega una orden y se instala solo (Java, usuario, agente y alta), comprobando antes la huella de la CA."

[text.es.pods.entrada]
short = "Entrada (Rust)"
title = "La entrada (Rust)"
text = "Mi proxy de Minecraft: cifrado y login con Mojang, cola de plazas y el empalme que pasa al jugador de un servidor a otro sin pantalla de carga."

[text.es.pods.voz]
short = "Voz"
title = "Chat de voz"
text = "El relé UDP del chat de voz por proximidad, en la misma entrada: la voz no toca los fragmentos."

[text.es.pods.fw]
short = "Cortafuegos"
title = "Cortafuegos de la DMZ"
text = "La entrada vive aislada en su VLAN. Si alguien la rompiera, solo podría hablar con los puertos del juego, nunca con la base de datos ni con el resto de casa."

[text.es.pods.authelia]
short = "Authelia"
title = "Authelia (inicio de sesión)"
text = "El panel no tiene usuarios propios: pasa por el inicio de sesión único de casa y el mando apunta quién hizo cada cosa."

[text.es.pods.panel]
short = "Panel"
title = "Panel de administración"
text = "Una web en Svelte: servidores, fragmentos, jugadores, staff, plazas, anuncios a toda la red, versiones, mapa en vivo y monitorización."

[text.es.pods.mando]
short = "Mando (Rust)"
title = "El mando (Rust)"
text = "El cerebro: decide qué servidor lleva cada trozo del mundo, guarda el estado deseado, da de alta máquinas con fichas de un solo uso y reparte versiones."

[text.es.pods.postgres]
short = "PostgreSQL"
title = "PostgreSQL"
text = "Economía, casas, equipos, sanciones y el reparto del mundo. Lo que da o quita algo se comprueba siempre aquí, en una sola sentencia."

[text.es.pods.eu1]
short = "eu-1"
title = "Fragmento eu-1 (Folia)"
text = "Un servidor de juego con mi versión de Folia: lleva unas celdas del mundo. Con gente cerca, la zona entera se queda en un mismo fragmento para no partir bases ni redstone."

[text.es.pods.eu2]
short = "eu-2"
title = "Fragmento eu-2 (Folia)"
text = "Otro trozo del mismo mundo. Si eu-1 cae, sus celdas pasan aquí y los jugadores siguen jugando."

[text.es.pods.coliseo]
short = "Coliseo"
title = "Coliseo (liga)"
text = "Un fragmento solo para la liga: duelos con kits, elo, retos y temporadas, sin cargar el mundo principal."

[text.es.pods.generador]
short = "Generador"
title = "Generador de terreno (Rust)"
text = "Genera el terreno nuevo fuera de Folia, con la misma semilla y un 99,3 % de bloques iguales que el original. Folia solo pone encima las estructuras."

[text.es.pods.almacen]
short = "Almacén"
title = "Almacén del mundo (Rust)"
text = "Guarda los chunks comprimidos con zstd y un diccionario (7,5 veces más pequeños). Cualquier fragmento puede cargar cualquier zona."

[text.es.pods.agente]
short = "Agente"
title = "Agente (uno por máquina)"
text = "Arranca, para y actualiza los fragmentos de su máquina según lo que diga el mando, y le manda métricas cada pocos segundos."

[text.es.pods.copias]
short = "Copias"
title = "Copias (PBS)"
text = "Copia diaria y cifrada del contenedor y de la base de datos, con la prueba de restauración semanal de todo el homelab."

[text.es.pods.metricas]
short = "Métricas"
title = "Métricas"
text = "TPS, MSPT, memoria, CPU, red y disco de cada fragmento y cada máquina, guardados en el propio mando: 14 días de gráficas en el panel."

[text.es.flows.login]
title = "Entras al servidor"
steps = [
  "Escribes el dominio en Minecraft.",
  "El DNS responde con un registro SRV: a qué puerto ir.",
  "El router solo deja pasar ese puerto, y solo hacia la DMZ.",
  "El cortafuegos de la DMZ deja hablar a la entrada solo con lo justo.",
  "La entrada cifra la conexión y pide a tu cliente que se identifique.",
  "Mojang confirma que la cuenta es tuya y trae tu skin.",
  "Si la red está llena (las plazas del panel), aquí te lo dice.",
  "El mando sabe qué fragmento lleva la zona donde estabas.",
  "La entrada te conecta con él.",
  "eu-1 te recibe con tus datos de la base.",
  "Ya estás jugando.",
]

[text.es.flows.cross]
title = "Cruzas a otro servidor sin pantalla de carga"
steps = [
  "Caminas hacia una zona que lleva otro fragmento.",
  "eu-1 ve que te acercas al borde de su celda.",
  "El mando confirma quién lleva la celda de al lado.",
  "La entrada abre por debajo una conexión con eu-2…",
  "…que ya te tiene preparado al otro lado.",
  "eu-2 carga el terreno del almacén común.",
  "La entrada cambia el flujo de paquetes al vuelo: un empalme.",
  "Sigues andando. No has visto ninguna pantalla de carga.",
]

[text.es.flows.chat]
title = "Hablas con alguien de otro servidor"
steps = [
  "Escribes en el chat.",
  "La entrada lo pasa a tu fragmento.",
  "eu-1 lo filtra (palabrotas, spam, silenciados) y se lo enseña a los de aquí.",
  "PostgreSQL lo reparte con LISTEN/NOTIFY a los demás fragmentos.",
  "eu-2 lo pinta igual que si fuera suyo.",
  "Llega como mensaje del sistema: sin el aviso de «no se puede verificar».",
  "Tu amigo lo lee, aunque esté en otro servidor.",
]

[text.es.flows.install]
title = "Añado un servidor físico con una orden"
steps = [
  "Entro en el panel desde casa.",
  "Authelia comprueba que soy yo.",
  "En «Servidores» le doy un nombre al servidor nuevo.",
  "El mando crea una ficha de un solo uso que caduca.",
  "El panel me enseña la orden, una sola vez.",
  "La copio…",
  "…y la pego como root en el servidor nuevo.",
  "Antes de bajar nada, comprueba la huella de la CA del mando: nadie en medio puede cambiar el guion.",
  "Instala Java, el usuario, el agente (comprobando su suma) y el servicio.",
  "El agente se da de alta con la ficha y recibe su certificado.",
  "Ya aparece en el panel: le pongo servicios y fragmentos.",
]

[text.es.flows.slots]
title = "Cambio las plazas de toda la red"
steps = [
  "Quiero que entren 300 en vez de 500.",
  "Paso por Authelia.",
  "En «Red» cambio las plazas y guardo.",
  "El mando lo apunta en el registro (quién y cuándo)…",
  "…y lo guarda en la base.",
  "En el siguiente latido se lo manda a cada agente.",
  "El agente se lo pasa a la entrada de su máquina.",
  "La lista de servidores enseña el nuevo máximo y, con la red llena, la entrada no deja pasar a nadie nuevo.",
  "Los que ya están dentro siguen jugando: a nadie se le echa.",
]

[text.es.flows.release]
title = "Sale una versión nueva"
steps = [
  "Una etiqueta en Forgejo compila, prueba y publica la release con su suma.",
  "Fijo la versión en el panel: el mando la baja y comprueba la suma.",
  "Los agentes ven que su versión ya no es la deseada.",
  "eu-1 avisa en el juego, se para, se actualiza y vuelve…",
  "…y solo cuando está bien, sigue el siguiente.",
  "eu-2, igual: de uno en uno, nunca todos a la vez.",
  "Mientras, sus jugadores han pasado al fragmento que sigue en marcha.",
  "El coliseo, el último.",
  "El mando lo da por hecho cuando todos están en marcha con la versión nueva.",
]

[text.es.flows.crash]
title = "Se cae un fragmento"
steps = [
  "eu-2 se cuelga o se queda sin memoria.",
  "Su agente deja de verlo sano y lo cuenta.",
  "El mando ve que hay celdas sin quien las lleve.",
  "Las reasigna en la base, de una vez y sin duplicados.",
  "Avisa a los fragmentos que quedan.",
  "eu-1 se queda también con las celdas de eu-2.",
  "La entrada lleva a los jugadores al fragmento que sigue vivo.",
  "Pierdes unos segundos, no la partida. El agente vuelve a arrancar eu-2.",
]

[text.es.incidents.dns]
title = "«Failed to connect: disconnected»"
meta = "29-10-2026 · Bloqueante: el servidor aparecía en la lista, pero nadie podía entrar"
symptom = "Desde fuera el servidor salía en la lista con su número de jugadores, pero al entrar el juego decía «Failed to connect to the server: disconnected». En la red de casa, con bots, todo iba bien."
options = [
  "El router bloqueaba el puerto de entrada.",
  "Las cuentas de prueba no eran originales.",
  "El contenedor de la DMZ resolvía nombres primero con el DNS de casa, al que no puede llegar: cada consulta tardaba 5 s y la comprobación con Mojang caducaba.",
  "El certificado de la entrada había caducado.",
]
cause = "El contenedor nuevo de la DMZ heredó el DNS de casa como primero. Desde la DMZ no se puede llegar a él (bien hecho), así que cada consulta esperaba 5 s antes de probar el siguiente. La lista de servidores no pregunta a Mojang, pero entrar sí: llegaba tarde y se cortaba."
fix = "DNS públicos en el contenedor de la DMZ, en Terraform (no a mano), y una nota en la documentación. Las pruebas de suplantación se repitieron: antes «pasaban» solo porque Mojang no respondía."
lesson = "Una prueba que pasa por la razón equivocada es peor que una que falla. Hay que mirar por qué pasa."

[text.es.incidents.chat]
title = "«No se puede verificar el mensaje»"
meta = "29-10-2026 · Media: un aviso en el chat de cada jugador"
symptom = "Minecraft avisaba de que los mensajes del chat no se podían verificar, y algunos clientes los marcaban como inseguros."
options = [
  "Mojang tenía caído el servicio de firmas.",
  "Los fragmentos van sin modo online detrás de la entrada (es quien comprueba las cuentas) y no pueden verificar firmas, así que el cliente veía un servidor que no exige chat seguro.",
  "El filtro de palabrotas cambiaba el texto y rompía la firma.",
]
cause = "Detrás de un proxy, los servidores de juego no pueden comprobar las firmas del chat: quien verifica la cuenta es la entrada. El cliente veía un servidor sin chat seguro y lo avisaba."
fix = "La entrada le dice al cliente, en el paquete de login, que el servidor es online y exige chat seguro, y los fragmentos mandan el chat como mensajes del sistema (sin firma), igual que el que llega de otros fragmentos."
lesson = "El cliente solo sabe lo que el servidor le cuenta: si en medio hay un proxy, tiene que contarlo bien."

[text.es.incidents.lock]
title = "Vender un diamante tardaba 3 segundos"
meta = "27-10-2026 · Alta: con 10 jugadores vendiendo a la vez"
symptom = "Con diez jugadores vendiendo a la vez, cada venta tardaba de mediana 2,8 s y algunas casi 5. La base de datos apenas trabajaba."
options = [
  "Cada venta tenía el cerrojo del precio del material mientras hacía varios viajes de ida y vuelta a la base; las demás esperaban en fila.",
  "Faltaba un índice en la tabla de ventas.",
  "El servidor de juego iba lento por los mobs.",
]
cause = "La venta abría una transacción, bloqueaba el precio del material (para no vender de más ni de menos) y hacía varios viajes de 80 ms antes del COMMIT. Diez ventas a la vez = diez en fila."
fix = "Toda la venta en una sola sentencia SQL y el COMMIT en el mismo envío: el cerrojo dura un viaje en vez de cinco. De 2.768 ms a 852 de mediana, y nadie vende de más ni de menos."
lesson = "Con una base lejos, lo que cuesta no son las consultas: son los viajes, sobre todo con un cerrojo puesto."

[text.es.incidents.oom]
title = "El fragmento que tardó 40 minutos en morir"
meta = "22-10-2026 · Alta: un fragmento colgado en plena prueba"
symptom = "Con 100 bots explorando terreno nuevo, un fragmento se quedó sin memoria y tardó 40 minutos en apagarse."
options = [
  "Una fuga de memoria del plugin.",
  "Demasiados bots para la máquina.",
  "Cada jugador podía pedir terreno nuevo sin límite: generarlo era el cuello de botella y las peticiones se acumulaban en memoria.",
]
cause = "Generar chunks nuevos es lo más caro de Minecraft. Sin límite por jugador, cien exploradores llenaban la cola de generación más rápido de lo que se vaciaba."
fix = "Un límite de generación por jugador (−20 % de CPU, 0 bots echados) y, después, un generador propio en Rust con la misma semilla: 2,35 veces más rápido que Folia sola en la misma máquina."
lesson = "Antes de dar más memoria, hay que ver qué se acumula y por qué."

[text.es.incidents.menus]
title = "Los menús lentos con una consulta de 1 ms"
meta = "23-10-2026 · Media: cada menú tardaba 115-270 ms en abrirse"
symptom = "Abrir menús que leen de la base (casas, perfil…) tardaba hasta 270 ms, aunque la consulta tardaba menos de 1,5 ms."
options = [
  "PostgreSQL estaba mal configurado.",
  "El tiempo se iba en volver al hilo del jugador: con Folia, la respuesta tiene que esperar al siguiente tick de su región.",
  "Los menús tenían demasiados objetos.",
]
cause = "En Folia cada región tiene su hilo. La consulta iba en otro hilo y la respuesta tenía que esperar su turno en el de la región del jugador."
fix = "Lo que solo se enseña (casas, cachés de presentación) vive en memoria; lo que da o quita algo se sigue comprobando en la base. De 115-270 ms a 17-19."
lesson = "Medir dónde se va el tiempo de verdad: la consulta era lo único que no hacía falta optimizar."

[text.es.bench]
title = "Antes y después, medido"
intro = "Cada cambio se mide contra la versión anterior con la misma prueba (bots haciendo de todo durante 6 minutos) y se queda solo si mejora sin romper nada. Algunas medidas son de la zona lejana de pruebas, a 80 ms de la base: ahí es donde más se notan los viajes."
before = "antes"
after = "después"
note = "Datos de la wiki de resultados del proyecto (p50 salvo que se diga otra cosa). Las pruebas se hicieron con dos zonas para comprobar que todo funciona entre continentes; en producción hay una sola."
groups = [
  ["db", "Base de datos"],
  ["tick", "Servidor de juego"],
  ["world", "Mundo, red y disco"],
]

[text.es.bench.rows.pay]
label = "/pay (pagar a otro)"
why = "Cinco viajes a la base (buscar el nombre, transacción, avisos) juntados en una sola sentencia."

[text.es.bench.rows.sethome]
label = "/sethome (guardar una casa)"
why = "Bloquear, contar, poner, leer y COMMIT: cinco viajes, ahora uno."

[text.es.bench.rows.perfil]
label = "/perfil"
why = "Perfil y saldos en una consulta con subconsultas en vez de cuatro."

[text.es.bench.rows.venta]
label = "Vender con 10 a la vez"
why = "La venta entera y su COMMIT en un solo envío: el cerrojo del precio dura un viaje."

[text.es.bench.rows.msg]
label = "/msg en el mismo servidor"
why = "Si el otro juega en el mismo fragmento, el mensaje no pasa por la base."

[text.es.bench.rows.tps]
label = "TPS con 100 bots"
why = "Folia usaba un solo hilo de región con 12 núcleos: ahora se reparten."

[text.es.bench.rows.mspt]
label = "MSPT con 100 bots"
why = "Lo mismo: menos milisegundos por tick y sin la parada de la región global."

[text.es.bench.rows.mobs]
label = "TPS de noche con 40 jugadores"
why = "Rangos de activación de la IA, aparición cada N ticks y colisiones más baratas."

[text.es.bench.rows.menus]
label = "Abrir un menú que lee de la base"
why = "Lo que solo se enseña, en memoria; lo que da o quita, en la base."

[text.es.bench.rows.generar]
label = "Generar terreno nuevo"
why = "El terreno lo genera un servicio en Rust; Folia solo pone las estructuras."

[text.es.bench.rows.zstd]
label = "Compresión del mundo"
why = "zstd con un diccionario entrenado con chunks reales (el End, de 17× a 25×)."

[text.es.bench.rows.entrada]
label = "CPU de la entrada con 100 bots"
why = "Caché de chunks ya comprimidos: el 93 % de aciertos con 42 MB."

[text.es.bench.rows.disco]
label = "/pay p95 al cambiar de disco"
why = "La base de pruebas pasó del RAID 1 de sistema al RAID 10 de discos SAS."

[[text.es.timeline]]
title = "Un mundo, varios servidores"
period = "20-22 oct 2026"
items = [
  "Entrada propia en Rust con el empalme sin pantalla de carga.",
  "Mando con el reparto por celdas y agentes que arrancan y paran fragmentos.",
  "Almacén del mundo con zstd y diccionario.",
]

[[text.es.timeline]]
title = "Rendimiento con datos"
period = "22-25 oct 2026"
items = [
  "Generador de terreno en Rust con paridad del 99,3 % con la misma semilla.",
  "Hilos de región, mobs y anti-xray medidos uno a uno.",
  "Wiki de resultados: cada cambio, con su línea base y su decisión.",
]

[[text.es.timeline]]
title = "Dos continentes"
period = "25-28 oct 2026"
items = [
  "Una segunda zona a 80 ms, con su propio mando, réplica de PostgreSQL y paso de una a otra.",
  "Bucle de optimización: juntar viajes a la base y medir cada orden con 100 bots.",
  "Alta disponibilidad: si cae el mando, otro toma el control y vuelve junto a su base.",
]

[[text.es.timeline]]
title = "Abierto al público"
period = "29 oct 2026"
items = [
  "Entrada en la DMZ, solo cuentas de Mojang y auditoría de suplantación.",
  "Una sola zona en producción y nada en mi PC.",
  "Panel nuevo: servidores con una orden, plazas de toda la red y anuncios.",
]

[[text.es.decisions]]
title = "Velocity o una entrada propia"
choice = "Entrada propia en Rust"
why = "Para pasar de un servidor a otro sin pantalla de carga hay que empalmar los paquetes al vuelo, y eso un proxy genérico no lo hace."

[[text.es.decisions]]
title = "Paper, Purpur o Folia"
choice = "Folia, con parches propios"
why = "Folia reparte el mundo en regiones con su propio hilo: con muchos jugadores separados aprovecha todos los núcleos."

[[text.es.decisions]]
title = "Redis delante de PostgreSQL"
choice = "No: menos viajes"
why = "33 horas de pg_stat_statements: lo que pesaba eran escrituras que tienen que persistir. Juntar viajes ganó más que una caché."

[[text.es.decisions]]
title = "Repartir el mundo a mano o solo"
choice = "Lo reparte el mando"
why = "Por celdas, sin partir nunca una zona con gente (bases y redstone intactas) y con reasignación sola si un servidor cae."

[[text.es.decisions]]
title = "Exponer el mando o solo la entrada"
choice = "Solo la entrada, en la DMZ"
why = "La base de datos no se ve desde internet y los servicios hablan entre sí con certificados mutuos (mTLS)."

[text.es.tech_notes]
rust = "Entrada, mando, agente, almacén y generador: todo lo que no es el juego en sí."
java = "El plugin del juego sobre Folia 26.3: economía, casas, equipos, liga, staff y chat de toda la red."
postgresql = "Todo el estado del juego y del reparto; sentencias únicas para que nada se duplique y LISTEN/NOTIFY para avisar entre servidores."
typescript = "El panel de administración en Svelte 5 y TypeScript."
linux = "Contenedores Debian con systemd de usuario; el agente se instala en cualquier Linux con una orden."
proxmox = "Los dos contenedores viven en el Proxmox de casa, junto al resto del homelab."
lxc = "El mando y los fragmentos en un contenedor; la entrada, en otro aislado en la DMZ."
terraform = "Los contenedores, su red y su DNS, declarados en Terraform."
ansible = "Roles para el contenedor de desarrollo y para la entrada de la DMZ, desplegados desde Forgejo."
forgejo = "Un repositorio por pieza con CI y releases firmadas por su suma."
git = "Ramas por cambio, etiquetas por versión y la wiki de resultados versionada."
vlan = "La entrada pública en la VLAN de la DMZ, sin acceso al resto de casa."
mikrotik = "Reenvío del puerto del juego y la voz, y reglas de la DMZ hacia los puertos justos."
dns = "Registro SRV para entrar solo con el dominio, creado por API."
hardening = "Solo cuentas de Mojang, mTLS entre servicios, base de datos sin exponer y batería de suplantación sin agujeros."
pbs = "Copias diarias y cifradas con prueba de restauración semanal."

[text.es.close]
lessons = [
  "Medir antes de tocar: la mitad de las ideas que parecían buenas no mejoraban nada y se descartaron con datos.",
  "Con una base lejos, el enemigo son los viajes, no las consultas.",
  "Una prueba que pasa por la razón equivocada es peor que una que falla.",
  "Probar con dos continentes desde el principio obligó a que todo funcionara sin trucos locales.",
]
next = [
  "Más jugadores reales en las pruebas externas.",
  "Sacar la IA de los mobs a un servicio aparte sin bajar los TPS.",
  "Una segunda zona en producción cuando haya hierro para ello.",
  "La versión 1.0.0, con el visto bueno de los que juegan.",
]

