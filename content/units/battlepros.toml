[text.en.meta]
title = "Inside BattlePros · Tito Pinardo Gutiérrez"
description = "A custom-built Minecraft network: my own Rust gateway, Folia shards, a controller that splits the world and a panel that adds servers with one command. Every change measured against a baseline."

[text.en.ui]
slot = "1U · BATTLEPROS"
face_specs = "Rust · Folia · PostgreSQL"
state = "Open for external testing"
map_silk = "GAME NET"
map_title = "Inside the network"
map_intro = "Click a part or pick a flow: joining, crossing to another server with no loading screen, adding a server with one command…"
vm_title = "One goliath · Proxmox containers"
vm_specs = "one zone in production"
outside = "Outside"
disclaimer = "Rebuilt from the project's documentation and results wiki: no addresses, ports or internal names."

[text.en.hero]
kicker = "1U unit · Ongoing personal project"
title = "BattlePros"
tagline = "A custom-built Minecraft network: one world split across several servers, no loading screens when you cross between them, and everything behind it (gateway, controller, agents, panel) written from scratch."
grade = "Open for testing · 0.7.45"
facts = [
  { label = "My part", value = "The idea, the architecture, the decisions and the testing. I write the code with an AI agent as a teammate, under fixed rules: measure before and after, document why, and never change the gameplay." },
  { label = "Where it lives", value = "On this same server: the controller and shards in one container, the public gateway isolated in the DMZ in another. Nothing on my PC." },
  { label = "Testing vs production", value = "Everything was tested with two zones (two “continents” 80 ms apart) to prove the world split, crossings and high availability work. In production, for external testing, there is just one: this server's goliath." },
]

[[text.en.stats]]
value = "20 TPS"
label = "with 100 bots at once in the zone"

[[text.en.stats]]
value = "−80 %"
label = "on paying another player (/pay), after merging 5 database round trips into 1"

[[text.en.stats]]
value = "2 → 1"
label = "zones: two in testing, one in production"

[[text.en.stats]]
value = "0"
label = "holes in the account impersonation test suite"

[[text.en.stats]]
value = "1 command"
label = "to add a new physical server to the network"

[[text.en.stats]]
value = "2.35×"
label = "faster terrain generation with the Rust generator"

[text.en.groups]
dmz = "DMZ · the only part visible from the internet"
control = "Control · behind single sign-on"
game = "Shards · the world, split"
data = "World, agents and backups"

[text.en.pods.player]
short = "Player"
title = "Player"
text = "Anyone with an original Minecraft account. Mojang accounts only: nobody can join pretending to be someone else."

[text.en.pods.friend]
short = "Another player"
title = "Another player"
text = "Someone elsewhere in the world, maybe on another server. To them it is the same world and the same chat."

[text.en.pods.mojang]
short = "Mojang"
title = "Mojang sessions"
text = "The gateway asks Mojang whether the account is real (and gets the skin). If Mojang doesn't answer in time, you don't get in."

[text.en.pods.dns]
short = "DNS (SRV)"
title = "DNS with an SRV record"
text = "Players type just the domain; an SRV record tells them which port to use. No Cloudflare proxy: Minecraft isn't HTTP."

[text.en.pods.router]
short = "Router"
title = "Router"
text = "Forwards the game and voice ports only to the DMZ. From the DMZ, only the exact game ports are reachable."

[text.en.pods.admin]
short = "Me (admin)"
title = "Administrator"
text = "Me in the browser: the panel sits behind Authelia and is only reachable from home."

[text.en.pods.forgejo]
short = "Forgejo CI"
title = "Forgejo (CI and releases)"
text = "Each part has its own repository: every push is built and tested, and a tag publishes a release with its SHA-256 checksum."

[text.en.pods.otro]
short = "Another server"
title = "A new physical server"
text = "Any Linux with systemd: paste one command and it installs itself (Java, user, agent and sign-up), checking the CA fingerprint first."

[text.en.pods.entrada]
short = "Gateway (Rust)"
title = "The gateway (Rust)"
text = "My own Minecraft proxy: encryption and Mojang login, player slots, and the splice that moves a player between servers with no loading screen."

[text.en.pods.voz]
short = "Voice"
title = "Voice chat"
text = "The UDP relay for proximity voice chat, in the same gateway: voice never touches the shards."

[text.en.pods.fw]
short = "Firewall"
title = "DMZ firewall"
text = "The gateway lives isolated in its own VLAN. If someone broke it, they could only reach the game ports, never the database or the rest of the house."

[text.en.pods.authelia]
short = "Authelia"
title = "Authelia (sign-in)"
text = "The panel has no users of its own: it goes through the home single sign-on and the controller records who did what."

[text.en.pods.panel]
short = "Panel"
title = "Admin panel"
text = "A Svelte web app: servers, shards, players, staff, slots, network-wide announcements, versions, live map and monitoring."

[text.en.pods.mando]
short = "Controller"
title = "The controller (Rust)"
text = "The brain: decides which server runs each piece of the world, stores the desired state, enrols machines with single-use tokens and rolls out versions."

[text.en.pods.postgres]
short = "PostgreSQL"
title = "PostgreSQL"
text = "Economy, homes, teams, punishments and the world split. Anything that gives or takes something is always checked here, in a single statement."

[text.en.pods.eu1]
short = "eu-1"
title = "Shard eu-1 (Folia)"
text = "A game server running my build of Folia: it owns some cells of the world. With players nearby, the whole area stays on one shard so bases and redstone are never split."

[text.en.pods.eu2]
short = "eu-2"
title = "Shard eu-2 (Folia)"
text = "Another piece of the same world. If eu-1 goes down, its cells move here and players keep playing."

[text.en.pods.coliseo]
short = "Colosseum"
title = "Colosseum (league)"
text = "A shard just for the league: duels with kits, elo, challenges and seasons, without loading the main world."

[text.en.pods.generador]
short = "Generator"
title = "Terrain generator (Rust)"
text = "Generates new terrain outside Folia, with the same seed and 99.3 % identical blocks. Folia only adds the structures on top."

[text.en.pods.almacen]
short = "World store"
title = "World store (Rust)"
text = "Stores chunks compressed with zstd and a dictionary (7.5 times smaller). Any shard can load any area."

[text.en.pods.agente]
short = "Agent"
title = "Agent (one per machine)"
text = "Starts, stops and updates the shards on its machine as the controller says, and sends it metrics every few seconds."

[text.en.pods.copias]
short = "Backups"
title = "Backups (PBS)"
text = "Daily encrypted backups of the container and the database, plus the weekly restore test for the whole homelab."

[text.en.pods.metricas]
short = "Metrics"
title = "Metrics"
text = "TPS, MSPT, memory, CPU, network and disk for every shard and machine, stored in the controller itself: 14 days of charts in the panel."

[text.en.flows.login]
title = "You join the server"
steps = [
  "You type the domain into Minecraft.",
  "DNS answers with an SRV record: which port to use.",
  "The router only lets that port through, and only to the DMZ.",
  "The DMZ firewall lets the gateway talk to just what it needs.",
  "The gateway encrypts the connection and asks your client to identify itself.",
  "Mojang confirms the account is yours and sends your skin.",
  "If the network is full (the slots set in the panel), you're told here.",
  "The controller knows which shard owns the area where you were.",
  "The gateway connects you to it.",
  "eu-1 loads your data from the database.",
  "You're playing.",
]

[text.en.flows.cross]
title = "You cross to another server with no loading screen"
steps = [
  "You walk towards an area owned by another shard.",
  "eu-1 sees you approaching the edge of its cell.",
  "The controller confirms who owns the next cell.",
  "Underneath, the gateway opens a connection to eu-2…",
  "…which already has you ready on the other side.",
  "eu-2 loads the terrain from the shared world store.",
  "The gateway switches the packet stream on the fly: a splice.",
  "You keep walking. You never saw a loading screen.",
]

[text.en.flows.chat]
title = "You talk to someone on another server"
steps = [
  "You type in chat.",
  "The gateway passes it to your shard.",
  "eu-1 filters it (swearing, spam, muted players) and shows it to players here.",
  "PostgreSQL fans it out with LISTEN/NOTIFY to the other shards.",
  "eu-2 renders it as if it were its own.",
  "It arrives as a system message: no “cannot be verified” warning.",
  "Your friend reads it, even on another server.",
]

[text.en.flows.install]
title = "I add a physical server with one command"
steps = [
  "I open the panel from home.",
  "Authelia checks it's me.",
  "In “Servers” I name the new server.",
  "The controller creates a single-use, expiring token.",
  "The panel shows me the command, only once.",
  "I copy it…",
  "…and paste it as root on the new server.",
  "Before downloading anything, it checks the controller's CA fingerprint: nobody in the middle can swap the script.",
  "It installs Java, the user, the agent (checking its checksum) and the service.",
  "The agent signs up with the token and receives its certificate.",
  "It shows up in the panel: I give it services and shards.",
]

[text.en.flows.slots]
title = "I change the slots for the whole network"
steps = [
  "I want 300 players instead of 500.",
  "Through Authelia.",
  "In “Network” I change the slots and save.",
  "The controller logs it (who and when)…",
  "…and stores it in the database.",
  "On the next heartbeat it sends it to every agent.",
  "The agent hands it to the gateway on its machine.",
  "The server list shows the new maximum and, when full, the gateway lets nobody new in.",
  "Those already inside keep playing: nobody gets kicked.",
]

[text.en.flows.release]
title = "A new version ships"
steps = [
  "A tag in Forgejo builds, tests and publishes the release with its checksum.",
  "I pin the version in the panel: the controller downloads it and checks the checksum.",
  "The agents see their version is no longer the desired one.",
  "eu-1 warns in game, stops, updates and comes back…",
  "…and only when it's healthy does the next one go.",
  "eu-2 the same: one by one, never all at once.",
  "Meanwhile its players have moved to the shard that's still running.",
  "The colosseum goes last.",
  "The controller marks it done when all are running the new version.",
]

[text.en.flows.crash]
title = "A shard goes down"
steps = [
  "eu-2 hangs or runs out of memory.",
  "Its agent stops seeing it healthy and reports it.",
  "The controller sees cells with nobody running them.",
  "It reassigns them in the database, in one go and with no duplicates.",
  "It tells the remaining shards.",
  "eu-1 takes over eu-2's cells too.",
  "The gateway moves players to the shard that's still alive.",
  "You lose a few seconds, not your game. The agent restarts eu-2.",
]

[text.en.incidents.dns]
title = "“Failed to connect: disconnected”"
meta = "29-10-2026 · Blocking: the server showed up in the list, but nobody could join"
symptom = "From outside the server appeared in the list with its player count, but joining said “Failed to connect to the server: disconnected”. On the home network, with bots, everything worked."
options = [
  "The router was blocking the game port.",
  "The test accounts weren't original.",
  "The DMZ container resolved names with the home DNS first, which it can't reach: every lookup took 5 s and the Mojang check timed out.",
  "The gateway's certificate had expired.",
]
cause = "The new DMZ container inherited the home DNS as its first resolver. The DMZ can't reach it (by design), so every lookup waited 5 s before trying the next one. The server list doesn't ask Mojang, but joining does: it was too late and got cut off."
fix = "Public DNS for the DMZ container, in Terraform (not by hand), plus a note in the docs. The impersonation tests were rerun: before, they only “passed” because Mojang never answered."
lesson = "A test that passes for the wrong reason is worse than one that fails. Look at why it passes."

[text.en.incidents.chat]
title = "“Message cannot be verified”"
meta = "29-10-2026 · Medium: a warning in every player's chat"
symptom = "Minecraft warned that chat messages couldn't be verified, and some clients flagged them as unsafe."
options = [
  "Mojang's signing service was down.",
  "The shards run without online mode behind the gateway (which is what checks accounts) and can't verify signatures, so the client saw a server that doesn't enforce secure chat.",
  "The swear filter changed the text and broke the signature.",
]
cause = "Behind a proxy, game servers can't check chat signatures: the gateway is what verifies the account. The client saw a server without secure chat and warned about it."
fix = "The gateway tells the client, in the login packet, that the server is online and enforces secure chat, and the shards send chat as system messages (unsigned), like chat coming from other shards."
lesson = "The client only knows what the server tells it: with a proxy in the middle, it has to tell it right."

[text.en.incidents.lock]
title = "Selling a diamond took 3 seconds"
meta = "27-10-2026 · High: with 10 players selling at once"
symptom = "With ten players selling at once, the median sale took 2.8 s and some nearly 5. The database was barely working."
options = [
  "Each sale held the material's price lock across several database round trips; the others queued behind it.",
  "An index was missing on the sales table.",
  "The game server was slow because of mobs.",
]
cause = "A sale opened a transaction, locked the material's price (so nobody over- or under-sells) and made several 80 ms round trips before COMMIT. Ten sales at once = ten in a queue."
fix = "The whole sale in a single SQL statement with the COMMIT in the same send: the lock lasts one round trip instead of five. From 2,768 ms to 852 median, and nobody over- or under-sells."
lesson = "With a distant database, queries aren't the cost: round trips are, especially with a lock held."

[text.en.incidents.oom]
title = "The shard that took 40 minutes to die"
meta = "22-10-2026 · High: a shard hung mid-test"
symptom = "With 100 bots exploring new terrain, a shard ran out of memory and took 40 minutes to shut down."
options = [
  "A memory leak in the plugin.",
  "Too many bots for the machine.",
  "Every player could request new terrain without limit: generating it was the bottleneck and requests piled up in memory.",
]
cause = "Generating new chunks is the most expensive thing in Minecraft. With no per-player limit, a hundred explorers filled the generation queue faster than it drained."
fix = "A per-player generation limit (−20 % CPU, no bots kicked) and then my own Rust generator with the same seed: 2.35 times faster than Folia alone on the same machine."
lesson = "Before adding memory, find out what's piling up and why."

[text.en.incidents.menus]
title = "Slow menus with a 1 ms query"
meta = "23-10-2026 · Medium: every menu took 115-270 ms to open"
symptom = "Opening menus that read from the database (homes, profile…) took up to 270 ms, even though the query took under 1.5 ms."
options = [
  "PostgreSQL was misconfigured.",
  "The time went into getting back to the player's thread: in Folia, the answer has to wait for the next tick of its region.",
  "The menus had too many items.",
]
cause = "In Folia each region has its own thread. The query ran on another thread and the answer had to wait its turn on the player's region thread."
fix = "What is only displayed (homes, display caches) lives in memory; anything that gives or takes is still checked in the database. From 115-270 ms to 17-19."
lesson = "Measure where the time really goes: the query was the one thing that didn't need optimising."

[text.en.bench]
title = "Before and after, measured"
intro = "Every change is measured against the previous version with the same test (bots doing everything for 6 minutes) and only stays if it improves things without breaking anything. Some numbers come from the far test zone, 80 ms from the database: that's where round trips hurt most."
before = "before"
after = "after"
note = "Data from the project's results wiki (p50 unless stated). Tests ran with two zones to prove everything works across continents; production has just one."
groups = [
  ["db", "Database"],
  ["tick", "Game server"],
  ["world", "World, network and disk"],
]

[text.en.bench.rows.pay]
label = "/pay (pay someone)"
why = "Five database round trips (look up the name, transaction, notices) merged into one statement."

[text.en.bench.rows.sethome]
label = "/sethome (save a home)"
why = "Lock, count, insert, read and COMMIT: five round trips, now one."

[text.en.bench.rows.perfil]
label = "/profile"
why = "Profile and balances in one query with subqueries instead of four."

[text.en.bench.rows.venta]
label = "Selling with 10 at once"
why = "The whole sale and its COMMIT in one send: the price lock lasts one round trip."

[text.en.bench.rows.msg]
label = "/msg on the same server"
why = "If the other player is on the same shard, the message skips the database."

[text.en.bench.rows.tps]
label = "TPS with 100 bots"
why = "Folia used a single region thread on 12 cores: now they're spread out."

[text.en.bench.rows.mspt]
label = "MSPT with 100 bots"
why = "Same change: fewer milliseconds per tick and no global-region stall."

[text.en.bench.rows.mobs]
label = "TPS at night with 40 players"
why = "AI activation ranges, spawning every N ticks and cheaper collisions."

[text.en.bench.rows.menus]
label = "Opening a database-backed menu"
why = "Display-only data in memory; anything that gives or takes, in the database."

[text.en.bench.rows.generar]
label = "Generating new terrain"
why = "Terrain comes from a Rust service; Folia only adds the structures."

[text.en.bench.rows.zstd]
label = "World compression"
why = "zstd with a dictionary trained on real chunks (the End went from 17× to 25×)."

[text.en.bench.rows.entrada]
label = "Gateway CPU with 100 bots"
why = "A cache of already-compressed chunks: 93 % hits with 42 MB."

[text.en.bench.rows.disco]
label = "/pay p95 after a disk move"
why = "The test database moved from the system RAID 1 to the SAS RAID 10."

