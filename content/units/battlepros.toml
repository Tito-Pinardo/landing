# Unidad 1U del rack: BattlePros, una red de Minecraft hecha a medida.
#
# Fuente: la wiki de resultados del proyecto (cada medida contra la línea
# base, con su porqué) y su documentación. Sin direcciones, puertos ni
# nombres internos: solo qué hace cada pieza.

id = "battlepros"
project = "battlepros"
status = "live"
host_tech = ["proxmox", "lxc", "linux"]
links = [
  ["player", "dns"],
  ["friend", "dns"],
  ["dns", "router"],
  ["router", "entrada"],
  ["entrada", "mojang"],
  ["admin", "authelia"],
  ["forgejo", "mando"],
  ["otro", "mando"],
]

