[text.es.incidents.node20]
title = "«markAsUncloneable is not a function»"
meta = "15-09-2026 · despliegue"
symptom = "La versión de Homepage elegida no arrancaba: un error de JavaScript que no decía nada del panel."
options = [
  "Faltaba compilar la aplicación",
  "La configuración tenía un error",
  "El Node.js del sistema era demasiado antiguo para esa versión de Next.js",
  "Faltaba memoria",
]
cause = "Esa versión de Homepage usa un Next.js que exige Node 22, y la distribución solo trae Node 20. El error salía de dentro de Node, no de Homepage."
fix = "Instalar Node 22 desde el repositorio oficial de NodeSource y asegurarse de que la tarea sustituye la versión previa, que ya estaba instalada de un intento anterior."
lesson = "Leer de quién es el error antes de buscarlo: este venía del motor, no de la aplicación. Y un intento previo deja restos que la segunda ejecución tiene que limpiar."

[text.es.incidents.host]
title = "«Host validation failed» a todo"
meta = "15-09-2026 · arranque"
symptom = "Ya arrancaba, pero respondía 400 «Host validation failed» a cualquier petición, desde cualquier sitio."
options = [
  "Homepage rechaza los nombres que no estén en su lista de hosts permitidos",
  "El certificado no era válido",
  "La puerta interna cambiaba la cabecera",
  "El cortafuegos cortaba la respuesta",
]
cause = "Es una protección propia de Homepage: si el nombre con el que se le llama no está en su lista, rechaza la petición."
fix = "Declarar los nombres permitidos en el servicio de systemd, generados también por Ansible."
lesson = "Las protecciones por defecto se agradecen, pero hay que saber que existen. La documentación oficial estaba antes que el foro."

[text.es.incidents.stale]
title = "El título viejo no se iba"
meta = "26-09-2026 · aspecto"
symptom = "Cambié título, idioma y orden. Ansible aplicó todo y reinició el servicio, pero el navegador seguía enseñando el título anterior."
options = [
  "La caché del navegador",
  "La puerta interna guardaba la página",
  "Ansible no había copiado las plantillas",
  "La página estática se genera una vez y reiniciar no la regenera",
]
cause = "Next.js genera parte del HTML una vez y lo sirve hecho. Reiniciar el servicio no lo vuelve a generar."
fix = "El rol llama a la ruta de regeneración tras reiniciar, con reintentos hasta que responde."
lesson = "«Aplicado sin errores» no es «se ve bien». Hay que mirar el resultado en el navegador."

