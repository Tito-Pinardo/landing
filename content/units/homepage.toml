[text.en.incidents.node20]
title = "«markAsUncloneable is not a function»"
meta = "15-09-2026 · deploy"
symptom = "The chosen Homepage version wouldn't start: a JavaScript error that said nothing about the dashboard."
options = [
  "The app hadn't been built",
  "The configuration had an error",
  "The system's Node.js was too old for that Next.js version",
  "Not enough memory",
]
cause = "That Homepage version uses a Next.js that requires Node 22, and the distribution only ships Node 20. The error came from inside Node, not Homepage."
fix = "Install Node 22 from the official NodeSource repo and make sure the task replaces the previous version, already installed by an earlier attempt."
lesson = "Read whose error it is before chasing it: this one came from the engine, not the app. And an earlier attempt leaves leftovers the second run has to clean up."

[text.en.incidents.host]
title = "«Host validation failed» for everything"
meta = "15-09-2026 · start-up"
symptom = "It now started, but answered 400 «Host validation failed» to every request, from anywhere."
options = [
  "Homepage rejects names that aren't on its allowed-hosts list",
  "The certificate wasn't valid",
  "The internal door changed the header",
  "The firewall cut the response",
]
cause = "It's Homepage's own protection: if the name it's called by isn't on its list, it rejects the request."
fix = "Declare the allowed names in the systemd service, also generated by Ansible."
lesson = "Default protections are welcome, but you have to know they exist. The official docs came before the forum."

[text.en.incidents.stale]
title = "The old title wouldn't go"
meta = "26-09-2026 · look"
symptom = "I changed title, language and order. Ansible applied everything and restarted the service, but the browser still showed the old title."
options = [
  "The browser cache",
  "The internal door was caching the page",
  "Ansible hadn't copied the templates",
  "The static page is generated once and restarting doesn't regenerate it",
]
cause = "Next.js generates part of the HTML once and serves it ready-made. Restarting the service doesn't generate it again."
fix = "The role calls the regeneration route after restarting, with retries until it answers."
lesson = "«Applied without errors» isn't «looks right». You have to look at the result in the browser."

