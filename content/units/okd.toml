[[text.en.decisions]]
title = "Which topology"
choice = "Compact: three nodes doing everything"
why = "With three VMs you get a control plane with quorum and room for workloads. More nodes won't fit on these disks."

[[text.en.decisions]]
title = "Which version"
choice = "The previous stable one, not the latest"
why = "The latest had a boot bug in its ISO. To learn OpenShift, the version that works beats the newest one."

[[text.en.decisions]]
title = "How the VMs are created"
choice = "With Terraform, like everything else"
why = "So the whole cluster can be destroyed and recreated with no manual steps, and RAM or boot order change with a commit."

[text.en.tech_notes]
openshift = "OKD installed with the Agent-Based Installer: ISO with network configuration, virtual addresses for API and applications, operators and routes."
kubernetes = "Under OpenShift: etcd, kubelet and the test app's resources."
terraform = "Creates the three VMs with their CPU, RAM, disks and boot order."
ansible = "Deploys the test application on the cluster."
