[text.en.incidents.iso]
title = "The VMs wouldn't boot the ISO"
meta = "14-09-2026 · install"
symptom = "The VMs always hung at the same point while loading the boot from the installer ISO."
options = [
  "The VMs were short of memory",
  "That specific version's ISO had a boot bug",
  "The hypervisor was misconfigured",
  "The ISO had downloaded corrupted",
]
cause = "It reproduced with 10 different configurations, including plain QEMU with no Proxmox and no KVM, while another small ISO booted fine. That version's ISO had a bug in its boot catalogue."
fix = "Use the installer's previous stable version, with the same configuration. It booted first time with host CPU."
lesson = "Before blaming something external, rule out your own side one variable at a time. And once all of that's ruled out, change version instead of trying more."

[text.en.incidents.overlay]
title = "«No space left on device» on a node with free disk"
meta = "14-09-2026 · install"
symptom = "After writing the system to all three disks, the install went silent. The API virtual address never came up."
options = [
  "The virtual disk was too small",
  "The image registry had failed",
  "The network between nodes was down",
  "The node was still in the install environment, whose temporary RAM file system had filled with images",
]
cause = "The coordinating node stays in the ISO environment until the end, keeping everything in a temporary RAM file system half the size of memory. With 16 GB that was 8 GB, and the downloaded images exceeded 17."
fix = "Raise the VMs to 32 GB of RAM with Terraform and reboot."
lesson = "Minimum requirements are for normal operation, not the install's peak. And on slow disks the peak lasts longer."

[text.en.incidents.etcd]
title = "etcd in a restart loop"
meta = "14-09-2026 · control plane"
symptom = "One etcd member had been unhealthy for over 37 minutes, and the rest of the control plane with it."
options = [
  "The etcd certificate was invalid",
  "The network between nodes was dropping packets",
  "Disk writes took up to 6.6 seconds, against the 200 ms etcd expects",
  "Not enough CPU",
]
cause = "etcd confirms each write on disk before carrying on. With every operator starting at once on spinning disks, the wait exceeded what it tolerates."
fix = "With a clear diagnosis, give it one more window before treating it as a hardware limit. It stabilised on its own and didn't restart again."
lesson = "Tell «broken» from «slow»: the logs said exactly what was slow and by how much. Waiting was a decision, not a hope."

[text.en.incidents.ostree]
title = "A node that wouldn't join"
meta = "14-09-2026 · nodes"
symptom = "Two nodes were ready, but the third wouldn't finish joining: its network wouldn't start and the Kubernetes service failed in a loop."
options = [
  "The system image swap took 5 minutes on a slow disk and systemd killed it just before it finished",
  "The node had another installer version",
  "Its disk was full",
  "DNS didn't resolve its name",
]
cause = "On reboot each node moves to the new system image. Copying the configuration took about 5 minutes, and that service's maximum stop time was exactly 5 minutes: it was discarded milliseconds before finishing."
fix = "Raise that time to 20 minutes and redo the image swap by hand with the exact same identifier. The node joined."
lesson = "Third time in a day a default timeout meant for SSD fell short. When something «hangs» on a slow disk, check the timeouts first."

