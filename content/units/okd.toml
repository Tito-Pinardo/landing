tagline = "To practise OpenShift for real: three control-plane nodes that also run workloads, installed with the Agent-Based Installer on VMs created by Terraform. Getting to 3 of 3 nodes ready and 33 of 33 healthy operators took a whole session of failures, almost all because of spinning disks."
grade = "3/3 nodes · 33/33 operators"
facts = [
  { label = "Why", value = "OpenShift is what many companies run on top of Kubernetes. Installing it yourself teaches what the installer does underneath." },
  { label = "How", value = "Terraform creates the VMs; the installer generates an ISO with each node's network configuration and the cluster assembles itself from there." },
  { label = "The challenge", value = "Everything is designed for SSD. On spinning disks, three times a default timeout fell short." },
]

