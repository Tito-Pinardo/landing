[text.en.meta]
title = "Inside the OKD cluster · Tito Pinardo Gutiérrez"
description = "A three-node OpenShift (OKD) cluster in the homelab, installed with the Agent-Based Installer on spinning disks: a broken ISO, an overlay that filled up, slow etcd and a five-minute timeout that killed the install."

[text.en.ui]
slot = "1U · OKD"
