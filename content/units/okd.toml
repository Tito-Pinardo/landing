[text.es.incidents.iso]
title = "Las VMs no arrancaban la ISO"
meta = "14-09-2026 · instalación"
symptom = "Las VMs se colgaban siempre en el mismo punto al cargar el arranque desde la ISO del instalador."
options = [
  "Faltaba memoria en las VMs",
  "La ISO de esa versión concreta tenía un fallo de arranque",
  "El hipervisor estaba mal configurado",
  "La ISO se había descargado corrupta",
]
cause = "Se reproducía con 10 configuraciones distintas, incluido QEMU puro sin Proxmox y sin KVM, mientras que otra ISO pequeña arrancaba sin problema. La ISO de esa versión tenía un fallo en su catálogo de arranque."
fix = "Usar la versión estable anterior del instalador, con la misma configuración. Arrancó a la primera con la CPU del host."
lesson = "Antes de culpar a algo de fuera hay que descartar lo propio, una variable cada vez. Y cuando todo lo propio está descartado, toca cambiar de versión, no seguir probando."

[text.es.incidents.overlay]
title = "«No space left on device» en un nodo con disco libre"
meta = "14-09-2026 · instalación"
symptom = "Tras escribir el sistema en los tres discos, la instalación se quedó en silencio. La dirección virtual de la API nunca llegó a levantarse."
options = [
  "El disco virtual era demasiado pequeño",
  "El registro de imágenes había fallado",
  "La red entre nodos estaba cortada",
  "El nodo seguía en el entorno de instalación, cuyo sistema temporal en RAM se había llenado de imágenes",
]
cause = "El nodo que coordina sigue en el entorno de la ISO hasta el final, y guarda todo en un sistema de ficheros temporal en RAM de la mitad de la memoria. Con 16 GB, eran 8 GB, y las imágenes descargadas pasaban de 17."
fix = "Subir las VMs a 32 GB de RAM con Terraform y reiniciar."
lesson = "Los requisitos mínimos son para el funcionamiento normal, no para el pico de la instalación. Y en discos lentos el pico dura más."

[text.es.incidents.etcd]
title = "etcd en bucle de reinicios"
meta = "14-09-2026 · plano de control"
symptom = "Un miembro de etcd llevaba más de 37 minutos sin estar sano, y con él el resto del plano de control."
options = [
  "El certificado de etcd era inválido",
  "La red entre nodos perdía paquetes",
  "Las escrituras en disco tardaban hasta 6,6 segundos, frente a los 200 ms que espera etcd",
  "Faltaba CPU",
]
cause = "etcd confirma cada escritura en disco antes de seguir. Con todos los operadores arrancando a la vez sobre discos mecánicos, la espera superaba lo que tolera."
fix = "Con el diagnóstico claro, darle una ventana más antes de tratarlo como límite de hardware. Se estabilizó solo y no volvió a reiniciarse."
lesson = "Saber distinguir «roto» de «lento»: los registros decían exactamente qué tardaba y cuánto. Esperar fue una decisión, no una esperanza."

[text.es.incidents.ostree]
title = "Un nodo que no se unía"
meta = "14-09-2026 · nodos"
symptom = "Dos nodos ya estaban listos, pero el tercero no terminaba de unirse: su red no arrancaba y el servicio de Kubernetes fallaba en bucle."
options = [
  "El cambio de imagen del sistema tardó 5 minutos en un disco lento y systemd lo mató justo antes de terminar",
  "El nodo tenía otra versión del instalador",
  "Su disco estaba lleno",
  "El DNS no resolvía su nombre",
]
cause = "Al reiniciar, cada nodo pasa a la imagen nueva del sistema. Copiar la configuración tardó unos 5 minutos, y el tiempo máximo de parada de ese servicio era exactamente 5 minutos: se descartó a milisegundos de terminar."
fix = "Ampliar ese tiempo a 20 minutos y rehacer el cambio de imagen a mano con el mismo identificador exacto. El nodo se unió."
lesson = "Tercera vez en un día que un tiempo por defecto pensado para SSD se quedaba corto. Ante algo «colgado» en disco lento, mirar primero los timeouts."

