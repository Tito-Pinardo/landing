[[text.es.decisions]]
title = "Qué topología"
choice = "Compacta: tres nodos que hacen de todo"
why = "Con tres VMs se tiene un plano de control con quórum y sitio para cargas. Más nodos no caben con estos discos."

[[text.es.decisions]]
title = "Qué versión"
choice = "La estable anterior, no la última"
why = "La última tenía un fallo de arranque en su ISO. Para aprender OpenShift, la versión que funciona vale más que la más nueva."

[[text.es.decisions]]
title = "Cómo se crean las VMs"
choice = "Con Terraform, como el resto"
why = "Para poder destruir y volver a crear el clúster entero sin pasos manuales, y para que la RAM o el orden de arranque cambien con un commit."

[text.es.tech_notes]
openshift = "OKD instalado con el Agent-Based Installer: ISO con la configuración de red, direcciones virtuales para la API y las aplicaciones, operadores y routes."
kubernetes = "Debajo de OpenShift: etcd, kubelet y los recursos de la aplicación de prueba."
terraform = "Crea las tres VMs con su CPU, RAM, discos y orden de arranque."
ansible = "Despliega la aplicación de prueba en el clúster."
proxmox = "Las tres VMs del clúster, sobre los discos del servidor."
dns = "Una zona propia del laboratorio en el DNS de casa para la API y las aplicaciones."

[text.es.close]
lessons = [
  "Descartar lo propio, variable a variable, antes de culpar a lo de fuera.",
  "En discos lentos, los timeouts por defecto son el primer sospechoso.",
  "Distinguir «roto» de «lento» leyendo los registros.",
]
next = [
  "Corregir un nodo que quedó degradado tras el arreglo manual de su imagen.",
  "Discos SSD para etcd: es lo único que lo arregla de raíz.",
]

