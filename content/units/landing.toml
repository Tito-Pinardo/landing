[text.es.incidents.anonymous]
title = "«Peer authentication failed for user anonymous»"
meta = "04-10-2026 · primer despliegue"
symptom = "El primer arranque en el contenedor falló: PostgreSQL rechazaba al usuario «anonymous». Al corregirlo, apareció «empty host»."
options = [
  "Faltaba crear la base de datos",
  "El cortafuegos bloqueaba el socket",
  "La librería no toma el usuario del sistema ni acepta un host vacío",
  "La contraseña estaba mal",
]
cause = "Con autenticación del sistema por socket no hay contraseña, pero la librería de base de datos necesita el usuario escrito en la URL y un host nominal: no lo deduce."
fix = "La URL de conexión lleva el usuario explícito y «localhost» como host nominal, con la ruta del socket aparte."
lesson = "Quitar la contraseña es más seguro, pero cambia lo que la librería necesita. Leer el error dos veces: el segundo decía exactamente qué faltaba."

[text.es.incidents.firefox]
title = "«En Firefox el laboratorio está roto»"
meta = "04-10-2026 · navegador"
symptom = "En Firefox el laboratorio se veía como una lista de desplegables y tarjetas, sin mapa. En otros navegadores, bien."
options = [
  "Firefox no soportaba el SVG del mapa",
  "Era la vista rápida, guardada en el navegador para siempre",
  "La CSP bloqueaba el JavaScript en Firefox",
  "Una extensión ocultaba el mapa",
]
cause = "En ese navegador se había activado alguna vez la vista rápida, que enseña lo esencial sin animaciones. Se guardaba sin caducidad y la web parecía rota."
fix = "La vista rápida caduca a los 30 minutos y, mientras está activa, el laboratorio dice que está en vista rápida y ofrece un botón para salir."
lesson = "Lo que se recuerda por el visitante tiene que caducar o verse. Un estado invisible que dura para siempre parece un fallo."

[text.es.incidents.raid]
title = "Despliegues que no llegaban"
meta = "05-10-2026 · operación"
symptom = "Los despliegues daban «inalcanzable» a mitad de camino y las pruebas de base de datos fallaban por tiempo, sin haber cambiado nada."
options = [
  "El contenedor se había quedado sin memoria",
  "Ansible tenía una versión incompatible",
  "Cloudflare cortaba las conexiones largas",
  "La comprobación mensual del RAID saturaba los discos del servidor",
]
cause = "El primer domingo de mes, el RAID del sistema se comprueba entero durante unas 5 horas. Con los discos al límite, un checkpoint de PostgreSQL llegó a tardar 1.190 segundos."
fix = "Desplegar con los mismos pasos del rol por separado (copiar, comprobar, reiniciar, healthz), validar la suite completa en la integración continua y relanzar el playbook entero al terminar: sin cambios pendientes."
lesson = "Saber qué tareas programadas tiene el servidor antes de culpar al código. Y que la comprobación de calidad no dependa de una sola máquina."

[text.es.incidents.history]
title = "Un repositorio que había que publicar"
meta = "04-10-2026 · seguridad"
symptom = "El código iba a ser público, pero su historial se había escrito pensando en un repositorio privado."
options = [
  "Reescribir el historial antes de publicar y auditar un clon limpio tras cada push",
  "Publicar solo el último commit",
  "Hacer el repositorio público y borrar lo sensible después",
  "Publicar un repositorio aparte copiado a mano",
]
cause = "Un historial de Git guarda todo lo que alguna vez estuvo, aunque ya no esté: notas de planificación, nombres internos o configuraciones."
fix = "Historial reescrito y saneado antes del primer push, un hook local que bloquea secretos, direcciones internas y nombres concretos, y la auditoría de un clon limpio después de cada push."
lesson = "Borrar algo en un commit nuevo no lo borra de la historia. Lo que se publica se revisa antes, y se vuelve a revisar desde fuera."

[[text.es.timeline]]
title = "Plan y contenido"
period = "04-10-2026"
items = [
  "Decisiones: Rust y Axum, PostgreSQL bien hecho aunque el tráfico no lo pida, contacto guardado y avisado a Matrix.",
  "El contenido sacado de mi documentación y saneado: nada de direcciones ni nombres internos.",
]

[[text.es.timeline]]
title = "El servidor y su contenedor"
period = "04-10-2026"
items = [
  "Binario con todo dentro y páginas renderizadas al arrancar.",
  "Contenedor propio con el cortafuegos más estricto y PostgreSQL solo por socket.",
  "Publicada otra vez, tras retirarla de internet el 26-09 por seguridad.",
]

[[text.es.timeline]]
title = "El laboratorio y el juego"
period = "Octubre de 2026"
items = [
  "Hermes como guía guionizado, mapa del servidor con recorridos animados, modo detective y terminal.",
  "Estado en vivo de cada pieza y aspecto de rack de servidores con enanitos.",
  "Unidades del rack: una página por pieza para verla por dentro, con sonido de sala de servidores.",
]

[[text.es.decisions]]
title = "Cómo se sirven las páginas"
choice = "Renderizadas una vez al arrancar"
why = "El contenido no cambia mientras el binario corre: renderizarlo en cada visita sería trabajo repetido. Desde memoria y con ETag, casi ninguna visita llega a gastar nada."

[[text.es.decisions]]
title = "Qué pasa si falla el aviso"
choice = "Guardar primero, avisar después"
why = "El mensaje es lo importante, el aviso no. Con una bandeja de salida, que Matrix no responda nunca hace perder un mensaje."

[[text.es.decisions]]
title = "Qué guarda de quien escribe"
choice = "Un hash de la IP, nunca la IP"
why = "Para limitar envíos basta con saber si dos peticiones vienen del mismo sitio. Con un hash con sal secreta se puede comparar sin poder volver a la IP."

[[text.es.decisions]]
title = "JavaScript"
choice = "Mejora progresiva, sin librerías"
why = "Todo se lee sin JavaScript y la CSP prohíbe cualquier script en línea. El mapa, la terminal, los logros y el sonido son una capa encima."

[text.es.tech_notes]
rust = "El servidor entero: Axum, plantillas askama compiladas, contenido validado al arrancar, cabeceras de seguridad y el trabajo que reintenta los avisos."
postgresql = "Mensajes y avisos pendientes, consultas comprobadas en compilación con sqlx, bloqueo de filas sin esperas para los reintentos y acceso solo por socket."
traefik = "La única entrada: certificado, cabeceras y una ruta generada desde la lista de servicios."
terraform = "Crea el contenedor de la web, sus recursos y su cortafuegos."
ansible = "El rol que instala PostgreSQL, despliega el binario, comprueba el contenido y espera al healthz."
git = "Repositorio público con historial saneado y un hook que bloquea secretos antes de cada push."
gitlab-ci = "GitHub Actions: formato, clippy y todas las pruebas contra un PostgreSQL de verdad en cada push."

[text.es.close]
lessons = [
  "Un binario con todo dentro es fácil de desplegar, de revertir y de razonar.",
  "Validar el contenido al arrancar convierte una errata en un despliegue que no ocurre, no en una página rota.",
  "Lo que es público se audita desde fuera, después de publicarlo.",
]
next = [
  "Cachear el HTML en Cloudflare con una regla propia.",
  "Activar el captcha del formulario si algún día aparecen bots.",
]

