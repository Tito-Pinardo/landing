[text.es.pods.postgres]
short = "PostgreSQL"
title = "PostgreSQL"
text = "Guarda los mensajes y los avisos pendientes. Las consultas se comprueban contra el esquema al compilar."

[text.es.pods.socket]
short = "Solo socket"
