deploy = "How it reaches production"

[text.en.pods.visitor]
short = "You"
title = "You"
text = "What you're reading right now."

[text.en.pods.cloudflare]
short = "Cloudflare"
title = "Cloudflare"
text = "In front of the domain: hides my home IP and filters."

[text.en.pods.traefik]
short = "Traefik"
title = "Traefik"
text = "The public door. It's the only thing allowed to talk to the site's container."

[text.en.pods.phone]
short = "My phone"
title = "My phone"
text = "Where the contact form messages reach me."

[text.en.pods.github]
short = "GitHub"
title = "GitHub repository"
text = "The code is public. Before every push, a hook looks for secrets, internal addresses and names that mustn't leave."

[text.en.pods.ci]
short = "GitHub Actions"
title = "Continuous integration"
text = "On every push: formatting, clippy with no warnings and every test against a real PostgreSQL."

[text.en.pods.matrix]
short = "Matrix"
title = "My Matrix server"
text = "The room where new-message notices arrive, with a bot of its own that can only write there."

[text.en.pods.axum]
short = "Axum"
title = "Axum server"
text = "Gets the request, finds the already rendered page and answers. If the browser already has it, it answers 304 with no body."

[text.en.pods.pages]
short = "Pages in RAM"
title = "Pre-rendered pages"
text = "Compiled templates filled in once at start-up, in both languages, each with its ETag."

[text.en.pods.security]
short = "Headers"
title = "Security headers"
text = "A strict CSP with nothing inline, HSTS and the rest. That's why JavaScript only enhances the page: everything works without it."

[text.en.pods.content]
short = "TOML content"
title = "Content in TOML"
text = "Texts, projects, lab parts and these units live in TOML files validated at start-up. A key missing in one language stops the deploy."

[text.en.pods.form]
short = "Contact form"
title = "Contact form"
text = "Validates the fields, has a honeypot field for bots and an optional captcha."

[text.en.pods.limits]
short = "Limits"
title = "Sending limits"
text = "Per IP and global, worked out with a single indexed query. The IP is never stored: only a hash with a secret salt."

[text.en.pods.outbox]
short = "Outbox"
title = "Outbox"
text = "The message is saved first and the notice is left pending. A job retries it until Matrix confirms with an event ID."

[text.en.pods.notify]
short = "Notice"
title = "Matrix notice"
text = "Sends the notice to the room with the site's own bot. Several workers don't step on each other: each takes a different row."

[text.en.pods.postgres]
short = "PostgreSQL"
title = "PostgreSQL"
text = "Stores messages and pending notices. Queries are checked against the schema at compile time."

[text.en.pods.socket]
short = "Socket only"
title = "No network"
text = "PostgreSQL listens on no interface: only on the local socket with OS authentication, no password to steal."

[text.en.pods.status]
short = "Live status"
title = "Homelab status"
text = "Every 5 minutes the hypervisor drops a summary: services running, availability and the LED for each map part. Aggregates only."

[text.en.pods.browser]
short = "Your browser"
title = "Your browser"
text = "Keeps your achievements, where you were and whether you want sound. None of it leaves your browser."

[text.en.pods.terraform]
short = "Terraform"
title = "Terraform"
text = "Creates the container with its resources, network and firewall: the only one with a «drop» inbound policy."

[text.en.pods.ansible]
short = "Ansible"
title = "Ansible"
text = "Installs PostgreSQL, the binary and its service, with secrets encrypted in the vault."

[text.en.pods.check]
short = "landing check"
title = "Check before restarting"
text = "The role runs «landing check» with the new binary: if the content isn't valid, nothing is restarted."

[text.en.pods.systemd]
short = "systemd"
title = "Hardened service"
text = "Read-only file system, no capabilities, a syscall filter, capped memory. After restarting, it waits for /healthz to say «ok»."

[text.en.flows.visit]
title = "Your visit"
steps = [
  "You open the site.",
  "Cloudflare gets it first.",
  "Traefik adds the certificate and passes it to the site's container.",
  "Axum gets the request. Nothing to look up: the page is already made.",
  "The security headers are added.",
  "Out goes the page in your language, rendered at start-up. If you already had it, a 304 and done.",
  "Your browser draws it and the JavaScript adds the map, the terminal, the achievements and the sound.",
  "And you're reading it.",
]

[text.en.flows.message]
title = "You write to me through the form"
steps = [
  "You fill in the form and send it.",
  "It comes in through Traefik, like everything.",
  "The fields are validated. If the honeypot field is filled in, it was a bot.",
  "Limits are checked: per IP (stored only as a hash) and global.",
  "The message is saved in PostgreSQL. From here on it isn't lost.",
  "A pending notice sits in the outbox.",
  "A job picks up the notice and sends it to Matrix.",
  "Matrix confirms with an event ID and the notice is marked delivered.",
  "It reaches my phone.",
]

[text.en.flows.retry]
title = "Matrix doesn't answer"
steps = [
  "There's a pending notice.",
  "It tries to send it, but Matrix doesn't reply.",
  "The notice stays in the outbox, with its attempt counted. The message is already saved.",
  "A while later it's retried. With several workers, each locks a different row and nobody sends twice.",
  "Matrix answers and confirms: delivered.",
]

[text.en.flows.release]
title = "I ship a version"
steps = [
  "I push. First, a local hook looks for secrets and internal names.",
  "Continuous integration runs formatting, clippy and every test.",
  "With everything green, I build the release.",
  "Ansible copies the new binary to the container.",
  "Before restarting, it runs «landing check»: it validates the content in both languages.",
  "It restarts the service and waits for /healthz to say «ok», which also checks the database.",
  "The new version is serving.",
]

[text.en.flows.build]
title = "I build the container from scratch"
steps = [
  "Terraform creates the container with its firewall: admin SSH and whatever comes from Traefik get in. Nothing else.",
  "Ansible installs and configures PostgreSQL.",
  "PostgreSQL not listening on the network.",
  "The site connects through the local socket, with OS authentication.",
  "Ansible creates the hardened service and starts it.",
]

[text.en.flows.live]
title = "The map's LEDs"
steps = [
  "Every 5 minutes a homelab status summary arrives. If it's over 15 minutes old it isn't even published.",
  "The site reads it and serves it as a small JSON.",
  "The home page asks for it on load.",
  "And your browser lights each part's LED. If the data is over 2 hours old, it's hidden.",
]

[text.en.incidents.anonymous]
title = "«Peer authentication failed for user anonymous»"
meta = "04-10-2026 · first deploy"
symptom = "The first start in the container failed: PostgreSQL rejected the user «anonymous». Fixing that brought up «empty host»."
options = [
  "The database hadn't been created",
  "The firewall was blocking the socket",
  "The library doesn't take the OS user or accept an empty host",
  "The password was wrong",
]
cause = "With OS authentication over a socket there's no password, but the database library needs the user written in the URL and a nominal host: it doesn't work them out."
fix = "The connection URL carries the explicit user and «localhost» as a nominal host, with the socket path separate."
lesson = "Dropping the password is safer, but it changes what the library needs. Read the error twice: the second one said exactly what was missing."

[text.en.incidents.firefox]
title = "«In Firefox the lab is broken»"
meta = "04-10-2026 · browser"
symptom = "In Firefox the lab showed up as a list of drop-downs and cards, with no map. In other browsers, fine."
options = [
  "Firefox didn't support the map's SVG",
  "It was the quick view, stored in the browser forever",
  "The CSP was blocking JavaScript in Firefox",
  "An extension was hiding the map",
]
cause = "Quick view, which shows the essentials without animations, had been switched on in that browser at some point. It was stored with no expiry and the site looked broken."
fix = "Quick view expires after 30 minutes and, while on, the lab says it's in quick view and offers a button to leave."
lesson = "Whatever is remembered for the visitor must expire or be visible. An invisible state that lasts forever looks like a bug."

[text.en.incidents.raid]
title = "Deploys that didn't get through"
meta = "05-10-2026 · operations"
symptom = "Deploys reported «unreachable» halfway and the database tests timed out, with nothing changed."
options = [
  "The container had run out of memory",
  "Ansible had an incompatible version",
  "Cloudflare was cutting long connections",
  "The monthly RAID check was saturating the server's disks",
]
cause = "On the first Sunday of the month the system RAID is checked end to end for about 5 hours. With the disks maxed out, a PostgreSQL checkpoint took 1,190 seconds."
fix = "Deploy with the role's same steps separately (copy, check, restart, healthz), validate the full suite in CI and rerun the whole playbook afterwards: nothing pending."
lesson = "Know which scheduled jobs the server runs before blaming the code. And don't let the quality check depend on a single machine."

[text.en.incidents.history]
title = "A repository that had to go public"
meta = "04-10-2026 · security"
symptom = "The code was going to be public, but its history had been written with a private repository in mind."
options = [
  "Rewrite the history before publishing and audit a clean clone after every push",
  "Publish only the last commit",
  "Make the repo public and delete the sensitive bits afterwards",
  "Publish a separate hand-copied repo",
]
cause = "A Git history keeps everything that was ever there, even if it's gone now: planning notes, internal names or configuration."
fix = "History rewritten and cleaned before the first push, a local hook blocking secrets, internal addresses and specific names, and an audit of a clean clone after every push."
lesson = "Deleting something in a new commit doesn't delete it from history. What gets published is reviewed beforehand, and reviewed again from outside."

