[text.es.hero]
kicker = "Unidad 1U · Proyecto personal en producción"
title = "Esta web"
tagline = "Un único binario de Rust que lleva dentro las plantillas, los estilos, los textos y hasta el CV. Renderiza todas las páginas una vez al arrancar y las sirve desde memoria. Lo único que escribe cualquiera, el formulario, se guarda en PostgreSQL antes de avisarme."
grade = "Código público · CI en verde"
facts = [
  { label = "Por qué Rust", value = "Un binario pequeño, sin entorno que instalar, que usa unos 12 MB de RAM y se comprueba en compilación: las plantillas, las consultas SQL y los textos de los dos idiomas." },
  { label = "Dónde vive", value = "En su propio contenedor sin Docker ni privilegios, el único del homelab que rechaza por defecto todo lo que entra. Solo Traefik puede hablar con él." },
  { label = "Qué hay detrás", value = "Terraform crea el contenedor, Ansible lo configura y despliega, y el binario se niega a arrancar si el contenido tiene una errata." },
]

