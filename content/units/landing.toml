[text.es.meta]
title = "Esta web por dentro · Tito Pinardo Gutiérrez"
description = "Cómo está hecha esta web: un binario de Rust que lo renderiza todo al arrancar, PostgreSQL solo por socket, un formulario con bandeja de salida hacia Matrix y un contenedor con el cortafuegos más estricto del homelab."

[text.es.ui]
slot = "1U · LANDING"
face_specs = "Rust · Axum · PostgreSQL · 12 MB de RAM"
state = "En producción"
map_silk = "WEB"
map_title = "Esta web por dentro"
map_intro = "Lo que estás leyendo ahora mismo sale de aquí. Elige un recorrido para ver qué pasa con tu visita o con un mensaje."
vm_title = "Contenedor de la web · Proxmox"
vm_specs = "sin Docker, sin privilegios"
outside = "Fuera"
