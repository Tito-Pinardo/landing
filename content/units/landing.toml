[[text.en.decisions]]
title = "How pages are served"
choice = "Rendered once at start-up"
why = "The content doesn't change while the binary runs: rendering it on every visit would be repeated work. From memory and with ETag, almost no visit costs anything."

[[text.en.decisions]]
title = "What if the notice fails"
choice = "Save first, notify later"
why = "The message is what matters, not the notice. With an outbox, Matrix not answering never loses a message."

[[text.en.decisions]]
title = "What it keeps about whoever writes"
choice = "A hash of the IP, never the IP"
why = "To limit sending it's enough to know whether two requests come from the same place. A hash with a secret salt can be compared without going back to the IP."

[[text.en.decisions]]
title = "JavaScript"
choice = "Progressive enhancement, no libraries"
why = "Everything reads without JavaScript and the CSP forbids any inline script. The map, terminal, achievements and sound are a layer on top."

[text.en.tech_notes]
rust = "The whole server: Axum, compiled askama templates, content validated at start-up, security headers and the job that retries notices."
postgresql = "Messages and pending notices, queries checked at compile time with sqlx, skip-locked row locking for retries and socket-only access."
traefik = "The only way in: certificate, headers and a route generated from the service list."
terraform = "Creates the site's container, its resources and its firewall."
ansible = "The role that installs PostgreSQL, deploys the binary, checks the content and waits for healthz."
git = "A public repo with cleaned history and a hook that blocks secrets before every push."
gitlab-ci = "GitHub Actions: formatting, clippy and every test against a real PostgreSQL on every push."

[text.en.close]
lessons = [
  "A binary with everything inside is easy to deploy, roll back and reason about.",
  "Validating content at start-up turns a typo into a deploy that doesn't happen, not a broken page.",
  "Whatever is public gets audited from outside, after publishing.",
]
