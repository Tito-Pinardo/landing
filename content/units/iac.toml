[text.en.groups]
control = "Control node"
terraform = "Terraform: what exists"
ansible = "Ansible: how it's configured"
fleet = "The fleet"

[text.en.pods.laptop]
short = "My laptop"
title = "My laptop"
text = "From home or the VPN, I open the terminals panel."

[text.en.pods.repo]
short = "Forgejo"
title = "Repository on Forgejo"
text = "All the infrastructure: Terraform, inventory, roles, playbooks, scripts and docs. Changes come in by PR with CI and their plan in view. It has its own unit."

[text.en.pods.backup]
short = "Backup"
title = "Backup repository"
text = "A hook pushes every commit to a second repository inside the house. It has its own unit."

[text.en.pods.public]
short = "Public copy"
title = "Cleaned public copy"
text = "The version I show, generated on every merge: a whitelist of files, documentation IPs, example domains and functions cut down to their description. It's only published if I approve it."

[text.en.pods.proxmoxapi]
short = "Proxmox API"
title = "Proxmox API"
text = "Terraform talks to it with a least-privilege token."

[text.en.pods.cloudflare]
short = "Cloudflare"
title = "Cloudflare DNS"
text = "Public records are created and deleted from the same service list."

[text.en.pods.codeman]
short = "Web terminals"
title = "Terminals panel"
text = "Each agent's real sessions, in tmux, visible from the browser behind the internal door."

[text.en.pods.agents]
short = "AI agents"
title = "AI agents"
text = "The ones I work with: they propose and run things, and I review. On subscriptions, never loose API keys."

[text.en.pods.hook]
short = "Hook"
title = "Git hook"
text = "After every commit, it pushes to both remotes in the background."

[text.en.pods.review]
short = "Review"
title = "Review"
text = "The step that never gets skipped: read the plan or the diff before applying."

[text.en.pods.tf]
short = "Terraform"
title = "Terraform"
text = "Containers and VMs, their CPU, memory, disks, network and firewall."

[text.en.pods.plan]
short = "plan"
title = "terraform plan"
text = "What would be created, changed or destroyed. If it says «destroy» on something with data, it stops."

[text.en.pods.state]
short = "State"
title = "Terraform state"
text = "What Terraform believes exists. It was moved between machines after checking the plan came out identical on both."

[text.en.pods.forcenew]
short = "ForceNew"
title = "Changes that recreate"
text = "Some fields can't be changed in place: changing them destroys and recreates the resource."

[text.en.pods.roles]
short = "Roles"
title = "Roles"
text = "One per service, reusable: packages, configuration, service and a final check."

[text.en.pods.vault]
short = "Secrets"
title = "Secrets"
text = "No more secret files: each group reads its own from OpenBao in 15-minute tokens, and the repository only has their names. The public one, not even that: examples."

[text.en.pods.diff]
short = "--check --diff"
title = "Dry run with diff"
text = "Which files would change and how, without changing anything."

[text.en.pods.services]
short = "Service list"
title = "Service list"
text = "A single list for Traefik routes, Cloudflare DNS and the start page."

[text.en.pods.lxc]
short = "Containers"
title = "LXC containers"
text = "One container per service, almost all unprivileged."

[text.en.pods.hardening]
short = "Hardening"
title = "Hardening role"
text = "Key-only SSH from specific sources, spare services removed and monitoring agents installed."

[text.en.pods.updates]
short = "Update"
title = "Updates"
text = "Packages across the fleet, on their own every Wednesday before dawn; Docker images and the rest, with a button in Forgejo. Nothing restarts on its own."

[text.en.pods.storage]
short = "ZFS"
title = "Data kept apart"
text = "Data lives on ZFS and is mounted into the container. Roles manage configuration, not data."

[text.en.flows.newservice]
title = "A service is born"
steps = [
  "From my laptop I open the terminals panel.",
  "I reach the control node's session.",
  "With an agent, I write the Terraform file for the new container.",
  "Terraform works out the change.",
  "The plan says: 1 to add, 0 to destroy.",
  "I read it. If something unexpected shows up, I stop.",
  "Terraform applies.",
  "Through the Proxmox API.",
  "And the container exists.",
  "I write the service's role.",
  "Its secrets, into OpenBao; in the repository, only their names.",
  "Dry run: which files would change.",
  "I review it.",
  "I apply the role.",
  "Hardening and monitoring, the same as everywhere else.",
  "I add the service to the common list.",
  "And its DNS is created only if it's public.",
  "Commit.",
  "To Forgejo, where CI runs.",
  "And to the backup, in the background.",
]

[text.en.flows.update]
title = "I update the fleet"
steps = [
  "Every Wednesday before dawn, packages update on their own; for the rest, a button in Forgejo: what (packages, containers or everything) and on which machines.",
  "First, a simulation per machine.",
  "Kernel, driver or critical-service changes are rejected.",
  "It's applied machine by machine.",
  "Each container has to come back healthy before moving to the next.",
  "The monitoring agents confirm it, and the summary reaches my phone: what changed and which machines want a restart. That's my call.",
]

[text.en.flows.danger]
title = "A plan that would have deleted data"
steps = [
  "I centralise SSH keys into a single list for every container.",
  "The plan comes out: 4 to add, 4 to destroy.",
  "That field can't be changed in place: it would recreate the containers.",
  "Among them, messaging with its whole database and the public door.",
  "Not applied. The keys are added by hand to existing ones and the list applies to new ones.",
]

[text.en.flows.public]
title = "The public copy, automatic but reviewed"
steps = [
  "Every merge generates the copy: only files on a whitelist; IPs, domains, emails and keys swapped for examples; secrets reduced to their names with no value; functions cut down to their signature and description.",
  "A leak check goes through all of it and stops any real data; also in every PR's CI. If it passes, I get a link to what would change and review it.",
  "With my approval it's published to GitHub, only if it's exactly what I reviewed and without rewriting its history.",
]

[text.en.flows.rebuild]
title = "Rebuilding a service"
steps = [
  "A container breaks beyond repair.",
  "Terraform creates it again.",
  "Just as it was.",
  "Its storage with the data is mounted.",
  "The role configures it.",
  "And the service is back. It used to be an afternoon of trial and error.",
]

[text.en.incidents.forcenew]
title = "An innocent change that destroyed four containers"
meta = "16-09-2026 · Terraform"
symptom = "I wanted to add my laptop's SSH key to every container from a common list. The plan said «4 to add, 4 to destroy»."
options = [
  "The Terraform state was corrupted",
  "The Proxmox API had changed",
  "That field is one of those that force the resource to be recreated if it changes",
  "The list had a formatting error",
]
cause = "In the Proxmox provider, the container account's keys can't be changed in place: any change destroys and recreates it. It would have wiped the messaging database and taken down the public door."
fix = "Don't apply that plan. Add the keys by hand on existing containers; the common list applies to those created from now on."
lesson = "The plan is the brake. A «destroy» on something with data gets read twice, however innocent the change looks."

[text.en.incidents.rename]
title = "Renaming a resource"
meta = "September 2026 · Terraform"
symptom = "Giving a resource a clearer name in the code, the plan wanted to destroy the container and create an identical one."
options = [
  "To Terraform, a different name is a different resource: it has to be moved in the state",
  "The name had invalid characters",
  "A «terraform init» was missing",
  "The provider doesn't support renaming",
]
cause = "Terraform identifies each resource by its address in the code. If it changes, it thinks the old one is surplus and a new one is missing."
fix = "Move the resource in the state to its new name before applying. The plan then shows no changes."
lesson = "In Terraform, renaming isn't cosmetic. Move it in the state first, then check the plan is empty."

[text.en.incidents.quotes]
title = "Quotes breaking on the way"
meta = "16-09-2026 · scripts"
symptom = "A script registering containers in monitoring failed differently every time: truncated quotes, lost newlines."
options = [
  "The script had syntax errors",
  "The Python version didn't match",
  "The network was dropping the connection",
  "The code went through three shells (local, SSH and the container) and each reinterpreted the quotes",
]
cause = "To reach the container the code travelled through three shell layers, and each one reinterpreted quotes and newlines."
fix = "Always send the code in base64 and decode it on the other side before running it. The problem disappears at the root."
lesson = "When you patch case by case and it keeps failing, change the transport instead of escaping harder."

[text.en.incidents.diverged]
title = "The backups stopped getting commits"
meta = "09-10-2026 · Git"
symptom = "Commits went through fine, but both remotes hadn't received anything for a while. No visible error."
options = [
  "The SSH key had expired",
  "I rewrote an already pushed commit and the remotes silently rejected everything after",
  "The backup disk was full",
  "The hook had been deleted",
]
cause = "The hook pushes in the background, so its errors aren't seen. After fixing a commit that was already on the remotes, the histories diverged and every later push was rejected."
fix = "Check what each remote had and force-push with a lease (only if nobody pushed anything else meanwhile)."
lesson = "What runs in the background needs a visible check. After rewriting history, look at the remotes."

