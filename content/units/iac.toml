[text.es.incidents.forcenew]
title = "Un cambio inocente que destruía cuatro contenedores"
meta = "16-09-2026 · Terraform"
symptom = "Quería añadir la clave de SSH del portátil a todos los contenedores desde una lista común. El plan dijo «4 to add, 4 to destroy»."
options = [
  "El estado de Terraform estaba corrupto",
  "La API de Proxmox había cambiado",
  "Ese campo es de los que obligan a recrear el recurso si cambia",
  "La lista tenía un error de formato",
]
cause = "En el proveedor de Proxmox, las claves de la cuenta del contenedor no se pueden cambiar en sitio: cualquier cambio destruye y crea de nuevo. Habría borrado la base de datos de la mensajería y tumbado la puerta pública."
fix = "No aplicar ese plan. Añadir las claves a mano en los contenedores existentes; la lista común queda para los que se creen desde ahora."
lesson = "El plan es el freno. Un «destroy» en algo con datos se lee dos veces, aunque el cambio parezca inocente."

[text.es.incidents.rename]
title = "Renombrar un recurso"
meta = "Septiembre de 2026 · Terraform"
symptom = "Al poner un nombre más claro a un recurso en el código, el plan quiso destruir el contenedor y crear otro igual."
options = [
  "Para Terraform, otro nombre es otro recurso: hay que moverlo en el estado",
  "El nombre tenía caracteres no válidos",
  "Faltaba un «terraform init»",
  "El proveedor no admite renombrar",
]
cause = "Terraform identifica cada recurso por su dirección en el código. Si cambia, cree que el viejo sobra y que falta uno nuevo."
fix = "Mover el recurso en el estado a su nombre nuevo antes de aplicar. El plan pasa a no tener cambios."
lesson = "En Terraform, renombrar no es cosmético. Primero se mueve en el estado, después se comprueba que el plan está vacío."

[text.es.incidents.quotes]
title = "Comillas que se rompían por el camino"
meta = "16-09-2026 · scripts"
symptom = "Un script que registra contenedores en la monitorización fallaba de formas distintas cada vez: comillas cortadas, saltos de línea perdidos."
options = [
  "El script tenía errores de sintaxis",
  "La versión de Python no coincidía",
  "La red cortaba la conexión",
  "El código pasaba por tres shells (local, SSH y el contenedor) y cada una interpretaba las comillas",
]
cause = "Para llegar al contenedor el código viajaba por tres capas de shell, y cada una reinterpretaba comillas y saltos de línea."
fix = "Mandar el código siempre en base64 y decodificarlo al otro lado antes de ejecutarlo. El problema desaparece de raíz."
lesson = "Cuando se parchea caso por caso y sigue fallando, hay que cambiar el transporte, no seguir escapando."

[text.es.incidents.diverged]
title = "Los respaldos dejaron de recibir commits"
meta = "09-10-2026 · Git"
symptom = "Los commits se hacían bien, pero los dos remotos llevaban un rato sin recibir nada. Ningún error a la vista."
options = [
  "Se había caducado la clave de SSH",
  "Rehíce un commit ya empujado y los remotos rechazaban en silencio todo lo siguiente",
  "El disco del respaldo estaba lleno",
  "El hook se había borrado",
]
cause = "El hook empuja en segundo plano, así que sus errores no se ven. Tras corregir un commit que ya estaba en los remotos, las historias divergieron y cada push posterior se rechazaba."
fix = "Comprobar qué tenía cada remoto y forzar con protección (solo si nadie ha empujado otra cosa entretanto)."
lesson = "Lo que corre en segundo plano necesita una comprobación visible. Tras reescribir historia, mirar los remotos."

[[text.es.timeline]]
title = "Primeros recursos"
period = "Septiembre de 2026"
items = [
  "Token de Proxmox con permisos justos y un contenedor de prueba que luego se retiró.",
  "La puerta pública, primero clonada y probada, después migrada.",
  "Mensajería, panel de inicio y DNS de Cloudflare desde la misma lista.",
]

[[text.es.timeline]]
title = "Toda la flota"
period = "Septiembre de 2026"
items = [
  "Plex, automatizaciones, documentos y monitorización migrados a código, siempre con el original parado como red.",
  "Rol de endurecimiento común y registro de monitorización en un comando.",
]

[[text.es.timeline]]
title = "Control desde el servidor"
period = "22-09-2026"
items = [
  "El nodo de control pasa de mi PC a un contenedor del servidor, con el plan idéntico en ambos.",
  "Panel de terminales con los agentes de IA, detrás de la puerta interna.",
  "Copia pública saneada en GitHub.",
]

[[text.es.decisions]]
title = "Qué hace cada herramienta"
choice = "Terraform crea, Ansible configura"
why = "Terraform sabe qué existe y lo compara con el código; Ansible sabe dejar una máquina en un estado. Mezclarlos hace que ninguno sepa del todo qué pasa."

[[text.es.decisions]]
title = "Versiones"
choice = "Fijadas"
why = "Volver a ejecutar un playbook no debe actualizar nada por sorpresa. Actualizar es un cambio explícito, con su commit."

[[text.es.decisions]]
title = "Los datos"
choice = "Aparte de los roles"
why = "Un rol que toca datos es un rol que puede borrarlos. Los datos viven en almacenamiento montado y se restauran por su lado."

[[text.es.decisions]]
title = "Migrar sin riesgo"
choice = "El original parado, no destruido"
why = "Cada migración deja el contenedor antiguo apagado como vuelta atrás hasta que el nuevo lleva días funcionando."

[text.es.tech_notes]
terraform = "Un fichero por contenedor o VM con el proveedor de Proxmox, plan antes de cada aplicación y cuidado con los campos que recrean."
ansible = "Un rol por servicio, secretos leídos de OpenBao, ensayo con --check --diff y actualizaciones de la flota equipo a equipo."
proxmox = "Terraform habla con su API con un token de permisos justos; el nodo de control vive en un contenedor del propio servidor."
lxc = "Un contenedor por servicio, casi todos sin privilegios."
zfs = "Los datos de cada servicio viven en ZFS y se montan; los roles no los tocan."
git = "Todo versionado, con hook que empuja a dos remotos y una copia pública saneada."
forgejo = "El origen del repositorio: rama principal protegida, CI sin secretos, plan del PR y despliegue con un clic."
renovate = "Un PR por cada versión fijada que tiene versión nueva, con su suma oficial; se aplica con el mismo plan y el mismo clic."
openbao = "Todos los secretos y las credenciales de Terraform salen de OpenBao, no del repositorio ni del disco del nodo de control."
crowdsec = "Su rol instala el motor, sus fuentes y el resumen diario; la IP real detrás de Cloudflare y el plugin, en el de Traefik."
pbs = "El servidor de copias, su almacén, la tarea nocturna y la copia aparte de los mundos de los juegos, todo desde código."
linux = "Contenedores Debian, Ubuntu y Alpine configurados de forma uniforme."
traefik = "Sus rutas se generan desde la lista común de servicios."
dns = "Los registros de Cloudflare se crean y se borran desde la misma lista; el DNS de casa, también configurado desde aquí."
hardening = "Rol común: SSH solo con clave y desde orígenes concretos, servicios sobrantes fuera y monitorización en todos."

[text.es.close]
lessons = [
  "El plan es el freno de mano: un «destroy» inesperado se lee antes de seguir.",
  "Separar lo que existe (Terraform), cómo está (Ansible) y los datos.",
  "Migrar con el original parado al lado.",
]
next = [
  "Pasar a código lo que queda a mano: el gestor de stacks Docker con todos sus servicios.",
  "Llevar también la configuración del router a código.",
]

