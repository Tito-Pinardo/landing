[text.en.meta]
title = "Inside the homelab as code · Tito Pinardo Gutiérrez"
description = "How the whole homelab is managed: Terraform creates the containers on Proxmox, Ansible configures them, every change is reviewed with plan or diff before applying, and everything lives versioned, with encrypted secrets and an automatic backup."

[text.en.ui]
