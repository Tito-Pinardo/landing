[[text.en.decisions]]
title = "What each tool does"
choice = "Terraform creates, Ansible configures"
why = "Terraform knows what exists and compares it with the code; Ansible knows how to bring a machine to a state. Mixing them means neither fully knows what's going on."

[[text.en.decisions]]
title = "Versions"
choice = "Pinned"
why = "Rerunning a playbook mustn't update anything by surprise. Updating is an explicit change, with its commit."

[[text.en.decisions]]
title = "Data"
choice = "Kept apart from the roles"
why = "A role that touches data is a role that can delete it. Data lives on mounted storage and is restored on its own."

[[text.en.decisions]]
title = "Migrating without risk"
choice = "The original stopped, not destroyed"
why = "Each migration leaves the old container switched off as a way back until the new one has been running for days."

[text.en.tech_notes]
terraform = "One file per container or VM with the Proxmox provider, a plan before every apply and care with fields that recreate."
ansible = "One role per service, secrets read from OpenBao, dry runs with --check --diff and fleet updates machine by machine."
proxmox = "Terraform talks to its API with a least-privilege token; the control node lives in a container on the server itself."
lxc = "One container per service, almost all unprivileged."
zfs = "Each service's data lives on ZFS and is mounted; roles don't touch it."
git = "Everything versioned, with a hook pushing to two remotes and a cleaned public copy."
forgejo = "The repository's origin: protected main branch, CI with no secrets, the PR's plan and one-click deploys."
renovate = "One PR for every pinned version with a new release, with its official checksum; applied with the same plan and the same click."
openbao = "Every secret and the Terraform credentials come from OpenBao, not from the repository or the control node's disk."
crowdsec = "Its role installs the engine, its sources and the daily summary; the real IP behind Cloudflare and the plugin, in Traefik's."
pbs = "The backup server, its datastore, the nightly job and the separate copy of the game worlds, all from code."
linux = "Debian, Ubuntu and Alpine containers configured uniformly."
traefik = "Its routes are generated from the common service list."
dns = "Cloudflare records are created and deleted from the same list; the home DNS is configured from here too."
hardening = "A common role: key-only SSH from specific sources, spare services removed and monitoring everywhere."

[text.en.close]
lessons = [
  "The plan is the handbrake: an unexpected «destroy» gets read before going on.",
  "Keep what exists (Terraform), how it is (Ansible) and the data separate.",
  "Migrate with the original stopped next to it.",
]
next = [
