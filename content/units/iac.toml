title = "The homelab as code"
tagline = "The home services had been set up by hand over years and nobody, me included, knew how to rebuild one. Now Terraform creates each container on Proxmox and an Ansible role configures it; secrets are encrypted, every change is reviewed before it's applied and everything sits in Git with an automatic backup."
