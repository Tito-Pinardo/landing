  { label = "How I work", value = "From a control container on the server itself, with the AI agents I work with in terminals I can open from my laptop or the browser." },
  { label = "The rule", value = "Nothing is applied without first seeing what will change: «terraform plan» or «--check --diff». And pinned versions: rerunning a playbook updates nothing by surprise." },
  { label = "The public part", value = "A cleaned copy of the repository on GitHub, generated and checked automatically on every change and published when I approve it: structure and roles, with no real IPs, secrets or firewall rules." },
]

