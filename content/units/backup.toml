[text.en.groups]
code = "Code and documentation"
changes = "Every change, with a way back"
data = "Data backups"
watch = "Checking they work"

[text.en.pods.laptop]
short = "My laptop"
title = "My laptop"
text = "I edit the repository from here or from the control node."

[text.en.pods.central]
short = "Forgejo"
title = "Forgejo, the origin"
text = "Where the work happens: the repository's origin, with CI. It has its own unit."

[text.en.pods.github]
short = "Private GitHub"
title = "Private GitHub repository"
text = "Where the documentation is pushed, outside the house."

[text.en.pods.pwmgr]
short = "Password mgr"
title = "My password manager"
text = "Holds a copy of the backups' encryption key. Without it nothing can be restored, and it's off the server."

[text.en.pods.me]
short = "Me"
title = "Me"
text = "Who decides what's in, what's out and what's missing."

[text.en.pods.element]
short = "Element"
title = "Element"
text = "The incidents room: only failures arrive."

[text.en.pods.usb]
short = "Separate disk"
title = "The backup disk"
text = "A 4.5 TB disk just for this. If it isn't mounted, the backup server doesn't start: it never writes to the system disk."

[text.en.pods.hook]
short = "Hook"
title = "post-commit hook"
text = "Versioned in the repository itself: every commit is pushed to the backup on its own, in the background."

[text.en.pods.bare]
short = "Backup repo"
title = "Backup repository"
text = "A bare repository in a tiny container, on a different disk from the working one."

[text.en.pods.gitshell]
short = "git-shell"
title = "Git-only user"
text = "The backup user can only push and pull: not even a shell. With its own key."

[text.en.pods.vaultgit]
short = "Documentation"
title = "Documentation backup"
text = "The notes vault is pushed every 10 minutes. It has its own unit."

[text.en.pods.revert]
short = "Way back"
title = "Rollback script"
text = "Before a delicate change, the state is saved along with a script that puts everything back."

[text.en.pods.timer]
short = "5 minutes"
title = "Scheduled rollback"
text = "If the change locks me out, it undoes itself after 5 minutes. If all goes well, I cancel the timer."

[text.en.pods.dated]
short = "Dated copies"
title = "Dated copies"
text = "Ansible leaves a dated copy of every file it replaces."

[text.en.pods.snapshot]
short = "Snapshot"
title = "Snapshot"
text = "A frozen picture of the disk before a change or a backup, so a consistent state gets copied. Deleted afterwards."

[text.en.pods.pbs]
short = "PBS"
title = "Proxmox Backup Server"
text = "In its own container. Every night it gets a copy of every container, incremental and deduplicated: only what changed travels."

[text.en.pods.crypt]
short = "Encrypted"
title = "Encrypted before leaving"
text = "The main server encrypts them before sending. Whoever took the backup disk couldn't read anything."

[text.en.pods.nodelete]
short = "No deleting"
title = "Who copies doesn't delete"
text = "The main server gets in with a permission that allows backing up and restoring, not deleting. Only the backup server prunes: 7 daily, 4 weekly and 6 monthly."

[text.en.pods.worlds]
short = "Worlds"
title = "The game worlds"
text = "They live outside the game panel's container, so they're not in its copy. They have their own, at 3:30."

[text.en.pods.verify]
short = "Verification"
title = "Weekly verification"
text = "Every Sunday, the backup server rereads every copy and checks it's whole."

[text.en.pods.lastcommit]
short = "Last commit"
title = "Date of the last commit"
text = "The simplest way to tell whether a Git backup is still alive."

[text.en.pods.restore]
short = "Restore"
title = "Restoring for real"
text = "The only proof a backup works, and it's automatic: every Sunday a group of containers is restored on the side and compared file by file. Each container gets its turn once a month."

[text.en.pods.alerts]
short = "Alerts"
title = "Failure alerts"
text = "If a backup fails, Proxmox posts to the incidents room. If all goes well, silence."

[text.en.flows.nightly]
title = "Every night"
steps = [
  "At 2:30, Proxmox copies every container to the backup server.",
  "Encrypted before leaving, with a key I also keep off the server.",
  "Incremental: only what changed since the night before travels.",
  "The main server can copy but not delete. The backup server prunes on its own: 7 daily, 4 weekly and 6 monthly.",
  "Everything goes to a separate disk, just for this.",
  "On Sundays, verification rereads every copy.",
  "If anything fails, an alert goes out.",
  "And reaches the incidents room. If nothing arrives, it went fine.",
]

[text.en.flows.worlds]
title = "The game worlds"
steps = [
  "The worlds (158 GB) are mounted from outside the games container: its copy doesn't include them.",
  "At 3:30, a storage snapshot, to copy a consistent state even if someone's playing.",
  "Encrypted like everything else.",
  "And to the same backup server, incrementally.",
]

[text.en.flows.proof]
title = "Every Sunday, a test restore"
steps = [
  "Every Sunday a group of containers is restored into new containers, without starting them so they don't clash with the originals.",
  "The backup server hands over their copies.",
  "They're decrypted with the key.",
  "The same one I keep in my password manager: if the server died, without that copy there'd be nothing to restore.",
  "Files unchanged since the backup are compared with the originals, and the temporary containers are deleted. The first time, 1,381 of 1,381 identical.",
  "The summary reaches my phone; if anything fails, the incidents room. I no longer hope it works: I know, every week.",
]

[text.en.flows.commit]
title = "I make a commit"
steps = [
  "I change something in the infrastructure.",
  "Commit, and push to Forgejo, the origin.",
  "The hook fires on its own.",
  "It pushes to the backup repository, on another disk.",
  "With a user that can only do Git.",
  "And the backup is up to date, without me doing anything.",
]

[text.en.flows.change]
title = "A delicate change"
steps = [
  "I'm about to change the hypervisor firewall. Ansible keeps a copy of what it replaces.",
  "And a container snapshot, if it's an update.",
  "The script that puts everything back is saved.",
  "A 5-minute timer starts.",
  "If I'm locked out, it reverts on its own. If all goes well, I cancel it.",
]

[text.en.flows.vault]
title = "The documentation"
steps = [
  "The notes copy themselves every 10 minutes.",
  "To the private repository.",
  "But one day the last commit was 13 days old.",
  "I found out by looking at the date, not because anything warned me.",
  "Now it's the first thing I check.",
]

[text.en.incidents.token]
title = "A permission that wasn't enough"
meta = "15-10-2026 · backups"
symptom = "The token the main server uses on the backup server had its backup permission on the datastore. Even so, Proxmox said the datastore didn't exist."
options = [
  "The datastore hadn't been created",
  "The backup disk wasn't mounted",
  "What a token can do is what it and its user have in common: the permission was needed on both",
  "The backup server's version was different",
]
cause = "On the backup server, a token's effective permissions are the intersection of its own and its user's. The user had none, so neither did the token, and the error presented it as a missing datastore."
fix = "Give the same backup-only permission to the user and the token. It still can't delete."
lesson = "«Doesn't exist» can mean «you can't see it». Faced with an error about something that does exist, check permissions first."

[text.en.incidents.bindmount]
title = "158 GB that weren't in any backup"
meta = "15-10-2026 · backups"
symptom = "Going over what went into the backups, the game worlds weren't in the games container's copy, even though from inside they look like just another folder."
options = [
  "They're mounted from outside the container, and a container's backup doesn't include what's mounted",
  "They were too big for the datastore",
  "They were excluded by mistake",
  "The game panel deleted them before the backup",
]
cause = "The worlds live on the server's storage and are mounted into the container. Proxmox backs up the container's disk, not what's mounted."
fix = "A separate copy of that storage, with a snapshot so the state is consistent, encrypted and to the same backup server. And a written rule: if any container keeps something irreplaceable on a mount, it goes on that list."
lesson = "«It's inside the container» isn't the same as «it's in the container's backup». Check where every folder comes from."

[text.en.incidents.samedisk]
title = "A backup on the same disk"
meta = "17-09-2026 · code"
symptom = "The infrastructure had its «backup»: a bare repository next to the working one."
options = [
  "The backup repository was corrupted",
  "It wasn't updating",
  "It was missing branches",
  "It was on the same disk of the same machine: a failure or theft would take both",
]
cause = "Both copies lived on the same disk of the same PC. And the laptop only synced by hand and over VPN."
fix = "A second repository in a container of its own on the server, with a user that can only do Git, and a versioned hook pushing every commit on its own."
lesson = "A backup in the same place as the original doesn't protect against what matters most. Ask what would destroy it along with the original."

[text.en.incidents.alpine]
title = "Ansible couldn't create the backup"
meta = "17-09-2026 · Alpine"
symptom = "The backup role failed on the container: first when assigning the key folder's group, then with «sudo: not found»."
options = [
  "The container was out of space",
  "Alpine doesn't create a group per user or ship sudo, as the role assumed",
  "The SSH key was wrong",
  "The repository already existed",
]
cause = "The container is a minimal Alpine: creating a user doesn't create its group, and there's no sudo to switch users."
fix = "Create the group explicitly and create the repository as root, then fix the owner with the file module."
lesson = "A role written for Debian isn't a role for any Linux. The system's assumptions have to be written down."

[text.en.incidents.raidnotbackup]
title = "«I have RAID, so I have a backup»"
meta = "06-09-2026 · decision"
symptom = "All the important data is mirrored or on RAIDZ. Why more?"
options = [
  "Because a deletion, a mistake or corruption gets copied to the mirror instantly",
  "Because RAID is slow",
  "Because RAID doesn't survive power cuts",
  "Because it takes too much space",
]
cause = "RAID protects against a disk dying. Anything else (a wrong command, a corrupted file, ransomware) reaches every disk at once."
fix = "For weeks it stayed written down as pending, not hidden. On 15-10, nightly backups on Proxmox Backup Server, encrypted, which the main server can't delete, and a test restore."
lesson = "An acknowledged gap beats a false sense of safety. And when it was solved, the proof was a restore, not a file."

[text.en.incidents.chown]
title = "Sunday's test failed on every container"
meta = "18-10-2026 · backups"
symptom = "The test restore failed on all seven containers in the group and on the game worlds, every one with «Permission denied». The day before it was fine."
options = [
  "The backups had been corrupted",
  "The encryption key had changed",
  "A deployment of another service changed the owner of every chunk of the backups, which live on the same disk as the movies",
  "The backup disk had filled up",
]
cause = "That morning, a deployment of the download manager changed the owner of everything on the media disks, as it always does. The backups live in a folder on one of those disks: their 96,672 chunks went to another user and the backup server could no longer read them. The backups were intact."
fix = "Give the backups folder its owner back and rerun the test. So it doesn't happen again: the role skips folders that aren't media and only touches files with the wrong owner, which is also much faster."
lesson = "The weekly test caught it the same day. Without it, I'd have found out the day I needed a backup."

