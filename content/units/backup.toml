description = "Qué copias hay en el homelab y cuáles no: el código con dos respaldos automáticos, cada cambio con su vuelta atrás programada, copias de los datos que se rompen con los cortes… y lo que todavía falta, dicho claramente."

[text.es.ui]
slot = "1U · BACKUP"
face_specs = "Git ×2 · reversión · lo que falta"
state = "Parcial"
map_silk = "BAK"
