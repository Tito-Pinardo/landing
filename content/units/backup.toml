[[text.en.decisions]]
title = "What gets copied"
choice = "Everything that can't be downloaded again"
why = "Every container, documents included, and the game worlds. Out: movies, series and Steam games (tens of terabytes that can be downloaded again) and the lab cluster, which is rebuilt from code."

[[text.en.decisions]]
title = "Encryption"
choice = "On the server, before they leave"
why = "The backup disk could get lost or taken. The key has a copy in my password manager: without it nothing can be restored, not even by me."

[[text.en.decisions]]
title = "Who can delete"
choice = "Only the backup server"
why = "If someone took over the main server, the first thing they'd try is deleting the backups. With a permission that only allows backing up and restoring, they can't."

[[text.en.decisions]]
title = "Where"
choice = "At home, for now"
why = "A disk on the same server protects against deletions, corruption and dying disks, which is what has actually happened. It doesn't protect against theft or fire. It's written down as the next step."

[[text.en.decisions]]
title = "How what's missing is reported"
choice = "In writing"
why = "A red status in the documentation stopped anyone, me included, from believing for weeks that there was something that wasn't there. Now what's red is the off-site copy."

[text.en.tech_notes]
pbs = "Incremental nightly backups of every container, encrypted at the source, pruning and verification on the backup server itself, and a permission that can't delete."
lxc = "The backup server and the code backup each live in their own container."
ansible = "The roles that set up the backup server and the code backup, and the dated copies left every time a file is replaced."
git = "A versioned hook that pushes every commit to a second repository, and the documentation to a private repository."
linux = "A git-shell user, rollback scripts with a timer and a backup folder only its service can read."
hardening = "Encrypted backups, a permission that can't delete and a backup user that can only do Git."
proxmox = "The nightly job, snapshots, restores and failure alerts."
zfs = "Snapshots to copy the game worlds in a consistent state. And RAID, which survives a dead disk, isn't a backup."

[text.en.close]
lessons = [
  "A backup that's never been restored is a hope.",
  "RAID isn't a backup, and what's mounted from outside isn't in the container's backup.",
  "What's missing is written down as missing, even when almost nothing is.",
]
next = [
  "An off-site copy: a rotated disk or a second backup server somewhere else.",
  "A UPS, so power cuts stop being the cause of half the problems.",
]
