title = "Las copias, con honestidad"
tagline = "El código de toda la infraestructura tiene dos respaldos automáticos y cada cambio delicado se aplica con una vuelta atrás programada. Pero los datos grandes no tienen copias periódicas fuera del servidor: es una decisión de presupuesto, y está documentada como pendiente, no escondida."
grade = "Código: cubierto · Datos: pendiente"
facts = [
  { label = "Lo que está cubierto", value = "La infraestructura entera se puede reconstruir desde Git, que se copia sola en cada commit a un segundo repositorio. La documentación, a un repositorio privado." },
  { label = "Lo que tiene parche", value = "Lo que se rompía con los cortes de luz (cuentas del panel de juegos) se copia cada 30 minutos fuera de su contenedor, con comprobación de que la copia sirve." },
  { label = "Lo que falta", value = "Copias periódicas de los datos fuera del servidor. Un RAID protege de que muera un disco, no de un borrado ni de una corrupción." },
]

