[text.es.meta]
title = "Las copias por dentro · Tito Pinardo Gutiérrez"
description = "Copias cifradas de todo el servidor cada noche, que el propio servidor no puede borrar, verificadas y con la restauración probada. Y lo que todavía no cubren."

[text.es.ui]
slot = "1U · BACKUP"
face_specs = "PBS · Git ×2 · reversión"
state = "En producción"
map_silk = "BAK"
map_title = "Las copias por dentro"
map_intro = "Qué se copia cada noche, quién puede borrarlo, cómo se sabe que sirve y lo que aún no cubre. Elige un recorrido."
vm_title = "Copias · un servidor de copias y lo que lo rodea"
vm_specs = "Proxmox Backup Server en su contenedor, con su disco aparte"
outside = "Fuera"
disclaimer = "Reconstrucción a partir de mi documentación: sin direcciones, rutas ni nombres internos. Lo que falta está escrito como falta."

[text.es.hero]
kicker = "Unidad 1U · Copias"
title = "Copias de verdad, y lo que aún no cubren"
tagline = "Durante meses, esta unidad decía «datos: pendiente». Ahora cada contenedor del servidor tiene copia cada noche en Proxmox Backup Server, cifrada antes de salir, con una retención que el propio servidor no puede tocar. Se verifica cada semana y la restauración está probada fichero a fichero. El código sigue con sus dos respaldos y cada cambio delicado, con su vuelta atrás. Lo que falta, una copia fuera de casa, sigue escrito como falta."
grade = "Copias cifradas cada noche · restauración probada"
facts = [
  { label = "Qué se copia", value = "Todos los contenedores, también los de documentos, y los mundos de los juegos aparte. Las películas y los juegos de Steam no: se vuelven a bajar." },
  { label = "Quién puede borrar", value = "Nadie más que el propio servidor de copias, que poda según su calendario. Si el servidor principal cayera en malas manos, no podría borrar sus copias." },
  { label = "Lo que falta", value = "Todo está en casa, en un disco enchufado al mismo servidor. Protege de borrados, corrupción y discos que mueren; no de un robo o un incendio." },
]

