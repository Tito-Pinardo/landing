[text.es.incidents.samedisk]
title = "Un respaldo en el mismo disco"
meta = "17-09-2026 · código"
symptom = "La infraestructura tenía su «copia»: un repositorio desnudo al lado del de trabajo."
options = [
  "El repositorio de respaldo estaba corrupto",
  "No se actualizaba",
  "Le faltaban ramas",
  "Estaba en el mismo disco de la misma máquina: un fallo o un robo se llevaba las dos",
]
cause = "Las dos copias vivían en el mismo disco del mismo PC. Y el portátil solo sincronizaba a mano y con VPN."
fix = "Un segundo repositorio en un contenedor propio del servidor, con un usuario que solo puede hacer Git, y un hook versionado que empuja cada commit solo."
lesson = "Una copia en el mismo sitio que el original no protege de lo que más importa. Hay que preguntarse qué la destruiría junto al original."

[text.es.incidents.alpine]
title = "Ansible no podía crear el respaldo"
meta = "17-09-2026 · Alpine"
symptom = "El rol del respaldo fallaba en el contenedor: primero al dar el grupo a la carpeta de claves, luego con «sudo: not found»."
options = [
  "Faltaba espacio en el contenedor",
  "Alpine no crea un grupo por usuario ni trae sudo, como suponía el rol",
  "La clave SSH era incorrecta",
  "El repositorio ya existía",
]
cause = "El contenedor es un Alpine mínimo: al crear un usuario no crea su grupo y no hay sudo para cambiar de usuario."
fix = "Crear el grupo de forma explícita y crear el repositorio como root, corrigiendo después el dueño con el módulo de ficheros."
lesson = "Un rol escrito para Debian no es un rol para cualquier Linux. Las suposiciones del sistema hay que escribirlas."

[text.es.incidents.raidnotbackup]
title = "«Tengo RAID, tengo copia»"
meta = "06-09-2026 · decisión"
symptom = "Todos los datos importantes están en espejo o en RAIDZ. ¿Para qué más?"
options = [
  "Porque un borrado, un error o una corrupción se copian al espejo al instante",
  "Porque el RAID es lento",
  "Porque el RAID no aguanta cortes de luz",
  "Porque ocupa demasiado",
]
cause = "El RAID protege de que muera un disco. Cualquier otra cosa (un comando equivocado, un fichero corrupto, un ransomware) llega a todos los discos a la vez."
fix = "No hay presupuesto ahora para copias periódicas fuera del servidor: se ha decidido así y está escrito como pendiente, con lo que sí está cubierto y lo que no."
lesson = "Es mejor un hueco reconocido que una falsa sensación de seguridad. Cuando se resuelva, la prueba será una restauración, no un fichero."

[[text.es.timeline]]
title = "Reversiones"
period = "Septiembre de 2026"
items = [
  "Cada cambio de seguridad con su script de vuelta atrás y un temporizador de 5 minutos.",
  "Copias de las cuentas del panel de juegos, y su arreglo cuando resultaron vacías.",
]

[[text.es.timeline]]
title = "Respaldo del código"
period = "17-09-2026"
items = [
  "Segundo repositorio en un contenedor propio, con un usuario solo de Git.",
  "Hook versionado que empuja cada commit solo.",
]

[[text.es.decisions]]
title = "Qué se copia primero"
choice = "Lo que permite reconstruir todo lo demás"
why = "Con el código de la infraestructura a salvo, cualquier servicio se vuelve a montar. Los datos son el siguiente paso."

[[text.es.decisions]]
title = "Cómo se cuenta lo que falta"
choice = "Por escrito"
why = "Un estado «sin copias periódicas» en rojo en la documentación evita que nadie, yo incluido, crea que hay algo que no hay."

[text.es.tech_notes]
lxc = "El respaldo del código vive en su propio contenedor diminuto."
ansible = "El rol que crea el respaldo y las copias fechadas que deja cada vez que sustituye un fichero."
git = "Hook versionado que empuja cada commit a un segundo repositorio, y la documentación a un repositorio privado."
linux = "Usuario con git-shell, scripts de reversión con temporizador y copias comprobadas."
hardening = "El usuario del respaldo solo puede hacer Git, con su propia clave."
proxmox = "Instantáneas antes de parchear, que se borran después."
zfs = "RAID y espejos para aguantar la muerte de un disco, que no es lo mismo que una copia."
postgresql = "Volcados de las bases antes de migrar o parchear, comprobados."
python = "El vigilante de copias de Hermes."

[text.es.close]
lessons = [
  "Una copia que no se ha restaurado nunca es una esperanza.",
  "RAID no es copia.",
  "Lo que falta se escribe como falta.",
]
next = [
  "Copias periódicas cifradas de contenedores y datos fuera del servidor, con una restauración de prueba cada cierto tiempo.",
  "Un SAI, para que los cortes de luz dejen de ser la causa de la mitad de los problemas.",
]

