[[text.en.decisions]]
title = "What gets backed up first"
choice = "What lets you rebuild everything else"
why = "With the infrastructure code safe, any service can be set up again. Data is the next step."

[[text.en.decisions]]
title = "How what's missing is reported"
choice = "In writing"
why = "A red «no regular backups» status in the documentation stops anyone, me included, from believing there's something there isn't."

[text.en.tech_notes]
lxc = "The code backup lives in its own tiny container."
ansible = "The role that creates the backup and the dated copies it leaves whenever it replaces a file."
git = "A versioned hook pushing every commit to a second repository, and the documentation to a private one."
linux = "A git-shell user, rollback scripts with a timer and verified copies."
hardening = "The backup user can only do Git, with its own key."
proxmox = "Snapshots before patching, deleted afterwards."
zfs = "RAID and mirrors to survive a dead disk, which isn't the same as a backup."
postgresql = "Database dumps before migrating or patching, checked."
python = "Hermes' backup watcher."

[text.en.close]
lessons = [
  "A backup that's never been restored is a hope.",
  "RAID isn't a backup.",
  "What's missing gets written down as missing.",
]
next = [
  "Regular encrypted off-server backups of containers and data, with a test restore every so often.",
  "A UPS, so power cuts stop being the cause of half the problems.",
]
