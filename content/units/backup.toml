title = "Repositorio privado en GitHub"
text = "Donde se empuja la documentación, fuera de casa."

[text.es.pods.pwmgr]
short = "Gestor claves"
title = "Mi gestor de contraseñas"
text = "Guarda una copia de la clave de cifrado de las copias. Sin ella no se restaura nada, y está fuera del servidor."

[text.es.pods.me]
short = "Yo"
title = "Yo"
text = "Quien decide qué entra, qué no y qué falta."

[text.es.pods.element]
short = "Element"
title = "Element"
text = "La sala de incidencias: solo llegan los fallos."

[text.es.pods.usb]
short = "Disco aparte"
title = "El disco de las copias"
text = "Un disco de 4,5 TB solo para esto. Si no está montado, el servidor de copias no arranca: nunca escribe en el disco del sistema."

[text.es.pods.hook]
short = "Hook"
title = "Hook post-commit"
text = "Versionado en el propio repositorio: cada commit se empuja solo al respaldo, en segundo plano."

[text.es.pods.bare]
short = "Repo de respaldo"
title = "Repositorio de respaldo"
text = "Un repositorio desnudo en un contenedor diminuto, en otro disco que el de trabajo."

[text.es.pods.gitshell]
short = "git-shell"
title = "Usuario solo Git"
text = "El usuario del respaldo solo puede hacer push y pull: ni una shell. Con su propia clave."

[text.es.pods.vaultgit]
short = "Documentación"
title = "Copia de la documentación"
text = "El vault de notas se empuja cada 10 minutos. Tiene su propia unidad."

[text.es.pods.revert]
short = "Vuelta atrás"
title = "Script de reversión"
text = "Antes de un cambio delicado se guarda el estado y un script que lo deja todo como estaba."

[text.es.pods.timer]
short = "5 minutos"
title = "Reversión programada"
text = "Si el cambio me deja fuera, a los 5 minutos se deshace solo. Si todo va bien, cancelo el temporizador."

[text.es.pods.dated]
short = "Copias fechadas"
title = "Copias fechadas"
text = "Ansible deja una copia fechada de cada fichero que sustituye."

[text.es.pods.snapshot]
short = "Instantánea"
title = "Instantánea"
text = "Una foto fija del disco antes de un cambio o de una copia, para copiar un estado coherente. Se borra después."

[text.es.pods.pbs]
short = "PBS"
title = "Proxmox Backup Server"
text = "En su propio contenedor. Recibe cada noche la copia de todos los contenedores, incremental y con deduplicación: solo viaja lo que cambió."

[text.es.pods.crypt]
short = "Cifrado"
title = "Cifradas antes de salir"
text = "El servidor principal las cifra antes de enviarlas. Quien se llevara el disco de copias no podría leer nada."

[text.es.pods.nodelete]
short = "Sin borrar"
title = "Quien copia no borra"
text = "El servidor principal entra con un permiso que deja copiar y restaurar, pero no borrar. Solo el servidor de copias poda: 7 diarias, 4 semanales y 6 mensuales."

[text.es.pods.worlds]
short = "Mundos"
title = "Los mundos de los juegos"
text = "Viven fuera del contenedor del panel de juegos, así que no entran en su copia. Tienen la suya, a las 3:30."

[text.es.pods.verify]
short = "Verificación"
title = "Verificación semanal"
text = "Cada domingo, el servidor de copias relee cada copia y comprueba que está entera."

[text.es.pods.lastcommit]
short = "Último commit"
title = "Fecha del último commit"
text = "La forma más simple de saber si una copia de Git sigue viva."

[text.es.pods.restore]
short = "Restaurar"
title = "Restaurar de verdad"
text = "La única prueba de que una copia sirve, y es automática: cada domingo se restaura un grupo de contenedores aparte y se compara fichero a fichero. Cada contenedor pasa una vez al mes."

[text.es.pods.alerts]
short = "Avisos"
title = "Avisos de fallos"
text = "Si una copia falla, Proxmox avisa en la sala de incidencias. Si todo va bien, silencio."

