  "Each copy is checked: if it's empty, it's rejected.",
  "After a power cut, the last valid one is restored.",
  "Same with database dumps: checked to be readable.",
  "Restoring is the only proof.",
]

[text.en.incidents.samedisk]
title = "A backup on the same disk"
meta = "17-09-2026 · code"
symptom = "The infrastructure had its «backup»: a bare repository next to the working one."
options = [
  "The backup repository was corrupted",
  "It wasn't updating",
  "It was missing branches",
  "It was on the same disk of the same machine: a failure or theft would take both",
]
cause = "Both copies lived on the same disk of the same PC. And the laptop only synced by hand and over VPN."
fix = "A second repository in a container of its own on the server, with a user that can only do Git, and a versioned hook pushing every commit on its own."
lesson = "A backup in the same place as the original doesn't protect against what matters most. Ask what would destroy it along with the original."

[text.en.incidents.alpine]
title = "Ansible couldn't create the backup"
meta = "17-09-2026 · Alpine"
symptom = "The backup role failed on the container: first when assigning the key folder's group, then with «sudo: not found»."
options = [
  "The container was out of space",
  "Alpine doesn't create a group per user or ship sudo, as the role assumed",
  "The SSH key was wrong",
  "The repository already existed",
]
cause = "The container is a minimal Alpine: creating a user doesn't create its group, and there's no sudo to switch users."
fix = "Create the group explicitly and create the repository as root, then fix the owner with the file module."
lesson = "A role written for Debian isn't a role for any Linux. The system's assumptions have to be written down."

[text.en.incidents.raidnotbackup]
title = "«I have RAID, so I have a backup»"
meta = "06-09-2026 · decision"
symptom = "All the important data is mirrored or on RAIDZ. Why more?"
options = [
  "Because a deletion, a mistake or corruption gets copied to the mirror instantly",
  "Because RAID is slow",
  "Because RAID doesn't survive power cuts",
  "Because it takes too much space",
]
cause = "RAID protects against a disk dying. Anything else (a wrong command, a corrupted file, ransomware) reaches every disk at once."
fix = "There's no budget right now for regular off-server backups: that's been decided and written down as pending, with what is covered and what isn't."
lesson = "An acknowledged gap beats a false sense of safety. When it's solved, the proof will be a restore, not a file."

