[[text.es.decisions]]
title = "Qué se copia"
choice = "Todo lo que no se puede volver a bajar"
why = "Todos los contenedores, también los de documentos, y los mundos de los juegos. Fuera las películas, las series y los juegos de Steam (decenas de terabytes que se vuelven a bajar) y el clúster de laboratorio, que se reconstruye desde código."

[[text.es.decisions]]
title = "Cifrar"
choice = "En el servidor, antes de que salgan"
why = "El disco de copias puede perderse o llevárselo alguien. La clave tiene una copia en mi gestor de contraseñas: sin ella no se restaura nada, ni siquiera yo."

[[text.es.decisions]]
title = "Quién puede borrar"
choice = "Solo el servidor de copias"
why = "Si alguien se hiciera con el servidor principal, lo primero que intentaría sería borrar las copias. Con un permiso que solo deja copiar y restaurar, no puede."

[[text.es.decisions]]
title = "Dónde"
choice = "En casa, de momento"
why = "Un disco en el mismo servidor protege de borrados, corrupción y discos que mueren, que es lo que ha pasado de verdad. No protege de un robo o un incendio. Está escrito como el siguiente paso."

[[text.es.decisions]]
title = "Cómo se cuenta lo que falta"
choice = "Por escrito"
