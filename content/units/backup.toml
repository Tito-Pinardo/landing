[text.en.meta]
title = "Inside the backups · Tito Pinardo Gutiérrez"
description = "What backups the homelab has and which it doesn't: code with two automatic backups, every change with a scheduled way back, copies of the data that breaks in power cuts… and what's still missing, stated plainly."

[text.en.ui]
slot = "1U · BACKUP"
face_specs = "Git ×2 · rollback · what's missing"
