[text.es.incidents.token]
title = "Un permiso que no bastaba"
meta = "15-10-2026 · copias"
symptom = "El token con el que el servidor principal entra en el de copias tenía su permiso de copia sobre el almacén. Aun así, Proxmox decía que el almacén no existía."
options = [
  "El almacén no se había creado",
  "El disco de copias no estaba montado",
  "Lo que puede hacer un token es lo que tienen en común él y su usuario: el permiso hacía falta en los dos",
  "La versión del servidor de copias era otra",
]
cause = "En el servidor de copias, los permisos efectivos de un token son la intersección de los suyos y los de su usuario. El usuario no tenía ninguno, así que el token tampoco, y el error lo presentaba como un almacén inexistente."
fix = "Dar el mismo permiso, solo de copia, al usuario y al token. Sigue sin poder borrar."
lesson = "Un «no existe» puede querer decir «no lo puedes ver». Ante un error de algo que sí existe, mirar primero los permisos."

[text.es.incidents.bindmount]
title = "158 GB que no iban en ninguna copia"
meta = "15-10-2026 · copias"
symptom = "Al repasar qué entraba en las copias, los mundos de los juegos no aparecían en la del contenedor de juegos, aunque desde dentro se ven como una carpeta más."
options = [
  "Están montados desde fuera del contenedor, y la copia de un contenedor no incluye lo montado",
  "Eran demasiado grandes para el almacén",
  "Estaban excluidos por error",
  "El panel de juegos los borraba antes de la copia",
]
cause = "Los mundos viven en el almacenamiento del servidor y se montan dentro del contenedor. Proxmox copia el disco del contenedor, no lo montado."
fix = "Una copia aparte de ese almacenamiento, con una instantánea para que el estado sea coherente, cifrada y al mismo servidor de copias. Y una regla escrita: si algún contenedor guarda algo irrecuperable en un montaje, se añade a esa lista."
lesson = "«Está dentro del contenedor» no es lo mismo que «está en la copia del contenedor». Hay que mirar de dónde viene cada carpeta."

[text.es.incidents.samedisk]
title = "Un respaldo en el mismo disco"
meta = "17-09-2026 · código"
symptom = "La infraestructura tenía su «copia»: un repositorio desnudo al lado del de trabajo."
options = [
  "El repositorio de respaldo estaba corrupto",
  "No se actualizaba",
  "Le faltaban ramas",
  "Estaba en el mismo disco de la misma máquina: un fallo o un robo se llevaba las dos",
]
cause = "Las dos copias vivían en el mismo disco del mismo PC. Y el portátil solo sincronizaba a mano y con VPN."
fix = "Un segundo repositorio en un contenedor propio del servidor, con un usuario que solo puede hacer Git, y un hook versionado que empuja cada commit solo."
lesson = "Una copia en el mismo sitio que el original no protege de lo que más importa. Hay que preguntarse qué la destruiría junto al original."

[text.es.incidents.alpine]
title = "Ansible no podía crear el respaldo"
meta = "17-09-2026 · Alpine"
symptom = "El rol del respaldo fallaba en el contenedor: primero al dar el grupo a la carpeta de claves, luego con «sudo: not found»."
options = [
  "Faltaba espacio en el contenedor",
  "Alpine no crea un grupo por usuario ni trae sudo, como suponía el rol",
  "La clave SSH era incorrecta",
  "El repositorio ya existía",
]
cause = "El contenedor es un Alpine mínimo: al crear un usuario no crea su grupo y no hay sudo para cambiar de usuario."
fix = "Crear el grupo de forma explícita y crear el repositorio como root, corrigiendo después el dueño con el módulo de ficheros."
lesson = "Un rol escrito para Debian no es un rol para cualquier Linux. Las suposiciones del sistema hay que escribirlas."

[text.es.incidents.raidnotbackup]
title = "«Tengo RAID, tengo copia»"
meta = "06-09-2026 · decisión"
symptom = "Todos los datos importantes están en espejo o en RAIDZ. ¿Para qué más?"
options = [
  "Porque un borrado, un error o una corrupción se copian al espejo al instante",
  "Porque el RAID es lento",
  "Porque el RAID no aguanta cortes de luz",
  "Porque ocupa demasiado",
]
cause = "El RAID protege de que muera un disco. Cualquier otra cosa (un comando equivocado, un fichero corrupto, un ransomware) llega a todos los discos a la vez."
fix = "Durante semanas quedó escrito como pendiente, sin esconderlo. El 15-10, copias cada noche en Proxmox Backup Server, cifradas, que el servidor principal no puede borrar, y una restauración de prueba."
lesson = "Es mejor un hueco reconocido que una falsa sensación de seguridad. Y cuando se resolvió, la prueba fue una restauración, no un fichero."

[text.es.incidents.chown]
title = "La prueba del domingo falló en todos los contenedores"
meta = "18-10-2026 · copias"
symptom = "La restauración de prueba falló en los siete contenedores del grupo y en los mundos de los juegos, todos con «Permission denied». El día antes iba bien."
options = [
  "Las copias se habían corrompido",
  "Había cambiado la clave de cifrado",
  "Un despliegue de otro servicio cambió el dueño de todos los trozos de las copias, que viven en el mismo disco que las películas",
  "El disco de copias se había llenado",
]
cause = "Esa mañana, un despliegue del gestor de descargas cambió el dueño de todo lo que había en los discos de medios, como hace siempre. Las copias viven en una carpeta de uno de esos discos: sus 96.672 trozos pasaron a otro usuario y el servidor de copias ya no podía leerlos. Las copias estaban intactas."
fix = "Devolver el dueño a la carpeta de las copias y repetir la prueba. Para que no vuelva: el rol salta las carpetas que no son medios y solo toca los ficheros con otro dueño, que además es mucho más rápido."
lesson = "La prueba semanal lo encontró el mismo día. Sin ella, lo habría descubierto el día que necesitara una copia."

