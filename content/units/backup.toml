[text.en.meta]
title = "Backups, inside · Tito Pinardo Gutiérrez"
description = "Encrypted backups of the whole server every night, which the server itself can't delete, verified and with restores tested. And what they don't cover yet."

[text.en.ui]
slot = "1U · BACKUP"
face_specs = "PBS · Git ×2 · rollback"
state = "In production"
map_silk = "BAK"
map_title = "Backups, inside"
map_intro = "What's copied every night, who can delete it, how you know it works and what it doesn't cover yet. Pick a walkthrough."
vm_title = "Backups · a backup server and what's around it"
vm_specs = "Proxmox Backup Server in its container, with its own disk"
outside = "Outside"
disclaimer = "Rebuilt from my own documentation: no addresses, paths or internal names. What's missing is written down as missing."

[text.en.hero]
kicker = "1U unit · Backups"
title = "Real backups, and what they don't cover yet"
tagline = "For months, this unit said «data: pending». Now every container on the server gets a copy every night on Proxmox Backup Server, encrypted before it leaves, with retention the server itself can't touch. It's verified weekly and restores have been tested file by file. The code keeps its two backups and every delicate change, its way back. What's missing, an off-site copy, is still written down as missing."
grade = "Encrypted nightly backups · restore tested"
facts = [
  { label = "What's copied", value = "Every container, documents included, and the game worlds separately. Movies and Steam games aren't: they can be downloaded again." },
  { label = "Who can delete", value = "Nobody but the backup server itself, which prunes on its own schedule. If the main server fell into the wrong hands, it couldn't delete its backups." },
  { label = "What's missing", value = "It's all at home, on a disk plugged into the same server. It protects against deletions, corruption and dying disks; not against theft or fire." },
]

