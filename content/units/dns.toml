[text.en.meta]
title = "Inside the home DNS · Tito Pinardo Gutiérrez"
description = "The DNS for the whole house: Technitium with caching, ad blocking, DNSSEC and encrypted upstream; a migration from Pi-hole without losing a single query, and the sync job that keeps my domains pointing home."

[text.en.ui]
slot = "1U · DNS"
face_specs = "Technitium · DoH · dynamic IP"
state = "In production"
map_silk = "DNS"
map_title = "Inside the DNS"
map_intro = "Every name typed at home comes through here before going anywhere. Pick a flow."
vm_title = "DNS containers · Proxmox"
vm_specs = "Technitium + IP sync"
outside = "Outside"
disclaimer = "Rebuilt from my documentation: no addresses, zones or internal names."

[text.en.hero]
kicker = "1U unit · Home network"
title = "Home DNS · Technitium"
tagline = "Every device at home, the router and the server itself ask here which address each name has. It answers internal names, blocks ads and trackers, validates DNSSEC signatures and whatever it has to ask outside, it asks encrypted."
grade = "Migrated with 0 lost queries"
facts = [
  { label = "Why Technitium", value = "It replaces two parts (Pi-hole and Unbound) with one: its own resolution, persistent cache, blocking and local zones, all with an API." },
  { label = "How it was migrated", value = "Next to the old one, in the same container and on the same IP. A port redirect moved new queries to the new service while the old ones finished." },
  { label = "The other tenant", value = "A tiny container checks the home public IP every 5 minutes and, if it changes, updates Cloudflare." },
]

