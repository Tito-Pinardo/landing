[text.es.incidents.clear]
title = "El DNS de casa iba cifrado… salvo el del servidor"
meta = "10-10-2026 · privacidad"
symptom = "Lo que pasaba por el DNS de casa salía cifrado. Pero al revisar las conexiones del servidor seguía habiendo consultas DNS en claro hacia fuera."
options = [
  "El DNS cifrado fallaba y volvía al puerto 53",
  "El router tenía otro DNS configurado",
  "Algún equipo de casa tenía el DNS a mano",
  "El hipervisor y casi todos sus contenedores usaban DNS públicos directamente",
]
cause = "El hipervisor tenía resolutores públicos configurados y 16 de los 18 contenedores los heredaban: preguntaban fuera, por el 53, sin cifrar y sin caché."
fix = "Un playbook que apunta el hipervisor y los contenedores al DNS de casa, con un público solo de respaldo, actualizado en caliente sin reiniciar nada. Y el DNS, el primero en arrancar."
lesson = "Comprobar el camino real del tráfico, no la configuración que se supone. El fallo estaba en el propio servidor, no en los equipos de casa."

[text.es.incidents.confused]
title = "Se apaga el DNS de toda la casa"
meta = "13-09-2026 · migración"
symptom = "La misma noche de la migración, la casa se quedó sin resolver nombres durante un rato."
options = [
  "La redirección del puerto se perdió al reiniciar",
  "Apagué el contenedor nuevo pensando que era el Pi-hole viejo",
  "Las listas de bloqueo bloquearon un dominio necesario",
  "La caché se corrompió",
]
cause = "Había dos contenedores con nombres parecidos: el de pruebas y el de producción. Apagué el que daba servicio pensando que era el viejo."
fix = "Encenderlo, comprobar resolución, bloqueos y redirección, volver a activar el arranque automático y renombrar los dos contenedores para que no se puedan confundir."
lesson = "Los nombres son parte de la seguridad operativa: lo que se puede confundir, alguien lo confundirá. Yo incluido."

[text.es.incidents.port53]
title = "¿Forzar el DNS en el router?"
meta = "10-10-2026 · decisión"
symptom = "Para que ningún equipo se saltara el DNS de casa, lo típico sería que el router redirigiera o bloqueara cualquier consulta al puerto 53 hacia fuera. No lo hice."
options = [
  "Porque si el servidor cae, nadie de casa podría ni poner un DNS a mano",
  "Porque el router no lo permite",
  "Porque rompe el DNS cifrado",
  "Porque ralentiza la navegación",
]
cause = "Tras un corte de luz, el servidor puede tardar más de una hora en arrancar. Con el 53 forzado, la casa se quedaría sin internet hasta entonces."
fix = "Decisión: no forzarlo. El DHCP reparte este DNS y quien lo necesite puede poner uno público a mano para seguir trabajando."
lesson = "La seguridad que deja a todo el mundo sin servicio cuando falla una pieza no es una mejora. Se decide con el peor caso delante."

[[text.es.timeline]]
title = "Pi-hole y Unbound"
period = "Verano de 2026"
items = [
  "Bloqueo de publicidad para toda la casa y resolución recursiva propia.",
  "Dos servicios que mantener y actualizar por separado.",
]

[[text.es.timeline]]
title = "Migración a Technitium"
period = "13-09-2026"
items = [
  "Instalado junto al anterior, con el paquete oficial verificado por su hash.",
  "Mismas listas, mismos bloqueos y mismas zonas locales.",
  "Cambio por redirección de puerto, sin tocar ningún cliente: 0 consultas perdidas.",
]

[[text.es.timeline]]
title = "Cifrado y arranque"
period = "10-10-2026"
items = [
  "Salida por DNS sobre HTTPS, comprobada mirando las conexiones.",
  "El hipervisor y sus contenedores pasan a resolver aquí.",
  "El DNS, el primero en arrancar tras un corte.",
]

[[text.es.decisions]]
title = "Cómo migrar un servicio que usa todo el mundo"
choice = "En la misma dirección, con redirección de puerto"
why = "Cambiar la IP del DNS obliga a tocar el DHCP y esperar a que cada equipo renueve. Redirigir el puerto dentro del mismo contenedor hace el cambio invisible y reversible en segundos."

[[text.es.decisions]]
title = "Cómo sale fuera"
choice = "DNS sobre HTTPS"
why = "Sin cifrar, cualquiera en el camino ve qué nombres se piden en casa. Con DoH, solo ve conexiones HTTPS a un resolutor."

[[text.es.decisions]]
title = "La IP dinámica"
choice = "Un contenedor propio que actualiza Cloudflare"
why = "Mi conexión no tiene IP fija. Un script pequeño en su propio contenedor es fácil de vigilar y no depende de servicios de terceros."

[text.es.tech_notes]
proxmox = "El hipervisor y sus contenedores resuelven aquí, y el DNS es el primero en el orden de arranque."
lxc = "Technitium y el sincronizador corren en sus propios contenedores LXC."
linux = "nftables para la redirección de la migración y para proteger los puertos nuevos; el servicio corre sin root con las restricciones de systemd."
mikrotik = "El DHCP del router anuncia este DNS en los tres segmentos, y el propio router también le pregunta."
dns = "Technitium: zonas locales, caché persistente con prefetch, DNSSEC, minimización de consultas, listas de bloqueo y salida por DoH."
hardening = "Panel solo detrás de la puerta interna con doble factor, consultas externas cifradas y validación de firmas."

[text.es.close]
lessons = [
  "Un servicio que usa todo el mundo se cambia sin que nadie lo note, o no se cambia.",
  "Mirar el tráfico real: el servidor seguía preguntando en claro mientras la casa ya iba cifrada.",
  "Nombres que no se puedan confundir, sobre todo en lo que da servicio a todos.",
]
next = [
  "Servir también el DNS por IPv6 cuando esté resuelto el fallo que encontré al probarlo.",
  "Llevar las listas y las zonas a código en el repositorio de infraestructura.",
]

