[text.en.pods.port]
short = "New port"
title = "Technitium on another port"
text = "The new server started next to the old one, on another port, to test it without affecting anyone."

[text.en.pods.redirect]
short = "Redirect"
title = "nftables redirect"
text = "A rule moved new connections on port 53 to the new server inside the same container. Those already open finished on the old one."

[text.en.pods.watch]
short = "Monitoring"
title = "Monitoring"
text = "Zabbix checks it resolves external names and both services are up; Wazuh watches for configuration changes."

[text.en.pods.sync]
short = "IP sync"
title = "IP sync"
text = "A minimal container with a script. It checks the home public IP every 5 minutes."

[text.en.pods.checkip]
short = "Public IP"
title = "What's my IP?"
text = "It asks outside which IP the world sees and compares it with the last known one."

[text.en.pods.records]
short = "Records"
title = "Public records"
text = "If the IP changed, it updates the records that should point home. Otherwise it does nothing."

[text.en.pods.startup]
short = "Starts first"
title = "Start-up order"
text = "After a power cut, DNS is the first container to start: everything else needs it."

[text.en.flows.query]
title = "Someone opens a website"
steps = [
  "A phone at home wants to open a website.",
  "It uses the DNS the router gave it when it joined: this one.",
  "The query reaches the DNS server.",
  "First, is it on a block list? No.",
  "Is it cached? No: it's the first time anyone has asked.",
  "It goes out to ask, over HTTPS.",
  "A public resolver answers.",
  "The answer comes back encrypted and its DNSSEC signature is validated if it has one.",
  "It's cached for next time.",
  "The phone gets the address and opens the site.",
]

[text.en.flows.local]
title = "An internal name"
steps = [
  "From home I ask for a panel by its internal name.",
  "The query reaches the DNS.",
  "The name is in a local zone: it's answered right here, without asking outside.",
  "The device gets the address of the internal door.",
]

[text.en.flows.ad]
title = "A website tries to load ads"
steps = [
  "A website asks for an ad domain.",
  "The query reaches the DNS.",
  "It's on the block lists.",
  "Or on my own blocks.",
  "The answer is «doesn't exist»: the ad doesn't load, on any device in the house.",
]

[text.en.flows.migrate]
title = "The migration, without downtime"
steps = [
  "Pi-hole is still answering everyone.",
  "Technitium starts on another port in the same container and I test it: names, blocks, DNSSEC.",
  "An nftables rule sends new connections on 53 to the new server, without changing the IP or anything on the clients.",
  "New queries are now answered by Technitium.",
  "For five minutes I fire 1,200 queries alternating external and internal names: 0 failures, the slowest 19.5 ms.",
  "Pi-hole stops once its last connections finish, and stays installed as a way back.",
]

[text.en.flows.ipchange]
title = "The home IP changes"
steps = [
  "Every 5 minutes the sync job wakes up.",
  "It asks what public IP home has.",
  "The answer comes from outside.",
  "It has changed since last time.",
  "It updates Cloudflare.",
  "The records that should point home now have the new IP.",
]

[text.en.flows.blackout]
title = "The power comes back"
steps = [
  "After a power cut the server boots. With the disk checks it can take over an hour.",
  "DNS is first in the start-up order.",
  "As soon as it answers, the other containers can resolve names.",
  "The hypervisor asks it first, and a public one only if it doesn't answer.",
  "Meanwhile, home devices can set a public DNS by hand: nothing is forced in the router.",
  "When everything is back, DHCP keeps handing out this DNS.",
]

[text.en.incidents.clear]
title = "Home DNS was encrypted… except the server's"
meta = "10-10-2026 · privacy"
symptom = "Whatever went through the home DNS left encrypted. But checking the server's connections there were still plain DNS queries going out."
options = [
  "Encrypted DNS was failing and falling back to port 53",
  "The router had another DNS configured",
  "Some home device had its DNS set by hand",
  "The hypervisor and almost all its containers used public DNS directly",
]
cause = "The hypervisor had public resolvers configured and 16 of the 18 containers inherited them: they asked outside, on 53, unencrypted and uncached."
fix = "A playbook that points the hypervisor and the containers at the home DNS, with a public one only as fallback, updated live without restarting anything. And DNS first to start."
lesson = "Check the real path of the traffic, not the configuration you assume. The flaw was on the server itself, not on the home devices."

[text.en.incidents.confused]
title = "DNS goes down for the whole house"
meta = "13-09-2026 · migration"
symptom = "The very night of the migration, the house couldn't resolve names for a while."
options = [
  "The port redirect was lost on reboot",
  "I switched off the new container thinking it was the old Pi-hole",
  "The block lists blocked a needed domain",
  "The cache got corrupted",
]
cause = "There were two containers with similar names: the test one and the production one. I switched off the one serving the house, thinking it was the old one."
fix = "Turn it back on, check resolution, blocking and the redirect, re-enable auto-start and rename both containers so they can't be confused."
lesson = "Names are part of operational safety: whatever can be confused, someone will confuse. Me included."

[text.en.incidents.port53]
title = "Force DNS on the router?"
meta = "10-10-2026 · decision"
symptom = "To stop any device bypassing the home DNS, the usual move is for the router to redirect or block any query to port 53 going out. I didn't do it."
options = [
  "Because if the server goes down, nobody at home could even set a DNS by hand",
  "Because the router doesn't allow it",
  "Because it breaks encrypted DNS",
  "Because it slows browsing down",
]
cause = "After a power cut the server can take over an hour to boot. With 53 forced, the house would be without internet until then."
fix = "Decision: don't force it. DHCP hands out this DNS, and anyone who needs to can set a public one by hand to keep working."
lesson = "Security that leaves everyone without service when one part fails isn't an improvement. Decide with the worst case in front of you."

[[text.en.timeline]]
title = "Pi-hole and Unbound"
period = "Summer 2026"
items = [
  "Ad blocking for the whole house and its own recursive resolution.",
  "Two services to maintain and update separately.",
]

[[text.en.timeline]]
title = "Migration to Technitium"
period = "13-09-2026"
items = [
  "Installed next to the old one, with the official package checked against its hash.",
  "Same lists, same blocks and same local zones.",
  "Switch through a port redirect, without touching any client: 0 lost queries.",
]

[[text.en.timeline]]
title = "Encryption and start-up"
period = "10-10-2026"
items = [
  "Upstream over DNS over HTTPS, checked by watching the connections.",
  "The hypervisor and its containers now resolve here.",
  "DNS first to start after a power cut.",
]

[[text.en.decisions]]
title = "How to migrate a service everyone uses"
choice = "On the same address, with a port redirect"
why = "Changing the DNS IP means touching DHCP and waiting for every device to renew. Redirecting the port inside the same container makes the switch invisible and reversible in seconds."

[[text.en.decisions]]
title = "How it goes out"
choice = "DNS over HTTPS"
why = "Unencrypted, anyone on the path sees which names are asked at home. With DoH they only see HTTPS connections to a resolver."

[[text.en.decisions]]
title = "The dynamic IP"
choice = "A container of its own that updates Cloudflare"
why = "My connection has no fixed IP. A small script in its own container is easy to monitor and doesn't depend on third-party services."

[text.en.tech_notes]
proxmox = "The hypervisor and its containers resolve here, and DNS is first in the start-up order."
lxc = "Technitium and the sync job run in their own LXC containers."
linux = "nftables for the migration redirect and to protect the new ports; the service runs without root under systemd's restrictions."
mikrotik = "The router's DHCP announces this DNS on all three segments, and the router itself asks it too."
dns = "Technitium: local zones, persistent cache with prefetch, DNSSEC, query minimisation, block lists and DoH upstream."
hardening = "Panel only behind the internal door with two-factor, encrypted external queries and signature validation."

[text.en.close]
lessons = [
  "A service everyone uses is changed without anyone noticing, or not at all.",
  "Look at real traffic: the server kept asking in plain text while the house was already encrypted.",
  "Names that can't be confused, especially for what serves everyone.",
]
next = [
  "Serve DNS over IPv6 too, once the bug I found testing it is sorted.",
  "Move the lists and zones into code in the infrastructure repo.",
]
