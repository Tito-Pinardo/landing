short = "E2EE keys"
title = "Device keys"
text = "Encrypting needs a device with live sessions. That's why the relay syncs all the time: if I join a room later, it finds out."

[text.en.pods.hermes]
short = "Hermes"
title = "Hermes"
text = "The assistant, with its own user. It only answers in the room I first invited it to."

[text.en.pods.webbot]
short = "Site bot"
title = "This site's bot"
text = "A user of its own that can only write in its room. If someone compromised the site, the token is good for nothing else."

[text.en.pods.alerts]
short = "Alerts"
title = "Alerts room"
text = "Only what's serious: high severity in monitoring and level 12 or above in security."

[text.en.pods.assistant]
short = "Assistant"
title = "Assistant room"
text = "Where I talk to Hermes."

[text.en.pods.topic]
short = "Topic rooms"
title = "Rooms by topic"
text = "One per watcher (backups, certificates, network…), plus email and events. Each only speaks when there's something."

[text.en.pods.contact]
short = "Site"
title = "Site room"
text = "Messages from the contact form."

[text.en.flows.chat]
title = "I talk to Hermes"
steps = [
  "I type in Element on my phone, away from home and without VPN.",
  "Cloudflare gets the request.",
  "Traefik passes it to the Matrix server.",
  "Only the client API exists: it's what the phone uses.",
  "Synapse receives the message.",
  "It stores it in its PostgreSQL.",
  "And delivers it to the room's devices.",
  "The assistant's room.",
  "Hermes gets it and starts its turn.",
]

[text.en.flows.alert]
title = "A serious alert"
steps = [
  "Monitoring spots a high-severity problem.",
  "It hands it to the local relay, with a shared secret so nobody on the network can inject fake alerts.",
  "The relay encrypts it with its device's keys.",
  "Synapse stores and delivers it encrypted: only the room's devices can read it.",
  "It reaches the alerts room.",
  "My phone buzzes.",
]

[text.en.flows.contact]
title = "Someone writes to me on the site"
steps = [
  "Someone sends this site's contact form.",
  "The site's own bot sends the notice.",
  "Synapse confirms with an event ID. Without that confirmation, the site retries.",
  "It reaches the site's room.",
  "I see it on my phone.",
]

[text.en.flows.probe]
title = "Someone pokes at the server"
steps = [
  "Someone on the internet opens the messaging domain.",
  "Traefik receives it.",
  "They look for the «it works» page: they get a 404.",
  "They try to talk as another Matrix server: that service doesn't exist.",
  "They try to sign up: sign-ups are closed. All they see is the login screen.",
]

[text.en.flows.deploy]
title = "Ansible builds the server"
steps = [
  "Ansible deploys a settings file next to the configuration the package generated, without touching its keys.",
  "Sign-ups closed and the registration secret, from the vault.",
  "Synapse starts and merges both configurations.",
  "Connected to its local PostgreSQL.",
  "Element is deployed in its own minimal container.",
]

[text.en.incidents.templates]
title = "An alert channel that had never worked"
meta = "17-09-2026 · alerts"
symptom = "The serious-alerts channel to Matrix had been set up for two days. The relay was running and tested. But checking the real history, all 5 of its alerts had failed."
options = [
  "The relay had no permission in the room",
  "The alert type had no message templates: Zabbix didn't even call the script",
  "Encryption was rejecting the messages",
  "The shared secret was wrong",
]
cause = "When the channel was created in Zabbix, the «problem», «recovery» and «update» templates were missing. With no text to generate, Zabbix never invoked the script, and the error only showed in its history."
fix = "Add the three templates in the same format as the old channel and test with a real alert, not with «the bot is on»."
lesson = "A component being on doesn't mean it works. To know whether an alert channel works, check whether the alerts arrived."

[text.en.incidents.decrypt]
title = "«Unable to decrypt message»"
meta = "17-09-2026 · encryption"
symptom = "A voice reply from Hermes showed up in Element as «Unable to decrypt message», on phone and PC. Restarting the bot didn't fix it: the next encrypted messages failed too."
options = [
  "The server lost the room keys",
  "The phone hadn't verified the session",
  "The audio was too big",
  "An external script wrote to the bot's key store while the bot was still running",
]
cause = "A script that sent a message «from outside» opened the bot's encryption store while the process was still running, and left its session state corrupted on disk. Every restart loaded the same broken state."
fix = "Quarantine the corrupted store (without deleting it) and let the bot log in with a brand-new device. I verified it again in Element; that voice note was lost."
lesson = "Encryption state belongs to a single process. Never touch it without stopping the service and checking it really stopped."

[text.en.incidents.nxdomain]
title = "«Server not found», just created"
meta = "15-09-2026 · DNS"
symptom = "I had just created the web client's public record. It resolved fine on any public DNS, but from home the browser said it didn't exist."
options = [
  "Cloudflare hadn't propagated the record yet",
  "The browser had the error cached",
  "The home DNS had cached the «doesn't exist» from before it was created",
  "The router was blocking the domain",
]
cause = "Someone had asked for that name before it existed, and the home DNS kept the negative answer. Restarting the service isn't enough: that cache is saved to disk and reloaded."
fix = "Flush the cache through its API. Since then, creating a new record has one more step in the procedure."
lesson = "Caches keep the «no»s too. And a persistent cache survives the restart that should clear it."

[[text.en.timeline]]
title = "Client and server"
period = "15-09-2026"
items = [
  "Element Web in a minimal container with nginx.",
  "Synapse with its PostgreSQL in another, private: no sign-ups, no federation.",
  "All created with Terraform and configured with Ansible.",
]

[[text.en.timeline]]
title = "Encrypted alerts"
period = "16-17-09-2026"
items = [
  "A relay with its own device to send end-to-end encrypted alerts.",
  "Monitoring and security connected, with stricter thresholds than the old channel: only what needs checking.",
  "The channel truly fixed after checking its history.",
]

[[text.en.timeline]]
title = "A space for the house"
period = "September and October 2026"
items = [
  "Topic rooms for Hermes and its watchers.",
  "This site's own bot, in its room.",
]

[[text.en.decisions]]
title = "Which server"
choice = "Synapse, the reference one"
why = "The most mature and documented. The classic argument for the alternative, using less, doesn't matter on this server."

[[text.en.decisions]]
title = "Public or behind the VPN?"
choice = "Public, but closed"
why = "The goal was to use it from my phone without VPN. That's balanced with closed sign-ups, federation truly off and only the client API exposed."

[[text.en.decisions]]
title = "One bot for everything or one per job"
choice = "One per job, no admin"
why = "The alerts relay, Hermes and the site's bot have separate users. If one is compromised, it can only write in its own place."

[text.en.tech_notes]
terraform = "Creates the Synapse and Element containers."
ansible = "Deploys Synapse with its configuration on top of the package's, closes sign-ups and keeps the registration secret encrypted."
lxc = "Synapse and Element in separate containers: the stateful one isn't mixed with the static one."
traefik = "The public door, with a dedicated rule that hides Synapse's test page."
linux = "Official packages and nginx with systemd, no Docker."
zabbix = "Sends its high-severity problems to the alerts room through the relay."
wazuh = "Sends its level 12+ events, grouped to avoid repeats."
hardening = "Closed sign-ups, non-existent federation, client API only, hidden test page and bots without admin."
python = "The alerts relay with matrix-nio: persistent session, continuous sync and a local endpoint protected with a secret."
postgresql = "Synapse's database, local and its own."

[text.en.close]
lessons = [
  "Check alert channels by what arrives, not by what's switched on.",
  "End-to-end encryption has state: treat it as a single-process database.",
  "Public doesn't have to mean open: what isn't served can't be attacked.",
]
next = [
  "«Recovered» notices in the alerts room, to close each problem.",
  "Backups of the bots' key stores, with the service stopped.",
]
