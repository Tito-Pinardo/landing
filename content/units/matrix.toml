[text.es.incidents.templates]
title = "Un canal de alertas que nunca había funcionado"
meta = "17-09-2026 · alertas"
symptom = "El canal de alertas graves hacia Matrix llevaba dos días creado. El relay estaba encendido y probado. Pero al revisar el histórico real, sus 5 avisos habían fallado todos."
options = [
  "El relay no tenía permisos en la sala",
  "Al tipo de aviso le faltaban las plantillas de mensaje: Zabbix ni siquiera llamaba al script",
  "El cifrado rechazaba los mensajes",
  "El secreto compartido estaba mal",
]
cause = "Al crear el canal en Zabbix faltaron las plantillas de «problema», «recuperado» y «actualización». Sin texto que generar, Zabbix ni siquiera invocaba el script, y el error solo se veía en su histórico."
fix = "Añadir las tres plantillas con el mismo formato que el canal antiguo y probar con un aviso real, no con un «el bot está encendido»."
lesson = "Que un componente esté encendido no dice que funcione. Para saber si un canal de alertas funciona hay que mirar si llegaron las alertas."

[text.es.incidents.decrypt]
title = "«No se puede descifrar el mensaje»"
meta = "17-09-2026 · cifrado"
symptom = "Un audio de Hermes apareció en Element como «Unable to decrypt message», en el móvil y en el PC. Reiniciar el bot no lo arreglaba: los siguientes mensajes cifrados también fallaban."
options = [
  "El servidor perdió las claves de la sala",
  "El móvil no tenía verificada la sesión",
  "El audio era demasiado grande",
  "Un script externo escribió en el almacén de claves del bot mientras el bot seguía vivo",
]
cause = "Un script que mandó un mensaje «desde fuera» abrió el almacén de cifrado del bot mientras el proceso seguía corriendo, y dejó corrupto en disco su estado de sesiones. Cada reinicio volvía a cargar el mismo estado roto."
fix = "Poner en cuarentena el almacén corrupto (sin borrarlo) y dejar que el bot entrara con un dispositivo nuevo desde cero. Lo volví a verificar en Element; aquel audio se perdió."
lesson = "El estado de cifrado es de un solo proceso. Nunca se toca sin parar el servicio y comprobar que de verdad se paró."

[text.es.incidents.nxdomain]
title = "«No se encuentra el servidor» recién creado"
meta = "15-09-2026 · DNS"
symptom = "Acababa de crear el registro público del cliente web. Resolvía bien en cualquier DNS público, pero desde casa el navegador decía que no existía."
options = [
  "Cloudflare aún no había propagado el registro",
  "El navegador tenía el error en caché",
  "El DNS de casa había guardado en caché el «no existe» de antes de crearlo",
  "El router bloqueaba el dominio",
]
cause = "Alguien había preguntado por ese nombre antes de que existiera, y el DNS de casa guardó la respuesta negativa. Reiniciar el servicio no basta: esa caché se guarda en disco y se recarga."
fix = "Vaciar la caché por su API. Desde entonces, al crear un registro nuevo, es un paso más del procedimiento."
lesson = "Las cachés también guardan los «no». Y una caché persistente sobrevive al reinicio que debería limpiarla."

