[[text.es.decisions]]
title = "Qué servidor"
choice = "Synapse, el de referencia"
why = "El más maduro y documentado. El argumento clásico de la alternativa, gastar menos, no pesa en este servidor."

[[text.es.decisions]]
title = "¿Público o detrás de la VPN?"
choice = "Público, pero cerrado"
why = "El objetivo era usarlo desde el móvil sin VPN. Se compensa con registro cerrado, federación apagada de verdad y solo la API de cliente expuesta."

[[text.es.decisions]]
title = "Un bot para todo o uno por función"
choice = "Uno por función, sin administración"
why = "El relay de alertas, Hermes y el bot de la web tienen usuarios distintos. Si uno se compromete, solo puede escribir en lo suyo."

[text.es.tech_notes]
terraform = "Crea los contenedores de Synapse y de Element."
ansible = "Despliega Synapse con su configuración por encima de la del paquete, cierra el registro y guarda el secreto de alta cifrado."
lxc = "Synapse y Element en contenedores separados: el que tiene estado no se mezcla con el estático."
traefik = "La puerta pública, con una regla dedicada que esconde la página de prueba de Synapse."
linux = "Paquetes oficiales y nginx con systemd, sin Docker."
zabbix = "Manda sus problemas de severidad alta a la sala de alertas a través del relay."
wazuh = "Manda sus eventos de nivel 12 o más, agrupados para no repetir."
hardening = "Registro cerrado, federación inexistente, solo la API de cliente, página de prueba oculta y bots sin administración."
python = "El relay de alertas con matrix-nio: sesión persistente, sincronización continua y un endpoint local protegido con secreto."
postgresql = "La base de datos de Synapse, local y solo suya."

[text.es.close]
lessons = [
  "Comprobar los canales de aviso por lo que llega, no por lo que está encendido.",
  "El cifrado de extremo a extremo tiene estado: se trata como una base de datos de un solo proceso.",
  "Público no tiene por qué significar abierto: lo que no se sirve no se puede atacar.",
]
next = [
  "Avisos de «recuperado» en la sala de alertas, para cerrar cada problema.",
  "Copias del almacén de claves de los bots, con el servicio parado.",
]

