[[text.es.decisions]]
title = "Dónde vive el código"
choice = "En casa; GitHub como escaparate"
why = "Lo interno no tiene por qué salir. GitHub enseña lo que quiero enseñar: una copia saneada y esta web, siempre detrás de lo que ya funciona."

[[text.es.decisions]]
title = "Qué servidor Git"
choice = "Forgejo"
why = "Un binario y SQLite: arranca con un gigabyte de memoria. Un GitLab completo pide varios para lo mismo, y aquí la memoria tiene otros usos."

[[text.es.decisions]]
title = "Los runners"
choice = "Dos, separados por lo que pueden tocar"
why = "El que comprueba todo no tiene nada que robar: ni secretos ni acceso. El que despliega vive en el nodo de control, que ya podía tocarlo todo, y solo atiende a su repositorio."

[[text.es.decisions]]
title = "Aplicar infraestructura"
choice = "Con un clic, y el plan exacto"
why = "Un plan que recrea un contenedor con datos se lee antes. Cuando haya confianza, los planes que solo actualizan podrían ir solos; los que destruyen, nunca."

[[text.es.decisions]]
title = "Esta web"
choice = "Despliegue continuo"
why = "Si algo sale mal, se vuelve al commit anterior en minutos y no hay datos en juego. El control de fugas va antes de desplegar, no después."

[text.es.tech_notes]
forgejo = "Servidor Git con PR, ramas protegidas, Actions y webhooks; dos runners en modo host, cada uno con lo justo."
git = "Origen en casa, respaldo en cada commit, central de antes en solo lectura y GitHub como copia pública."
terraform = "Formato y validación en el CI sin estado; plan del PR y plan guardado que se aplica tal cual."
ansible = "ansible-lint con línea base, playbooks afectados en ensayo y despliegue de esta web con su rol."
rust = "El CI de esta web: formato, clippy, pruebas y compilación con caché entre ejecuciones."
postgresql = "Un PostgreSQL solo por socket en el runner: cada prueba crea su propia base."
hardening = "Runner sin secretos, gitleaks en todo el historial y control de fugas antes de publicar."
lxc = "Forgejo y el runner, cada uno en su contenedor sin privilegios; el runner se recrea desde cero."
linux = "Contenedores Debian con versiones fijadas y sumas comprobadas de cada binario."

[text.es.close]
lessons = [
  "Un CI sin secretos descubre lo que el código daba por hecho.",
  "Ver el plan antes de fusionar cambia cómo se revisa.",
  "Lo público va detrás de lo desplegado, nunca delante.",
]
next = [
  "Que los planes que solo actualizan se apliquen solos.",
  "Copias de verdad para todo el servidor, no solo para Forgejo.",
]

