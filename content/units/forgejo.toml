[[text.en.decisions]]
title = "Where the code lives"
choice = "At home; GitHub as the shop window"
why = "Internal things have no reason to leave. GitHub shows what I want to show: a sanitised copy and this site, always behind what already works."

[[text.en.decisions]]
title = "Which Git server"
choice = "Forgejo"
why = "One binary and SQLite: it runs in a gigabyte of memory. A full GitLab needs several for the same job, and memory here has other uses."

[[text.en.decisions]]
title = "The runners"
choice = "Two, split by what they can touch"
why = "The one that checks everything has nothing to steal: no secrets, no access. The one that deploys lives on the control node, which could already touch everything, and only serves its own repository."

[[text.en.decisions]]
title = "Applying infrastructure"
choice = "One click, and the exact plan"
why = "A plan that recreates a container with data gets read first. Once there's trust, update-only plans could go on their own; destructive ones, never."

[[text.en.decisions]]
title = "This site"
choice = "Continuous deployment"
why = "If something goes wrong, it's back to the previous commit in minutes and no data is at stake. The leak check runs before deploying, not after."

[text.en.tech_notes]
forgejo = "Git server with PRs, protected branches, Actions and webhooks; two runners in host mode, each with just what it needs."
git = "Origin at home, a backup on every commit, the old central read-only and GitHub as the public copy."
terraform = "Formatting and validation in CI with no state; the PR's plan and a saved plan applied as is."
ansible = "ansible-lint with a baseline, affected playbooks in dry-run and this site deployed with its role."
rust = "This site's CI: formatting, clippy, tests and the build, cached between runs."
postgresql = "A socket-only PostgreSQL on the runner: each test creates its own database."
hardening = "A runner with no secrets, gitleaks over the whole history and a leak check before publishing."
lxc = "Forgejo and the runner, each in its own unprivileged container; the runner is rebuilt from scratch."
linux = "Debian containers with pinned versions and checked checksums for every binary."

