[text.es.incidents.labels]
title = "Trabajos que no arrancaban nunca"
meta = "14-10-2026 · Forgejo"
symptom = "El runner estaba conectado y sin errores, pero los trabajos del CI se quedaban «en espera» para siempre."
options = [
  "El runner no llegaba al servidor",
  "Se registró sin etiqueta, ningún «runs-on» casaba, y tras ponérsela solo busca trabajo cuando cambia la cola",
  "El workflow tenía un error de sintaxis",
  "Actions estaba desactivado en el repositorio",
]
cause = "El runner se registró sin etiquetas, así que no casaba con ningún trabajo. Al ponérselas siguió igual: solo vuelve a pedir trabajo cuando cambia la versión de tareas del servidor, y los trabajos ya estaban en cola."
fix = "Registrarlo con su etiqueta desde el playbook y reiniciarlo una vez. Quedó escrito en la documentación."
lesson = "«En espera» sin errores casi siempre es un problema de emparejamiento, no de conexión. Las etiquetas van desde el primer registro."

[text.es.incidents.validate]
title = "El primer CI salió en rojo, y era lo esperado"
meta = "14-10-2026 · Terraform"
symptom = "terraform validate fallaba en el runner y en mi terminal no. No usa estado ni credenciales."
options = [
  "Faltaban las credenciales de Proxmox",
  "La versión de Terraform era distinta",
  "validate también evalúa file(): el código lee una clave SSH que el runner no tiene",
  "El estado no estaba disponible",
]
cause = "El proveedor lee la clave pública del usuario con file(), y validate evalúa esa función. En el runner, que no tiene secretos, el fichero no existía."
fix = "Un fichero falso a propósito en el runner: deja validar y no abre nada. Lo mismo para la contraseña del vault que pide ansible-lint."
lesson = "Un CI sin secretos destapa todo lo que el código da por hecho de la máquina. Mejor descubrirlo en rojo que tenerlo escondido."

[text.es.incidents.jwt]
title = "Un secreto para algo apagado"
meta = "14-10-2026 · Forgejo"
symptom = "Forgejo no arrancaba: pedía un secreto de OAuth2, y OAuth2 estaba desactivado."
options = [
  "Lo pide igualmente al arrancar: hay que generarlo aunque no se use",
  "La configuración tenía OAuth2 activado sin querer",
  "Era un fallo de permisos del fichero",
  "La versión era incompatible",
]
cause = "La versión instalada comprueba ese secreto al arrancar aunque la función esté apagada."
fix = "Generarlo en el propio contenedor la primera vez, junto a los otros secretos internos. No sale de ahí."
lesson = "Los secretos internos se generan en la máquina que los usa y nunca viajan."

[text.es.incidents.lint]
title = "Un aviso que en mi terminal no salía"
meta = "14-10-2026 · ansible-lint"
symptom = "ansible-lint daba en el runner un aviso nuevo en un rol que en el nodo de control pasaba limpio. Misma versión."
options = [
  "El runner tenía otra configuración de lint",
  "El rol había cambiado entre medias",
  "Una línea base desactualizada",
  "En el nodo de control faltaba una colección y ese rol no se analizaba entero",
]
cause = "El nodo de control no tenía instalada la colección de Kubernetes que usa ese rol, y ansible-lint lo saltaba sin decirlo. El runner instala todas las del fichero de requisitos."
fix = "Arreglar el aviso. Desde entonces la referencia es el CI, que parte de una instalación limpia."
lesson = "«En mi máquina pasa» no vale si mi máquina tiene huecos. Por eso el CI parte de cero."

