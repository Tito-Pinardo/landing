text = "The alerts room, on my phone: one message per run, with the commit and the link."

[text.en.pods.backup]
short = "Backup"
title = "Backup repository"
text = "The same as always: every machine still pushes each commit to it. It has its own unit."

[text.en.pods.site]
short = "This site"
title = "This site"
text = "A Rust binary: what the runner deploys when everything goes green."

[text.en.pods.github]
short = "GitHub"
title = "GitHub, the public copy"
text = "It only gets commits that have already passed CI, the leak check and the deployment."

[text.en.pods.git]
short = "Git over SSH"
title = "Git over SSH"
text = "Its own port for Git, separate from the admin SSH. Only registered keys get in."

[text.en.pods.webui]
short = "Web with 2FA"
title = "Web interface"
text = "Only from home or the VPN, behind the internal gate with two-factor and then the Forgejo login."

[text.en.pods.pr]
short = "PRs, branches"
title = "PRs and a protected branch"
text = "The infrastructure's main branch takes no pushes: only PRs with green CI."

[text.en.pods.hooks]
short = "Webhooks"
title = "Webhooks"
text = "When each run ends, Forgejo calls out with a signed request."

[text.en.pods.runner]
short = "CI runner"
title = "CI runner"
text = "In its own container, without a single secret or any access to the homelab. If it has to read a vault, it reads a deliberately fake one."

[text.en.pods.iaclint]
short = "TF + lint"
title = "Terraform and ansible-lint"
text = "Terraform formatting and validation with no state or credentials; ansible-lint, which only fails on new warnings."

[text.en.pods.rust]
short = "Rust + PG"
title = "Rust and PostgreSQL"
text = "For this site: formatting, clippy, tests against a real PostgreSQL, the build and valid content."

[text.en.pods.gitleaks]
short = "gitleaks"
title = "gitleaks"
text = "Over the whole history, not just the last commit: what was deleted is still in the repository."

[text.en.pods.plan]
short = "PR plan"
title = "The PR's plan"
text = "Terraform plan and the affected playbooks in dry-run. It's posted as a PR comment, before merging."

[text.en.pods.click]
short = "One click"
title = "Approve with one click"
text = "Merging applies nothing: the main branch's plan comes out and I approve it."

[text.en.pods.saved]
short = "Saved plan"
title = "Saved plan"
text = "Exactly that plan is applied. If the state changed afterwards, Terraform refuses instead of doing something else."

[text.en.pods.fugas]
short = "Leak check"
title = "Leak check"
text = "Before anything leaves home: gitleaks, only my public identity as author and no addresses or internal names."

[text.en.pods.avisos]
short = "Alerts"
title = "Alert receiver"
text = "Checks the webhook's signature and sums up the run: repository, branch, commit, duration and link."

[text.en.pods.relay]
short = "Encrypted relay"
title = "Matrix relay"
text = "Posts the alert end-to-end encrypted to the alerts room."

[text.en.pods.mirror]
short = "Old central"
title = "The old central repository"
text = "Read-only now: it rejects pushes explaining how to change the remote and catches up from Forgejo."

[text.en.pods.copia]
short = "Daily copy"
title = "Daily copy"
text = "The Forgejo container, every night to a separate disk: seven dailies and four weeklies."

[text.en.flows.pr]
title = "An infrastructure change, by PR"
steps = [
  "From any of my machines I create a branch: the main one takes no direct pushes.",
  "I push it to Forgejo over SSH.",
  "I open the PR.",
  "The CI runner picks it up: it has no secrets and no access to the homelab.",
  "Terraform formatting and validation, and ansible-lint.",
  "gitleaks over the whole history and a check that every vault is encrypted.",
  "Meanwhile, the deploy runner works out the plan: what Terraform touches and which playbooks, in dry-run.",
  "The plan is posted as a PR comment: I see what's touched before merging.",
  "I merge. The main branch's plan comes out and I approve it with one click.",
  "That saved plan is applied. If anything changed in between, Terraform refuses.",
  "The result goes out through the webhook.",
  "Encrypted, to the alerts room.",
  "And reaches my phone.",
]

[text.en.flows.web]
title = "This site, from a push to the internet"
steps = [
  "I push a change to this site.",
  "It lands on Forgejo, the repository's origin.",
  "The CI runner picks it up.",
  "Formatting, clippy, tests against PostgreSQL, the build, valid content and valid minified JS.",
  "And gitleaks over the whole history.",
  "On green, the deploy runner reviews what isn't public yet.",
  "It builds, deploys with Ansible and waits for the site to answer.",
  "Only then does it push that commit to GitHub.",
  "The webhook reports the result.",
  "And I see it on my phone.",
]

[text.en.flows.red]
title = "Two commits in the red"
steps = [
  "I add my machines' SSH keys to the configuration.",
  "Push.",
  "CI picks it up.",
  "ansible-lint fails: lines over 160 characters. It's the keys.",
  "The alert goes out as soon as the first job fails, without waiting for the rest.",
  "❌ in Element, with the commit and the link to the run.",
  "I fix it: an exception for those lines and only those.",
  "Green.",
  "✅ in Element. Eight alerts went out that day and all eight arrived.",
]

[text.en.flows.mirror]
title = "Changing the origin without losing anyone"
steps = [
  "A machine still pointing at the old central repository tries to push.",
  "The central is read-only now: it rejects the push and says how to change the remote.",
  "The origin is Forgejo.",
  "Every five minutes the central catches up from Forgejo, for anyone still reading it.",
  "The machine changes its remote and pushes.",
  "And the usual backup still gets every commit.",
]

[text.en.flows.rebuild]
title = "What's copied and what's rebuilt"
steps = [
  "The repositories and their history live in Forgejo.",
  "Every night, a copy of the container to a separate disk.",
  "The CI runner isn't copied: it keeps nothing.",
  "It's rebuilt with its playbook, tools at pinned versions with checked checksums.",
  "And the same goes for Rust and PostgreSQL for this site.",
]

[text.en.incidents.labels]
title = "Jobs that never started"
meta = "14-10-2026 · Forgejo"
symptom = "The runner was connected with no errors, but CI jobs sat «waiting» forever."
options = [
  "The runner couldn't reach the server",
  "It registered with no label, no «runs-on» matched, and once labelled it only looks for work when the queue changes",
  "The workflow had a syntax error",
  "Actions was disabled on the repository",
]
cause = "The runner registered with no labels, so it matched no job. Adding them changed nothing: it only asks for work again when the server's task version changes, and the jobs were already queued."
fix = "Register it with its label from the playbook and restart it once. It's written down in the docs."
lesson = "«Waiting» with no errors is nearly always a matching problem, not a connection one. Labels go in from the first registration."

[text.en.incidents.validate]
title = "The first CI run went red, as expected"
meta = "14-10-2026 · Terraform"
symptom = "terraform validate failed on the runner but not in my terminal. It uses no state or credentials."
options = [
  "The Proxmox credentials were missing",
  "The Terraform version was different",
  "validate also evaluates file(): the code reads an SSH key the runner doesn't have",
  "The state wasn't available",
]
cause = "The provider reads the user's public key with file(), and validate evaluates that function. On the runner, which has no secrets, the file didn't exist."
fix = "A deliberately fake file on the runner: validation passes and it opens nothing. Same for the vault password ansible-lint asks for."
lesson = "A CI with no secrets uncovers everything the code assumes about the machine. Better to find it in the red than keep it hidden."

[text.en.incidents.jwt]
title = "A secret for something switched off"
meta = "14-10-2026 · Forgejo"
symptom = "Forgejo wouldn't start: it wanted an OAuth2 secret, and OAuth2 was disabled."
options = [
  "It asks for it at startup anyway: it has to be generated even if unused",
  "OAuth2 had been enabled by mistake",
  "It was a file permissions problem",
  "The version was incompatible",
]
cause = "The installed version checks that secret at startup even with the feature switched off."
fix = "Generate it inside the container the first time, next to the other internal secrets. It never leaves."
lesson = "Internal secrets are generated on the machine that uses them and never travel."

[text.en.incidents.lint]
title = "A warning my terminal didn't show"
meta = "14-10-2026 · ansible-lint"
symptom = "On the runner, ansible-lint raised a new warning in a role that passed clean on the control node. Same version."
options = [
  "The runner had a different lint configuration",
  "The role had changed in between",
  "An out-of-date baseline",
  "The control node was missing a collection, so that role wasn't fully analysed",
]
cause = "The control node didn't have the Kubernetes collection that role uses, and ansible-lint skipped it silently. The runner installs everything in the requirements file."
fix = "Fix the warning. Since then, CI is the reference: it starts from a clean install."
lesson = "«Works on my machine» isn't enough if my machine has gaps. That's why CI starts from scratch."

