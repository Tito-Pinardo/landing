]

[[text.en.decisions]]
title = "Next.js vs plain React or Remix"
choice = "Next.js 14 (App Router)"
why = "Server-side rendering to load in under 500 ms and read the public leaderboards without exposing more endpoints."

[[text.en.decisions]]
title = "NestJS vs Django or Go"
choice = "NestJS"
why = "TypeScript on both sides with the same types, a modular structure that keeps the code tidy, and good WebSocket support."

[[text.en.decisions]]
title = "PostgreSQL vs MongoDB"
choice = "PostgreSQL with JSONB"
why = "Referential integrity where it matters and JSONB for the questions: new exercise types without migrating the schema. The best of both worlds."

[[text.en.decisions]]
title = "Microservices?"
choice = "A modular monolith, and called that"
why = "One module per domain with clear boundaries, without paying the latency and distributed transactions of separate services the project did not need."

[[text.en.decisions]]
title = "Integer IDs or UUIDs"
choice = "UUID"
why = "Nobody can guess how many users there are or walk through them one by one, and merging data later does not clash."

[text.en.tech_notes]
nestjs = "The whole API: one module per domain, JWT and role guards, transactions when awarding XP and the WebSocket gateway."
typescript = "Backend and frontend in TypeScript, sharing the same types in the monorepo."
nextjs = "I contributed to the frontend: server components for the leaderboards and the NextAuth session in an HTTP-only cookie."
postgresql = "UUID schema, questions in JSONB, indexes for the leaderboard and the unique constraint that ended double XP."
