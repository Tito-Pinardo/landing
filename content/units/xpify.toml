[text.es.xp]
difficulties = ["Fácil", "Media", "Difícil", "Épica"]

[text.es.incidents.doublexp]
title = "El doble XP"
meta = "15-01-2026 · Crítica: afectaba a la integridad de los datos"
symptom = "Con mala conexión, algunos usuarios cobraban dos veces el XP de la misma misión."
options = [
  "El cálculo de XP sumaba mal los aciertos.",
  "El navegador reenviaba la petición y el backend procesaba las dos a la vez.",
  "Redis devolvía un ranking antiguo.",
]
cause = "Un reintento del cliente mandaba el mismo POST dos veces y las dos transacciones corrían en paralelo. Supusimos que la transacción bloquearía la fila, pero con el aislamiento por defecto de PostgreSQL (READ COMMITTED) no es así."
fix = "Una restricción única sobre (usuario, misión). El segundo intento falla en la propia base de datos y el backend responde lo mismo que al primero: la operación se vuelve idempotente."
lesson = "Las garantías, en la base de datos; no en la esperanza de que el cliente no repita."

[text.es.incidents.redirect]
title = "El bucle infinito"
meta = "20-01-2026 · Bloqueante: nadie podía iniciar sesión"
symptom = "Al pulsar «Entrar», el navegador rebotaba entre la aplicación y Keycloak hasta rendirse con ERR_TOO_MANY_REDIRECTS."
options = [
  "El certificado de Let's Encrypt había caducado.",
  "Las cookies de sesión estaban bloqueadas.",
  "Keycloak creía que la conexión no era segura.",
]
cause = "Traefik terminaba el HTTPS y hablaba con Keycloak por HTTP interno. Keycloak veía HTTP, redirigía a HTTPS… y Traefik se lo devolvía otra vez."
fix = "Que el proxy diga la verdad: la cabecera X-Forwarded-Proto: https en el middleware de Traefik. Keycloak supo que el cliente ya venía por HTTPS."
lesson = "Detrás de un proxy, las aplicaciones solo saben lo que el proxy les cuenta."

[text.es.incidents.oom]
title = "La build que se quedaba sin memoria"
meta = "02-02-2026 · Media: retrasaba cada despliegue unos 20 minutos"
symptom = "El pipeline fallaba en npm run build con «JavaScript heap out of memory»."
options = [
  "Next.js consumía demasiada memoria generando las páginas estáticas.",
  "Había una fuga de memoria en el backend.",
  "La imagen base de Docker estaba corrupta.",
]
cause = "La compilación de Next.js, junto con otras tareas del runner, se comía los 7 GB de la máquina de CI."
fix = "Más memoria para Node (NODE_OPTIONS=--max-old-space-size=4096) y sin source maps en producción: un 40 % menos de consumo."
lesson = "El CI también es producción: hay que medirlo y darle recursos como a todo lo demás."

[text.es.incidents.hydration]
title = "La hora que no cuadraba"
meta = "Media: la consola se llenaba de avisos"
symptom = "React avisaba sin parar: «Text content did not match. Server: 10:00 AM, Client: 11:00 AM»."
options = [
  "El reloj del servidor estaba mal.",
  "Una dependencia de React estaba desactualizada.",
  "El servidor renderizaba la hora en UTC y el navegador en la hora de España.",
]
cause = "Se pintaban horas con toLocaleTimeString() durante el renderizado. El HTML del servidor (UTC) y el del cliente no coincidían y se rompía la hidratación."
fix = "Tiempos relativos («hace 5 minutos») donde se podía y, donde no, pintar la hora solo en el cliente con un hook useMounted."
lesson = "Si el resultado depende de dónde se ejecuta, no puede renderizarse en los dos sitios."

[text.es.incidents.lock]
title = "Cinco minutos sin servicio"
meta = "Alta: la aplicación dejó de responder durante un despliegue"
symptom = "Durante un despliegue la aplicación se quedó colgada unos cinco minutos."
options = [
  "Traefik perdió la ruta al backend.",
  "Añadir una columna con valor por defecto reescribió y bloqueó la tabla de usuarios.",
  "El pod de PostgreSQL se reinició.",
]
cause = "Una migración hacía ALTER TABLE users ADD COLUMN bio TEXT DEFAULT '…'. En la versión que usábamos eso puede reescribir la tabla entera, y una tabla con carga se queda bloqueada mientras tanto."
fix = "Partirla en tres pasos: añadir la columna sin valor por defecto, rellenar en segundo plano y fijar el valor por defecto al final."
lesson = "Una migración también es código de producción: se revisa pensando en la carga, no solo en el esquema."

[[text.es.timeline]]
title = "Fundamentos"
period = "Iteración 1"
items = [
  "Monorepo y docker-compose con PostgreSQL 16 y Redis 7 antes de escribir lógica de negocio.",
  "API en NestJS con validación de datos y logs de cada petición.",
  "Keycloak, «el primer muro»: realm, clientes, roles y validación del JWT.",
  "Misiones con preguntas en JSONB y los primeros tests del cálculo de XP (incluido el tramposo que responde en 0 segundos).",
]

[[text.es.timeline]]
title = "Experiencia de juego"
period = "Iteración 2"
items = [
  "Interfaz con tema propio, panel con nivel y avatar, y mapa de misiones.",
  "Bucle de juego: máquina de estados, arrastrar y soltar, confeti, sonidos y pantalla que tiembla al fallar.",
  "Alianzas con código de invitación y sucesión automática si se va el líder.",
  "Pruebas con compañeros: «va lento al pasar de pregunta» → precarga de la siguiente.",
]

[[text.es.timeline]]
title = "Tiempo real y escala"
period = "Iteración 3"
items = [
  "Gateway de WebSockets con el JWT comprobado en el handshake.",
  "Chat persistente y salas por alianza.",
  "Redis como puente entre réplicas y caché del ranking.",
  "Límite de mensajes por segundo y avatares en MinIO.",
]

[[text.es.timeline]]
title = "Producción"
period = "Iteración 4"
items = [
  "Dockerfiles multi-stage: de 1,2 GB a 180 MB.",
  "K3s en una VM de mi Proxmox, Traefik, Let's Encrypt y GitOps con Argo CD.",
  "Pruebas de carga con k6 → índices que faltaban → la CPU de la base de datos bajó al 15 %.",
  "Volúmenes probados matando pods, cabeceras de seguridad, Prometheus, Loki, Grafana y la versión 1.0.0.",
]

[[text.es.decisions]]
title = "Next.js frente a React a secas o Remix"
choice = "Next.js 14 (App Router)"
why = "Renderizado en servidor para cargar en menos de 500 ms y leer los rankings públicos sin exponer más endpoints."

[[text.es.decisions]]
title = "NestJS frente a Django o Go"
choice = "NestJS"
why = "TypeScript en las dos partes con los mismos tipos, una estructura modular que obliga a ordenar el código y buen soporte de WebSockets."

[[text.es.decisions]]
title = "PostgreSQL frente a MongoDB"
choice = "PostgreSQL con JSONB"
why = "Integridad referencial donde importa y JSONB para las preguntas: nuevos tipos de ejercicio sin migrar el esquema. Lo mejor de los dos mundos."

[[text.es.decisions]]
title = "¿Microservicios?"
choice = "Monolito modular, y dicho tal cual"
why = "Un módulo por dominio con límites claros, pero sin pagar la latencia y las transacciones distribuidas de servicios separados que el proyecto no necesitaba."

[[text.es.decisions]]
title = "IDs enteros o UUID"
choice = "UUID"
why = "Nadie puede adivinar cuántos usuarios hay ni recorrerlos de uno en uno, y fusionar datos en el futuro no choca."

[text.es.tech_notes]
nestjs = "Toda la API: un módulo por dominio, guards de JWT y roles, transacciones al dar XP y el gateway de WebSockets."
typescript = "Backend y frontend en TypeScript, con los mismos tipos compartidos en el monorepo."
nextjs = "Contribuí al frontend: componentes de servidor para los rankings y la sesión con NextAuth en una cookie HTTP-Only."
postgresql = "Esquema con UUID, preguntas en JSONB, índices para el ranking y la restricción única que acabó con el doble XP."
keycloak = "Login OIDC con PKCE, realm propio, roles de administrador y estudiante, y validación del JWT con sus claves públicas."
kubernetes = "Clúster K3s de un nodo: Deployments, PostgreSQL en StatefulSet, volúmenes, Jobs de migración y rutas de Traefik."
argocd = "GitOps: Argo CD dejaba el clúster igual que lo descrito en Git. Nada se aplicaba a mano."
gitlab-ci = "Lint, tests (Jest y Playwright con informes JUnit), build multi-stage y publicación de imágenes con la etiqueta del commit."
prometheus = "Prometheus con cAdvisor, Loki y Promtail para los logs, y siete reglas de alerta en Grafana."
docker = "Imágenes multi-stage de 1,2 GB a 180 MB; en local todo arrancaba con docker-compose."
redis = "Puente de Socket.io entre réplicas y caché del ranking: de 150 ms a 2 ms."
traefik = "Ingress de K3s con Let's Encrypt, detrás del Traefik de casa. El bucle con Keycloak se arregló con X-Forwarded-Proto."
linux = "El nodo lo preparé desde cero: sistema, cortafuegos y K3s."
proxmox = "La VM del clúster vivía en mi servidor Proxmox, junto al resto del homelab."
git = "Monorepo con ramas por funcionalidad y hooks (husky y lint-staged) que no dejaban commitear código con errores."

[text.es.close]
lessons = [
  "Lo más difícil no fue el código, sino que Keycloak, NestJS y Next.js se entendieran: tokens, roles y redirecciones entre contenedores.",
