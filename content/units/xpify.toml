[text.es.pods.github]
short = "GitHub"
title = "Repositorio (monorepo)"
text = "Frontend, backend, tipos compartidos y manifiestos de Kubernetes en un mismo repositorio. Lo que hay en Git es lo que corre."

[text.es.pods.ci]
short = "CI/CD"
title = "Integración continua"
text = "En cada push: lint, tests (Jest y Playwright, con informes JUnit) y build de las imágenes. Con husky ni siquiera se podía commitear código con errores."

[text.es.pods.registry]
short = "Registro"
title = "Registro de imágenes (GHCR)"
text = "Las imágenes se publicaban con dos etiquetas: latest y el hash del commit, para saber siempre qué versión exacta estaba desplegada."

[text.es.pods.traefik]
short = "Traefik Ingress"
title = "Traefik (Ingress de K3s)"
text = "Repartía el tráfico dentro del clúster: la web al frontend, /api al backend y el login a Keycloak. Certificados de Let's Encrypt automáticos."

[text.es.pods.argocd]
short = "Argo CD"
title = "Argo CD (GitOps)"
text = "Vigilaba el repositorio y dejaba el clúster igual que lo descrito en Git. Nada se aplicaba a mano con kubectl."

[text.es.pods.secrets]
short = "Secrets"
title = "Secrets de Kubernetes"
text = "Contraseñas de la base de datos, Keycloak y MinIO fuera del repositorio: se creaban aparte en el clúster y los pods las leían como variables."

[text.es.pods.migrations]
short = "Migraciones"
title = "Job de migraciones"
text = "Un Job que aplicaba los cambios de esquema antes de arrancar la nueva versión del backend. Así un despliegue nunca encontraba tablas a medias."

[text.es.pods.frontend]
short = "Next.js"
title = "Frontend (Next.js 14)"
text = "SPA con renderizado en servidor: carga inicial por debajo de 500 ms. Los rankings públicos se leían en componentes de servidor y la sesión vivía en una cookie HTTP-Only."

[text.es.pods.backend]
short = "NestJS ×3"
title = "Backend (NestJS, 3 réplicas)"
text = "Mi parte principal: la API REST, un monolito modular con un módulo por dominio (misiones, alianzas, usuarios), guards de JWT y roles, y transacciones al dar XP."

[text.es.pods.ws]
short = "Socket.io"
title = "Tiempo real (Socket.io)"
text = "Gateway de WebSockets: chat de alianza, avisos de XP y rankings que se movían sin recargar. El JWT se comprobaba ya en el handshake."

[text.es.pods.keycloak]
short = "Keycloak"
title = "Keycloak (identidad)"
text = "Login con OIDC y PKCE, realm propio, roles de administrador y estudiante. El backend validaba cada token con las claves públicas de Keycloak."

[text.es.pods.postgres]
short = "PostgreSQL 16"
title = "PostgreSQL 16"
text = "StatefulSet con volumen propio. UUID como claves, preguntas en JSONB (nuevos tipos sin tocar el esquema) e índices pensados para el ranking."

[text.es.pods.redis]
short = "Redis"
title = "Redis"
text = "Dos trabajos: puente de Socket.io entre las réplicas del backend y caché del ranking (Top 10 en 2 ms en vez de 150)."

[text.es.pods.minio]
short = "MinIO (S3)"
title = "MinIO"
text = "Almacenamiento compatible con S3 para los avatares. Un Job creaba los buckets al desplegar."

[text.es.pods.pvc]
short = "Volúmenes (PVC)"
title = "Volúmenes persistentes"
text = "PostgreSQL, Redis y MinIO guardaban sus datos en volúmenes. Lo probé matando el pod de la base de datos: volvía con todo intacto."

[text.es.pods.promtail]
short = "Promtail"
title = "Promtail"
text = "Leía los logs de cada pod directamente del nodo y agrupaba las trazas de error de varias líneas en un solo evento."

[text.es.pods.loki]
short = "Loki"
title = "Loki"
text = "Guardaba los logs con etiquetas (namespace, servicio) para buscarlos desde Grafana sin entrar en ningún pod."

[text.es.pods.prometheus]
short = "Prometheus"
title = "Prometheus"
text = "Métricas de CPU, memoria y disco de cada contenedor a través de cAdvisor, sin agentes extra."

[text.es.pods.grafana]
short = "Grafana"
title = "Grafana"
text = "Paneles ya provisionados y siete reglas de alerta: consumo de recursos y errores en los logs."

