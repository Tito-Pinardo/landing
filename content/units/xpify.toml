]

[text.en.xp]
difficulties = ["Easy", "Medium", "Hard", "Epic"]

[text.en.incidents.doublexp]
title = "Double XP"
meta = "15 Jan 2026 · Critical: data integrity at stake"
symptom = "On flaky connections, some users were paid the XP for the same mission twice."
options = [
  "The XP calculation added up the right answers wrongly.",
  "The browser resent the request and the backend processed both at once.",
  "Redis returned a stale leaderboard.",
]
cause = "A client retry sent the same POST twice and both transactions ran in parallel. We assumed the transaction would lock the row, but with PostgreSQL's default isolation (READ COMMITTED) it does not."
fix = "A unique constraint on (user, mission). The second attempt fails in the database itself and the backend answers exactly as it did the first time: the operation becomes idempotent."
lesson = "Guarantees belong in the database, not in hoping the client never retries."

[text.en.incidents.redirect]
title = "The endless loop"
meta = "20 Jan 2026 · Blocking: nobody could sign in"
symptom = "After clicking «Sign in», the browser bounced between the app and Keycloak until it gave up with ERR_TOO_MANY_REDIRECTS."
options = [
  "The Let's Encrypt certificate had expired.",
  "Session cookies were being blocked.",
  "Keycloak thought the connection was not secure.",
]
cause = "Traefik terminated HTTPS and talked to Keycloak over internal HTTP. Keycloak saw HTTP, redirected to HTTPS… and Traefik sent it straight back."
fix = "Make the proxy tell the truth: the X-Forwarded-Proto: https header in the Traefik middleware. Keycloak then knew the client was already on HTTPS."
lesson = "Behind a proxy, applications only know what the proxy tells them."

[text.en.incidents.oom]
title = "The build that ran out of memory"
meta = "2 Feb 2026 · Medium: delayed every deployment by about 20 minutes"
symptom = "The pipeline failed at npm run build with «JavaScript heap out of memory»."
options = [
  "Next.js used too much memory generating the static pages.",
  "There was a memory leak in the backend.",
  "The Docker base image was corrupt.",
]
cause = "The Next.js build, plus other jobs on the runner, ate the CI machine's 7 GB."
fix = "More memory for Node (NODE_OPTIONS=--max-old-space-size=4096) and no source maps in production: 40 % less memory."
lesson = "CI is production too: measure it and give it resources like everything else."

[text.en.incidents.hydration]
title = "The time that did not match"
meta = "Medium: the console filled up with warnings"
symptom = "React kept warning: «Text content did not match. Server: 10:00 AM, Client: 11:00 AM»."
options = [
  "The server clock was wrong.",
  "A React dependency was out of date.",
  "The server rendered the time in UTC and the browser in Spanish time.",
]
cause = "Times were rendered with toLocaleTimeString() during rendering. The server HTML (UTC) and the client's did not match, which broke hydration."
fix = "Relative times («5 minutes ago») where possible and, elsewhere, render the time on the client only with a useMounted hook."
lesson = "If the result depends on where it runs, it cannot be rendered in both places."

[text.en.incidents.lock]
title = "Five minutes down"
meta = "High: the app stopped responding during a deployment"
symptom = "During a deployment the app hung for about five minutes."
options = [
  "Traefik lost the route to the backend.",
  "Adding a column with a default value rewrote and locked the users table.",
  "The PostgreSQL pod restarted.",
]
cause = "A migration ran ALTER TABLE users ADD COLUMN bio TEXT DEFAULT '…'. On the version we used that can rewrite the whole table, and a table under load stays locked meanwhile."
fix = "Split it into three steps: add the column without a default, backfill in the background and set the default at the end."
lesson = "A migration is production code too: review it with the load in mind, not just the schema."

