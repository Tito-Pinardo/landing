# Unidad 1U del rack: XPIFY por dentro.
#
# Una "unidad" es la página propia de un proyecto con mucha miga: se entra
# desde su pieza en el laboratorio o desde su misión. Arriba va lo que no
# depende del idioma (mapa, recorridos, reglas del cálculo de XP) y abajo los
# textos en `[text.es]` y `[text.en]`, con las mismas claves.
#
# Fuente: la memoria del TFG y la documentación técnica del proyecto. Sin
# direcciones, dominios ni nombres internos: solo qué hacía cada pieza.

id = "xpify"
# Misión (site.toml) a la que pertenece.
project = "xpify"
status = "retired"
# Lo que tenía la propia máquina: se ilumina el marco de la VM.
host_tech = ["proxmox", "linux", "kubernetes"]
# Conexiones fijas del mapa; los recorridos dibujan su camino encima.
links = [
  ["player", "cloudflare"],
  ["friend", "cloudflare"],
  ["cloudflare", "homeedge"],
  ["homeedge", "traefik"],
  ["github", "ci"],
  ["ci", "registry"],
]

# Cálculo de XP tal y como lo hacía el backend:
# XP = base × dificultad × (accuracy_base + acierto × accuracy_weight) × tiempo
# y nivel = floor(level_constant × √XP total) + 1.
[xp]
base_min = 50
base_max = 300
base_default = 100
difficulty = [1.0, 1.2, 1.5, 1.85]
# Segundos: por debajo de cada límite se aplica su factor; por encima del
# último, `time_slow`.
time_limits = [150, 240, 360]
time_factors = [1.25, 1.1, 1.0]
time_slow = 0.9
accuracy_base = 0.6
accuracy_weight = 0.7
level_constant = 0.05

