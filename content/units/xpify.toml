[text.en.flows.login]
title = "Signing in (OIDC + PKCE)"
steps = [
  "You click «Sign in».",
  "The request comes in through Cloudflare, already over HTTPS.",
  "The home Traefik sends it to the cluster VM.",
  "The Ingress decides: the site goes to the frontend.",
  "Next.js redirects you to Keycloak with a PKCE challenge.",
  "Keycloak shows its sign-in form.",
  "You type your credentials (or use Google or GitHub).",
  "They are right: Keycloak sends you back with a one-time code.",
  "The Next.js server picks up the code. The browser never sees the token.",
  "Back-channel exchange: code + PKCE verifier for a JWT.",
  "The session is stored in an HTTP-only cookie (BFF pattern): an XSS cannot read it.",
  "You are in. Every API call carries the JWT and the backend checks its signature.",
]

[text.en.flows.mission]
title = "You finish a mission"
steps = [
  "You answer the last question and your answers are sent with the time each one took.",
  "In through Cloudflare…",
  "…and the home Traefik.",
  "The Ingress sends /api to the backend.",
  "The guard validates the JWT and role. A transaction starts: it marks the answers and works out the XP.",
  "Saves the attempt. A unique constraint stops anyone cashing in the same mission twice.",
  "Commits the transaction and updates your alliance's XP.",
  "Invalidates the cached leaderboard: the next request sees your new position.",
  "Emits the mission_completed event over the WebSocket.",
  "Confetti and «+120 XP» on screen, no reload.",
]

[text.en.flows.chat]
title = "Alliance chat across replicas"
steps = [
  "You type in your alliance chat.",
  "In through Cloudflare…",
  "…and the home Traefik.",
  "The Ingress hands it to the WebSocket. You landed on backend replica 1.",
  "Replica 1 saves the message before emitting it: reloading no longer loses it.",
  "It publishes it to the alliance room (at most 5 messages per second).",
  "Your teammate is on replica 2, which knows nothing about your socket…",
  "…but Redis bridges the replicas and passes the message along.",
  "Replica 2 emits it to its room.",
  "Your teammate sees it instantly. Without Redis, each replica was an island.",
]

[text.en.flows.ranking]
title = "You open the leaderboard"
steps = [
  "You open the global leaderboard.",
  "Cloudflare…",
  "…and the home Traefik.",
  "The Ingress sends the page to the frontend.",
  "A Next.js server component asks the backend for the Top: the HTML arrives already filled in.",
  "The backend checks the cache first.",
  "If the cache is empty (someone just earned XP)…",
  "…it queries PostgreSQL with a descending index on XP: it only reads the top.",
  "Stores the result in Redis for whoever comes next: 2 ms instead of 150.",
  "Next.js renders the table on the server.",
