argocd = "GitOps: Argo CD kept the cluster exactly as described in Git. Nothing was applied by hand."
gitlab-ci = "Lint, tests (Jest and Playwright with JUnit reports), multi-stage builds and images published with the commit tag."
prometheus = "Prometheus with cAdvisor, Loki and Promtail for logs, and seven alert rules in Grafana."
docker = "Multi-stage images from 1.2 GB down to 180 MB; locally everything started with docker-compose."
redis = "Socket.io bridge between replicas and leaderboard cache: from 150 ms to 2 ms."
traefik = "K3s Ingress with Let's Encrypt, behind my home Traefik. The Keycloak loop was fixed with X-Forwarded-Proto."
linux = "I set the node up from scratch: system, firewall and K3s."
proxmox = "The cluster VM lived on my Proxmox server, next to the rest of the homelab."
git = "Monorepo with feature branches and hooks (husky and lint-staged) that refused commits with errors."

