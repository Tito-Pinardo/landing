[text.en.incidents.refresh]
title = "A list that never refreshed"
meta = "03-10-2026 · configuration"
symptom = "The channel list created through the API loaded once and was never downloaded again."
options = [
  "The source was blocking downloads",
  "The API creates it with a refresh interval of zero",
  "The container's cron didn't start",
  "The disk was full",
]
cause = "From the web UI, the daily refresh is set by default. Created through the API, the interval is zero: never."
fix = "Set 24 hours when creating it and correct it on the existing ones too."
lesson = "Automating through an API isn't the same as clicking: defaults can differ. Check the result, not just that it returned 200."

[text.en.incidents.jinja]
title = "A 400 with «'str' object has no attribute 'get'»"
meta = "03-10-2026 · Ansible"
symptom = "When sending the channel group selection, the API answered 400 with a Python error."
options = [
  "The API had a bug",
  "Authentication was missing",
  "The group names had accents",
  "The list built with a template loop arrived as text, not as a list",
]
cause = "A loop inside an Ansible template returns a string that looks like a list. The API expected objects and got text."
fix = "Build the list only with filters, which return real structures."
lesson = "In Ansible, what looks like a list isn't always one. Filters keep the type; templates turn it into text."

[text.en.incidents.newline]
title = "The firewall changed on every pass"
meta = "03-10-2026 · idempotence"
symptom = "Every time the playbook ran, the container's firewall file came out as modified, even though nothing had changed."
options = [
  "The module added a trailing newline and the file never matched the template",
  "The hypervisor rewrote the file",
  "The template had the date in it",
  "Another playbook was touching it",
]
cause = "That file is written through a command's standard input, and Ansible appends a newline. The comparison never matched."
fix = "Tell the module not to add that newline. The second pass now reports zero changes."
lesson = "If the second pass changes anything, it isn't idempotent even if the result is the same. And the same pattern is probably in other roles: noted to review them."

