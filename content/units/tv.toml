[[text.es.decisions]]
title = "¿Convertir en el servidor?"
choice = "No, solo reempaquetar"
why = "Con buena subida, cada uno puede recibir la calidad original. Si una tele de casa la necesita convertida, ya lo hace Plex con su GPU."

