[text.es.incidents.refresh]
title = "Una lista que nunca se actualizaba"
meta = "03-10-2026 · configuración"
symptom = "La lista de canales creada por la API se cargaba una vez y nunca más se volvía a descargar."
options = [
  "La fuente bloqueaba las descargas",
  "La API la crea con el intervalo de recarga a cero",
  "El cron del contenedor no arrancaba",
  "El disco estaba lleno",
]
cause = "Desde la web, la recarga diaria viene puesta. Creada por la API, el intervalo es cero: nunca."
fix = "Fijar las 24 horas al crearla y corregirlo también en las que ya existían."
lesson = "Automatizar por API no es lo mismo que hacer clic: los valores por defecto pueden ser otros. Hay que comprobar el resultado, no solo que respondió 200."

[text.es.incidents.jinja]
title = "Un 400 con «'str' object has no attribute 'get'»"
meta = "03-10-2026 · Ansible"
symptom = "Al enviar la selección de grupos de canales, la API respondía 400 con un error de Python."
options = [
  "La API tenía un fallo",
  "Faltaba autenticación",
  "Los nombres de los grupos llevaban tildes",
  "La lista construida con un bucle de plantilla llegaba como texto, no como lista",
]
cause = "Un bucle dentro de una plantilla de Ansible devuelve una cadena que parece una lista. La API esperaba objetos y recibió texto."
fix = "Construir la lista solo con filtros, que devuelven estructuras de verdad."
lesson = "En Ansible, lo que parece una lista no siempre lo es. Los filtros mantienen el tipo; las plantillas lo convierten en texto."

[text.es.incidents.newline]
title = "El cortafuegos cambiaba en cada pasada"
meta = "03-10-2026 · idempotencia"
symptom = "Cada vez que se pasaba el playbook, el fichero del cortafuegos del contenedor salía como modificado, aunque nada había cambiado."
options = [
  "El módulo añadía un salto de línea al final y el fichero nunca coincidía con la plantilla",
  "El hipervisor reescribía el fichero",
  "La plantilla tenía la fecha dentro",
  "Otro playbook lo tocaba",
]
cause = "Ese fichero se escribe a través de la entrada estándar de un comando, y Ansible añade un salto de línea al final. La comparación nunca daba igual."
fix = "Decirle al módulo que no añada ese salto. La segunda pasada ya da cero cambios."
lesson = "Si la segunda pasada cambia algo, no es idempotente aunque el resultado sea el mismo. Y el mismo patrón probablemente esté en otros roles: queda apuntado para revisarlos."

