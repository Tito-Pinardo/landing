[[text.en.decisions]]
title = "Which manager"
choice = "An active one, with users"
why = "The previous one had stalled. This one merges sources, matches the guide, has per-channel permissions and speaks the three formats needed."

[[text.en.decisions]]
title = "Convert on the server?"
choice = "No, just repackage"
why = "With good upload, everyone can get the original quality. If a TV at home needs it converted, Plex already does that on its GPU."

