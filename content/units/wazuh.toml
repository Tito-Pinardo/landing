[[text.en.decisions]]
title = "How vulnerabilities are counted"
choice = "Against the distribution, not the raw number"
why = "A CVE in a shared library shows up on every machine. What matters is whether the installed version is already fixed, pending or not affected."

[[text.en.decisions]]
title = "What goes in an alert"
choice = "A summary, never the log"
why = "A log can carry data that mustn't leave the server. The alert says what, where and how many times; the detail is on the dashboard."

[[text.en.decisions]]
title = "CIS scores"
choice = "Don't chase the number"
why = "Some controls, applied blindly, would break the hypervisor's firewall or needed services. They're accepted with a written reason."

[text.en.tech_notes]
wazuh = "Manager, indexer and dashboard; agents with logs, file integrity, inventory and vulnerabilities; alert levels measured and tuned."
proxmox = "The hypervisor has its agent and auditd; agents are registered through it."
lxc = "Wazuh runs in its own unprivileged container."
linux = "auditd, journald, AppArmor and spare services reviewed on every machine."
ansible = "Fleet updates, simulated first and without touching kernel or drivers."
python = "The integration that groups repeats and sends summaries to Discord and Matrix."
hardening = "CIS checks reviewed, auditing of critical files and alerts without raw data."

[text.en.close]
lessons = [
  "A security system that alerts on everything alerts on nothing.",
  "Count properly: one CVE in a hundred places is one patch, not a hundred attacks.",
  "Snapshots get deleted.",
]
next = [
