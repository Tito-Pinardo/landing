[text.en.meta]
title = "Inside Wazuh · Tito Pinardo Gutiérrez"
description = "The homelab's security with Wazuh: agents across the fleet, file integrity, vulnerabilities and CIS checks reviewed by hand, and from 9,500 alerts a week to about a hundred."

[text.en.ui]
slot = "1U · WAZUH"
face_specs = "SIEM · FIM · CVE · CIS"
state = "In production"
map_silk = "SEC"
map_title = "Inside the security"
map_intro = "Every machine sends its logs; here it's decided what's suspicious and who gets told. Pick a flow."
vm_title = "Wazuh container · Proxmox"
vm_specs = "manager, indexer and dashboard"
outside = "Outside"
disclaimer = "Rebuilt from my documentation: no addresses, agents, local rules or details useful for an attack."

[text.en.hero]
kicker = "1U unit · Security"
title = "Wazuh · who did what"
tagline = "An agent on every machine sends its logs, watches the files that shouldn't change and takes a package inventory. Wazuh matches them against its rules, known vulnerabilities and CIS checks, and alerts by severity: the serious stuff, encrypted to my phone."
grade = "2,195 → 1,801 vulnerability entries"
facts = [
  { label = "How it's isolated", value = "Unprivileged container with no SSH; the API, indexer and mail only listen inwards, and agent enrolment is closed: they're registered from the hypervisor." },
  { label = "What it watches", value = "Logins, changes to critical files, packages with vulnerabilities and configuration checks on the containers and the server itself." },
  { label = "How it alerts", value = "Grouping repeats in 5-minute windows and never sending raw logs. Only high-level stuff reaches my phone." },
]

