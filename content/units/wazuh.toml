[text.es.incidents.noise]
title = "9.517 avisos en una semana"
meta = "05-10-2026 · ruido"
symptom = "Los avisos de seguridad eran «súper pesados»: miles al día en Discord."
options = [
  "Un ataque continuo",
  "Un agente se había vuelto loco",
  "Se mandaba todo desde nivel 3, y casi todo era rutina: sesiones de Ansible, cron y SSH correctos",
  "Las reglas estaban duplicadas",
]
cause = "Discord recibía desde nivel 3. Dos tercios eran aperturas y cierres de sesión de mis propias automatizaciones, y el resto, SSH correctos y comprobaciones rutinarias."
fix = "Medir una semana por regla y por agente, y subir Discord a nivel 7 y el correo a 10. Lo que se deja de enviar sigue en el panel y Hermes resume los accesos fallidos."
lesson = "Si casi todo lo que llega es rutina, lo importante se pierde entre medias. Se decide con el recuento delante, no a ojo."

[text.es.incidents.pve]
title = "Once cambios «sospechosos» al día en el hipervisor"
meta = "08-09-2026 · integridad"
symptom = "La integridad de ficheros avisaba cada día de cambios en ficheros de configuración del hipervisor, incluidas claves."
options = [
  "Alguien estaba modificando el hipervisor",
  "Esa carpeta es un sistema de ficheros del clúster que se reescribe solo constantemente",
  "Un fallo del disco",
  "Una actualización a medias",
]
cause = "Esa carpeta del hipervisor no son ficheros normales: es una vista de su base de datos interna, que se reescribe a cada momento por su funcionamiento normal."
fix = "Sacarla de la vigilancia de integridad y dejar las rutas que sí importan: cuentas, sudo, SSH y servicios. Además, auditd vigila esos ficheros en el hipervisor."
lesson = "Vigilar algo que cambia siempre no protege: entrena a ignorar el aviso. Hay que saber qué es cada ruta antes de vigilarla."

[text.es.incidents.stuck]
title = "Tres horas parado en «apt upgrade»"
meta = "25-09-2026 · disco"
symptom = "La actualización de la flota se quedó tres horas en el contenedor de Wazuh. No era Ansible ni una pregunta de apt: los procesos estaban esperando al disco."
options = [
  "Un paquete roto",
  "Falta de memoria",
  "La red con el repositorio",
  "Disco del sistema saturado, con dos instantáneas antiguas multiplicando cada escritura",
]
cause = "Todo el sistema y unos 16 contenedores comparten un espejo de dos discos mecánicos, con la caché de escritura apagada. Y el volumen de Wazuh, casi lleno, arrastraba dos instantáneas que convertían cada escritura en varias."
fix = "Borrar las instantáneas, reiniciar el contenedor y terminar la configuración. Activar la caché de escritura de los discos del sistema. Dar al indexador 15 minutos para arrancar."
lesson = "Una instantánea «por si acaso» tiene un coste en cada escritura mientras exista. Se borra cuando ya no hace falta."

[[text.es.timeline]]
title = "Instalación"
period = "06 y 07-09-2026"
items = [
  "Primer intento fallido por la presión de disco; segundo separando la descarga inicial de vulnerabilidades.",
  "Contenedor sin privilegios, sin SSH y con los puertos internos solo hacia dentro.",
  "Agentes en toda la flota.",
]

[[text.es.timeline]]
title = "Revisión completa"
period = "14-09-2026"
items = [
  "342 CVE contrastadas con la distribución y parches oficiales aplicados.",
  "Controles CIS fallidos revisados uno a uno, con excepciones documentadas.",
  "Auditoría de ficheros de cuentas en el hipervisor y servicios sobrantes apagados.",
]

[[text.es.timeline]]
title = "Menos ruido"
period = "Septiembre y octubre de 2026"
items = [
  "Integridad sin la carpeta que cambia sola.",
  "Niveles de aviso ajustados con una semana medida.",
]

[[text.es.decisions]]
title = "Cómo se cuentan las vulnerabilidades"
choice = "Contra la distribución, no el número bruto"
why = "Una CVE en una biblioteca compartida aparece en cada máquina. Lo que importa es si la versión instalada ya está corregida, pendiente o no afectada."

[[text.es.decisions]]
title = "Qué se manda en un aviso"
choice = "Un resumen, nunca el registro"
why = "Un registro puede llevar datos que no deben salir del servidor. El aviso dice qué, dónde y cuántas veces; el detalle está en el panel."

[[text.es.decisions]]
title = "Las puntuaciones CIS"
choice = "No perseguir el número"
why = "Algunos controles, aplicados a ciegas, romperían el cortafuegos del hipervisor o servicios necesarios. Se aceptan con su motivo escrito."

[text.es.tech_notes]
wazuh = "Gestor, indexador y panel; agentes con registros, integridad de ficheros, inventario y vulnerabilidades; niveles de aviso medidos y ajustados."
proxmox = "El hipervisor tiene su agente y auditd; los agentes se registran a través de él."
lxc = "Wazuh corre en su propio contenedor sin privilegios."
linux = "auditd, journald, AppArmor y servicios sobrantes revisados en cada máquina."
ansible = "Las actualizaciones de la flota, con simulación previa y sin tocar kernel ni drivers."
python = "La integración que agrupa repeticiones y manda resúmenes a Discord y a Matrix."
hardening = "Controles CIS revisados, auditoría de ficheros críticos y avisos sin datos en crudo."

[text.es.close]
lessons = [
  "Un sistema de seguridad que avisa de todo no avisa de nada.",
  "Contar bien: una CVE en cien sitios es un parche, no cien ataques.",
  "Las instantáneas se borran.",
]
next = [
  "Repetir la medición de avisos en unas semanas.",
  "Mover el sistema a discos más rápidos para que una actualización no compita con todo el servidor.",
]

