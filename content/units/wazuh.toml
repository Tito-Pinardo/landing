[text.en.incidents.noise]
title = "9,517 alerts in a week"
meta = "05-10-2026 · noise"
symptom = "Security alerts were «unbearable»: thousands a day on Discord."
options = [
  "An ongoing attack",
  "An agent had gone haywire",
  "Everything was sent from level 3, and almost all of it was routine: Ansible sessions, cron and successful SSH",
  "Rules were duplicated",
]
cause = "Discord got everything from level 3. Two thirds were session opens and closes from my own automations, and the rest successful SSH logins and routine checks."
fix = "Measure a week by rule and agent, and raise Discord to level 7 and email to 10. What stops being sent stays on the dashboard and Hermes summarises failed logins."
lesson = "If almost everything that arrives is routine, what matters gets lost in between. Decide with the count in front of you, not by eye."

[text.en.incidents.pve]
title = "Eleven «suspicious» changes a day on the hypervisor"
meta = "08-09-2026 · integrity"
symptom = "File integrity warned every day about changes to the hypervisor's configuration files, keys included."
options = [
  "Someone was modifying the hypervisor",
  "That folder is a cluster file system that rewrites itself constantly",
  "A disk fault",
  "A half-finished update",
]
cause = "That hypervisor folder isn't normal files: it's a view of its internal database, rewritten all the time by normal operation."
fix = "Take it out of integrity monitoring and keep the paths that matter: accounts, sudo, SSH and services. On top of that, auditd watches those files on the hypervisor."
lesson = "Watching something that always changes doesn't protect you: it trains you to ignore the alert. Know what each path is before watching it."

[text.en.incidents.stuck]
title = "Three hours stuck on «apt upgrade»"
meta = "25-09-2026 · disk"
symptom = "The fleet update sat for three hours on the Wazuh container. It wasn't Ansible or an apt prompt: the processes were waiting for the disk."
options = [
  "A broken package",
  "Out of memory",
  "The network to the repository",
  "A saturated system disk, with two old snapshots multiplying every write",
]
cause = "The whole system and about 16 containers share a mirror of two spinning disks, with write cache off. And Wazuh's nearly full volume carried two snapshots that turned each write into several."
fix = "Delete the snapshots, restart the container and finish configuration. Turn on write cache on the system disks. Give the indexer 15 minutes to start."
lesson = "A «just in case» snapshot costs something on every write for as long as it exists. Delete it once it's no longer needed."

