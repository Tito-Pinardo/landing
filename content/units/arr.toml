[text.en.incidents.dbfull]
title = "«database or disk is full»"
meta = "03-08-2026 · disk"
symptom = "The film manager logged 60 database errors in ten minutes."
options = [
  "The database was corrupted",
  "The library pool was full",
  "The container disk where the databases live was almost out of space",
  "Too many requests at once",
]
cause = "It wasn't the library, which has its own pool, but the container's disk, where the databases, Docker images and logs live."
fix = "Grow the container disk by 74 GB from the hypervisor, without stopping it."
lesson = "«Disk full» doesn't say which disk. Check which one before deleting anything from the library."

[text.en.incidents.pack]
title = "A whole season that wouldn't import"
meta = "11-07-2026 · import"
symptom = "A full season had arrived and sat in the queue as finished, but the manager refused to import it and the episodes didn't appear."
options = [
  "It came as a single bundle tied to the series, not to specific episodes, and it couldn't split it on its own",
  "The files were damaged",
  "The series wasn't in the manager",
  "The folder lacked permissions",
]
cause = "With the whole season in one block, the manager knew which series it was but not which file was which episode, and blocks the import so as not to get it wrong."
fix = "Import by hand through the API, specifying each episode. Documented as a procedure."
lesson = "When an automation stops out of caution, the way out isn't to bypass it but to give it the data it's missing."

[text.en.incidents.header]
title = "A «network error» that wasn't the network"
meta = "04-09-2026 · playback"
symptom = "A film gave a network error when played in Plex, on any device."
options = [
  "The router was cutting the connection",
  "The GPU was failing to convert",
  "Plex had a version bug",
  "The file was broken: header zeroed and half its size with no data",
]
cause = "The file had its first megabytes zeroed and took up much less on disk than its stated size: it was incomplete. Plex reported it as a network error."
fix = "Confirm it by looking inside the file and ask the manager to get it again."
lesson = "An error message describes where it was noticed, not where the fault is. Look at the data before the path."

