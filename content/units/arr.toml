]

[[text.es.decisions]]
title = "Cómo se elige la versión"
choice = "Perfiles explícitos"
why = "Decidir caso a caso no escala. Un perfil dice qué idioma, calidad y tamaño son aceptables y el gestor aplica siempre lo mismo."

[[text.es.decisions]]
title = "Cómo se mueven los ficheros"
choice = "Enlaces duros en el mismo pool"
why = "Copiar duplicaría espacio y tiempo. Con enlaces duros mover es instantáneo y no ocupa más."

[text.es.tech_notes]
lxc = "El contenedor de Docker del servidor, con su disco ampliado cuando hizo falta."
docker = "Cada servicio en su contenedor, agrupados en stacks de Docker Compose."
zfs = "La biblioteca en su pool, con enlaces duros para mover sin copiar."
python = "Scripts contra la API de los gestores para importaciones manuales y revisiones."
linux = "ffprobe para mirar los ficheros por dentro."
zabbix = "Vigila los discos y los contenedores."
hardening = "Paneles solo detrás de la puerta interna con doble factor."

[text.es.close]
lessons = [
  "Reglas antes que trabajo manual: los perfiles ordenan mejor que yo.",
  "Leer bien qué disco está lleno y qué está roto de verdad.",
]
next = [
  "Avisos de los gestores en una sala propia en vez de revisarlos a mano.",
]

