  "El disco del contenedor estaba casi lleno.",
  "La monitorización lo tenía en rojo.",
  "Se amplía el disco en caliente.",
  "Y la base vuelve a funcionar, sin perder nada.",
]

[text.es.incidents.dbfull]
title = "«database or disk is full»"
meta = "03-08-2026 · disco"
symptom = "El gestor de películas registró 60 errores de base de datos en diez minutos."
options = [
  "La base de datos estaba corrupta",
  "El pool de la biblioteca estaba lleno",
  "El disco del contenedor donde viven las bases se había quedado casi sin espacio",
  "Demasiadas peticiones a la vez",
]
cause = "No era la biblioteca, que tiene su propio pool, sino el disco del contenedor, donde viven las bases de datos, las imágenes de Docker y los registros."
fix = "Ampliar el disco del contenedor en 74 GB desde el hipervisor, sin pararlo."
lesson = "«Disco lleno» no dice qué disco. Mirar cuál, antes de borrar nada de la biblioteca."

[text.es.incidents.pack]
title = "Una temporada entera que no se importaba"
meta = "11-07-2026 · importación"
symptom = "Una temporada completa había llegado y estaba en la cola como terminada, pero el gestor se negaba a importarla y los episodios no aparecían."
options = [
  "Llegó como un único paquete asociado a la serie, no a episodios concretos, y no podía repartirlo solo",
  "Los ficheros estaban dañados",
  "La serie no estaba en el gestor",
  "Faltaban permisos en la carpeta",
]
cause = "Al venir toda la temporada en un solo bloque, el gestor sabía de qué serie era pero no qué fichero correspondía a qué episodio, y bloquea la importación para no equivocarse."
fix = "Importar a mano por la API, indicando cada episodio. Quedó documentado como procedimiento."
lesson = "Cuando una automatización se para por prudencia, la salida no es saltársela sino darle el dato que le falta."

[text.es.incidents.header]
title = "«Error de red» que no era de red"
meta = "04-09-2026 · reproducción"
symptom = "Una película daba error de red al reproducirla en Plex, en cualquier dispositivo."
options = [
  "El router cortaba la conexión",
  "La GPU fallaba al convertir",
  "Plex tenía un fallo de versión",
  "El fichero estaba roto: la cabecera a ceros y la mitad del tamaño sin datos",
]
cause = "El fichero tenía los primeros megas a cero y ocupaba en disco bastante menos de lo que decía su tamaño: estaba incompleto. Plex lo contaba como error de red."
fix = "Confirmarlo mirando el fichero por dentro y pedir al gestor que lo consiga de nuevo."
lesson = "El mensaje de error describe dónde se notó, no dónde está el fallo. Mirar el dato antes que el camino."

