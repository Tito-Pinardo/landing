[[text.en.decisions]]
title = "How the version is chosen"
choice = "Explicit profiles"
why = "Deciding case by case doesn't scale. A profile says which language, quality and size are acceptable and the manager always applies the same."

[[text.en.decisions]]
title = "How files are moved"
choice = "Hard links on the same pool"
why = "Copying would double space and time. With hard links moving is instant and takes no extra room."

