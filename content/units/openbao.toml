[text.en.meta]
title = "OpenBao, the master keys, inside · Tito Pinardo Gutiérrez"
description = "All my infrastructure's secrets out of the repository and off the disk: read-only 15-minute tokens, manual unsealing and a certificate authority of my own."

[text.en.ui]
slot = "1U · BAO"
face_specs = "OpenBao · keys · seal"
state = "In production"
map_silk = "BAO"
map_title = "The keys, inside"
map_intro = "Where the whole infrastructure's secrets come from, who can ask for them and what happens when the server restarts. Pick a walkthrough."
vm_title = "OpenBao · container on Proxmox"
vm_specs = "one CPU, half a gigabyte of memory and nothing else to do"
outside = "Outside"
disclaimer = "Rebuilt from my own documentation: no addresses, paths or internal names, and of course no secrets at all."

[text.en.hero]
kicker = "1U unit · Secrets"
title = "Secrets, out of the repository and off the disk"
tagline = "The whole infrastructure's secrets lived encrypted in the repository, with a single password kept on the control node's disk next to the Terraform credentials. Now they all live in OpenBao, the open version of Vault, and only their names are left in the repository. Every deployment asks for them with a read-only role, gets a 15-minute token and uses them in memory. After every restart, OpenBao waits sealed until I open it. And along the way it signs the internal services' certificates."
grade = "Secrets in the repository: zero"
facts = [
  { label = "What it holds", value = "Over 90 secrets from every service, split by group, the Terraform credentials and the authority that signs internal certificates. The repository only has the names." },
  { label = "Who asks for them", value = "Only the control node, with a read-only role that works from nowhere else. I log in with the same single sign-on as everywhere else. Every read is audited." },
  { label = "After a restart", value = "Sealed until I open it with a key that isn't on any of the server's disks. Services keep running; what stops is change." },
]

