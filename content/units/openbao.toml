  "Sus datos siguen cifrados.",
  "Se desellan con la misma clave de siempre.",
  "Y si se perdieran la copia y la clave, las dos llaves tienen su copia de emergencia en el gestor de contraseñas: se vuelve a montar desde cero.",
]

[text.es.incidents.audit]
title = "La auditoría que no se dejaba activar"
meta = "15-10-2026 · OpenBao"
symptom = "El script de configuración inicial activaba la auditoría por la API, como dice media documentación de Vault. OpenBao lo rechazaba."
options = [
  "El token no tenía permisos de administrador",
  "La ruta del registro no existía",
  "En esta versión la auditoría solo se declara en el fichero de configuración, no por la API",
  "El almacenamiento estaba sellado",
]
cause = "OpenBao 2.x ya no deja activar la auditoría por la API: es una medida de seguridad de esa rama, y se declara en el fichero de configuración."
fix = "El registro de auditoría va en el fichero de configuración que gestiona Ansible, y sale del script de puesta en marcha."
lesson = "Un fork no es un clon: lo que vale para Vault hay que comprobarlo en OpenBao. Y lo que va en la configuración queda versionado con el resto."

[text.es.incidents.root]
title = "Sin token root, ¿cómo se cambia una contraseña?"
meta = "15-10-2026 · OpenBao"
symptom = "Tocaba cambiar la contraseña de mi usuario de administrador. El token root se había revocado al terminar la instalación y el procedimiento de siempre para generar otro respondía «no permitido»."
options = [
  "Había que reinstalar OpenBao",
  "En esta versión, generar un root sin autenticar viene cerrado: se abre un momento en la configuración y se vuelve a cerrar",
  "La clave de desellado no era la buena",
  "Hacía falta un segundo administrador",
]
cause = "OpenBao 2.x trae cerrados por defecto los caminos sin autenticar para generar un token root. Así nadie puede intentarlo desde la red."
fix = "Abrirlo un momento en la configuración, generar el token con la clave de desellado, hacer el cambio, revocarlo y volver a cerrar. Comprobar que vuelve a negarse. Quedó escrito paso a paso."
lesson = "Que lo peligroso venga cerrado está bien siempre que el camino para abrirlo esté escrito antes de necesitarlo."

[[text.es.timeline]]
title = "Las llaves salen del disco"
period = "15-10-2026"
items = [
  "Contenedor propio con el paquete oficial y su suma fijada, TLS propio, cortafuegos que lo cierra todo salvo lo justo y copia diaria.",
  "Las dos llaves dentro, comprobadas idénticas a las de antes; después, los ficheros en claro borrados y el token root revocado.",
  "El nodo de control pide con un rol de solo lectura y tokens de 15 minutos.",
]

[[text.es.timeline]]
title = "El sello a mano"
period = "15-10-2026"
items = [
  "Vigilancia del sello con aviso en Element.",
  "Desellar desde el navegador, detrás de la puerta interna con doble factor.",
  "Monitorización y seguridad, como el resto de la flota.",
]

[[text.es.timeline]]
title = "Todos los secretos dentro"
period = "15 al 18-10-2026"
items = [
  "Más de 90 secretos de todos los grupos pasan del repositorio a OpenBao, comprobados uno a uno por su huella. En el repositorio quedan sus nombres.",
  "Ya no hay ficheros cifrados ni contraseña que los abra.",
  "Entrar con el inicio de sesión de casa y un rol de escritura solo para crear secretos.",
  "Una autoridad de certificados propia, con ACME, para los servicios internos.",
]

[[text.es.timeline]]
title = "Primer rekey"
period = "15-10-2026"
items = [
  "Contraseña nueva para todos los secretos cifrados, con el contenido comprobado.",
  "Recuperar el acceso de administrador, escrito paso a paso.",
]

[[text.es.decisions]]
title = "Desellar"
choice = "A mano, siempre"
why = "Desellar solo, sin servicios de fuera, implica guardar la clave en el propio servidor, y entonces OpenBao no protege de nada que tenga acceso al disco. El precio: tras un corte de luz no hay despliegues hasta que lo abro. Los servicios siguen funcionando."

[[text.es.decisions]]
title = "Qué entra primero"
choice = "Las llaves maestras, y luego todo"
why = "Con ellas se abre todo lo demás. Mover cada secreto de cada servicio a la vez habría sido un cambio enorme: primero un grupo de prueba y después el resto, comprobando que cada valor leído de OpenBao era idéntico al de antes."

[[text.es.decisions]]
title = "Cómo se piden"
choice = "Solo lectura, desde un sitio y por 15 minutos"
why = "Si algo se filtrara del nodo de control, un token caducado o copiado a otra máquina no sirve, y la auditoría dice qué se leyó."

[[text.es.decisions]]
title = "El token root"
choice = "Ninguno guardado"
why = "Se genera cuando hace falta, con la clave de desellado, y se revoca al terminar. Un root guardado es la llave de todas las llaves."

[[text.es.decisions]]
title = "OpenBao o Vault"
choice = "OpenBao"
why = "Es la versión libre de Vault, con licencia abierta y mantenida por la Linux Foundation. Para lo que uso, es lo mismo."

[text.es.tech_notes]
openbao = "Llaves maestras con AppRole de solo lectura ligado a su origen, tokens de 15 minutos, auditoría, TLS propio y desellado a mano."
hardening = "Cortafuegos que lo cierra todo salvo lo justo, certificado fijado en el cliente, web solo detrás de doble factor y ningún token root guardado."
lxc = "Un contenedor sin privilegios solo para esto, con copia diaria a otro disco."
linux = "Debian con el paquete oficial y su suma comprobada."
ansible = "Cada grupo lee sus secretos de OpenBao al desplegar; en el inventario solo están sus nombres."
terraform = "Un envoltorio que le pasa las credenciales de OpenBao en memoria, también en el despliegue por PR."
git = "En el repositorio solo están los nombres de los secretos: ni valores ni ficheros cifrados."
proxmox = "El token de su API sale de OpenBao en cada plan."

[text.es.close]
lessons = [
  "Una llave en el disco de la máquina que la usa no es una llave guardada.",
  "Lo que se para con el sello son los cambios, no los servicios: es un buen precio.",
  "El procedimiento de emergencia se escribe antes de la emergencia.",
]
next = [
  "Un kit de recuperación fuera del servidor con las claves que no pueden perderse.",
  "Entrar con passkeys, sin contraseña.",
]

