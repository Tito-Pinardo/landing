[text.es.meta]
title = "OpenBao, las llaves maestras, por dentro · Tito Pinardo Gutiérrez"
description = "Todos los secretos de mi infraestructura fuera del repositorio y del disco: tokens de 15 minutos de solo lectura, desellado a mano y una autoridad de certificados propia."

[text.es.ui]
slot = "1U · BAO"
face_specs = "OpenBao · llaves · sello"
state = "En producción"
map_silk = "BAO"
map_title = "Las llaves por dentro"
map_intro = "De dónde salen los secretos de toda la infraestructura, quién puede pedirlos y qué pasa cuando el servidor se reinicia. Elige un recorrido."
vm_title = "OpenBao · contenedor en Proxmox"
vm_specs = "una CPU, medio giga de memoria y nada más que hacer"
outside = "Fuera"
disclaimer = "Reconstrucción a partir de mi documentación: sin direcciones, rutas ni nombres internos, y por supuesto sin ningún secreto."

[text.es.hero]
kicker = "Unidad 1U · Secretos"
title = "Los secretos, fuera del repositorio y del disco"
tagline = "Los secretos de toda la infraestructura vivían cifrados en el repositorio, con una sola contraseña guardada en el disco del nodo de control junto a las credenciales de Terraform. Ahora viven todos en OpenBao, la versión libre de Vault, y en el repositorio solo quedan sus nombres. Cada despliegue los pide con un rol de solo lectura, recibe un token de 15 minutos y los usa en memoria. Tras cada reinicio, OpenBao espera sellado hasta que lo abro yo. Y de paso firma los certificados de los servicios internos."
grade = "Secretos en el repositorio: cero"
facts = [
  { label = "Qué guarda", value = "Más de 90 secretos de todos los servicios, separados por grupo, las credenciales de Terraform y la autoridad que firma los certificados internos. En el repositorio solo están los nombres." },
  { label = "Quién los pide", value = "Solo el nodo de control, con un rol de solo lectura que no vale desde ningún otro sitio. Yo entro con el mismo inicio de sesión que en el resto. Cada lectura queda auditada." },
  { label = "Tras un reinicio", value = "Sellado hasta que lo abro con una clave que no está en ningún disco del servidor. Los servicios siguen funcionando; lo que se para son los cambios." },
]

