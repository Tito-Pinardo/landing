title = "Backup disk"
text = "The container's daily copy, on another disk."

[text.en.pods.tls]
short = "Own TLS"
title = "Own TLS"
text = "Its own certificate, pinned on the client: nobody can pretend to be OpenBao."

[text.en.pods.raft]
short = "Storage"
title = "Integrated storage"
text = "Data is encrypted on disk: without unsealing it can't be read, not even from the copy."

[text.en.pods.seal]
short = "Seal"
title = "The seal"
text = "After every start, OpenBao hands out nothing until someone enters the key."

[text.en.pods.audit]
short = "Audit"
title = "Audit log"
text = "Who asked for what and when, every time. Declared in the configuration."

[text.en.pods.approle]
short = "AppRole"
title = "Deployment AppRole"
text = "The identity the control node uses to ask for the keys."

[text.en.pods.ipbind]
short = "Only from there"
title = "Bound to one origin"
text = "That role only works from the control node. Copied to another machine, it's useless."

[text.en.pods.ttl]
short = "15-min token"
title = "Short tokens"
text = "Every token expires in 15 minutes. If one leaked, it would be worth little and from one place only."

[text.en.pods.policy]
short = "Read-only"
title = "Read-only policy"
text = "It can read the two keys and nothing else: no writing, no listing other paths."

[text.en.pods.vaultpass]
short = "Per group"
title = "Secrets per group"
text = "Each Ansible group reads its own from OpenBao when deploying. There are no encrypted files left, nor a password to open them."

[text.en.pods.tf]
short = "tf"
title = "Terraform with borrowed keys"
text = "A Terraform wrapper that fetches the credentials from OpenBao and passes them in memory."

[text.en.pods.deploy]
short = "Deploy"
title = "The deploy runner"
text = "Asks for the keys before every plan and every apply."

[text.en.pods.secreto]
short = "Write role"
title = "Write role"
text = "Scripts that create secrets use another role: it can only create and change the groups' ones, and only from the control node. It can't read the Terraform credentials."

[text.en.pods.watch]
short = "Watcher"
title = "Seal watcher"
text = "Every 10 minutes it checks whether OpenBao is sealed or not answering, and reports changes."

[text.en.pods.unsealui]
short = "Web with 2FA"
title = "Unseal from the browser"
text = "Only from home or the VPN, with two-factor. I log in with the same single sign-on as the other panels."

[text.en.pods.copia]
short = "Daily copy"
title = "Daily copy"
text = "The whole container, every night, on the backup server. The data is already encrypted."

[text.en.pods.rekey]
short = "Home CA"
title = "Certificate authority"
text = "Signs the internal services' certificates over ACME, like Let's Encrypt. Its root is installed on every machine."

[text.en.flows.deploy]
title = "A deployment with the keys off the disk"
steps = [
  "Time to deploy.",
  "The runner identifies itself with its AppRole.",
  "OpenBao checks the request comes from the control node.",
  "And that it only asks for what its policy allows: reading the two keys.",
  "It gets a 15-minute token.",
  "Ansible asks for each group's secrets with that token.",
  "From the repository it only takes their names.",
  "Terraform gets its credentials in memory.",
  "And talks to the Proxmox API.",
  "Every read lands in the audit log.",
]

[text.en.flows.restart]
title = "After a restart"
steps = [
  "The server boots and OpenBao stays sealed.",
  "The watcher sees it within 10 minutes.",
  "It posts to Element: «OpenBao is sealed».",
  "I see it.",
  "I take the key from my password manager.",
  "I paste it into the web page, behind the two-factor gate.",
  "Unsealed. «Unsealed again» arrives.",
  "And deployments carry on where they were.",
]

[text.en.flows.change]
title = "Changing a secret"
steps = [
  "I need to change a service's password.",
  "I log into OpenBao with my usual sign-on, with two-factor.",
  "I create a new version of the secret in its group. The previous one is kept in case I need to go back.",
  "The change lands in the audit log.",
  "That service's next deployment already uses the new one.",
  "Nothing changes in the repository: it only has the name.",
]

[text.en.flows.pki]
title = "Certificates for what doesn't face the internet"
steps = [
  "Ansible installs the home authority's root on every machine.",
  "The authority lives in OpenBao and speaks ACME, the same protocol as Let's Encrypt, only for internal names and only from home.",
  "The internal gate asks it for each panel's certificates and renews them on its own, every 90 days at most.",
  "And my browsers trust them without warnings.",
]

[text.en.flows.admin]
title = "Getting admin access back"
steps = [
  "No root token is stored anywhere, on purpose.",
  "When one is needed, a temporary one is generated with the unseal key.",
  "OpenBao ships with that path closed: it's opened briefly in the configuration and restarted, which seals it again.",
  "With the temporary token I make the change, and nothing else.",
  "I revoke it: the audit log keeps the record.",
  "And I close the path again. I check it: it must refuse once more.",
]

[text.en.flows.lost]
title = "If OpenBao is lost entirely"
steps = [
  "The container breaks beyond repair.",
  "It's restored from the daily copy.",
  "Its data is still encrypted.",
  "It's unsealed with the same key as always.",
  "And if both the copy and the key were lost, the two keys have their emergency copy in the password manager: it's rebuilt from scratch.",
]

[text.en.incidents.audit]
title = "The audit log that wouldn't switch on"
meta = "15-10-2026 · OpenBao"
symptom = "The setup script enabled auditing through the API, as half of Vault's documentation says. OpenBao rejected it."
options = [
  "The token didn't have admin rights",
  "The log path didn't exist",
  "In this version auditing is only declared in the configuration file, not through the API",
  "The storage was sealed",
]
cause = "OpenBao 2.x no longer lets you enable auditing through the API: it's a security measure in that branch, and it's declared in the configuration file."
fix = "The audit log goes in the configuration file Ansible manages, and out of the setup script."
lesson = "A fork isn't a clone: what works for Vault has to be checked on OpenBao. And what goes in the configuration is versioned with everything else."

[text.en.incidents.root]
title = "No root token: how do you change a password?"
meta = "15-10-2026 · OpenBao"
symptom = "I had to change my admin user's password. The root token had been revoked after installing, and the usual way to generate another answered «not allowed»."
options = [
  "OpenBao had to be reinstalled",
  "In this version, generating a root without authenticating ships closed: it's opened briefly in the configuration and closed again",
  "The unseal key was the wrong one",
  "A second administrator was needed",
]
cause = "OpenBao 2.x ships with the unauthenticated paths for generating a root token closed by default. That way nobody can try it from the network."
fix = "Open it briefly in the configuration, generate the token with the unseal key, make the change, revoke it and close it again. Check that it refuses once more. It's written down step by step."
lesson = "Dangerous things shipping closed is good, as long as the way to open them is written down before you need it."

[[text.en.timeline]]
title = "The keys leave the disk"
period = "15-10-2026"
items = [
  "Its own container with the official package and pinned checksum, its own TLS, a firewall that closes everything but the essentials, and a daily copy.",
  "Both keys inside, checked identical to the old ones; then the plain-text files deleted and the root token revoked.",
  "The control node asks with a read-only role and 15-minute tokens.",
]

[[text.en.timeline]]
title = "The seal, by hand"
period = "15-10-2026"
items = [
  "A seal watcher with alerts in Element.",
  "Unsealing from the browser, behind the internal gate with two-factor.",
  "Monitoring and security, like the rest of the fleet.",
]

[[text.en.timeline]]
title = "All the secrets inside"
period = "15 to 18-10-2026"
items = [
  "Over 90 secrets from every group move from the repository to OpenBao, checked one by one by fingerprint. Their names stay in the repository.",
  "No encrypted files left, nor a password to open them.",
  "Logging in with the home sign-on, and a write role only for creating secrets.",
  "A certificate authority of my own, with ACME, for internal services.",
]

[[text.en.timeline]]
title = "First rekey"
period = "15-10-2026"
items = [
  "A new password for every encrypted secret, with the content checked.",
  "Getting admin access back, written down step by step.",
]

[[text.en.decisions]]
title = "Unsealing"
choice = "By hand, always"
why = "Auto-unseal without outside services means keeping the key on the server itself, and then OpenBao protects against nothing with disk access. The price: after a power cut there are no deployments until I open it. Services keep running."

[[text.en.decisions]]
title = "What goes in first"
choice = "The master keys, then everything"
why = "They open everything else. Moving every service's secrets at once would have been a huge change: first a test group, then the rest, checking that each value read from OpenBao was identical to the old one."

[[text.en.decisions]]
title = "How they're requested"
choice = "Read-only, from one place, for 15 minutes"
why = "If something leaked from the control node, an expired token or one copied to another machine is useless, and the audit log says what was read."

[[text.en.decisions]]
title = "The root token"
choice = "None stored"
why = "It's generated when needed, with the unseal key, and revoked afterwards. A stored root is the key to all keys."

[[text.en.decisions]]
title = "OpenBao or Vault"
choice = "OpenBao"
why = "It's the open version of Vault, openly licensed and maintained under the Linux Foundation. For what I use it's the same."

[text.en.tech_notes]
openbao = "Master keys behind a read-only AppRole bound to its origin, 15-minute tokens, auditing, its own TLS and manual unsealing."
hardening = "A firewall that closes everything but the essentials, a certificate pinned on the client, the web page only behind two-factor and no stored root token."
lxc = "An unprivileged container just for this, copied daily to another disk."
linux = "Debian with the official package and its checksum verified."
ansible = "Each group reads its secrets from OpenBao when deploying; the inventory only has their names."
terraform = "A wrapper that passes it the credentials from OpenBao in memory, in PR deploys too."
git = "The repository only has the secrets' names: no values, no encrypted files."
proxmox = "Its API token comes from OpenBao on every plan."

[text.en.close]
lessons = [
  "A key on the disk of the machine that uses it isn't a key kept safe.",
  "What the seal stops is change, not services: a good price.",
  "The emergency procedure is written before the emergency.",
]
next = [
  "An off-server recovery kit with the keys that must never be lost.",
  "Logging in with passkeys, no password.",
]
