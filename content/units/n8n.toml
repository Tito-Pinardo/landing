text = "n8n doesn't touch the Docker socket directly: it goes through a proxy that only allows what's needed."

[text.en.flows.run]
title = "A normal run"
steps = [
  "30 minutes pass and the trigger fires.",
  "The source is checked.",
  "The list of new items arrives.",
  "The filter compares it with the record.",
  "What's already processed is dropped.",
  "Two new items are left.",
  "The headless browser fetches each one's file.",
  "The API answers with each file's name.",
  "Each item reads its own by exact name. Before, with two at once, they could get crossed.",
  "They're delivered to the target service, each with its own data.",
  "The target answers for each one.",
  "Responses are matched with their items: both accepted.",
  "Only now are they written to the record.",
  "And the temporary files are cleaned up.",
]

[text.en.flows.fail]
title = "Something fails halfway"
steps = [
  "An item is delivered.",
  "The target doesn't accept it.",
  "No confirmation arrives.",
  "The item stays pending, out of the record.",
  "The failure stays in the history to review.",
  "On the next run it comes back as new.",
]

[text.en.flows.zombie]
title = "A browser that doesn't close"
steps = [
  "A page takes too long and the API errors.",
  "Before, the error dropped the reference to the browser but didn't close it: the process stayed alive.",
  "The container's memory climbs day after day.",
  "Until I notice: 31 GB used out of 32.",
  "Now every error closes the browser before forgetting it.",
  "Orphaned processes stay at zero.",
]

[text.en.flows.deploy]
title = "It gets deployed"
