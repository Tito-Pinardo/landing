[text.en.pods.filter]
short = "Filter"
title = "Filter against the record"
text = "Keeps only what hasn't been processed yet."

[text.en.pods.send]
short = "Deliver"
title = "Delivery"
text = "Sends each item to the target service, with that item's data and not the first one in the batch."

[text.en.pods.browser]
short = "Browser"
title = "Headless browser"
