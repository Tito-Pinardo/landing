[[text.en.decisions]]
title = "When something is marked done"
choice = "When the target confirms it"
why = "Marking it earlier is simpler and works 99 % of the time. The other 1 % is lost without anyone seeing."

[[text.en.decisions]]
title = "Docker access"
choice = "Through a limited proxy"
why = "Giving an automation tool the whole Docker socket is giving it the server. The proxy only allows the operations it needs."

[text.en.tech_notes]
terraform = "Creates the automation container."
