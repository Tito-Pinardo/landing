[text.en.incidents.skip]
title = "Items that vanished without a trace"
meta = "June 2026 · flow"
symptom = "A run found three new items. Only one reached the target. The other two were never tried again."
options = [
  "The target rejected them as duplicates",
  "The record marked everything found as done, not what was confirmed, and with several at once the files got crossed",
  "The source had removed them",
  "The trigger skipped a run",
]
cause = "Two bugs together. The record was built from everything the filter saw as new, not from what the target confirmed. And with several items in one batch, file reading took «whatever was there», not each item's own."
fix = "Only what the target confirms is recorded, matching each response with its item. Each item reads its file by the name the API returned and is sent with its own data."
lesson = "A «done» record is written after doing, never before. Otherwise a failure stops being temporary and becomes permanent and silent."

[text.en.incidents.zombies]
title = "31 GB of 32 in use"
meta = "05-09-2026 · memory"
symptom = "The container was about to run out of memory. n8n itself was using 264 MB."
options = [
  "n8n had a memory leak",
  "The run history was huge",
  "The system cache wasn't being freed",
  "Over 2,000 orphaned browser processes, piled up over weeks",
]
cause = "On any error, the API dropped its reference to the browser without closing it. The process lived forever: 2,104 browsers piled up over 22 days."
fix = "Close the browser on every error before forgetting it. Killing the orphans freed about 28 GB at once and, since the fix, the count stays at zero even when the site fails."
lesson = "Dropping a reference doesn't free what's behind it. Whatever is opened gets closed on the error path too."

[text.en.incidents.perms]
title = "The same job, 51 times"
meta = "18-09-2026 · permissions"
symptom = "For 28 hours the flow failed every half hour and repeated the same work over and over."
options = [
  "The temp folder had been created by root and n8n, without root, couldn't delete: the error cut the flow before recording",
  "The target was down",
  "The disk was full",
  "The trigger had been duplicated",
]
cause = "After moving the service to code, the role created that folder without an explicit owner. Clean-up failed with «Permission denied», cut the flow before writing the record and the next run saw the same items as new again."
fix = "Create that folder in the same task as the others, owned by the n8n user, and rerun the role: only that task changed."
lesson = "When moving something to code, whatever used to be fine «just because» has to be written down: here, a folder's owner."

