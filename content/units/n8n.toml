[text.es.hero]
kicker = "Unidad 1U · Automatización"
title = "n8n · lo que se hace solo"
tagline = "Tareas que antes hacía a mano y ahora son flujos: cada 30 minutos uno revisa una web con un navegador sin cabeza, compara con lo que ya ha procesado, obtiene lo nuevo y lo entrega a otro servicio. Lo difícil no es hacerlo, es no perder nada cuando algo falla a mitad."
grade = "Registro solo tras confirmar"
facts = [
  { label = "Por qué n8n", value = "Los flujos se ven como un grafo, cada ejecución queda registrada con sus datos y se puede relanzar. Para tareas programadas entre servicios, es más fácil de depurar que un script suelto." },
  { label = "La regla", value = "Algo solo se marca como hecho cuando el servicio de destino confirma que lo recibió. Si no, se queda pendiente y la siguiente ejecución lo vuelve a intentar." },
  { label = "Cómo se despliega", value = "Terraform crea el contenedor y un rol de Ansible levanta n8n, el navegador sin cabeza y el flujo. Las carpetas compartidas nacen con el dueño correcto." },
]

