[text.es.meta]
title = "n8n por dentro · Tito Pinardo Gutiérrez"
description = "Las automatizaciones del homelab en n8n: un flujo programado con navegador sin cabeza, un registro que solo se escribe tras confirmar, y tres averías que enseñaron a no perder trabajo en silencio."

[text.es.ui]
slot = "1U · N8N"
face_specs = "n8n · navegador sin cabeza · cada 30 min"
state = "En producción"
map_silk = "FLOW"
map_title = "Un flujo por dentro"
map_intro = "Cada media hora, un flujo busca novedades y las entrega a otro servicio. Elige un recorrido para ver dónde se puede perder algo y cómo se evita."
vm_title = "Contenedor de automatizaciones · Proxmox"
vm_specs = "n8n + navegador sin cabeza"
outside = "Fuera"
