[text.en.meta]
title = "Inside n8n · Tito Pinardo Gutiérrez"
description = "The homelab's automations in n8n: a scheduled flow with a headless browser, a record only written after confirmation, and three failures that taught me not to lose work silently."

[text.en.ui]
slot = "1U · N8N"
face_specs = "n8n · headless browser · every 30 min"
state = "In production"
map_silk = "FLOW"
map_title = "Inside a flow"
map_intro = "Every half hour, a flow looks for new items and hands them to another service. Pick a flow to see where something could get lost and how that's avoided."
vm_title = "Automation container · Proxmox"
vm_specs = "n8n + headless browser"
outside = "Outside"
disclaimer = "Told generically on purpose: no sources, target services or the content being moved."

[text.en.hero]
kicker = "1U unit · Automation"
title = "n8n · what happens on its own"
tagline = "Tasks I used to do by hand that are now flows: every 30 minutes one checks a website with a headless browser, compares with what it has already processed, fetches what's new and hands it to another service. The hard part isn't doing it, it's not losing anything when something fails halfway."
grade = "Recorded only after confirmation"
facts = [
  { label = "Why n8n", value = "Flows look like a graph, every run is logged with its data and can be rerun. For scheduled tasks between services it's easier to debug than a loose script." },
  { label = "The rule", value = "Something is only marked done when the target service confirms it got it. Otherwise it stays pending and the next run tries again." },
  { label = "How it's deployed", value = "Terraform creates the container and an Ansible role brings up n8n, the headless browser and the flow. Shared folders are created with the right owner." },
]

[[text.en.stats]]
value = "2,104"
label = "orphaned browser processes found"

[[text.en.stats]]
value = "28 GB"
label = "of RAM freed by closing them"

[[text.en.stats]]
