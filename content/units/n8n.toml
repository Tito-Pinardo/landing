[text.es.incidents.skip]
title = "Elementos que desaparecían sin dejar rastro"
meta = "Junio de 2026 · flujo"
symptom = "Una ejecución encontró tres novedades. Solo una llegó al destino. Las otras dos no volvieron a intentarse nunca."
options = [
  "El destino las rechazaba por duplicadas",
  "El registro apuntaba como hechos todos los encontrados, no los confirmados, y con varios a la vez los ficheros se cruzaban",
  "La fuente las había retirado",
  "El disparador se saltó una ejecución",
]
cause = "Dos fallos juntos. El registro se construía con todo lo que el filtro había visto como nuevo, no con lo que el destino había confirmado. Y con varios elementos en la misma tanda, la lectura de ficheros cogía «el que hubiera», no el de cada uno."
fix = "Solo se registra lo que el destino confirma, cruzando cada respuesta con su elemento. Cada elemento lee su fichero por el nombre que devolvió la API y se envía con sus propios datos."
lesson = "Un registro de «hechos» se escribe después de hacer, nunca antes. Si no, un fallo deja de ser temporal y se vuelve permanente y silencioso."

[text.es.incidents.zombies]
title = "31 GB de 32 en uso"
meta = "05-09-2026 · memoria"
symptom = "El contenedor estaba al borde de quedarse sin memoria. n8n en sí usaba 264 MB."
options = [
  "n8n tenía una fuga de memoria",
  "El historial de ejecuciones era enorme",
  "La caché del sistema no se liberaba",
  "Más de 2.000 procesos de navegador huérfanos, acumulados durante semanas",
]
cause = "Ante cualquier error, la API soltaba su referencia al navegador sin cerrarlo. El proceso seguía vivo para siempre: 2.104 navegadores acumulados en 22 días."
fix = "Cerrar el navegador en cada error antes de olvidarlo. Matar los huérfanos liberó unos 28 GB al instante y, desde el arreglo, el recuento se queda en cero aunque la web falle."
lesson = "Soltar una referencia no libera lo que hay detrás. Lo que se abre, se cierra también en el camino del error."

[text.es.incidents.perms]
title = "La misma tarea, 51 veces"
meta = "18-09-2026 · permisos"
symptom = "Durante 28 horas, el flujo falló cada media hora y repetía el mismo trabajo una y otra vez."
options = [
  "La carpeta temporal la había creado root y n8n, sin root, no podía borrar: el error cortaba el flujo antes de registrar",
  "El destino estaba caído",
  "El disco estaba lleno",
  "El disparador se había duplicado",
]
cause = "Tras pasar el servicio a código, el rol creaba esa carpeta sin dueño explícito. La limpieza fallaba con «Permission denied», cortaba el flujo antes de escribir el registro y la siguiente ejecución volvía a ver lo mismo como nuevo."
fix = "Crear esa carpeta en la misma tarea que el resto, con el dueño del usuario de n8n, y relanzar el rol: solo cambió esa tarea."
lesson = "Al pasar algo a código, lo que antes estaba bien «porque sí» hay que escribirlo: aquí, el dueño de una carpeta."

[[text.es.timeline]]
title = "El flujo"
period = "Junio de 2026"
items = [
  "Primer flujo programado con navegador sin cabeza.",
  "Arreglo del registro: solo tras confirmar.",
]

[[text.es.timeline]]
title = "A código"
period = "16-09-2026"
items = [
  "Contenedor nuevo con Terraform y rol de Ansible para todo el stack.",
  "El antiguo, parado como margen.",
  "Panel fuera de internet el 26-09.",
]

[[text.es.decisions]]
title = "Cuándo se apunta algo como hecho"
choice = "Cuando el destino lo confirma"
why = "Apuntarlo antes es más sencillo y funciona el 99 % de las veces. El 1 % restante se pierde sin que nadie lo vea."

[[text.es.decisions]]
title = "Acceso a Docker"
choice = "A través de un proxy limitado"
why = "Dar a una herramienta de automatización el socket de Docker entero es darle el servidor. El proxy solo deja las operaciones que necesita."

[text.es.tech_notes]
terraform = "Crea el contenedor de las automatizaciones."
ansible = "El rol que levanta n8n, el navegador sin cabeza y el flujo, con las carpetas y sus dueños."
lxc = "Corre en su propio contenedor LXC."
docker = "n8n, la API del navegador y el proxy del socket, en un mismo stack."
linux = "Usuarios y dueños de las carpetas compartidas, y procesos que se cierran de verdad."
typescript = "La API del navegador sin cabeza y los nodos de código del flujo, en JavaScript."
zabbix = "Vigila la memoria del contenedor."
hardening = "Panel solo detrás de la puerta interna, n8n sin root y Docker a través de un proxy."

[text.es.close]
lessons = [
  "Registrar después de confirmar, no antes.",
  "Lo que se abre se cierra también cuando hay error.",
  "Al pasar algo a código, escribir hasta lo que parecía obvio.",
]
next = [
  "Un aviso cuando un flujo falla varias veces seguidas, en vez de descubrirlo por el historial.",
]

