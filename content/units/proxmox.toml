[text.es.incidents.lvm]
title = "Ningún contenedor arrancaba tras un corte"
meta = "07-08-2026 · almacenamiento"
symptom = "Tras un corte de luz, el servidor arrancó solo, pero ningún contenedor ni VM llegó a iniciar. La documentación tampoco se podía abrir: también estaba dentro."
options = [
  "Se había roto un disco del espejo",
  "El almacenamiento de los contenedores quedó a medio activar tras su comprobación",
  "Proxmox había perdido su configuración",
  "La red no levantaba",
]
cause = "El apagado brusco dejó el LVM-thin marcado para revisión. La revisión tardó entre 65 y 90 minutos en discos mecánicos, y dejó sus piezas internas activas por separado, lo que impedía activar el conjunto."
fix = "Esperar a la revisión, desactivar a mano las dos piezas sueltas y activar el conjunto. Después, arrancar a mano todos los contenedores: el arranque automático solo se intenta una vez."
lesson = "Escribir el postmortem con el paso exacto: la próxima vez, ir directo a desactivar las piezas sueltas ahorra otra revisión entera. Y un SAI evitaría todo esto."

[text.es.incidents.fwoptions]
title = "Reglas de cortafuegos que no hacían nada"
meta = "22-09-2026 · cortafuegos"
symptom = "Había restringido el SSH de los contenedores a mis equipos y la VPN, y bloqueado el puerto de la base vectorial. Desde otro contenedor se llegaba igual a los dos."
options = [
  "El cortafuegos del hipervisor estaba apagado",
  "Las reglas tenían un error de sintaxis",
  "Los contenedores usaban otra interfaz",
  "Un fichero de reglas sin su sección de opciones con «enable: 1» no se aplica",
]
cause = "Los contenedores que sí filtraban tenían en su fichero una sección de opciones con el cortafuegos activado. Los demás solo tenían reglas: Proxmox las guarda, pero no las aplica, aunque la interfaz tenga el cortafuegos marcado."
fix = "Activar la sección de opciones en los 11 contenedores afectados y comprobarlo desde fuera, intentando conectar a lo que debía estar cerrado."
lesson = "Una regla de seguridad se prueba atacándola. Si no, puede estar escrita y no hacer nada durante días."

[text.es.incidents.upgrade]
title = "Terraform se quedó sin permiso tras actualizar"
meta = "Septiembre de 2026 · actualización"
symptom = "Después de pasar a Proxmox 9.2, crear el rol de permisos de Terraform fallaba: un privilegio de la lista ya no existía."
options = [
  "La versión nueva había eliminado ese privilegio y había que quitarlo de la lista",
  "El token había caducado",
  "El usuario de Terraform se había borrado",
  "La API había cambiado de puerto",
]
cause = "Proxmox 9.2 retiró un privilegio de monitorización que la documentación del proveedor de Terraform aún pedía."
fix = "Quitar ese privilegio del rol y comprobar con un plan que Terraform seguía pudiendo hacer todo lo necesario."
lesson = "Las guías de permisos envejecen con cada versión. Mejor dar los privilegios justos y probarlos que copiar una lista."

[[text.es.timeline]]
title = "Proxmox 8.4"
period = "Hasta el verano de 2026"
items = [
  "Contenedores creados a mano, cortafuegos del hipervisor desactivado.",
]

[[text.es.timeline]]
title = "Proxmox 9.2"
period = "Verano de 2026"
items = [
  "Actualización a la 9.2, necesaria para ampliar el pool de discos.",
  "Nueva forma de arranque y driver de GPU recompilado.",
]

[[text.es.timeline]]
title = "Cerrar y medir"
period = "Septiembre y octubre de 2026"
items = [
  "Cortafuegos del hipervisor con rechazo por defecto y reversión automática a los 5 minutos.",
  "Cortafuegos de los contenedores activado de verdad y comprobado.",
  "Caché de escritura en los discos del sistema y DNS del hipervisor por el DNS de casa.",
]

[[text.es.decisions]]
title = "Contenedores o VMs"
choice = "Contenedores, salvo lo que necesita su kernel"
why = "Un contenedor arranca en segundos y gasta casi nada. Solo el clúster del laboratorio necesita VMs."

[[text.es.decisions]]
title = "Con privilegios o sin ellos"
choice = "Sin, siempre que se pueda"
why = "Sin privilegios, el root del contenedor no es el del servidor. Plex se pasó a sin privilegios incluso con la GPU dentro."

[[text.es.decisions]]
title = "Cambios en el cortafuegos"
choice = "Con reversión automática"
why = "Un error en el cortafuegos del hipervisor te deja fuera del hipervisor. Cada cambio llevaba un temporizador que lo deshacía si no lo cancelaba."

[text.es.tech_notes]
proxmox = "Proxmox VE 9.2: contenedores y VMs, API para Terraform, cortafuegos del hipervisor y de cada contenedor, GPU con IOMMU."
lxc = "Unos veinte contenedores, casi todos sin privilegios, uno por servicio."
linux = "RAID por software, LVM-thin, systemd-boot, auditd y el script de ventiladores por IPMI."
zfs = "Los pools de datos grandes, gestionados desde el propio hipervisor."
terraform = "Crea contenedores y VMs a través de la API, con un token de permisos justos."
ansible = "Configura el hipervisor: cortafuegos, DNS, auditoría y actualizaciones."
zabbix = "Vigila carga, RAID, SMART, temperatura y espacio real del almacenamiento."
wazuh = "El agente del hipervisor vigila cuentas, sudo, SSH y servicios."
hardening = "Entrada rechazada por defecto, auditoría de ficheros críticos y servicios sobrantes apagados."

[text.es.close]
lessons = [
  "Un servidor sin SAI convierte cada corte de luz en una comprobación de una hora.",
  "Las reglas de seguridad se prueban desde fuera.",
  "Escribir el paso exacto que arregla algo ahorra la mitad la próxima vez.",
]
next = [
  "Un SAI con apagado coordinado.",
  "Mover el sistema y los discos de los contenedores a SSD.",
]

