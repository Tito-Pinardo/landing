tagline = "A real rack server, a 1U Dell R620 with two Xeons and about 250 GB of RAM, plus an external 24-disk shelf. Proxmox splits that machine into about twenty LXC containers and the lab VMs, with its own firewall and a GPU for Plex."
grade = "Proxmox 9.2, up from 8.4"
facts = [
