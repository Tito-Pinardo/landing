[[text.en.decisions]]
title = "Containers or VMs"
choice = "Containers, except what needs its own kernel"
why = "A container starts in seconds and uses almost nothing. Only the lab cluster needs VMs."

[[text.en.decisions]]
title = "Privileged or not"
choice = "Unprivileged whenever possible"
why = "Unprivileged, the container's root isn't the server's. Plex moved to unprivileged even with the GPU inside."

[[text.en.decisions]]
title = "Firewall changes"
choice = "With automatic rollback"
why = "A mistake in the hypervisor firewall locks you out of the hypervisor. Each change had a timer that undid it unless I cancelled it."

[text.en.tech_notes]
proxmox = "Proxmox VE 9.2: containers and VMs, an API for Terraform, hypervisor and per-container firewalls, GPU with IOMMU."
lxc = "About twenty containers, almost all unprivileged, one per service."
linux = "Software RAID, LVM-thin, systemd-boot, auditd and the IPMI fan script."
zfs = "The large data pools, managed from the hypervisor itself."
terraform = "Creates containers and VMs through the API, with a least-privilege token."
ansible = "Configures the hypervisor: firewall, DNS, auditing and updates."
zabbix = "Watches load, RAID, SMART, temperature and real storage usage."
wazuh = "The hypervisor's agent watches accounts, sudo, SSH and services."
hardening = "Inbound dropped by default, auditing of critical files and spare services switched off."

