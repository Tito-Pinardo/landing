[text.en.incidents.lvm]
title = "No container would start after a power cut"
meta = "07-08-2026 · storage"
symptom = "After a power cut the server booted on its own, but no container or VM started. The documentation couldn't be opened either: it was inside too."
options = [
  "A mirror disk had failed",
  "The containers' storage was left half-activated after its check",
  "Proxmox had lost its configuration",
  "The network wouldn't come up",
]
cause = "The abrupt shutdown left LVM-thin flagged for checking. The check took 65 to 90 minutes on spinning disks and left its internal parts active separately, which prevented activating the whole."
fix = "Wait for the check, deactivate the two loose parts by hand and activate the whole. Then start every container by hand: automatic start is only attempted once."
lesson = "Write the postmortem with the exact step: next time, going straight to deactivating the loose parts saves another full check. And a UPS would avoid all of it."

[text.en.incidents.fwoptions]
title = "Firewall rules that did nothing"
meta = "22-09-2026 · firewall"
symptom = "I had restricted the containers' SSH to my machines and the VPN, and blocked the vector database's port. From another container you could still reach both."
options = [
  "The hypervisor firewall was off",
  "The rules had a syntax error",
  "The containers used another interface",
  "A rules file without its options section with «enable: 1» isn't applied",
]
cause = "The containers that did filter had an options section in their file with the firewall enabled. The rest only had rules: Proxmox stores them but doesn't apply them, even if the interface has the firewall ticked."
fix = "Enable the options section on the 11 affected containers and check from outside, trying to connect to what should be closed."
lesson = "A security rule is tested by attacking it. Otherwise it can sit there written down, doing nothing, for days."

[text.en.incidents.upgrade]
title = "Terraform lost a permission after upgrading"
meta = "September 2026 · upgrade"
symptom = "After moving to Proxmox 9.2, creating Terraform's permission role failed: a privilege on the list no longer existed."
options = [
  "The new version had removed that privilege and it had to come off the list",
  "The token had expired",
  "The Terraform user had been deleted",
  "The API had changed port",
]
cause = "Proxmox 9.2 retired a monitoring privilege that the Terraform provider's docs still asked for."
fix = "Drop that privilege from the role and check with a plan that Terraform could still do everything it needed."
lesson = "Permission guides age with every release. Better to grant exactly what's needed and test it than copy a list."

