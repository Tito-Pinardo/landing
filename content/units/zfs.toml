  "La ampliación se lanza sobre el grupo de discos, no sobre un disco.",
  "El pool sigue en uso mientras se reparten los datos.",
  "Al terminar, un scrub lo verifica todo: 0 errores.",
]

[text.es.flows.speed]
title = "Trece veces más escrituras"
steps = [
  "Mido con fio: 95 escrituras con fsync por segundo.",
  "Activo la caché de escritura de los discos.",
  "Y un servicio que la vuelve a activar en cada arranque.",
  "Con el planificador en «none».",
  "Vuelvo a medir: 1.237.",
]

[text.es.flows.watch]
title = "Vigilar los discos"
steps = [
  "Cada disco informa de su SMART.",
  "La monitorización lo recoge sin despertar los discos dormidos.",
  "Los scrubs periódicos comprueban cada bloque.",
  "Y la ocupación de cada pool.",
  "Si algo empeora, aviso.",
]

[text.es.flows.reinsert]
title = "Un disco que vuelve a entrar"
steps = [
  "Saco un disco de su bahía y lo vuelvo a meter.",
  "No monta: el sistema cree que el mismo disco ya está montado.",
  "Se limpia el registro del sistema de ficheros y se monta.",
  "Y sus datos vuelven a estar disponibles.",
]

[text.es.incidents.attach]
title = "Una ampliación que no hacía nada"
meta = "Julio de 2026 · pool"
symptom = "El script de ampliar el pool con un disco nuevo terminaba, pero el pool seguía igual de grande. Sin ningún error claro."
options = [
  "El disco nuevo era defectuoso",
  "El pool estaba lleno",
  "Usaba la orden de añadir a un espejo, que no vale para RAIDZ, y además esa versión de ZFS no sabía ampliar un RAIDZ",
  "Faltaba reiniciar",
]
cause = "La orden apuntaba a un disco del pool, como en un espejo, en vez de al grupo RAIDZ entero. Y la versión de ZFS instalada todavía no permitía ampliar un RAIDZ."
fix = "Actualizar el hipervisor a una versión con ZFS 2.3 o más y lanzar la ampliación sobre el grupo de discos. Terminó en un día y el scrub posterior reparó 0 bytes."
lesson = "Un script que «termina» no es un script que funciona: hay que comprobar el resultado. Y leer qué versión permite qué antes de lanzar algo así."

[text.es.incidents.uuid]
title = "«wrong fs type, bad superblock»"
meta = "14-07-2026 · disco"
symptom = "Saqué un disco de su bahía y lo volví a meter. No montaba, y el error hablaba de un sistema de ficheros dañado."
options = [
  "El disco se había dañado al sacarlo",
  "El sistema seguía teniendo registrado el disco anterior con el mismo identificador",
  "La bahía estaba rota",
  "Faltaba el controlador",
]
cause = "Al sacarlo en caliente, el kernel cerró el sistema de ficheros pero no lo olvidó del todo. Al volver con otro nombre de dispositivo, su identificador chocaba con el que aún figuraba como montado."
fix = "Limpiar la referencia antigua y montarlo de nuevo, sin tocar sus datos."
lesson = "El mensaje de error no siempre dice la causa: «superblock dañado» era «ya te conozco». El registro del kernel lo decía claro."

[text.es.incidents.cache]
title = "Discos lentos de fábrica"
meta = "06-10-2026 · rendimiento"
symptom = "El pool grande hacía solo 95 escrituras con fsync por segundo, con cinco discos."
options = [
  "El pool estaba muy fragmentado",
  "La controladora limitaba la velocidad",
  "Faltaba RAM para la caché",
  "Varios discos venían con la caché de escritura apagada",
]
cause = "Los discos tenían la caché de escritura desactivada, y en los que van detrás de la bandeja ni siquiera aceptaban la orden normal para activarla."
fix = "Activarla con la orden que sí aceptan, guardarla en el disco y añadir un servicio que la vuelve a activar en cada arranque. De 95 a 1.237 escrituras por segundo."
lesson = "La configuración de fábrica no es la mejor para cada uso. Medir, cambiar una cosa y volver a medir."

[[text.es.timeline]]
title = "Ampliación del pool"
period = "Julio y agosto de 2026"
items = [
  "Actualización de Proxmox para tener una versión de ZFS que amplíe RAIDZ.",
  "Quinto disco añadido en caliente y scrub posterior sin errores.",
]

[[text.es.timeline]]
title = "Ajustes medidos"
period = "Septiembre y octubre de 2026"
items = [
  "Sin tiempo de acceso y bloques grandes para vídeo.",
  "Caché de escritura y planificador en todos los pools, medidos con fio antes y después.",
]

[[text.es.decisions]]
title = "RAID por hardware o ZFS"
choice = "ZFS con la controladora en modo HBA"
why = "ZFS necesita ver los discos de verdad para comprobar cada bloque y reparar lo que encuentra. Un RAID por hardware se lo escondería."

[[text.es.decisions]]
title = "Un pool para todo o varios"
choice = "Uno por patrón de uso"
why = "Mucho espacio y lectura secuencial no piden lo mismo que muchas escrituras pequeñas. Separarlos deja ajustar cada uno."

[text.es.tech_notes]
proxmox = "ZFS gestionado desde el hipervisor; actualizado para poder ampliar un RAIDZ."
lxc = "Los contenedores montan los datasets que necesitan."
linux = "RAID por software para el sistema, caché de escritura de los discos, planificador de E/S y discos XFS sueltos."
zfs = "RAIDZ1 ampliado en caliente, espejos para los juegos, caché ARC, compresión, recordsize y scrubs."
zabbix = "Vigila pools, RAID y SMART sin despertar los discos dormidos."

[text.es.close]
lessons = [
  "Comprobar el resultado de una operación de discos, no que el script termine.",
  "Medir cada ajuste antes y después.",
  "Un RAID no es una copia.",
]
next = [
  "Unir los discos sueltos al pool.",
  "Un SSD para el sistema y las bases de datos.",
]

