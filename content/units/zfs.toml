[text.es.meta]
title = "El almacenamiento por dentro · Tito Pinardo Gutiérrez"
description = "Los discos del homelab: un pool ZFS RAIDZ en una bandeja de 24 discos ampliado en caliente, un espejo para los juegos, el RAID del sistema y cómo se multiplicaron por trece las escrituras sin comprar nada."

