[text.es.hero]
kicker = "Unidad 1U · Almacenamiento"
title = "ZFS y RAID · los discos"
tagline = "Los datos grandes viven en un pool ZFS RAIDZ1 de cinco discos de 10 TB en una bandeja externa; los mundos de los juegos, en un espejo de cuatro discos SAS; el sistema, en un RAID1 por software. ZFS verifica cada bloque al leerlo y una caché enorme en RAM sirve casi todas las lecturas."
grade = "Escrituras ×13 sin comprar nada"
facts = [
  { label = "Por qué ZFS", value = "Sumas de comprobación en cada bloque, compresión, instantáneas y ampliar un RAIDZ en caliente. Y la RAM sobrante del servidor se convierte en caché." },
  { label = "Qué pool para qué", value = "RAIDZ para mucho espacio con un disco de margen; espejos para escrituras pequeñas y rápidas; RAID1 por software para el sistema." },
  { label = "Lo que no es", value = "Ni RAIDZ ni espejos son una copia de seguridad: aguantan que muera un disco, no un borrado. Eso está en la unidad de copias." },
]

