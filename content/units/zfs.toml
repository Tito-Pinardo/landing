[text.es.pods.recordsize]
short = "recordsize 1M"
title = "Tamaño de bloque"
text = "Bloques de 1 MB para vídeo, que se lee de principio a fin. Bloques normales donde hay ficheros pequeños."

[text.es.pods.atime]
