]

[text.en.incidents.attach]
title = "An expansion that did nothing"
meta = "July 2026 · pool"
symptom = "The script to grow the pool with a new disk finished, but the pool stayed the same size. No clear error."
options = [
  "The new disk was faulty",
  "The pool was full",
  "It used the add-to-mirror command, which doesn't work for RAIDZ, and that ZFS version couldn't expand a RAIDZ anyway",
  "A reboot was missing",
]
cause = "The command targeted one disk in the pool, as for a mirror, instead of the whole RAIDZ group. And the installed ZFS version didn't yet allow RAIDZ expansion."
fix = "Upgrade the hypervisor to a version with ZFS 2.3 or later and run the expansion against the disk group. It finished in a day and the scrub afterwards repaired 0 bytes."
lesson = "A script that «finishes» isn't a script that works: check the result. And read which version allows what before launching something like that."

[text.en.incidents.uuid]
title = "«wrong fs type, bad superblock»"
meta = "14-07-2026 · disk"
symptom = "I pulled a disk from its bay and put it back. It wouldn't mount, and the error talked about a damaged file system."
options = [
  "The disk got damaged when pulled",
  "The system still had the previous disk registered with the same identifier",
  "The bay was broken",
  "The driver was missing",
]
cause = "Pulled live, the kernel shut the file system but didn't fully forget it. Coming back under another device name, its identifier clashed with the one still listed as mounted."
fix = "Clear the old reference and mount it again, without touching its data."
lesson = "The error message doesn't always give the cause: «bad superblock» meant «I already know you». The kernel log said it plainly."

[text.en.incidents.cache]
title = "Slow disks out of the box"
meta = "06-10-2026 · performance"
symptom = "The big pool managed only 95 fsync writes per second, with five disks."
options = [
  "The pool was heavily fragmented",
  "The controller was capping the speed",
  "Not enough RAM for the cache",
  "Several disks shipped with write cache switched off",
]
cause = "The disks had write cache disabled, and the ones behind the shelf didn't even accept the normal command to enable it."
fix = "Enable it with the command they do accept, save it on the disk and add a service that enables it again on every boot. From 95 to 1,237 writes per second."
lesson = "Factory settings aren't the best for every use. Measure, change one thing, measure again."

[[text.en.timeline]]
title = "Pool expansion"
period = "July and August 2026"
items = [
  "Proxmox upgraded to get a ZFS version that can expand RAIDZ.",
  "Fifth disk added live and a clean scrub afterwards.",
]

[[text.en.timeline]]
title = "Measured tuning"
period = "September and October 2026"
items = [
  "No access time and large blocks for video.",
  "Write cache and scheduler on every pool, measured with fio before and after.",
]

[[text.en.decisions]]
title = "Hardware RAID or ZFS"
choice = "ZFS with the controller in HBA mode"
why = "ZFS needs to see the real disks to check every block and repair what it finds. Hardware RAID would hide them."

[[text.en.decisions]]
title = "One pool or several"
choice = "One per usage pattern"
why = "Lots of space and sequential reads don't want the same as many small writes. Separating them lets each be tuned."

[text.en.tech_notes]
proxmox = "ZFS managed from the hypervisor; upgraded to allow RAIDZ expansion."
lxc = "Containers mount the datasets they need."
linux = "Software RAID for the system, disk write cache, I/O scheduler and loose XFS disks."
zfs = "RAIDZ1 expanded live, mirrors for games, ARC cache, compression, recordsize and scrubs."
zabbix = "Watches pools, RAID and SMART without waking sleeping disks."

[text.en.close]
lessons = [
  "Check the result of a disk operation, not that the script finished.",
  "Measure each change before and after.",
  "RAID isn't a backup.",
]
next = [
  "Bring the loose disks into the pool.",
  "An SSD for the system and the databases.",
]
