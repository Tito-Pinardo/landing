[text.es.pods.wce]
short = "Caché escritura"
title = "Caché de escritura de los discos"
text = "Venía apagada en varios discos. Con ZFS es segura: vacía esa caché en cada transacción."

[text.es.pods.service]
short = "Al arrancar"
title = "Reactivar al arrancar"
text = "En los discos detrás de la bandeja el ajuste no siempre sobrevive a un apagado: un servicio lo vuelve a poner en cada arranque."

[text.es.pods.expand]
short = "Ampliación"
title = "Ampliar el RAIDZ"
text = "Añadir un quinto disco a un RAIDZ de cuatro, en caliente, sin mover los datos a otro sitio."

[text.es.pods.uuid]
short = "UUID XFS"
title = "Identificador de un disco"
text = "Un disco sacado y vuelto a meter puede chocar consigo mismo."

[text.es.pods.scrub]
short = "Scrub"
title = "Scrub"
text = "Lee todo el pool y comprueba cada bloque contra su suma. Tras la ampliación: 0 errores."

[text.es.pods.smart]
short = "SMART"
title = "SMART"
text = "La salud que cada disco dice de sí mismo: sectores reasignados, temperatura, errores."

[text.es.pods.fill]
short = "Ocupación"
title = "Ocupación"
text = "Por encima del 80-85 %, ZFS escribe más lento. Hay que vigilarlo antes de llegar."

[text.es.pods.fio]
short = "fio"
title = "Medir con fio"
text = "En un dataset temporal sin compresión, antes y después de cada ajuste, y borrado al terminar."

