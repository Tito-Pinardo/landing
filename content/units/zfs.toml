tagline = "Large data lives on a ZFS RAIDZ1 pool of five 10 TB disks in an external shelf; the game worlds, on a mirror of four SAS disks; the system, on a software RAID1. ZFS checks every block as it reads it and a huge RAM cache serves almost all reads."
grade = "Writes ×13 without buying anything"
facts = [
  { label = "Why ZFS", value = "Checksums on every block, compression, snapshots and live RAIDZ expansion. And the server's spare RAM becomes cache." },
  { label = "Which pool for what", value = "RAIDZ for lots of space with one disk of margin; mirrors for small, fast writes; software RAID1 for the system." },
  { label = "What it isn't", value = "Neither RAIDZ nor mirrors are a backup: they survive a disk dying, not a deletion. That's in the backups unit." },
]

