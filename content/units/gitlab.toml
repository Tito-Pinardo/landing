[text.en.meta]
title = "GitLab, CI and deployment, inside · Tito Pinardo Gutiérrez"
description = "My own Git server at home: changes by MR, CI with no secrets, the plan before merging, one-click deploys, AI agents working from issues and this site published on its own when its CI goes green."

[text.en.ui]
slot = "1U · GIT"
