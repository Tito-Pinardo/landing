[text.es.pods.laptop]
short = "Mis equipos"
title = "Mis equipos"
text = "El PC, el portátil y el nodo de control: los únicos con clave para empujar."

[text.es.pods.element]
short = "Element"
title = "Element"
text = "Una sala propia para el CI/CD, aparte de las incidencias: un mensaje por ejecución, con el commit y el enlace."

[text.es.pods.backup]
short = "Respaldo"
title = "Repositorio de respaldo"
text = "El de siempre: cada equipo le sigue empujando cada commit. Tiene su propia unidad."

[text.es.pods.site]
short = "Esta web"
title = "Esta web"
text = "Un binario de Rust: lo que despliega el runner cuando todo sale en verde."

[text.es.pods.agentes]
short = "Agentes IA"
title = "Agentes IA, desde las issues"
text = "Una issue con su etiqueta arranca un agente en su propio contenedor, sin llaves de la casa, con el perfil de esa tarea: reglas, permisos y pruebas. Puede partir un hito en subtareas y abrir MR; fusionar, desplegar o publicar, no."

[text.es.pods.github]
short = "GitHub"
title = "GitHub, la copia pública"
text = "Solo recibe commits que ya han pasado el CI, el control de fugas y el despliegue."

[text.es.pods.git]
short = "Git por SSH"
title = "Git por SSH"
text = "Un puerto propio para Git, separado del SSH de administración. Solo entran las claves dadas de alta."

[text.es.pods.webui]
short = "Web con 2FA"
title = "Interfaz web"
text = "Solo desde casa o la VPN, con el inicio de sesión único de la casa y doble factor."

[text.es.pods.pr]
short = "MR y ramas"
title = "MR y rama protegida"
text = "La rama principal de la infraestructura no admite pushes: solo MR con el CI en verde, y las fusiona una persona."

[text.es.pods.hooks]
short = "Webhooks"
title = "Webhooks"
text = "Al terminar cada ejecución, o cuando una issue pide un agente, GitLab avisa con una petición que lleva su secreto."

[text.es.pods.runner]
short = "Runner CI"
title = "Runner del CI"
text = "En su propio contenedor, sin un solo secreto ni acceso al homelab. Si tiene que leer un vault, lee uno falso a propósito."

[text.es.pods.iaclint]
short = "TF + lint"
title = "Terraform, lint y Trivy"
text = "Formato y validación de Terraform sin estado ni credenciales, tflint, ansible-lint (solo falla con avisos nuevos) y Trivy, que busca fallos graves en la configuración y en las dependencias."

[text.es.pods.rust]
short = "Rust + PG"
title = "Rust y PostgreSQL"
text = "Para esta web: formato, clippy, pruebas contra un PostgreSQL de verdad, compilación y contenido válido."

[text.es.pods.gitleaks]
short = "gitleaks"
title = "gitleaks"
text = "Sobre todo el historial, no solo el último commit: lo borrado sigue en el repositorio."

[text.es.pods.plan]
short = "Plan de la MR"
title = "Plan de la MR"
text = "Terraform plan y los playbooks afectados en modo ensayo. Queda como nota de la MR, antes de fusionar."

[text.es.pods.click]
short = "Un clic"
title = "Aprobar con un clic"
text = "Fusionar no aplica nada: sale el plan de la rama principal y lo apruebo yo con ▶."

[text.es.pods.saved]
short = "Plan guardado"
title = "Plan guardado"
text = "Se aplica exactamente ese plan. Si el estado cambió después, Terraform se niega en vez de hacer otra cosa."

[text.es.pods.fugas]
short = "Fugas"
title = "Control de fugas"
text = "Antes de que nada salga de casa: gitleaks, solo mi identidad pública como autor y ni direcciones ni nombres internos."

[text.es.pods.avisos]
short = "Avisos"
title = "Receptor de avisos"
text = "Comprueba el secreto del webhook y resume la ejecución: repositorio, rama, commit, duración y enlace."

[text.es.pods.relay]
short = "Relay cifrado"
title = "Relay de Matrix"
text = "Publica el aviso cifrado de extremo a extremo en la sala del CI/CD."

[text.es.pods.renovate]
short = "Renovate"
title = "Renovate"
text = "Cada lunes busca versiones nuevas de todo lo que está fijado y abre una MR por cada una, con su suma SHA-256 oficial."

[text.es.pods.copia]
short = "Copia diaria"
title = "Copia diaria"
text = "El contenedor de GitLab, cada noche a un disco aparte y cifrado. Restaurarlo está probado."

