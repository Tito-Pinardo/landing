[text.es.meta]
title = "GitLab, el CI y el despliegue por dentro · Tito Pinardo Gutiérrez"
description = "Mi servidor Git en casa: cambios por MR, CI sin secretos, plan antes de fusionar, despliegue con un clic, agentes IA que trabajan desde las issues y esta web publicada sola cuando su CI sale en verde."

[text.es.ui]
slot = "1U · GIT"
face_specs = "GitLab · CI · agentes"
state = "En producción"
map_silk = "GIT"
map_title = "El origen del código por dentro"
map_intro = "Por aquí entra cada cambio de la infraestructura y de esta web, y aquí se decide si sale. Elige un recorrido."
vm_title = "GitLab y sus runners · contenedores en Proxmox"
vm_specs = "el servidor Git, un runner sin secretos y uno que despliega"
outside = "Fuera"
disclaimer = "Reconstrucción a partir de mi documentación: sin direcciones, puertos ni nombres internos."

[text.es.hero]
kicker = "Unidad 1U · Código y entrega"
title = "Mi propio Git, con CI y despliegue"
tagline = "La infraestructura vivía en un repositorio sin interfaz y nadie revisaba nada antes de que entrara: un fichero mal formateado o un secreto en claro se copiaban tal cual. Ahora todo pasa por mi propio GitLab (empezó en Forgejo). Cada push lo comprueba un runner sin secretos, cada cambio de infraestructura entra por MR con su plan a la vista, esta web se despliega sola cuando su CI sale en verde, y una issue puede poner a trabajar a un agente IA que entrega su MR."
grade = "De push a la web: sin tocar nada"
facts = [
  { label = "Dónde vive el código", value = "En casa. GitHub queda como escaparate: la copia saneada de la infraestructura y esta web, que solo recibe lo que ya está desplegado." },
  { label = "La regla", value = "Nada entra sin CI en verde, y nada de infraestructura se aplica sin ver antes el plan. El paso final lo apruebo yo con un clic." },
  { label = "Los avisos", value = "Cada ejecución, bien o mal, llega a Element cifrada. El fallo sale en cuanto falla el primer trabajo." },
]

