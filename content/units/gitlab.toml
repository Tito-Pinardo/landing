[text.en.groups]
server = "GitLab"
ci = "CI runner: checks"
deploy = "Deploy runner: applies"
around = "Around it"

[text.en.pods.laptop]
short = "My machines"
title = "My machines"
text = "The PC, the laptop and the control node: the only ones with a key to push."

[text.en.pods.element]
short = "Element"
title = "Element"
text = "A room of its own for CI/CD, apart from incidents: one message per run, with the commit and the link."

[text.en.pods.backup]
short = "Backup"
title = "Backup repository"
text = "The same as always: every machine still pushes each commit to it. It has its own unit."

[text.en.pods.site]
short = "This site"
title = "This site"
text = "A Rust binary: what the runner deploys when everything goes green."

[text.en.pods.agentes]
short = "AI agents"
title = "AI agents, from issues"
text = "An issue with its label starts an agent in its own container, with no home keys, using that task's profile: rules, permissions and tests. It can split a milestone into subtasks and open MRs; merging, deploying or publishing, no."

[text.en.pods.github]
short = "GitHub"
title = "GitHub, the public copy"
text = "It only gets commits that have already passed CI, the leak check and the deployment."

[text.en.pods.git]
short = "Git over SSH"
title = "Git over SSH"
text = "Its own port for Git, separate from the admin SSH. Only registered keys get in."

[text.en.pods.webui]
short = "Web with 2FA"
title = "Web interface"
text = "Only from home or the VPN, with the home single sign-on and two-factor."

[text.en.pods.pr]
short = "MRs, branches"
title = "MRs and a protected branch"
text = "The infrastructure's main branch takes no pushes: only MRs with green CI, merged by a person."

[text.en.pods.hooks]
short = "Webhooks"
title = "Webhooks"
text = "When each run ends, or when an issue asks for an agent, GitLab calls out with a request carrying its secret."

[text.en.pods.runner]
short = "CI runner"
title = "CI runner"
text = "In its own container, without a single secret or any access to the homelab. If it has to read a vault, it reads a deliberately fake one."

[text.en.pods.iaclint]
short = "TF + lint"
title = "Terraform, lint and Trivy"
text = "Terraform formatting and validation with no state or credentials, tflint, ansible-lint (only fails on new warnings) and Trivy, which looks for serious flaws in configuration and dependencies."

[text.en.pods.rust]
short = "Rust + PG"
title = "Rust and PostgreSQL"
text = "For this site: formatting, clippy, tests against a real PostgreSQL, the build and valid content."

[text.en.pods.gitleaks]
short = "gitleaks"
title = "gitleaks"
text = "Over the whole history, not just the last commit: what was deleted is still in the repository."

[text.en.pods.plan]
short = "MR plan"
title = "The MR's plan"
text = "Terraform plan and the affected playbooks in dry-run. It's posted as a note on the MR, before merging."

[text.en.pods.click]
short = "One click"
title = "Approve with one click"
text = "Merging applies nothing: the main branch's plan comes out and I approve it with ▶."

[text.en.pods.saved]
short = "Saved plan"
title = "Saved plan"
text = "Exactly that plan is applied. If the state changed afterwards, Terraform refuses instead of doing something else."

[text.en.pods.fugas]
short = "Leak check"
title = "Leak check"
text = "Before anything leaves home: gitleaks, only my public identity as author and no addresses or internal names."

[text.en.pods.avisos]
short = "Alerts"
title = "Alert receiver"
text = "Checks the webhook's secret and sums up the run: repository, branch, commit, duration and link."

[text.en.pods.relay]
short = "Encrypted relay"
title = "Matrix relay"
text = "Posts the alert end-to-end encrypted to the CI/CD room."

[text.en.pods.renovate]
short = "Renovate"
title = "Renovate"
text = "Every Monday it looks for new versions of everything pinned and opens one MR for each, with its official SHA-256."

[text.en.pods.copia]
short = "Daily copy"
title = "Daily copy"
text = "The GitLab container, every night to a separate disk, encrypted. Restoring it has been tested."

[text.en.flows.pr]
title = "An infrastructure change, by MR"
steps = [
  "From any of my machines I create a branch: the main one takes no direct pushes.",
  "I push it to GitLab over SSH.",
  "I open the MR.",
  "The CI runner picks it up: it has no secrets and no access to the homelab.",
  "Terraform formatting and validation, and ansible-lint.",
  "gitleaks over the whole history and a check that every vault is encrypted.",
  "Meanwhile, the deploy runner works out the plan: what Terraform touches and which playbooks, in dry-run.",
  "The plan is posted as a note on the MR: I see what's touched before merging.",
  "I merge. The main branch's plan comes out and I approve it with one click.",
  "That saved plan is applied. If anything changed in between, Terraform refuses.",
  "The result goes out through the webhook.",
  "Encrypted, to the CI/CD room.",
  "And reaches my phone.",
]

[text.en.flows.web]
title = "This site, from a push to the internet"
steps = [
  "I push a change to this site.",
  "It lands on GitLab, the repository's origin.",
  "The CI runner picks it up.",
  "Formatting, clippy, tests against PostgreSQL, the build, valid content and valid minified JS.",
  "And gitleaks over the whole history.",
  "On green, the deploy runner reviews what isn't public yet.",
  "It builds, deploys with Ansible and waits for the site to answer.",
  "Only then does it push that commit to GitHub.",
  "The webhook reports the result.",
  "And I see it on my phone.",
]

[text.en.flows.red]
title = "Two commits in the red"
steps = [
  "I add my machines' SSH keys to the configuration.",
  "Push.",
  "CI picks it up.",
  "ansible-lint fails: lines over 160 characters. It's the keys.",
  "The alert goes out as soon as the first job fails, without waiting for the rest.",
  "❌ in Element, with the commit and the link to the run.",
  "I fix it: an exception for those lines and only those.",
  "Green.",
  "✅ in Element. Eight alerts went out that day and all eight arrived.",
]

[text.en.flows.renovate]
title = "Versions bump themselves, but don't apply themselves"
steps = [
  "Monday morning: Renovate finds a new Traefik version.",
  "It opens an MR with the new number and its SHA-256, taken from the official checksum file. If the release doesn't publish one, there's no MR.",
  "CI checks it like any other.",
  "Formatting, lint and secrets.",
  "The MR's plan says which playbook would run and how many tasks would change.",
  "I merge and approve with one click.",
  "That plan is applied.",
  "The result goes out through the webhook.",
  "And reaches Element. Major versions wait for my approval in an issue before an MR is even opened.",
]

[text.en.flows.agente]
title = "An issue that does itself (and I review it)"
steps = [
  "I open an issue, explain what I want and give it the agent queue label.",
  "GitLab tells the launcher with a webhook.",
  "The launcher starts an agent with that task's profile, in its isolated container. Four at a time at most.",
  "It works on its own branch and pushes it with the token of a bot that can't merge or deploy.",
  "It opens the MR, which will close the issue when merged.",
  "CI picks it up like any other.",
  "Formatting, lint and tests: the same as for a change of mine.",
  "Another agent, read-only, reviews the MR and leaves its verdict.",
  "The «MR delivered» alert goes out.",
  "Encrypted, to the CI/CD room.",
  "And I review it: a person always does the merge. If something's missing, I ask in a comment and it fixes it on the same branch.",
]

[text.en.flows.drift]
title = "Every night: did anyone change something by hand?"
steps = [
  "In the early hours, the deploy runner starts from the last deployment.",
  "It works out the Terraform plan. If anything shows up, someone changed something outside the code: real drift.",
  "It alerts. Also if the main branch has undeployed changes.",
  "And if everything matches, silence: nothing arrives.",
]

[text.en.flows.rebuild]
title = "What's copied and what's rebuilt"
steps = [
  "The repositories, their history, the issues and the packages live in GitLab.",
  "Every night, a copy of the container to a separate disk.",
  "The CI runner isn't copied: it keeps nothing.",
  "It's rebuilt with its playbook, tools at pinned versions with checked checksums.",
  "And the same goes for Rust and PostgreSQL for this site.",
]

[text.en.incidents.labels]
title = "Jobs that never started"
meta = "14-10-2026 · Forgejo"
symptom = "The runner was connected with no errors, but CI jobs sat «waiting» forever."
options = [
  "The runner couldn't reach the server",
  "It registered with no label, no «runs-on» matched, and once labelled it only looks for work when the queue changes",
  "The workflow had a syntax error",
  "Actions was disabled on the repository",
]
cause = "The runner registered with no labels, so it matched no job. Adding them changed nothing: it only asks for work again when the server's task version changes, and the jobs were already queued."
fix = "Register it with its label from the playbook and restart it once. It's written down in the docs."
lesson = "«Waiting» with no errors is nearly always a matching problem, not a connection one. Labels go in from the first registration."

[text.en.incidents.validate]
title = "The first CI run went red, as expected"
meta = "14-10-2026 · Terraform"
symptom = "terraform validate failed on the runner but not in my terminal. It uses no state or credentials."
options = [
  "The Proxmox credentials were missing",
  "The Terraform version was different",
  "validate also evaluates file(): the code reads an SSH key the runner doesn't have",
  "The state wasn't available",
]
cause = "The provider reads the user's public key with file(), and validate evaluates that function. On the runner, which has no secrets, the file didn't exist."
fix = "A deliberately fake file on the runner: validation passes and it opens nothing. Same for the vault password ansible-lint asks for."
lesson = "A CI with no secrets uncovers everything the code assumes about the machine. Better to find it in the red than keep it hidden."

[text.en.incidents.jwt]
title = "A secret for something switched off"
meta = "14-10-2026 · Forgejo"
symptom = "Forgejo wouldn't start: it wanted an OAuth2 secret, and OAuth2 was disabled."
options = [
  "It asks for it at startup anyway: it has to be generated even if unused",
  "OAuth2 had been enabled by mistake",
  "It was a file permissions problem",
  "The version was incompatible",
]
cause = "The installed version checks that secret at startup even with the feature switched off."
fix = "Generate it inside the container the first time, next to the other internal secrets. It never leaves."
lesson = "Internal secrets are generated on the machine that uses them and never travel."

[text.en.incidents.zero]
title = "A version bump with zero changes"
meta = "15-10-2026 · Renovate"
symptom = "Renovate opened the PR for a new Qdrant version. CI went green, but the plan said the playbook wouldn't change a single task."
options = [
  "Renovate had written the wrong number",
  "The playbook wasn't among the affected ones",
  "The role downloaded to a fixed path with «skip if it exists»: the old binary stayed and got reinstalled",
  "The new version was the same as the old one",
]
cause = "The role downloaded the binary to a fixed temporary path and skipped the download if one was already there. With the previous version's binary in place, the new one was never fetched. Traefik had the same problem, and the control node's Ansible tool didn't upgrade either if one was already installed."
fix = "Each version in its own directory, as other roles already did, and the Ansible tool comparing the installed version with the requested one. After that, the plans showed the changes."
lesson = "A version bump that changes nothing is a clue, not good news. Until Renovate, those numbers were bumped by hand and nobody had noticed."

[text.en.incidents.token]
title = "Renovate saw no versions at all"
meta = "15-10-2026 · Renovate"
symptom = "Renovate's first runs found no new versions of anything coming from GitHub, though there were some."
options = [
  "Outside GitHub, querying its releases needs a token: the same versions are in the official images' tags",
  "The variables' annotations were misspelt",
  "Forgejo was blocking outbound internet",
  "The versions were pinned in another file",
]
cause = "Renovate only queries GitHub releases without a token when it runs on GitHub. At home, those lookups failed."
fix = "Use the official Docker images and PyPI packages as sources, which publish the same versions. No extra tokens to keep."
lesson = "Before adding a token, look for a source that doesn't need one."

[text.en.incidents.lint]
title = "A warning my terminal didn't show"
meta = "14-10-2026 · ansible-lint"
symptom = "On the runner, ansible-lint raised a new warning in a role that passed clean on the control node. Same version."
options = [
  "The runner had a different lint configuration",
  "The role had changed in between",
  "An out-of-date baseline",
  "The control node was missing a collection, so that role wasn't fully analysed",
]
cause = "The control node didn't have the Kubernetes collection that role uses, and ansible-lint skipped it silently. The runner installs everything in the requirements file."
fix = "Fix the warning. Since then, CI is the reference: it starts from a clean install."
lesson = "«Works on my machine» isn't enough if my machine has gaps. That's why CI starts from scratch."

[text.en.incidents.root]
title = "The first thing Trivy found"
meta = "15-10-2026 · CI"
symptom = "I added Trivy to CI to watch for dependencies with known flaws. The first thing it flagged as serious wasn't a dependency at all."
options = [
  "An image with an unpatched critical flaw",
  "A service that launches a browser to read other people's websites was running as root inside its container",
  "A plain-text secret in a config file",
  "An old Terraform version",
]
cause = "The API that opens a headless browser to read third-party pages ran as root. If one of those pages managed to exploit the browser, it would have root in the container."
fix = "Run it as an unprivileged user, the same one that already owned its folders. Checked that the browser starts just the same."
lesson = "A new scanner finds old debts. Better it finds them than someone else."

