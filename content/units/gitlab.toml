[[text.en.decisions]]
title = "Where the code lives"
choice = "At home; GitHub as the shop window"
why = "Internal things have no reason to leave. GitHub shows what I want to show: a sanitised copy and this site, always behind what already works."

[[text.en.decisions]]
title = "Which Git server"
choice = "GitLab CE (it started on Forgejo)"
why = "Forgejo, one binary and SQLite, ran in a gigabyte and served me for a month. I switched when I wanted an issue or a milestone to put AI agents to work: GitLab brings scoped labels, milestones, a package registry and a fuller API, and on this server its 8 GB no longer weigh."

[[text.en.decisions]]
title = "AI agents"
choice = "My own launcher, isolated"
why = "GitLab's agents are paid and don't use my subscription. A small service handles the webhooks and starts each agent in a container with no home keys: it can open MRs, but not merge, deploy or publish releases."

[[text.en.decisions]]
title = "The runners"
choice = "Two, split by what they can touch"
why = "The one that checks everything has nothing to steal: no secrets, no access. The one that deploys lives on the control node, which could already touch everything, and only serves its own repository."

[[text.en.decisions]]
title = "Applying infrastructure"
choice = "One click, and the exact plan"
why = "A plan that recreates a container with data gets read first. Once there's trust, update-only plans could go on their own; destructive ones, never."

[[text.en.decisions]]
title = "Versions"
choice = "Automatic MRs, one-click apply"
why = "Renovate takes away the searching and the checksums, but every bump goes through the same plan and approval as one of my changes. Major versions wait for my approval, and databases stay out: upgrading them means migrating data."

[[text.en.decisions]]
title = "This site"
choice = "Continuous deployment"
why = "If something goes wrong, it's back to the previous commit in minutes and no data is at stake. The leak check runs before deploying, not after."

[text.en.tech_notes]
gitlab = "Git server with MRs, protected branches, pipelines, a package registry and webhooks; shell runners, each with just what it needs, and AI agents launched from issues."
git = "Origin at home, a backup on every commit, the old central read-only and GitHub as the public copy."
terraform = "Formatting and validation in CI with no state; the MR's plan and a saved plan applied as is."
ansible = "ansible-lint with a baseline, affected playbooks in dry-run and this site deployed with its role."
rust = "This site's CI: formatting, clippy, tests and the build, cached between runs."
postgresql = "A socket-only PostgreSQL on the runner: each test creates its own database."
hardening = "A runner with no secrets, gitleaks over the whole history and a leak check before publishing."
lxc = "GitLab, the runners and the agents, each in its own unprivileged container; the runner is rebuilt from scratch."
linux = "Debian containers with pinned versions and checked checksums for every binary."
renovate = "Weekly MRs for new versions with their official checksum, grouped when they must go together and majors with prior approval."

[text.en.close]
lessons = [
  "A CI with no secrets uncovers what the code took for granted.",
  "Seeing the plan before merging changes how you review.",
  "What's public goes behind what's deployed, never ahead.",
]
next = [
  "Let update-only plans apply on their own.",
  "Renovate for this site's dependencies too.",
]
