[text.en.hero]
kicker = "1U unit · Code & delivery"
title = "My own Git, with CI and deployment"
tagline = "The infrastructure lived in a repository with no interface and nobody reviewed anything before it went in: a badly formatted file or a plain-text secret was copied as it was. Now everything goes through my own GitLab (it started on Forgejo). A runner with no secrets checks every push, every infrastructure change comes in by MR with its plan in view, this site deploys itself when its CI goes green, and an issue can put an AI agent to work that delivers its MR."
grade = "From push to the site: hands off"
facts = [
  { label = "Where the code lives", value = "At home. GitHub is the shop window: the sanitised copy of the infrastructure and this site, which only gets what's already deployed." },
  { label = "The rule", value = "Nothing goes in without green CI, and no infrastructure is applied without seeing the plan first. I approve the last step with one click." },
  { label = "The alerts", value = "Every run, good or bad, reaches Element encrypted. A failure is posted as soon as the first job fails." },
]

