title = "El paso a GitLab"
period = "19 y 20-11-2026"
items = [
  "GitLab CE en su contenedor, con inicio de sesión único y copia diaria, restaurada a prueba.",
  "Los workflows, traducidos a pipelines: los mismos trabajos, el plan como nota de la MR y ▶ para aplicar.",
  "Paquetes y releases de la red de juegos en el registro de GitLab, sin un solo secreto en el CI.",
  "Agentes IA lanzados desde issues e hitos, cada uno con su perfil; probado con diez issues a la vez y matando uno a mitad.",
  "Forgejo, en solo lectura hasta apagarlo el 25-11: fuera de Terraform sin destruirlo y con su copia guardada; su runner pasa a llamarse ci-runner.",
]

[[text.es.decisions]]
title = "Dónde vive el código"
choice = "En casa; GitHub como escaparate"
why = "Lo interno no tiene por qué salir. GitHub enseña lo que quiero enseñar: una copia saneada y esta web, siempre detrás de lo que ya funciona."

[[text.es.decisions]]
title = "Qué servidor Git"
choice = "GitLab CE (empezó en Forgejo)"
why = "Forgejo, un binario y SQLite, arrancaba con un gigabyte y me sirvió un mes. Cambié cuando quise que una issue o un hito pusieran a trabajar a agentes IA: GitLab trae etiquetas con estados, hitos, registro de paquetes y una API más completa, y en este servidor sus 8 GB ya no pesan."

[[text.es.decisions]]
title = "Agentes IA"
choice = "Un lanzador propio, aislado"
why = "Los agentes de GitLab son de pago y no usan mi suscripción. Un servicio pequeño atiende los webhooks y arranca cada agente en un contenedor sin llaves de la casa: puede abrir MR, pero no fusionar, desplegar ni publicar releases."

[[text.es.decisions]]
title = "Los runners"
choice = "Dos, separados por lo que pueden tocar"
why = "El que comprueba todo no tiene nada que robar: ni secretos ni acceso. El que despliega vive en el nodo de control, que ya podía tocarlo todo, y solo atiende a su repositorio."

[[text.es.decisions]]
title = "Aplicar infraestructura"
choice = "Con un clic, y el plan exacto"
why = "Un plan que recrea un contenedor con datos se lee antes. Cuando haya confianza, los planes que solo actualizan podrían ir solos; los que destruyen, nunca."

[[text.es.decisions]]
title = "Las versiones"
choice = "MR automáticas, aplicar con un clic"
why = "Renovate quita el trabajo de buscar y de calcular sumas, pero cada subida pasa por el mismo plan y la misma aprobación que un cambio mío. Las versiones mayores esperan a que las apruebe, y las bases de datos se quedan fuera: subirlas exige migrar datos."

[[text.es.decisions]]
title = "Esta web"
choice = "Despliegue continuo"
why = "Si algo sale mal, se vuelve al commit anterior en minutos y no hay datos en juego. El control de fugas va antes de desplegar, no después."

[text.es.tech_notes]
gitlab = "Servidor Git con MR, ramas protegidas, pipelines, registro de paquetes y webhooks; runners de shell, cada uno con lo justo, y agentes IA lanzados desde las issues."
git = "Origen en casa, respaldo en cada commit, central de antes en solo lectura y GitHub como copia pública."
terraform = "Formato y validación en el CI sin estado; plan de la MR y plan guardado que se aplica tal cual."
ansible = "ansible-lint con línea base, playbooks afectados en ensayo y despliegue de esta web con su rol."
rust = "El CI de esta web: formato, clippy, pruebas y compilación con caché entre ejecuciones."
postgresql = "Un PostgreSQL solo por socket en el runner: cada prueba crea su propia base."
hardening = "Runner sin secretos, gitleaks en todo el historial y control de fugas antes de publicar."
lxc = "GitLab, los runners y los agentes, cada uno en su contenedor sin privilegios; el runner se recrea desde cero."
linux = "Contenedores Debian con versiones fijadas y sumas comprobadas de cada binario."
renovate = "MR semanales de versiones nuevas con su suma oficial, agrupadas cuando tienen que ir juntas y las mayores con aprobación previa."

[text.es.close]
lessons = [
  "Un CI sin secretos descubre lo que el código daba por hecho.",
  "Ver el plan antes de fusionar cambia cómo se revisa.",
  "Lo público va detrás de lo desplegado, nunca delante.",
]
next = [
  "Que los planes que solo actualizan se apliquen solos.",
  "Renovate también para las dependencias de esta web.",
]

