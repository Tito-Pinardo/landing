[text.en.meta]
title = "Inside the internal door · Tito Pinardo Gutiérrez"
description = "How you get into the homelab's internal panels: Caddy with internal certificates, Authelia with single sign-on and two-factor auth, and why no panel is ever one port away from being bypassed."

[text.en.ui]
slot = "1U · SSO + 2FA"
face_specs = "Caddy · Authelia · LAN and VPN only"
state = "In production"
map_silk = "AUTH"
map_title = "Inside the internal door"
map_intro = "Internal panels aren't published: you reach them from home or the VPN, and always through here. Pick a flow."
vm_title = "Internal proxy · Docker container"
vm_specs = "Caddy + Authelia"
outside = "Where you come from"
disclaimer = "Rebuilt from my documentation: no internal names, addresses or users."

[text.en.hero]
kicker = "1U unit · Access to the panels"
title = "Caddy + Authelia · the internal door"
tagline = "Traefik is the door to the internet; this is the one inside. Caddy receives requests to the homelab panels and, before letting any through, asks Authelia whether there's a valid session with two-factor auth."
grade = "Two-factor by default"
facts = [
  { label = "Why two doors", value = "Public traffic and administration shouldn't share an entrance. If someone finds a flaw in the public door, the panels aren't behind it." },
  { label = "How it decides", value = "Caddy makes an authorisation request to Authelia for every request. Authelia decides; the content doesn't go through it." },
  { label = "The golden rule", value = "A protected panel must not be reachable on its direct port: if it is, the protection is decorative." },
]

