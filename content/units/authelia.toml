[text.es.incidents.directport]
title = "Una puerta con doble factor… y otra sin él"
meta = "06-09-2026 · auditoría"
symptom = "El gestor de contenedores ya pedía inicio de sesión y doble factor a través de la puerta interna. En la auditoría, aun así, lo marqué como hallazgo."
options = [
  "El código 2FA no caducaba",
  "Su puerto seguía abierto en la red: se podía entrar sin pasar por Authelia",
  "La sesión duraba demasiado",
  "El certificado interno estaba caducado",
]
cause = "El contenedor publicaba su puerto en todas las interfaces. Quien estuviera en la red podía ir directo al puerto y saltarse Caddy y Authelia. Para un panel con acceso a Docker, eso es acceso de administrador."
fix = "Publicar el puerto solo en localhost y comprobarlo: sin sesión, la puerta da 302 al login; el puerto directo, rechazado desde el PC. Con reversión automática a los 5 minutos por si me dejaba fuera."
lesson = "La autenticación delante solo sirve si no hay otro camino. Hay que probar el atajo, no solo la puerta."

[text.es.incidents.published]
title = "Paneles internos con nombre público"
meta = "26-09-2026 · superficie"
symptom = "Revisando todo lo que se veía desde internet, varios paneles de administración tenían su propio nombre público y su ruta en la puerta de internet."
options = [
  "Cloudflare los publicaba por defecto",
  "Un servicio los registraba solo al arrancar",
  "Se habían ido publicando por comodidad, uno a uno",
  "El DNS de casa se filtraba fuera",
]
cause = "Cada panel se había publicado en su momento para poder verlo desde fuera. Ninguno era grave por sí solo; juntos eran demasiada superficie."
fix = "Retirar de internet sus rutas y sus registros DNS en un mismo día. Siguen en uso, pero detrás de esta puerta: desde casa o la VPN, con doble factor."
lesson = "La comodidad publica cosas de una en una; la seguridad las revisa todas juntas."

[[text.es.timeline]]
title = "Caddy para los nombres internos"
period = "Verano de 2026"
items = [
