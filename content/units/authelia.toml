]

[[text.es.decisions]]
title = "Dónde se autentica"
choice = "Una vez, en Authelia, para todos los paneles"
why = "Cada panel con su propio login débil es un punto flojo. Con inicio de sesión único, el doble factor protege todo a la vez."

[[text.es.decisions]]
title = "Qué pasa con los logins propios"
choice = "Se conservan detrás del SSO"
why = "Para el panel más delicado, el doble factor de Authelia no sustituye su login: lo precede. Dos llaves distintas."

[[text.es.decisions]]
title = "Cómo se aplica un cambio de acceso"
choice = "Con reversión automática"
why = "Un error en la puerta te deja fuera de la puerta. Cada cambio llevaba un temporizador que deshacía todo a los 5 minutos si no lo cancelaba tras probar."

[text.es.tech_notes]
linux = "Un contenedor Linux con Docker que agrupa el proxy interno y los paneles de la biblioteca."
docker = "Caddy, Authelia y los paneles corren como contenedores; los protegidos publican su puerto solo en localhost."
wireguard = "Desde fuera de casa, los paneles solo se alcanzan a través de la VPN."
dns = "Los nombres internos solo resuelven en el DNS de casa, y su panel de administración está detrás de esta puerta."
hardening = "Inicio de sesión único con doble factor por defecto, ningún panel con nombre público y ningún atajo por puerto directo."

[text.es.close]
lessons = [
  "Separar la entrada pública de la de administración.",
  "Probar el atajo: una puerta con doble factor no sirve si hay una ventana abierta al lado.",
  "Cambios de acceso siempre con un camino de vuelta automático.",
]
next = [
  "Integrar más paneles por OIDC para que dejen de necesitar su propia cuenta local.",
  "Llevar la configuración de Caddy al repositorio de infraestructura, como las rutas de Traefik.",
]

