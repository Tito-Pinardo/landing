steps = [
  "A device on the network tries to go straight to the container manager's port, without Caddy.",
  "The panel only listens inside its own container.",
  "The connection is refused: from the network there's nothing on that port.",
  "All that's left is the real door.",
  "Caddy gets the request.",
  "It asks Authelia.",
  "And without a two-factor session, it doesn't get through.",
]

[text.en.flows.outside]
title = "Someone tries from the internet"
steps = [
  "Someone on the internet looks for the internal panels.",
  "Their names don't exist outside home and the firewall doesn't let anyone in.",
  "There's nothing to attack: the policy isn't even evaluated.",
]

[text.en.incidents.directport]
title = "A door with two-factor… and another without"
meta = "06-09-2026 · audit"
symptom = "The container manager already asked for a login and two-factor through the internal door. Still, I flagged it in the audit."
options = [
  "The 2FA code didn't expire",
  "Its port was still open on the network: you could get in without Authelia",
  "The session lasted too long",
  "The internal certificate had expired",
]
cause = "The container published its port on every interface. Anyone on the network could go straight to the port and skip Caddy and Authelia. For a panel with Docker access, that's admin access."
fix = "Publish the port on localhost only, and check it: without a session the door returns a 302 to the login; the direct port is refused from the PC. With automatic rollback after 5 minutes in case I locked myself out."
lesson = "Authentication in front only works if there's no other way round. You have to test the shortcut, not just the door."

[text.en.incidents.published]
title = "Internal panels with public names"
meta = "26-09-2026 · surface"
symptom = "Reviewing everything visible from the internet, several admin panels had their own public name and a route on the internet door."
options = [
  "Cloudflare published them by default",
  "A service registered them on start-up",
  "They'd been published one by one, for convenience",
  "The home DNS leaked outside",
]
cause = "Each panel had been published at some point so I could see it from outside. None was serious on its own; together they were too much surface."
fix = "Take their routes and DNS records off the internet on the same day. They're still in use, but behind this door: from home or the VPN, with two-factor."
lesson = "Convenience publishes things one at a time; security reviews them all together."

