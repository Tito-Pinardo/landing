[[text.en.decisions]]
title = "Where you authenticate"
choice = "Once, in Authelia, for every panel"
why = "Every panel with its own weak login is a soft spot. With single sign-on, two-factor protects all of them at once."

[[text.en.decisions]]
title = "What about the panels' own logins"
choice = "Kept behind the SSO"
why = "For the most sensitive panel, Authelia's two-factor doesn't replace its login: it comes first. Two different keys."

[[text.en.decisions]]
title = "How an access change is applied"
choice = "With automatic rollback"
why = "A mistake in the door locks you out of the door. Every change had a timer that undid everything after 5 minutes unless I cancelled it after testing."

[text.en.tech_notes]
linux = "A Linux container with Docker that groups the internal proxy and the library panels."
docker = "Caddy, Authelia and the panels run as containers; protected ones publish their port on localhost only."
wireguard = "From outside home, the panels can only be reached through the VPN."
dns = "Internal names only resolve on the home DNS, and its admin panel is behind this door."
hardening = "Single sign-on with two-factor by default, no panel with a public name and no shortcut through a direct port."

[text.en.close]
lessons = [
  "Keep the public entrance apart from the admin one.",
  "Test the shortcut: a two-factor door is useless with an open window next to it.",
  "Access changes always with an automatic way back.",
]
next = [
  "Bring more panels in through OIDC so they no longer need their own local account.",
  "Move the Caddy configuration into the infrastructure repo, like the Traefik routes.",
]
