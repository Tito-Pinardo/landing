  "El router reenvía el HTTPS que viene de la WAN al contenedor de Traefik.",
  "Traefik la recibe en su punto de entrada.",
  "Presenta el certificado válido del dominio y descifra la petición.",
  "Recupera la IP real del visitante, fiándose solo de la cabecera si viene de Cloudflare.",
  "Mira el nombre pedido y encuentra su ruta.",
  "Añade las cabeceras de seguridad.",
  "La web responde desde su contenedor.",
  "La respuesta vuelve cifrada con sus cabeceras.",
  "Y llega al visitante.",
]

[text.es.flows.cert]
title = "Un certificado se renueva solo"
steps = [
  "Faltan menos de 30 días para que caduque un certificado. Traefik inicia la renovación.",
  "Crea un registro temporal en el DNS de Cloudflare para demostrar que el dominio es mío.",
  "Let's Encrypt comprueba el registro y firma el certificado nuevo.",
  "Traefik borra el registro temporal y guarda el certificado.",
  "Desde la siguiente conexión, los visitantes reciben el nuevo. Sin reinicios.",
  "Por si algo fallara, el vigilante de certificados de Hermes avisa con días de margen.",
]

[text.es.flows.newroute]
title = "Publico un servicio nuevo"
steps = [
  "Añado una línea a la lista de servicios del repositorio: dominio y servicio.",
  "Ansible genera el fichero de la ruta y la entrada del panel de inicio, revisando el cambio antes de aplicarlo.",
  "Si es un servicio del servidor, crea solo su registro DNS en Cloudflare, con proxy: no hay que entrar al panel para nada.",
  "Traefik detecta el fichero nuevo y carga la ruta sin cortar nada.",
  "El servicio sigue igual de aislado: Traefik corre con su usuario y sus permisos.",
  "La ruta ya responde.",
  "Y la monitorización empieza a comprobarla.",
]

[text.es.flows.retire]
title = "Retiro un servicio"
steps = [
  "Borro su línea de la lista de servicios del repositorio. Es lo único que hago.",
  "Ansible compara la lista con lo que hay publicado.",
  "Borra el fichero de la ruta que ya no está en la lista: si no, Traefik lo seguiría sirviendo.",
  "Y borra su registro DNS en Cloudflare. Solo toca los registros que creó él: los demás de la zona no se miran.",
  "La puerta ya no tiene ninguna entrada para ese nombre.",
  "Y la monitorización deja de comprobarlo.",
]

[text.es.flows.www]
title = "Alguien escribe «www»"
