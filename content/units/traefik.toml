  "Un visitante escribe la dirección con «www».",
  "Cloudflare la pasa a casa.",
  "Traefik la recibe.",
  "La ruta de esa variante es una redirección 301 a la dirección canónica.",
  "El navegador vuelve a pedir, ahora a la buena.",
  "Esta vez sí hay ruta al servicio.",
  "Y la web responde. Antes de declararlo en la lista, esa variante daba un error 526.",
]

[text.es.flows.admin]
title = "Alguien busca el panel desde fuera"
steps = [
  "Alguien intenta llegar al panel de Traefik desde internet.",
  "El panel no tiene nombre público, así que ni siquiera hay ruta desde fuera.",
  "Aunque la hubiera, solo acepta la red de casa y la VPN.",
  "No consigue nada. Los paneles internos van por otra puerta, con doble factor.",
]

[text.es.incidents.disk]
title = "El disco de la puerta al 80 %"
meta = "14-08-2026 · disco"
symptom = "Revisando los logs para otra cosa, el disco del contenedor de Traefik estaba al 80 % y subiendo. Si se llenaba, se caían una veintena de dominios a la vez."
options = [
  "Los certificados antiguos no se borraban",
  "Una actualización había dejado copias del binario",
  "El log de accesos llevaba meses sin rotar: 36,6 GB",
  "Los registros temporales del DNS se acumulaban",
]
cause = "No había configuración de rotación para el log de accesos. Un fichero de 36,6 GB en un disco de 50."
fix = "Rotación diaria, 7 días, comprimida. La primera rotación forzada intentó copiar el fichero entero con solo 9,5 GB libres: la paré a tiempo y vacié el original directamente, que es seguro porque Traefik escribe siempre al final."
lesson = "Todo lo que escribe sin parar necesita rotación desde el primer día. Y la primera limpieza de algo enorme se piensa: el método normal puede ser justo el que llena el disco."

[text.es.incidents.bot]
title = "4.600 intentos al día contra el panel de juegos"
meta = "14-08-2026 · tráfico"
symptom = "El log mostraba miles de peticiones al día contra el panel de los servidores de juego. Parecía un ataque de fuerza bruta y estaba preparando un bloqueo automático."
options = [
  "Un bot de internet probando contraseñas",
  "Mi propio bot de Discord preguntando el estado cada 10 segundos por el dominio público",
  "Cloudflare reintentando peticiones",
  "La monitorización comprobando el panel",
]
cause = "La IP de origen era la de casa. Era mi bot de Discord, que pedía el estado del panel cada 10 segundos por el dominio público: salía a internet, pasaba por Cloudflare y volvía a entrar. Más de 91.000 peticiones en una sola sesión."
fix = "Que el bot hable con el panel por la red interna. El «ataque» desapareció del log."
lesson = "Antes de bloquear, mirar de dónde viene. La mitad de los misterios del tráfico están en casa."

[text.es.incidents.e526]
title = "La dirección con «www» daba error 526"
meta = "Octubre de 2026 · rutas"
symptom = "Quien escribía la dirección de esta web con «www» delante se encontraba un error 526 de Cloudflare en vez de la web."
options = [
  "El certificado había caducado",
  "El DNS no tenía el registro de «www»",
  "Cloudflare estaba caído",
  "Traefik no tenía ruta para esa variante del nombre",
]
cause = "Cloudflare mandaba la variante con «www» a casa, pero Traefik no tenía ninguna ruta ni certificado para ese nombre, así que la conexión segura fallaba."
fix = "Un campo nuevo en la lista de servicios para declarar redirecciones: la variante con «www» responde con un 301 a la dirección canónica."
lesson = "Cada nombre que apunta a casa necesita su destino declarado. Si la redirección vive en la lista, se genera y se revisa como todo lo demás."

[[text.es.timeline]]
title = "Una puerta para todo"
period = "Verano de 2026"
items = [
  "Traefik en su contenedor con el binario oficial, sin Docker.",
  "Certificados automáticos por DNS con Cloudflare.",
  "Una veintena de dominios, cada uno con su ruta.",
]

[[text.es.timeline]]
title = "Lo que encontré mirando los logs"
period = "Agosto de 2026"
items = [
  "Log de 36,6 GB sin rotar: rotación diaria.",
  "El «bot de fuerza bruta» era mi propio bot de Discord.",
]

[[text.es.timeline]]
title = "Menos superficie"
period = "26-09-2026"
items = [
  "Fuera de internet los paneles internos: hipervisor, automatizaciones, panel de inicio, el propio panel de Traefik y otros.",
  "Borradas sus rutas y sus registros DNS; siguen en uso detrás de la puerta interna con doble factor.",
  "Rutas generadas desde una sola lista en el repositorio, con redirecciones declaradas.",
]

[[text.es.decisions]]
title = "Proxy público"
choice = "Traefik en un contenedor, sin Docker"
why = "Es la pieza más expuesta: cuantas menos capas, mejor. El binario oficial con systemd basta y se actualiza con Ansible."

[[text.es.decisions]]
title = "Cómo se prueban los dominios"
choice = "Desafío DNS-01 en Cloudflare"
why = "No obliga a abrir el puerto 80 al mundo, funciona aunque el servicio aún no esté listo y permite certificados comodín."

[[text.es.decisions]]
title = "Cuántos dominios"
choice = "Tres, cada uno con su uso"
why = "Uno para esta web y los proyectos personales que se pueden ver en público, otro para los juegos y otro para los servicios del servidor. Separarlos deja claro qué es qué. El registro DNS se crea y se borra solo en el de los servicios del servidor, que es el que crece con cada servicio nuevo; los otros dos se cuidan a mano a propósito."

[[text.es.decisions]]
title = "Qué se publica"
choice = "Solo lo que tiene que verse desde fuera"
why = "Un panel publicado es una invitación. Los internos van por Caddy y Authelia, con doble factor y solo desde casa o la VPN."

[text.es.tech_notes]
traefik = "Proxy inverso de entrada: TLS automático por DNS, una ruta por dominio, redirecciones, cabeceras de seguridad e IP real solo desde Cloudflare."
lxc = "Corre en su propio contenedor LXC, separado del resto de servicios."
linux = "Servicio systemd con usuario propio, rotación de logs con logrotate y un disco que ya no se llena."
git = "La lista de servicios publicados está versionada: cada dominio nuevo es un commit."
ansible = "Genera las rutas y el panel de inicio desde la misma lista, mostrando el cambio antes de aplicarlo."
hardening = "Cabeceras HSTS, panel sin acceso inseguro y limitado a la red de casa y la VPN, y paneles internos retirados de internet."

[text.es.close]
lessons = [
  "La puerta más expuesta es la que menos piezas debe tener.",
  "Mirar los logs de vez en cuando: el disco y el bot salieron así.",
  "Publicar es fácil; despublicar lo que no hace falta es lo que de verdad reduce el riesgo.",
]
next = [
  "Retomar un bloqueo automático basado en los logs, ahora que ya no hay ruido propio.",
  "Llevar las cabeceras de seguridad comunes a la lista de servicios, para que cada ruta nueva las herede.",
]

