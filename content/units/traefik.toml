ops = "Operations"

[text.en.pods.visitor]
short = "Visitor"
title = "A visitor"
text = "Anyone opening one of my sites."

[text.en.pods.cloudflare]
short = "Cloudflare"
title = "Cloudflare"
text = "Proxy in front of the domains: hides my home IP and filters. It also runs the DNS where Traefik proves the domain is mine."

[text.en.pods.router]
short = "Router"
title = "MikroTik router"
text = "Forwards the HTTPS coming in on the WAN, and only that, to the Traefik container."

[text.en.pods.letsencrypt]
short = "Let's Encrypt"
title = "Let's Encrypt"
text = "The authority that signs the certificates, free and renewable every 90 days."

[text.en.pods.git]
short = "Git"
title = "Infrastructure repository"
text = "The list of published services lives here, versioned: which domain goes to which service."

[text.en.pods.ansible]
short = "Ansible"
title = "Ansible"
text = "Reads the list and writes one route per domain, creates its DNS record in Cloudflare and deletes routes and records that are no longer there. The same list generates the homelab's start page."

[text.en.pods.entrypoint]
short = "Port 443"
title = "HTTPS entry point"
text = "Traefik listens for HTTPS. Plain HTTP only exists to redirect to HTTPS."

[text.en.pods.tls]
short = "Certificate"
title = "TLS termination"
text = "Traefik presents each domain's valid certificate and decrypts the request."

[text.en.pods.realip]
short = "Real IP"
title = "Visitor's real IP"
text = "Behind Cloudflare, every request seems to come from Cloudflare. Traefik only trusts the real-IP header if it comes from Cloudflare's ranges."

[text.en.pods.acme]
short = "ACME DNS-01"
title = "Renewal through DNS"
text = "To prove the domain is mine, Traefik creates a temporary record in Cloudflare's DNS. No extra port to open, and it works for wildcards."

[text.en.pods.router_web]
short = "Route per domain"
title = "Routes"
text = "One route per domain, in its own file. Traefik looks at the requested name and picks the service."

[text.en.pods.redirect]
short = "301 redirect"
title = "Redirects"
text = "Variants with or without «www» send you to the canonical address with a 301, declared in the service list itself."

[text.en.pods.headers]
short = "Headers"
title = "Security headers"
text = "HSTS and the other headers so the browser won't accept unencrypted versions."

[text.en.pods.dashboard]
short = "Dashboard"
title = "Traefik dashboard"
text = "No insecure access, no public name and limited to the home network and the VPN."

[text.en.pods.landing]
short = "This site"
title = "This site"
text = "One of the services behind the door. It has its own unit."

[text.en.pods.media]
short = "Media"
title = "Media"
text = "Plex and what surrounds it, to watch away from home."

[text.en.pods.chat]
short = "Messaging"
title = "Messaging (Matrix)"
text = "The chat server and its web client."

[text.en.pods.games]
short = "Games (web)"
title = "Game websites"
text = "The public site of the game servers. The game itself doesn't come through here: Traefik only speaks HTTP."

[text.en.pods.logs]
short = "Access logs"
title = "Access log"
text = "One line per request: who, what and the result. Useful… unless it eats the disk."

[text.en.pods.rotate]
short = "Rotation"
title = "Log rotation"
text = "One file per day, seven days, compressed. It was missing, and the log reached 36 GB."

[text.en.pods.systemd]
short = "systemd"
title = "systemd service"
text = "The official binary with its systemd unit, no Docker: fewer parts at the most exposed door."

[text.en.pods.monitor]
short = "Monitoring"
title = "Monitoring"
text = "Monitoring checks it answers and Hermes' certificate watcher warns before any of them expires."

[text.en.flows.request]
title = "A request to this site"
steps = [
  "A visitor opens this site.",
  "Cloudflare gets it first and passes it home.",
  "The router forwards HTTPS coming from the WAN to the Traefik container.",
  "Traefik receives it at its entry point.",
  "It presents the domain's valid certificate and decrypts the request.",
  "It recovers the visitor's real IP, trusting the header only if it comes from Cloudflare.",
  "It looks at the requested name and finds its route.",
  "It adds the security headers.",
  "The site answers from its container.",
  "The response goes back encrypted with its headers.",
  "And reaches the visitor.",
]

[text.en.flows.cert]
title = "A certificate renews itself"
steps = [
  "A certificate has under 30 days left. Traefik starts the renewal.",
  "It creates a temporary record in Cloudflare's DNS to prove the domain is mine.",
  "Let's Encrypt checks the record and signs the new certificate.",
  "Traefik removes the temporary record and stores the certificate.",
  "From the next connection, visitors get the new one. No restarts.",
  "In case something failed, Hermes' certificate watcher warns days ahead.",
]

[text.en.flows.newroute]
title = "I publish a new service"
steps = [
  "I add a line to the service list in the repo: domain and service.",
  "Ansible generates the route file and the start-page entry, showing the change before applying it.",
  "If it's a server service, it creates its DNS record in Cloudflare by itself, proxied: no need to open the dashboard at all.",
  "Traefik spots the new file and loads the route without cutting anything.",
  "The service stays just as isolated: Traefik runs with its own user and permissions.",
  "The route is live.",
  "And monitoring starts checking it.",
]

[text.en.flows.retire]
title = "I retire a service"
steps = [
  "I delete its line from the service list in the repo. That's all I do.",
  "Ansible compares the list with what's published.",
  "It deletes the route file that's no longer on the list: otherwise Traefik would keep serving it.",
  "And it deletes its DNS record in Cloudflare. It only touches the records it created: the rest of the zone is left alone.",
  "The door no longer has any entrance for that name.",
  "And monitoring stops checking it.",
]

[text.en.flows.www]
title = "Someone types «www»"
steps = [
  "A visitor types the address with «www».",
  "Cloudflare passes it home.",
  "Traefik receives it.",
  "That variant's route is a 301 redirect to the canonical address.",
  "The browser asks again, now for the right one.",
  "This time there is a route to the service.",
  "And the site answers. Before it was declared in the list, that variant returned a 526 error.",
]

[text.en.flows.admin]
title = "Someone looks for the dashboard from outside"
steps = [
  "Someone tries to reach the Traefik dashboard from the internet.",
  "The dashboard has no public name, so there isn't even a route from outside.",
  "Even if there were, it only accepts the home network and the VPN.",
  "Nothing gained. Internal panels go through another door, with two-factor auth.",
]

[text.en.incidents.disk]
title = "The door's disk at 80 %"
meta = "14-08-2026 · disk"
symptom = "Checking the logs for something else, the Traefik container's disk was at 80 % and rising. If it filled up, about twenty domains would go down at once."
options = [
  "Old certificates weren't being deleted",
  "An update had left copies of the binary",
  "The access log hadn't been rotated for months: 36.6 GB",
  "Temporary DNS records were piling up",
]
cause = "There was no rotation set up for the access log. A 36.6 GB file on a 50 GB disk."
fix = "Daily rotation, 7 days, compressed. The first forced rotation tried to copy the whole file with only 9.5 GB free: I stopped it in time and emptied the original directly, which is safe because Traefik always writes at the end."
lesson = "Anything that writes nonstop needs rotation from day one. And the first clean-up of something huge needs thought: the normal method can be exactly what fills the disk."

[text.en.incidents.bot]
title = "4,600 attempts a day against the game panel"
meta = "14-08-2026 · traffic"
symptom = "The log showed thousands of requests a day against the game servers' panel. It looked like a brute-force attack and I was preparing an automatic block."
options = [
  "An internet bot trying passwords",
  "My own Discord bot asking for the status every 10 seconds through the public domain",
  "Cloudflare retrying requests",
  "Monitoring checking the panel",
]
cause = "The source IP was the home one. It was my Discord bot, asking the panel for its status every 10 seconds via the public domain: out to the internet, through Cloudflare and back in. Over 91,000 requests in a single session."
fix = "Have the bot talk to the panel over the internal network. The «attack» vanished from the log."
lesson = "Before blocking, look at where it comes from. Half the traffic mysteries are at home."

[text.en.incidents.e526]
title = "The «www» address gave a 526 error"
meta = "October 2026 · routes"
symptom = "Anyone typing this site's address with «www» in front got a Cloudflare 526 error instead of the site."
options = [
  "The certificate had expired",
  "DNS had no «www» record",
  "Cloudflare was down",
  "Traefik had no route for that variant of the name",
]
cause = "Cloudflare sent the «www» variant home, but Traefik had no route or certificate for that name, so the secure connection failed."
fix = "A new field in the service list to declare redirects: the «www» variant answers with a 301 to the canonical address."
lesson = "Every name pointing home needs its destination declared. If the redirect lives in the list, it gets generated and reviewed like everything else."

[[text.en.timeline]]
title = "One door for everything"
period = "Summer 2026"
items = [
  "Traefik in its container with the official binary, no Docker.",
  "Automatic certificates through DNS with Cloudflare.",
  "About twenty domains, each with its route.",
]

[[text.en.timeline]]
title = "What I found reading the logs"
period = "August 2026"
items = [
  "A 36.6 GB unrotated log: daily rotation.",
  "The «brute-force bot» was my own Discord bot.",
]

[[text.en.timeline]]
title = "Less surface"
period = "26-09-2026"
items = [
  "Internal panels off the internet: hypervisor, automations, start page, Traefik's own dashboard and others.",
  "Their routes and DNS records deleted; they're still in use behind the internal door with two-factor auth.",
  "Routes generated from a single list in the repo, with declared redirects.",
]

[[text.en.decisions]]
title = "Public proxy"
choice = "Traefik in a container, no Docker"
why = "It's the most exposed part: the fewer layers, the better. The official binary with systemd is enough and Ansible updates it."

[[text.en.decisions]]
title = "How domains are proven"
choice = "DNS-01 challenge on Cloudflare"
why = "No need to open port 80 to the world, it works even if the service isn't ready yet and it allows wildcard certificates."

[[text.en.decisions]]
title = "How many domains"
choice = "Three, each with its own use"
why = "One for this site and the personal projects that can be seen in public, one for the games and one for the server's services. Keeping them apart makes it clear what's what. DNS records are created and deleted automatically only on the server-services one, which grows with every new service; the other two are looked after by hand on purpose."

[[text.en.decisions]]
title = "What gets published"
choice = "Only what has to be seen from outside"
why = "A published panel is an invitation. Internal ones go through Caddy and Authelia, with two-factor auth and only from home or the VPN."

[text.en.tech_notes]
traefik = "Entry reverse proxy: automatic TLS through DNS, one route per domain, redirects, security headers and real IP only from Cloudflare."
lxc = "Runs in its own LXC container, separate from the other services."
linux = "systemd service with its own user, log rotation with logrotate and a disk that no longer fills up."
git = "The list of published services is versioned: every new domain is a commit."
ansible = "Generates the routes and the start page from the same list, showing the change before applying it."
hardening = "HSTS headers, a dashboard with no insecure access limited to home and the VPN, and internal panels taken off the internet."

[text.en.close]
lessons = [
  "The most exposed door is the one that should have the fewest parts.",
  "Read the logs now and then: the disk and the bot both turned up that way.",
  "Publishing is easy; unpublishing what isn't needed is what really cuts risk.",
]
next = [
  "Bring back automatic blocking based on the logs, now that my own noise is gone.",
  "Move the common security headers into the service list, so every new route inherits them.",
]
