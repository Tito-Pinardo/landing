tagline = "A reverse proxy in its own container that receives all web traffic from the internet, adds the certificate and hands it out by name. Routes aren't edited by hand: they come from the same list Ansible uses to generate the rest of the homelab."
grade = "Surface reduced on 26-09-2026"
facts = [
  { label = "Why Traefik", value = "Automatic Let's Encrypt certificates, routes in files that reload without downtime and a dependency-free binary: it fits in a small container with no Docker." },
  { label = "What it publishes", value = "Only what has to be seen from outside: this site, messaging, media and games. Internal panels were taken off the internet and go through another door with two-factor auth." },
  { label = "How it's managed", value = "A list of services in the infrastructure repo. Ansible generates one route per domain and Traefik picks it up on the fly." },
]

