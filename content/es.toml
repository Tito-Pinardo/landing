options = [
  "Un disco se ha roto y hay que restaurar copias.",
  "El almacenamiento LVM quedó a medio activar tras su comprobación automática y bloquea el arranque de todo.",
  "Proxmox ha perdido la configuración de los contenedores.",
]
feedback = [
  "Los discos y el RAID están bien: no hay ningún error de hardware ni datos dañados.",
  "",
  "La configuración está intacta: los contenedores existen, solo que ninguno consigue arrancar.",
]
solution = "Tras el apagón, LVM revisó los metadatos del almacenamiento (65-90 minutos en discos mecánicos) y dejó dos volúmenes internos activados por separado. Mientras siguen así, LVM se niega a activar el almacenamiento. Desactivarlos a mano y activar el pool lo arregló todo."
lesson = "Escribí el postmortem con cómo detectarlo, el comando exacto y por qué tarda tanto. Y que si la monitorización vive en el mismo servidor, cae con él."

[incidents.blackout.clues]
internet = "Las webs no responden: la petición llega a casa, pero nadie contesta."
traefik = "Traefik ni siquiera está en marcha: su contenedor está parado."
proxmox = "El host ha arrancado bien, pero todos los contenedores y máquinas virtuales están en «stopped». El log repite: «activating LV pve/data failed… prohibited while data_tmeta is active»."
zabbix = "Zabbix tampoco funciona: también es un contenedor. Por eso no ha llegado ninguna alerta."
zfs = "En LVM aparecen los volúmenes internos del pool activos por separado, y un «thin_check» acaba de terminar tras más de una hora."
obsidian = "La documentación tampoco se puede abrir: corre en otro contenedor parado."

