  "Fuera de clase mantengo un homelab que no es un juguete: da servicio a diario a mi casa y está definido entero como código. Si un servidor desaparece, Terraform lo vuelve a crear y Ansible lo deja configurado igual que estaba.",
  "Mi forma de trabajar: medir antes de cambiar, un cambio cada vez, comprobarlo en producción y dejarlo documentado, incluido lo que no funcionó. Prefiero convertir un arreglo manual en automatización mantenible a repetirlo dos veces.",
