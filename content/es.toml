# ---------------------------------------------------------------------------
# Misiones
# ---------------------------------------------------------------------------

[projects.homelab-iac]
title = "Homelab como código"
tagline = "Mi infraestructura de casa, definida entera en Terraform y Ansible."
context = "Proyecto personal en curso, en producción a diario."
problem = "Los servicios de casa se habían montado a mano durante años: nadie (ni yo) sabía exactamente cómo reconstruir uno si se rompía."
bullets = [
  "Migré los servicios a infraestructura como código: Terraform crea los contenedores y VMs en Proxmox y roles de Ansible reutilizables configuran el sistema y las aplicaciones.",
  "Secretos cifrados con Ansible Vault, todo versionado en Git con copia de respaldo automática, y cada cambio revisado con plan o --check --diff antes de aplicarlo.",
  "Red MikroTik segmentada por VLANs, acceso remoto con WireGuard, Traefik como única entrada pública con certificados automáticos y DNS propio con Technitium.",
  "Almacenamiento ZFS y RAID por software, y passthrough de GPU NVIDIA para cargas aceleradas por hardware.",
  "Publiqué una copia saneada y pública del repositorio: sin IPs reales, secretos ni reglas de firewall.",
]
outcome = "Reconstruir un servicio pasa de ser una tarde de prueba y error a un comando."
lesson = "Tras un corte de luz que dejó el almacenamiento LVM inactivo y todos los servicios caídos, escribí el postmortem con la causa raíz, cómo detectarlo y el arreglo exacto."

[projects.hermes]
title = "Hermes · asistente de IA local"
tagline = "Un asistente en el chat que conoce el estado de mis servidores, y nada sale de mi red."
context = "Proyecto personal, en producción desde septiembre de 2026."
problem = "Saber si el homelab está sano obligaba a abrir varios paneles distintos (monitorización, seguridad, almacenamiento, copias)."
bullets = [
  "Bot conversacional en Matrix, por texto y por voz, con el modelo de lenguaje funcionando en local con Ollama.",
  "RAG sobre mi documentación de Obsidian con Qdrant como base vectorial, combinado con instantáneas de Zabbix y Wazuh para contextualizar incidencias.",
  "Herramientas de estado del homelab (copias, certificados, almacenamiento, actualizaciones, uso anómalo, accesos fallidos, red) que avisan solo cuando encuentran algo anormal, más un resumen diario.",
  "Batería de evaluación con varias semillas: la versión final pasa 107 de 111 casos sin regresiones, y los cambios que empeoraban el resultado se descartaron con datos.",
]
outcome = "El estado del homelab se consulta con una pregunta en lenguaje natural en vez de abriendo paneles."
lesson = "Lo que se puede calcular en código no se le pide al modelo: fechas, sumas y vencimientos fallaban mientras los hacía el LLM y dejaron de fallar al pasarlos a código."

[projects.xpify]
title = "XPIFY · e-learning gamificado"
tagline = "Plataforma de aprendizaje con juegos y chat en tiempo real. Proyecto final con un 10/10."
context = "Proyecto final de ASIR + DAW, desplegado en producción y evaluado funcionando."
problem = "Hacía falta una plataforma educativa que motivara con mecánicas de juego y que se pudiera evaluar en producción real, no en una demo local."
bullets = [
  "Me encargué del backend, de toda la infraestructura y de la automatización del despliegue, y contribuí al frontend en Next.js.",
  "API REST en NestJS con PostgreSQL, autenticación con Keycloak y control de acceso por roles.",
  "Chat y eventos de juego en tiempo real con Socket.io.",
  "Desplegada en Kubernetes (K3s) con GitOps mediante Argo CD y GitLab CI/CD, con métricas y logs en Prometheus, Grafana y Loki.",
]
outcome = "Calificación de 10/10, evaluada con la plataforma funcionando en producción."

[projects.security]
title = "Seguridad y monitorización"
tagline = "Saber qué pasa en cada máquina y cerrar lo que no debería estar abierto."
context = "Proyecto personal en curso dentro del homelab."
problem = "Con más de veinte contenedores y VMs, revisar a mano la seguridad y el estado de cada uno no escala."
bullets = [
  "Despliegue automatizado con Ansible de agentes de Zabbix y Wazuh, con avisos por correo y chat probados de extremo a extremo.",
  "Revisión de vulnerabilidades con Wazuh: se corrigieron las 430 entradas que tenían arreglo publicado y se documentaron los residuos y sus límites.",
  "Hardening reutilizable de Linux y SSH aplicado como rol de Ansible, y auditoría de red con correcciones en el router y el cortafuegos.",
  "Retirada de internet de todo panel que no necesitaba estar público: solo queda expuesto lo imprescindible.",
]
outcome = "Menos superficie expuesta y avisos que llegan solos en vez de revisiones manuales."
lesson = "Documento qué no demuestra una auditoría tanto como lo que demuestra: 'sin hallazgos' no es 'sin vulnerabilidades'."

[projects.okd]
title = "Clúster OpenShift (OKD)"
tagline = "Clúster de tres nodos sobre Proxmox para practicar administración de OpenShift."
context = "Laboratorio personal, instalación completada y verificada."
problem = "Quería practicar OpenShift de verdad, con sus problemas de instalación reales, no con un tutorial guiado."
bullets = [
  "Tres nodos definidos con Terraform, DNS preparado e instalación con el Agent-Based Installer.",
  "Resueltos los problemas reales del camino: una ISO con fallo de arranque, RAM insuficiente, orden de arranque tras instalar y latencia de etcd en discos mecánicos.",
  "Resultado verificado: 3/3 nodos Ready y 33/33 operadores sanos, con una aplicación de prueba desplegada mediante Ansible.",
]
outcome = "Un clúster OpenShift funcionando y un historial de instalación con cada fallo y su solución."
lesson = "etcd no perdona los discos lentos: la latencia de almacenamiento se nota antes en el plano de control que en las aplicaciones."

[projects.paperless]
title = "Clasificación automática de documentos"
tagline = "Scripts en Python que clasifican y asignan documentos de alumnos solos."
context = "Prácticas en el Centro Universitario Cardenal Cisneros."
problem = "Los documentos de alumnos se clasificaban y asignaban a mano."
bullets = [
  "Scripts en Python sobre la API de Paperless-ngx que clasifican y asignan los documentos automáticamente.",
  "Investigación de IA y reconocimiento de escritura manuscrita para apoyar respuestas automáticas a consultas de alumnos.",
]
outcome = "Menos trabajo manual repetitivo para el personal del centro."

[projects.landing]
title = "Esta web"
tagline = "Rust, PostgreSQL y mi propio homelab, sin plantillas ni constructores de webs."
context = "Proyecto personal, en producción."
problem = "Quería una forma de enseñar mi trabajo que fuera, en sí misma, una muestra de cómo trabajo."
bullets = [
  "Servidor en Rust con Axum y plantillas compiladas; PostgreSQL con consultas comprobadas en compilación.",
  "Páginas pre-renderizadas detrás de Cloudflare: casi ninguna visita llega al servidor.",
  "Desplegada con Terraform y Ansible en mi homelab, detrás de Traefik y con monitorización.",
  "Funciona sin JavaScript; el mapa, la terminal y los logros son una mejora encima.",
]
outcome = "Lo que estás viendo."
lesson = "La parte rápida de una web no es el lenguaje del servidor, es no tener que llamarlo."

