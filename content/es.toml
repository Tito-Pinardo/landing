title = "Una actualización que no termina"
intro = "Lanzo la actualización de todos los contenedores con Ansible. Media hora después sigue en el mismo paso… y tres horas después, también."
options = [
  "apt está esperando a que alguien responda una pregunta en pantalla.",
  "Un disco se está muriendo.",
  "El RAID1 de discos mecánicos, compartido por unos 16 contenedores, está saturado de escrituras.",
]
feedback = [
  "No hay ninguna pregunta: dpkg sí avanzaba al principio y luego se quedó esperando al disco.",
  "SMART dice que los dos discos están sanos, sin sectores defectuosos.",
  "",
]
solution = "Los dos discos tenían la caché de escritura en modo «write through» y todo el sistema compartía el mismo RAID1. Cada escritura esperaba al plato. Activé la caché «write back» de forma persistente y medí la mejora con carga real."
lesson = "Carga alta con la CPU ociosa es espera de disco. Y documenté qué estaba medido y qué solo inferido: borrar las instantáneas casi no cambió la presión de I/O."

[incidents.slowupdate.clues]
iac = "Ansible lleva 30 minutos en la tarea «apt upgrade» del contenedor de Wazuh."
wazuh = "Dentro del contenedor, mandb lleva casi una hora en estado D (esperando disco). Carga 27 con la CPU casi parada."
proxmox = "Presión de I/O del 50 %. El RAID md0 está al 100 % de uso moviendo apenas 2 MB/s."
