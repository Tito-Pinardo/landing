# Fuentes del resumen semanal de los lunes (tools/digest/digest.py).
#
# Cada fuente dice a qué unidad del rack y a qué tecnologías de site.toml
# afecta. Son todas públicas: lo que revelan de mi servidor ya lo cuenta la
# web.
#
#   kind = "release"   versiones nuevas (feed Atom de GitHub o RSS)
#   kind = "news"      noticias y artículos de fuera (el modelo decide si
#                      merecen entrar)
#
# Los avisos de seguridad no van aquí: salen de [[security]] más abajo.

