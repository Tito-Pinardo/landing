# CI/CD de la web en GitLab, el origen del repositorio. Traducción de
# .forgejo/workflows/ci.yml (que sigue valiendo en Forgejo hasta el corte):
#
# - comprobar (runner del CI, sin secretos): lo mismo que el CI de GitHub
#   más gitleaks sobre todo el historial.
# - desplegar (solo main, con «comprobar» en verde): el runner de
#   despliegue (solo ramas protegidas) pasa el control de fugas de lo que
#   aún no es público, compila, despliega con Ansible y empuja ese commit a
#   GitHub, que queda como copia pública. El script vive en ese runner, con la
#   infraestructura, no aquí.
#
# El resultado de cada pipeline llega a Element por el webhook del proyecto.

variables:
  # Las consultas se comprueban contra los datos de .sqlx (cargo sqlx prepare).
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: never
  # Historial completo para gitleaks.
  GIT_DEPTH: "0"

stages: [comprobar, desplegar]

workflow:
  rules:
    # Un pipeline por push a una rama (sin duplicados por MR) y a mano.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

comprobar:
  stage: comprobar
  tags: [landing]
  script:
    - cargo fmt --check
    - cargo clippy --locked --all-targets -- -D warnings
    # Pruebas contra PostgreSQL (DATABASE_URL la pone el runner).
    - cargo test --locked
    - cargo build --locked --release
    - '"$CARGO_TARGET_DIR/release/landing" check'
    # El JS minificado sigue siendo JS válido.
    - |
      min="$(mktemp -d)"
      "$CARGO_TARGET_DIR/release/landing" dump-assets "$min"
      for f in "$min"/*.js; do node --check "$f"; done
      # El rack 3D ya viene minificado por esbuild y es un módulo ES.
      cp static/rack3d.min.js "$min/rack3d.mjs" && node --check "$min/rack3d.mjs"
      rm -rf "$min"
    # Banco de experiencia (tools/ux) sin 3D, con el Chromium de Debian:
    # unidades, blog y portada en móvil, tableta y sin WebGL. Cualquier cifra
    # por encima de 0 (solapes, scroll lateral, axe, errores…) lo pone en rojo.
    - |
      if [ ! -x /usr/bin/chromium ] || ! command -v npm >/dev/null; then
        echo "El runner no tiene Chromium/npm: banco omitido"
      else
        sitio="$(mktemp -d)"
        FORJA_JSON=tools/ux/forja-ejemplo.json "$CARGO_TARGET_DIR/release/landing" dump-site "$sitio" >/dev/null
        python3 tools/ux/servir.py "$sitio" &
        servidor=$!
        (
          cd tools/ux
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund --loglevel=error
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8099/es/ && break; sleep 1; done
          node banco.mjs --chromium /usr/bin/chromium --sin-webgl --slow no --fallar \
            --solo movil,tableta,sin3d,unidades,unidades_movil,blog,blog_movil \
            --out "$sitio/informe" || { cat "$sitio/informe/informe.md"; exit 1; }
        ) && resultado=0 || resultado=$?
        kill "$servidor"
        rm -rf "$sitio"
        [ "$resultado" -eq 0 ] || exit "$resultado"
      fi
    - python3 -m unittest tools/digest/test_digest.py
    # Todo el historial: lo que se borró en un commit posterior sigue en el repo.
    - gitleaks git --redact --no-banner --exit-code 1 .

desplegar:
  stage: desplegar
  tags: [landing-despliegue]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  # Uno a la vez, en orden.
  resource_group: produccion
  variables:
    # landing-desplegar hace su propia copia del commit.
    GIT_STRATEGY: none
  script:
    - landing-desplegar "$CI_COMMIT_SHA"
